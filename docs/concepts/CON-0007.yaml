id: CON-0007
title: Splitting, stemming and abbreviation expansion are three mechanisms, and a search over code needs them separated
status: accepted
date: 2026-08-22
refines: [REQ-0016]
tags: [retrieval, context, ranking, stemming, identifiers, literature]
summary: |
  Loom's STEM-VARIANTS does three jobs the software-engineering IR literature
  treats as three problems with different rules and different failure modes:
  splitting a compound identifier, stemming an inflected English word, and
  expanding an abbreviation. Conflating them is what produced BUG-0040, where
  "string" was mis-parsed as a gerund into "str" and "stre" and the second of
  those reached STRESS-PUSHER at the strongest rank the scale has.

  This concept records what the literature says about each, and the measurement
  that settled it for this tree: the Porter stemmer in Quicklisp's `stem'
  system leaves "string" alone, takes "saving" to "save", and takes "prefixed"
  to "prefix".
body: |
  THE THREE MECHANISMS

  SPLITTING. A compound identifier -- data-handler, MapElementTypeEditor --
  carries meaning in the combination as well as in the parts, so the standard
  practice is to split *and* keep the whole. Lucene's WordDelimiterGraphFilter
  is built for this and Elastic documents it as intended for "complex
  identifiers, such as product IDs or part numbers", recommended with the
  keyword tokenizer rather than one that strips punctuation first, with
  `preserve_original' and `catenate_words' emitting the unsplit form alongside
  the parts.

  Loom already splits and keeps the whole: TASK-TOKENS emits "data-handler"
  and "data" and "handler". What it does not do is treat the whole as stronger
  evidence than a part, which is the same gap the stem case has.

  Elastic's own caveat does not apply here. `preserve_original' produces
  multi-position tokens that break phrase matching unless flattened; Loom's
  token set is flat and it does no phrase matching, so it gets the practice
  without the cost.

  STEMMING. Reducing an inflected English word to a root. The practice is to
  apply it to natural-language fields -- comments, docstrings -- and to leave
  identifiers unstemmed, which is why search engines are configured with an
  analyzer per field rather than one for the index.

  Loom derives one token set from the task and matches it against both a name
  and a :DOCUMENTATION. The two passes in SEED-MATCHES share `tokens'. That is
  the divergence from practice, and it is the one that costs: stemming "saving"
  to "save" for a docstring is ordinary morphology, and stemming "string" to
  "str" for a *name* is not morphology at all.

  ABBREVIATION EXPANSION. "str" for "string", "cfg" for "config". A separate
  and much-studied task -- Hill's AMAP, Lawrie and Binkley's identifier
  expansion -- and its canonical motivating example is the one this tree hit:
  a developer searching "string" misses code that wrote "str". What matters is
  the method. Expansions are mined as a dictionary from the corpus itself,
  from surrounding comments and co-occurring identifiers, never derived by
  suffix rules, because the relation between "str" and "string" is not
  morphological and no rule over word endings can produce it.

  So Loom's -ing rule producing "str" from "string" is not a bad stem that
  happens to land on a useful abbreviation. It is a coincidence: the rule fires
  on three characters at the end of a word and one of its two outputs collides
  with a real abbreviation. The other output, "stre", is what the rule actually
  did.

  WHAT THE MEASUREMENT SAID

  Quicklisp's `stem' system, Porter's algorithm, against the tokens this tree's
  cases actually produce:

      string     -> string        Loom's rule gives str and stre
      strings    -> string
      saving     -> save          the gain Loom's rule was kept for
      prefixed   -> prefix        which is acceptance case r39-3
      starts     -> start
      reading    -> read
      encoding   -> encod
      parse      -> pars
      parsing    -> pars
      whitespace -> whitespac

  Porter does not have BUG-0040. It leaves "string" alone because "string" is
  not an inflection, and it keeps "saving" -> "save" because that one is.

  "prefixed" -> "prefix" is the more interesting row. DOT-PREFIXED-P is
  acceptance case r39-3 and has missed since the case was written. Loom stems
  only the *query*, then substring-matches the result against raw names, so
  "prefix" reaches DOT-PREFIXED-P only as a substring and ranks accordingly.
  An index stemmed with the same analyzer as the query turns that into an exact
  match on a token. The rule that both sides use one analyzer is the oldest
  advice in text search and Loom follows it on neither side.

  RESEARCH AND INDUSTRY DISAGREE, AND THE DISAGREEMENT IS THE POINT

  Hill's comparison of stemmers on source code identifiers, over more than 500
  search tasks across six Java systems, found stemming produced relevant
  results more consistently than not stemming, and that heavy and morphological
  stemmers -- Paice, MStem -- outperformed the light rule-based Porter and
  Snowball for search.

  Zoekt, which backs Sourcegraph and came out of Google, does no stemming at
  all. It is a trigram index over exact matches, with ctags symbol information
  used to rank a match higher when it aligns with a known symbol.

  These are not in conflict. Concept location -- "where is the code that does
  X" -- rewards recall and tolerates over-stemming. Navigational search --
  "find JS-TRIM" -- demands exactness. Loom's `context' is the first and
  `find' is the second, and they share a matching policy today. REQ-0045 is
  that.

  THE CAVEAT THAT LANDS HARDEST HERE

  Hill's result is qualified: how stemming affects retrieval is mediated by
  other factors, among them the use of tf-idf to filter commonly occurring
  terms, and the precise nature of the queries.

  Loom has no idf. Nothing in SEED-SCORE weights a term by how common it is;
  the coverage band counts every matched token the same. So this tree takes
  stemming's recall and skips the weighting the literature says controls its
  noise -- and then works around the consequence by hand, which is what
  REQ-0016 R7's reasoning about common words is, and what DES-0032 declined to
  supply a rarity model for. Read that way, "stre" reaching STRESS-PUSHER is
  not first of all a stemming defect. It is what a missing idf looks like when
  a bad token draws a strong rank. REQ-0046 is that.

  REFERENCES

  Hill, E., Fry, Z. P., Boyd, H., Sridhara, G., Novikova, Y., Pollock, L.,
  Vijay-Shanker, K. "AMAP: Automatically Mining Abbreviation Expansions in
  Programs to Enhance Software Maintenance Tools."
  https://dl.acm.org/doi/pdf/10.1145/1370750.1370771

  "A comparison of stemmers on source code identifiers for software search."
  https://ieeexplore.ieee.org/document/6080817/

  Lawrie, D., Binkley, D. "Expanding Identifiers to Normalize Source Code
  Vocabulary." ICSM 2011.
  http://www.cs.loyola.edu/~lawrie/papers/lawrieICSM2011.pdf

  "An Empirical Study of Abbreviations and Expansions in Software Artifacts."
  https://par.nsf.gov/servlets/purl/10132767

  "Which Abbreviations Should Be Expanded?" FSE 2021.
  https://homepages.uc.edu/~niunn/papers/FSE21-AbbreExpanded.pdf

  Zoekt design notes.
  https://github.com/sourcegraph/zoekt/blob/main/doc/design.md

  Elasticsearch, word delimiter graph token filter.
  https://www.elastic.co/docs/reference/text-analysis/analysis-word-delimiter-graph-tokenfilter

  Azure AI Search, custom analyzers per field.
  https://learn.microsoft.com/en-us/azure/search/index-add-custom-analyzers
