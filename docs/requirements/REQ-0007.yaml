id: REQ-0007
title: describe on a document must summarise it, not reprint it
status: implemented
date: 2026-07-29
refines: [REV-0001]
affects: [describe-entity, document-properties, print-summary-line]
tags: [knowledge, console, documents, context]
summary: |
  `describe REQ-0003` prints the entire requirement -- some 240 lines -- and puts
  the neighbour list, the thing describe exists to produce, underneath all of it.
  A command whose purpose is to spare an agent from reading a file instead
  injects the file and appends a summary. The cause is that the analyzer
  concatenates eight prose fields into one :body property, so there is no
  summary left to print on its own, while :title is stored and never displayed
  at all.
body: |
  WHAT IS WRONG

    loom> describe REQ-0003
    document REQ-0003  [docs/requirements/REQ-0003.yaml]

    A macro that expands into a defun or a test creates a named definition ...
    WHAT IS MISSING
    ARCH-0001 indexes defmacro as a :function carrying :macro-p ...
    ... roughly 240 lines ...
    defvar and defparameter are omitted only because nothing has needed them ...
      -> documents: assert-entity, resolve-calls, register-document-type, ...
      <- refines: REQ-0004

  The command is documented as "Full detail for one entity, with its neighbours
  grouped by edge type." The neighbours are two lines and they arrive last, after
  the whole document has gone past. On a code entity describe is well behaved --
  `describe repository-graph` is six lines and useful. The defect is specific to
  documents, and it gets worse as documents get better, since a thorough
  requirement is a longer one.

  For an agent this inverts the trade the tool exists to make. CLAUDE.md opens by
  saying to ask Loom rather than read the tree; describe on a document reads the
  tree on the agent's behalf and charges it the same tokens, plus a summary line.
  In a subagent it is worse, because that output lands in a context window nobody
  is watching and the agent has no way to ask for less.

  WHY THERE IS NO SUMMARY TO PRINT

  The analyzer flattens prose. *prose-fields* is

    (:rationale :consequences :statement :summary :description :notes :body
     :lessons)

  and its own comment says the text of all of them "becomes the entity's :BODY,
  which is both what an agent reads and what mentioned-link scanning runs over."
  So a document's summary is not a field on the entity; it is the first paragraph
  of a single concatenated blob. describe then prints :statement, :rationale and
  :body in sequence, which is why the output above shows the summary and the body
  run together with no separator -- they are one string.

  The dual purpose is the reason it was built this way and it is a real reason:
  mention scanning wants every word of prose in one place. Nothing about that
  requires the display path to receive the same blob.

  Two smaller facts belong with this:

    :title is parsed and stored on every document (base-properties reads it) and
    no command prints it. describe shows type, doc-id and path. The one-line
    statement of what a document is about is already in the graph, unused.

    :summary survives as a property of its own for one entity type only --
    :concept -- which shows the shape is available and was simply not applied
    where it is needed most.

  WHAT A SOLUTION HAS TO COVER

  R1  describe on a document prints, by default: type, doc-id, title, location,
      status where there is one, the summary, and the neighbours grouped by edge
      type. Nothing else. This is bounded output regardless of how long the
      document is.

  R2  The neighbours are reachable without scrolling. Whether that means edges
      before prose or prose kept short enough not to matter is a display
      decision, but a reader must not have to pass the document to reach the
      graph.

  R3  The full text is available on explicit request rather than removed. A
      document's body is worth reading and Loom knows where it is; the
      requirement is that asking for it is a separate act. Whether that is an
      argument to describe, a distinct command, or a pointer to the file path the
      reader can Read is left open -- the third option costs nothing and may be
      the right answer, since the file is truth (DEC-0001) and the graph is an
      index over it.

  R4  The prose fields are individually addressable on the entity. At minimum
      :summary and :title for every document type, not only :concept. The
      concatenated blob stays for mention scanning, and stays derived from the
      fields rather than replacing them -- DEC-0003's rule applies: a pass that
      consumes its input cannot be re-run, and flattening eight fields into one
      string with no way back is exactly that shape.

  R5  Decisions and rules get the same treatment. describe currently prints
      :statement, :rationale and :body in sequence, so a decision shows its
      rationale and consequences in full and a rule shows its statement. DEC-0004
      and RULE-0004 are short today and this is invisible; it is the same defect
      waiting on a longer document.

  R6  Say what happens when the summary itself is long. A summary is a field an
      author controls and nothing bounds it. The precedent to copy is
      build-context, which reports what it spent against a budget and says
      `(truncated)` when it left something out -- bounded output that admits its
      own bound rather than either overflowing or silently cutting.

  WHAT THIS IS NOT

  Not a request to make describe terse for code entities. Its behaviour there is
  correct and this requirement must not regress it.

  Not a request to stop indexing prose. The mention scanning that :body feeds is
  what produces the "which documents talk about this function" answer, which is
  useful and which REQ-0006 is separately making honest about its confidence.
  R4's point is only that the display path and the scanning path want different
  things from the same source, and one property is currently serving both.

  RESOLUTION, 2026-08-02

  Answered by ARCH-0005 and landed by PLAN-0004. `impact REQ-0007 2` reports
  those two and nothing else -- no sibling design, no open bug -- which is what
  RULE-0005's upward walk asks be confirmed before a requirement moves.

  R1, R2  describe on a document prints type, doc-id, location, title, status
          and a summary bounded to *SUMMARY-TOKEN-BUDGET* (120 tokens), then
          the neighbour groups. `describe REQ-0003` was 250 lines of body
          before two lines of neighbours; it is now six lines of summary
          before them, and the bound does not depend on the document.

  R3      The full text is untouched and reached by Read: describe-entity's
          :properties still carries the complete :body, and :entity still
          names the path. No new command and no new argument -- ARCH-0005's
          ALTERNATIVES CONSIDERED records why that was the cheapest of the
          three options this document left open.

  R4      :summary and :title are individually stored on :document, :decision
          and :rule, via one line in BASE-PROPERTIES rather than a per-type
          case. *PROSE-FIELDS* and COLLECT-BODY are unchanged, so :body is
          still derived from the raw YAML table on every pass and DEC-0003 is
          undisturbed -- a second independent read of the same input, not a
          rewrite of the existing derivation.

  R5      :decision and :rule go through the same path, falling back to
          :rationale and :statement and labelling which field they showed.
          The rationale-printed-twice defect this document did not name is
          gone as a consequence of no longer printing :body at all.

  R6      BOUNDED-TEXT cuts at a word boundary and reports what it showed
          against the budget, and the console prints "(120/312 tokens,
          truncated)" -- build-context's precedent, which R6 named, applied
          to one field.

  What this document asked not be regressed was not: a code entity's
  :document key is NIL, so the branch does not exist for a function, class or
  file rather than happening to print nothing there.
