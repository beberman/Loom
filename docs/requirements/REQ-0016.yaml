id: REQ-0016
title: context must reach the subsystem a task names, not the entities whose names resemble it
status: partial
date: 2026-08-06
affects: [build-context, context-item, render-context, seed-entities, search-entities,
          seed-matches, seed-score, seed-slice, admit-seeds, seed-type-rank,
          task-tokens, task-terms, stem-variants, slot-accessor-p, test-code-p,
          named-by-task-p, production-names, demoted-test-p,
          expand-from-seeds, edge-cost, container-p, effective-cost]
importance: Critical
tags: [knowledge, console, context, ranking, retrieval, con-0006, req-0031, req-0035]
summary: |
  Asked `context data-handler` against ~/lisp/game-server on 2026-08-06, Loom
  returned 22 entities: CORS handlers from the web layer, mpackage event
  callbacks and two test fixtures. The DATA-HANDLER class, its six subclasses
  and its 21 `dhandler-*` CRUD generics were all absent. Every entity returned
  contained the substring "handler" and almost none was what the question was
  about.

  The same command on Loom's own tree answered well, and that is why the defect
  survived: Loom's names are long and unique, so a lexical match usually lands
  on the right entity. game-server's are short and repeated and grouped by CLOS
  class, and the seeding failed immediately.

  Rewritten 2026-08-17. The original document carried eight dated amendment
  sections, several correcting its own claims, and its framing was wrong in a
  way the amendments could not repair. Git holds it; this states what is now
  known.

  Two things it got wrong. The title asked for "structural centrality", and no
  centrality measure was ever used or wanted -- every one available ranks
  containers first, because :CONTAINS runs from a file to everything in it. What
  was needed was proximity to the seeds under a weighted edge cost, which is a
  property of the query rather than of the tree. And the whole document was
  written as a precision complaint -- 22 entities returned and almost none
  relevant -- when the defect was that the protocol was *absent*. CON-0006
  records the correction: the reader is an LLM, a wrong entry costs a few tokens,
  a missing one costs a grep.
body: |
  WHAT WAS ACTUALLY WRONG

  Three separate defects, found in that order and fixed in reverse.

  The seeder scored an entity by the best of its matches, so an entity matching
  half the sentence tied with one matching a single common word, and the tie
  fell to token order. `start-server startup sequence and database handler
  health check` seeded seven of eight entities on the English word "check".

  The expansion was one hop, unordered, every edge the same price. TABLE-HANDLER
  and GAME-HANDLER are one :INHERITS hop from DB-HANDLER and two from
  DATA-HANDLER; MODEL-HANDLER is three. No ranking reaches an entity the
  expansion never visits, so a defect that read as ranking was reachability.

  The budget was 2,000 tokens, sized for a bundle of names and locations. Once
  the walk reached 157 entities it printed two of them, so R6 was failing on
  room after it had stopped failing on reach.

  A fourth was found later and belongs to REQ-0035: no code entity carried the
  prose its own definition declared, so a query describing what a function does
  could not match the sentence in which its author described it.

  THE REQUIREMENTS, AND WHERE EACH STANDS

  R1  A query naming an entity that exists must seed from that entity, not from
      every entity whose name contains the query as a substring.

      MET. *SEED-TYPE-PREFERENCE* was fifteen entries with :CLASS two below
      :FUNCTION, and the type band dominates the score, so every function
      matching any word outranked the class the query was named after. Three
      tiers now: definitions, containers, documents.

  R2  Expansion must weight edge types rather than treat them alike.

      MET. *EDGE-COSTS* prices each relationship type and direction --
      :INHERITS and :IMPLEMENTS 1, :USES 2, :CALLS 3 outward and 4 inward -- and
      EXPAND-FROM-SEEDS is a best-first walk bounded by cost rather than hops. A
      type absent from the table is uncrossable rather than free.

      :CALLS is asymmetric because what a thing calls is bounded by its body and
      describes it, where what calls it is unbounded and describes the callers.

  R3  Entities matching the query lexically but sitting in an unrelated part of
      the graph must rank below entities reached structurally from the seed.

      PARTIAL. The walk orders neighbours by cost, and SET-CORS-HANDLER no
      longer displaces DHANDLER-GET. What remains is a tie between two lexical
      matches: on front-end, `changing the type of a map element` returns
      MAPELEMENTTYPE and not MAPELEMENTTYPEEDITOR, which answers the same three
      terms from a longer name. That is the one miss in the acceptance set.

  R4  Test fixtures must rank below production code when both match, unless the
      query asks about tests.

      MET. TEST-CODE-P is a path guess, which this project has been burned by
      once -- BUG-0006 derived :SYSTEM from a path. The difference is what a
      wrong answer costs: a wrong :SYSTEM is asserted into the graph and read by
      rules, where a wrong answer here moves one candidate down one band in one
      bundle. Ranking may guess where assertion may not.

      A test definition sharing a name with production code is exempt
      (PRODUCTION-NAMES), because it is evidence about that name rather than a
      fixture competing for the slot.

  R5  A query naming no known entity must still return something useful.

      PARTIAL, and answered from two directions rather than one.

      REQ-0035 indexed the prose a definition declares, so a query describing
      what a function does can match the sentence its author wrote. TASK-TOKENS
      also stems four suffixes, so `saving a piece design` reaches SAVEDESIGN.

      Convergence answers the other half: an entity reached by several of the
      bundle's own seeds is discounted by one cost unit per additional seed,
      floored at 1. Eight seeds on a prose query are eight guesses and they are
      not independent.

      Still open: no seeds means no walk and no bundle.

  R6  Acceptance is measured on more than one tree.

      MET. `context data-handler` on game-server returns all ten of
      DATA-HANDLER, DB-HANDLER, NULL-HANDLER, TABLE-HANDLER, MODEL-HANDLER,
      GAME-HANDLER and four of the DHANDLER-* protocol, untruncated. The count
      went 6 of 10, to 7 when the walk made them reachable, to 10 when the two
      tiers gave them room.

      The Loom clause is retired rather than met. It named MAKE-MACRO-ENTITY on
      `context macro definitions`, and Loom is one of the indexed trees: a
      session's own commits grew its index from 140 items to 144 and pushed that
      entity out of eighth place with no change to any ranking. A clause whose
      corpus moves under it measures the repository.

  R7  A query term matching many entities contributes proportionately less, and
      no narrow slice of the query may fill the seed set.

      MET. SEED-SCORE ranks coverage above match quality, and ADMIT-SEEDS caps
      the distinct names one slice of the task may contribute, relaxing the cap
      rather than returning fewer seeds than there are candidates.

      The standing clause is met too. `start-server startup sequence and
      database handler health check` seeds START-SERVER and carries all six of
      READ-CONFIG, CONFIG-GET, SET-CORS-HANDLER, INITIALIZE-GAME-API,
      INITIALIZE-MEDIA and CONFIGURE-LOG. What met it was REQ-0035, not R2 or
      R3: better seeds let the existing expansion reach the startup sequence.

  R8  A prose query that lands today must still land.

      MET throughout. `data-api handler database connection acquire and test
      connectivity` returns all three CONNECTION-CONNECT-DATABASE definitions at
      every stage of this work. The triplication is the finding, so two of three
      is a regression rather than a partial pass.

  R9  Recall is the measure.

      MET, and it is tools/test/acceptance.py: fifteen queries over game-server and
      front-end, 31 of 32 expected entities present, slowest query 0.07s.

      Loom is deliberately absent for the reason R6 gives. The script reports a
      strict count and a lenient one -- strict for an entity that is a seed or an
      item, lenient also for one named on a relation line beneath something else
      -- because that difference decides real cases and arguing it per query
      wasted a measurement.

  WHAT WAS TRIED AND DOES NOT WORK

  Recorded because the measurements cost more than the code and the next reader
  should not repeat them. Branch `search-index` at 3278c63 holds all of it.

  A tokenised postings index with BM25 over six weighted fields replaces the
  substring scan and is net worse on these three trees: 29 of 32 against 31, and
  0.16-0.48s against 0.07s. BM25 and BM25F disagree per query and neither
  dominates -- BM25F recovers BASE-ENCODER and BASE-DECODER on the protocol
  query, BM25 recovers MAKE-MACRO-ENTITY on `macro definitions`. Fusing them by
  reciprocal rank beats either alone and is still worse than what is deployed.

  Between them the two attempts gained exactly one entity, SAVEDESIGN, and
  STEM-VARIANTS is what gained it. Moving forty lines of tokeniser onto the live
  path gained the same entity at the same latency.

  IDF did not do what this document expected of it. "check" is rare on all three
  trees -- 43 of game-server's 3,946 entities, idf 4.50 -- so the word that broke
  R7 would not have been suppressed. R7's defect was that the CHECK-* family is
  many, which is a diversity problem rather than a term-rarity one.

  WHAT IS OUTSTANDING

  R3's tie-break. MAPELEMENTTYPEEDITOR answers three of four query terms and
  loses to MAPELEMENTTYPE, which answers the same three from a shorter name.
  One entity of thirty-two.

  R5's empty case. No seeds, no bundle.

  Neither is addressed by anything on the `search-index` branch, and both
  attempts to fix R3 through scoring were reverted. Whoever takes it up should
  start from what neither attempt explained: BM25 dropped WORKINGSET and
  COLOREDITOR, which are ordinary name matches, and no measurement says why.
