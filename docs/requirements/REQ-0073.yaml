id: REQ-0073
title: A declared reference must be able to name another repository, because federation matches only code entities on a bare name and no document-to-document edge can cross
status: draft
priority: p3
date: 2026-09-12
amended: 2026-09-12
refines: [REQ-0027, CON-0004, CON-0008]
affects: [federated-affects-ops, federated-mentions-ops, federate-repositories,
          declared-edge-type-for, federated-declared-names,
          classified-unresolved-references, resolve-document-links, resolve-one,
          unresolved-references, document-reference-report, find-repository,
          require-repository, read-frameworks, parse-frameworks,
          watch-repository, repository-graph, short-commit]
importance: Major
tags: [multi-repo, federation, documents, refines, references, organization,
