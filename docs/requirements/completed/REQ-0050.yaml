id: REQ-0050
title: An answer must say which tree it is about, because the commit it reports is the tree's and the answer came from an index that may be older
status: implemented
date: 2026-08-23
refines: [REQ-0036]
affects: [structure-report, repository-status, index-provenance, file-provenance, index-drift, unindexed-files, build-context, describe-entity, load-systems]
importance: Critical
tags: [staleness, provenance, measurement, req-0036, con-0001, harness]
summary: |
  `structure` reports a `commit` field. It is `git rev-parse HEAD` on the
  repository root, read at query time. CLAUDE.md tells an agent to compare it
  against `git rev-parse HEAD` to confirm the answer is about the tree on disk,
  and that comparison always succeeds -- it is the same command run twice.

  What it does not measure is whether the *index* matches either of them. The
  index is built by a watcher over a working tree, so its content can differ
  from HEAD by every uncommitted edit, and it can lag the working tree by
  however long since the last poll. A commit field agreeing with HEAD is
  consistent with an index built from entirely different bytes.

  REQ-0036 R4 already solved this for one surface. A context record carries the
  commit *and* a hash of `git diff HEAD`, for the stated reason that "the
  commit alone would attribute a judgement to code that was not what answered
  it: a tree under active work is dirty for most of the sessions that produce
  these records". Nothing else in Loom carries the pair.
body: |
  HOW FRESHNESS IS MEASURED TODAY, PER SURFACE

    structure    :COMMIT, from GIT-COMMIT on the repository root, read when the
                 report is built. Plus :COMMIT-REASON when it cannot be read.
                 Nothing about the index.

    status       prints the file, entity and relationship counts, and
                 `watcher : watching'. The counts describe the index; nothing
                 ties them to a revision.

    describe --source
                 :INDEXED-AT, from REPOSITORY-INDEXED-AT -- a generation
                 counter that increments per reindex. It answers "has this
                 repository been reindexed since" and not "as of what tree".

    context      the bundle carries no revision at all. The *record* does,
                 through GIT-FINGERPRINT, and only when the context log is on.

    tools/acceptance.py, tools/recall.py
                 nothing. Both drive a running service over REST and report a
                 score with no statement of what produced it.

  WHY THE COMMIT FIELD IS THE WRONG MEASUREMENT

  It measures the tree and is read as measuring the index. Three things move
  independently and the field sees one:

    the commit          moves on `git commit'
    the working tree    moves on every save, and is what the analyzer reads
    the index           moves when the watcher polls, which is after the save
                        and before nothing in particular

  So `commit` agreeing with HEAD tells a caller that Loom and git are looking
  at the same repository. It says nothing about whether the index was built
  from the bytes now on disk. The 2026-08-21 record in docs/TODO.md is the case
  measured: the field named the last commit while the index reflected a working
  tree with twenty-four modified files. It was not wrong; it answered a
  different question than the one CLAUDE.md tells an agent to ask it.

  WHAT IT COST, TWICE IN ONE WEEK

  The narrow instance is `structure`. The general one is that an instrument
  reporting a number without saying what produced it will be believed.

  On 2026-08-23, tools/acceptance.py was run four times and reported 43 of 45
  each time, and every run measured a headless service started before any of
  that day's work. It was proved rather than guessed: the running service
  returned only :TOKENS, none of the fields added that morning, and silently
  ignored a budget sent to it. Three of those runs were reported as
  verification of changes they could not have seen. The number happened not to
  move, which is exactly why nobody looked.

  The same week, tools/call-site-census.lisp could not load at all -- its
  registry and quickload list predate loom-embed, which loom-knowledge has
  depended on since PLAN-0043 -- so the instrument that *CALL-SITE-CEILING*'s
  failure message tells a developer to re-run had been broken since that plan
  landed and nothing said so.

  Two harnesses, one week, the same shape: a measurement that cannot say what
  it measured. This is CON-0001 applied to Loom's own answers rather than to
  the graph's contents -- a fabricated fact is worse than a recorded gap, and a
  score attributed to the wrong build is a fabricated fact about the tool
  itself.

  REQUIREMENTS

  R1  Every answer that could be about a stale tree carries the same triple the
      context record already carries: the commit, a hash of the uncommitted
      diff, and the branch. GIT-FINGERPRINT computes it and REQ-0036 R4 argues
      it; this asks that it stop being the context log's private fact.

      The diff hash is the load-bearing half. A commit is stable for hours of
      editing and the working tree is not, so the commit distinguishes weeks
      and the diff hash distinguishes saves.

  R2  It says when the *index* was built, not only what the tree says now.
      Those are different instants and the gap between them is the whole
      subject: the analyzer reads the working tree, the watcher polls after the
      save, and a query answers from whatever the last poll produced.

      A revision recorded at index time and reported at query time is the
      shape. REPOSITORY-INDEXED-AT is the generation counter that exists and it
      is not enough on its own -- it orders reindexes and names no tree.

  R3  A disagreement is reported rather than left for the caller to compute.
      A surface that prints an index fingerprint beside a current one has moved
      the comparison to the reader; the answer should say `index is 3 commits
      and 24 modified files behind this tree' or say that it is current.

  R4  A harness states what it measured. tools/acceptance.py and
      tools/recall.py drive a running service, so the service's revision is
      what produced the score and neither prints it. The score and the
      fingerprint belong on the same line, so that a run against a stale
      service is visible in its own output rather than by suspicion.

      This is not a Loom feature; it is the instrument obeying the rule it
      exists to enforce.

  R5  A tool that loads a system says so when it cannot. The census failed by
      not loading, which is the easy case, and reported it as a backtrace
      rather than as "this instrument is broken, the ceiling is unmeasured".
      A measurement that did not happen must not read like one that returned
      nothing to say.

  ACCEPTANCE

  `structure` on a tree with uncommitted edits reports that the index is behind,
  and on a clean freshly-indexed tree reports that it is current. Both against
  the same repository, minutes apart, with one `touch` between them.

  `tools/acceptance.py` prints the service's commit and diff hash beside its
  score. Running it against a deliberately stale service -- start one, edit a
  file, reindex, run -- produces a line that differs from `git rev-parse HEAD`,
  and that is the whole test.

  `check` continues to report 0 violations and its 8 unresolved document
  references, because nothing here touches resolution.

  WHAT THIS IS NOT

  Not a new fingerprinting mechanism. GIT-FINGERPRINT, GIT-DIFF-HASH,
  GIT-COMMIT and REPOSITORY-INDEXED-AT all exist. What is missing is that four
  of the five surfaces do not carry what one of them already does.

  Not a staleness *check*. Loom already has :STALE on an entity for a different
  thing -- a fact whose evidence was not re-confirmed. This is about the answer
  as a whole, not about a row in it.

  Not a refusal. An index behind the tree is usable and often the only thing
  available mid-refactor; DEC-0001 has the graph derived and rebuildable, not
  authoritative. The requirement is that the caller be told, not that the
  answer be withheld -- which is REQ-0037's posture applied to provenance
  rather than to absence.

  OPEN QUESTIONS

  - What a non-git tree reports. GIT-FINGERPRINT already returns a reason per
    missing field rather than NIL, so the shape exists; whether "not a git
    repository" should read as current or as unknown is not obvious, and
    guessing wrong makes every answer on such a tree look suspect.

  - Whether the diff hash should cover untracked files. `git diff HEAD` does
    not, and an untracked new source file is indexed by the analyzer and
    invisible to the fingerprint. That is a real gap in the mechanism REQ-0036
    R4 already relies on, and it means the existing pairing is weaker than its
    docstring claims.

  - Cost. GIT-DIFF-HASH shells out to `git diff HEAD` and hashes the output.
    On the context log that is once per recorded call; on `find` it would be
    once per query, which is a subprocess in the latency path of the cheapest
    command Loom has.

  R3 AS BUILT, AND THE WRONG ANSWER THAT PRECEDED IT

  R3 asks that a disagreement be reported rather than left for the caller to
  compute. It is reported as DRIFT: how many claimed files the index is behind
  on, from REPOSITORY-STAMPS.

  The first attempt used `git diff HEAD' and was wrong in a way worth keeping
  on the record, because it looked right and passed its own test. A diff hash
  moves when *any* file in the tree moves, and most of a tree is not indexed --
  documents, tools, fixtures, this file. Within an hour of landing, editing
  tools/acceptance.py made the harness report a stale service whose index was
  perfectly current.

  That is not a cosmetic false positive. A staleness signal that fires on every
  document edit is one that gets ignored, and an ignored signal restores the
  defect it was built to remove. The failure mode of the fix is the failure
  mode of the bug.

  REPOSITORY-STAMPS was the right source all along and cost nothing to use: the
  watcher already stores, per claimed file, the write date and a content hash
  of the bytes the analyzer read. A file whose stamp disagrees with disk is a
  file the index is behind on, and nothing else is. One stat per claimed file,
  which FILE-CHANGED-P already pays on every poll.

  Verified in both directions, which the diff hash never was: pause the
  watcher, append a line to an indexed source file, and drift reads 1 and the
  harness says STALE INDEX; edit an unindexed file and it reads 0 and says the
  index is current.

  The commit is kept beside it. It is cheap, it names a shared reference point,
  and it is the half a human recognises; drift is the half that answers the
  question.

  OUTCOME, 2026-08-24

  R1 and R5 land here; R2, R3 and R4 were partly built already and are finished
  by the same change. Every surface that answers about a tree now says which
  tree, and every instrument that loads a system says so when it cannot.

  WHERE THE TRIPLE TRAVELS

      status      console prints `built from' and `freshness'; REST carries
                  commit, commit-reason, branch, diff, dirty, drift and
                  unindexed. The console printed none of it before: the plist
                  has carried the fingerprint since R2 and PRINT-STATUS
                  dropped it, so the surface a developer reads said how big the
                  index was and never what it was built from.
      structure   the header names the commit, the branch and whether the tree
                  was dirty, and the next line says whether the index is
                  current or how many files behind. It read `git rev-parse
                  HEAD' when the report was built until now, which is the
                  defect this requirement opens with.
      context     one line above the bundle. This was the surface carrying no
                  revision at all, and it is the answer with the longest life:
                  a bundle is read into a session and worked from for an hour.
      describe    the same fingerprint, plus whether this entity's own file has
                  moved. Per file rather than per tree, which is both the
                  precise question for an answer about one definition and the
                  affordable one -- see the cost table.
      generated
      ARCH        a sentence, and only when the index was behind or the tree
                  dirty. It is written into a file and read months later, when
                  nothing else can say whether the index behind it had caught
                  up.

  R3 IS TWO COUNTS, BECAUSE ONE OF THEM CANNOT TRAVEL

  INDEX-DRIFT walked the tree: REPOSITORY-FILES, which is a recursive directory
  walk plus a `git check-ignore' subprocess. Measured on Loom, 179ms against
  1.6ms for the stats it exists to do. This requirement's own open question is
  that a fingerprint in the latency path of the cheapest command Loom has is
  not affordable, and at 179ms it was affordable nowhere.

  Drift now walks REPOSITORY-STAMPS -- what the index read, compared against
  disk -- and costs 5.5ms on Loom. What a stamp walk cannot see is a file the
  index has never read, which is now UNINDEXED-FILES, costs the walk, and is
  reported by `status' alone. Two named counts rather than one number quietly
  covering both, because they are three orders of magnitude apart in cost and
  only one of them can travel on every answer.

  WHAT IT COSTS, REST medians over ten calls on Loom, before and after

      find         3.0ms ->  2.2ms    carries no provenance; the control
      describe     4.7ms ->  4.2ms    one stat, per file
      context    100.4ms -> 112.6ms   the stamp walk
      structure   72.1ms -> 82.9ms    the stamp walk
      status     210.9ms -> 412.2ms   the stamp walk and the tree walk

  `describe' is where the design was decided by measurement. With tree-wide
  drift on it, it went 4.7ms to 25.6ms -- a fivefold cost on a command an agent
  issues dozens of times a session, to answer a question it was not asking.
  FILE-PROVENANCE asks about the one file the answer is about and costs nothing
  measurable.

  THE ACCEPTANCE, RUN

  `structure' on a tree with uncommitted edits reports that the index is
  behind: paused the Loom watcher over REST, appended one line to
  src/knowledge/structure.lisp, and the report came back drift 1 and dirty
  true. Restored the file: drift 0, `index current with the tree'.

  `tools/acceptance.py' against that same stale service printed

      measured against: service at 225499ce40d8  <-- STALE INDEX: 1 claimed
      file changed since it was read

  tools/recall.py prints a line per repository its cases touch, read off the
  provenance the bundles themselves now carry rather than from a second call --
  which R1 is what made possible:

      measured against:
        front-end: 48b1970fb5fb (terrain-partion)  index current with the tree
        game-server: 4113fb8da96e (pieces)  index current with the tree

  `check' reports 0 violations and its 8 unresolved document references.

  The retrieval floors are untouched, which is the claim worth checking rather
  than assuming: nothing here changes seeding, ranking or what a bundle
  contains, and a provenance line that cost a case would say otherwise.

      tools/acceptance.py   42 of 44, the same two misses -- fe-5 and r39-3
      known-item            443 of 450: name 148, inflected 148, prose 147
      suite                 10 of 10 systems

  R5, AND THE TWO INSTRUMENTS NOBODY HAD RUN

  tools/harness.lisp is the shared loader. Every instrument opened with the same
  twelve lines copied seven times, and they had drifted three ways: two
  registries missing loom-embed, two roots hardcoded to one machine's absolute
  path, and one script deliberately different in a way no reader could tell from
  an accident.

  This requirement names tools/call-site-census.lisp as the instrument that
  could not load. BUG-0047 is that it was three: family-census and
  package-census had been broken by PLAN-0043 in exactly the same way and were
  found by looking rather than by anyone needing them. Both run now.

  A failed load prints what did not happen and exits 1:

      tools/family-census.lisp did not run.
        LOOM-WORKSPACE failed to load: Component #:LOOM-EMBED not found...
        Nothing was measured. This is not a result of zero -- it is the
        instrument being broken, and whatever it measures is unknown
        until it loads.

  tools/load-test.lisp keeps its own second phase and exits 2 for a system that
  did not load, distinct from its 1 for a system that loaded the console. Its
  registry omits process/ on purpose, and folding that into the shared loader
  would have made the deliberate omission look like the accidental ones.

  THE OPEN QUESTIONS, ANSWERED

  A non-git tree reports an unknown commit with the reason, and a known
  freshness. The two halves fail independently: drift comes from Loom's own
  stamps and needs no git at all. So `not a git repository' reads as `which
  commit is unknown' rather than making the whole answer suspect.

  The diff hash still does not see untracked files, and the freshness signal no
  longer depends on it. A new source file the analyzer would claim is counted
  by UNINDEXED-FILES, so the gap in REQ-0036 R4's mechanism remains a gap in
  that mechanism and is no longer a gap in this one.

  Cost is the table above. The answer is that a stamp walk is affordable on a
  bundle and on a structural report, a tree walk is affordable on `status'
  alone, and neither is affordable on `describe' -- which is why `describe'
  asks about its own file instead.
