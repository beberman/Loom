id: REQ-0054
title: a zero-hit find must distinguish no such name anywhere from no definition and N textual occurrences, because the two imply opposite next moves
status: implemented
date: 2026-08-27
refines: [REQ-0037, REQ-0051]
affects: [textual-occurrences, parse-grep-line, search-entities]
importance: Major
tags: [find, absence, mentions, req-0037, req-0051, front-end]
summary: |
  `find term=osm-import` against front-end returns
  `{"entities":[],"total":0,"truncated":null,"elsewhere":[]}`. The string is a
  route -- `router.post('/osm-import', ...)` -- and it appears in the mock, in
  the router's header comment and in PLAN-0003. So "where is the osm-import
  endpoint" has an answer, the index holds the material for it, and `find`
  reports the same empty object it reports for a name that exists nowhere.

  REQ-0051 built the other half of this: a zero-hit answer now says what the
  *other* repositories hold. What it does not say is what *this* repository
  holds in prose.
body: |
  THE TWO ABSENCES

      no definition, no occurrence      the name is dead; stop looking
      no definition, N occurrences      the name is a string, a route, a
                                        config key or a comment; read those N

  Only the first is worth a caller's confidence, and today they are the same
  answer. An agent that trusts it stops, which is the failure REQ-0037 is about:
  a confident absence is more expensive than a slow one.

  THE MATERIAL IS ALREADY INDEXED

  `context` reaches these through its `mentions` band -- a markdown file's
  backticked identifiers and a document's prose both resolve into `:mentions`
  edges, and REQ-0028 claims a `.md` wherever the repository keeps it. What is
  missing is a path from `find` to the same material.

  REQUIREMENTS

  R1  A `find` that matches no definition reports the textual occurrences of the
      term, with file and line, or reports that there are none.

  R2  An occurrence is never an entity. Route strings, config keys and comment
      words are not definitions and must not become ones -- this is a second
      band in the answer, not a change to what the analyzer asserts.

  R3  The band is capped and says it was. A common word occurs everywhere, and a
      list of four hundred lines is a different way of answering nothing.

  R4  It costs the miss and not the hit. A `find` that matched a definition does
      the work it does today; only the zero-hit path pays for the scan, which is
      where the caller is deciding whether to reach for grep.

  ACCEPTANCE

  `find term=osm-import` against front-end names the router, the mock and
  PLAN-0003, and says how many occurrences it did not list. `find
  term=no-such-token-anywhere` against the same tree says there are none, and
  that answer is what makes the first one trustworthy.

  IMPLEMENTED 2026-08-28

  R1 and R2. A zero-hit `find` carries an `occurrences` band: the lines the term
  is written on, with file, line and text. Nothing enters the graph -- the scan
  runs at answer time and asserts nothing -- so a route string stays a route
  string.

  R3. Capped at twelve, with the total beside it. `1 of 400 shown` is what makes
  a short list honest, which is BUG-0002's rule on a third band.

  R4. Paid on the miss only. A `find` that matched a definition does exactly
  what it did before.

  THE OPEN QUESTION, ANSWERED BY THE ACCEPTANCE

  Files, not `:mentions` edges. The edges carry a markdown file's backticks and
  a document's prose; two of this case's occurrences are a string literal and a
  source comment, which no analyzer asserts anything about. `git grep -n -F -I`
  answers all of them in one subprocess -- fixed-string because a term is a
  name and not a pattern, and bounded on IGNORED-PATHS' terms, where exit 1 is
  git's ordinary "no matches" and must not read as a failure.

  MEASURED

      find osm-import      front-end   0 definitions, 8 occurrences:
                                       .env.example:40, router.mjs:12, :93,
                                       :94, :181, PartitionEditorMock.jsx:919,
                                       :1564, fixtureGame.js:144
      find no-such-token-anywhere      0 definitions, 0 occurrences, no reason
                                       -- the answer that makes the first
                                       trustworthy

  THIS DOCUMENT WAS WRONG ABOUT PLAN-0003

  The acceptance named "the router, the mock and PLAN-0003". The router and the
  mock are there. PLAN-0003.yaml does not contain the string and `git log -S
  osm-import -- docs/plans/PLAN-0003.yaml` finds no commit that ever put it
  there, so the claim was mistaken when it was written rather than overtaken by
  an edit. Corrected here rather than by quietly rewriting the acceptance.

  A SHAPE THAT HAD TO CHANGE BEFORE IT SHIPPED, AGAIN

  The band was `occurrences` holding a plist whose own list key was also
  `occurrences`. *ARRAY-VALUED-KEYS* decides an empty list from an empty object
  by key, so naming the outer one made the encoder emit the whole plist as a
  flattened array. The inner key is `lines` now. That is the second such defect
  in two requirements -- REQ-0059 shipped an alist that encoded as the string
  "(.py . 9)" -- and both were found by reading the REST answer rather than by
  a test, which is worth noticing about how these are being checked.

  OPEN QUESTIONS

  Both are answered above. One remains, and it is new: the band is on the
  named-repository form and not on the federated one. A `find` with no
  repository that matches nothing is the strongest absence claim Loom makes,
  and giving it occurrences would cost one subprocess per watched tree -- nine
  here. Whether that is worth paying on a miss is a measurement nobody has
  taken.
