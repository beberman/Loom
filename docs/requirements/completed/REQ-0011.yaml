id: REQ-0011
title: System/module identity is an analyzer decision, made from language semantics, not a path guess in loom-graph
status: implemented
date: 2026-08-05
affects: [entity-system, edges-between-systems, in-system-p, entities-in-system,
          analyze-file]
importance: Major
tags: [rules, layering, analyzer, ontology, generality]
summary: |
  BUG-0006 fixed ENTITY-SYSTEM to stop reading the leading path segment (every
  file in this tree is "src") and read the segment after "src/" instead. That
  fix is narrower than it looks: it is still a directory-path guess, hardcoded
  to this tree's own convention, made by loom-graph rather than by the
  analyzer that actually parsed the file. Working through what "the system a
  piece of code belongs to" should mean for a repository Loom did not write
  itself surfaced a harder problem than a wrong path depth: in Common Lisp
  (and to a lesser extent Java, with split packages across source roots), the
  binding a symbol belongs to is a runtime declaration -- IN-PACKAGE -- fully
  independent of which file or directory holds the form, so a file anywhere on
  disk can reopen LOOM-GRAPH and add to it. Grouping by directory is not an
  approximation of that; it can be flatly wrong. This asks that system/module
  identity move to where the language is actually being parsed -- the
  analyzer -- with a path-based default for languages where the file is the
  only unit that exists (JavaScript, ordinary TypeScript) or where path
  already is the real mechanism (Python's directory-as-package import
  system), and a declared, file-independent binding read from the source for
  languages that have one -- IN-PACKAGE for Lisp now, with C++'s `namespace`
  and Java's `package` statement carrying the identical shape for later
  analyzers. C, which has no grouping construct at all, is the weakest case:
  its path default is convention with nothing backing it, not an
  approximation of a real answer the way it is for Python.
body: |
  WHAT IS WRONG, BEYOND BUG-0006

  ENTITY-SYSTEM (src/graph/query.lisp) computes a "system" by string-parsing
  an entity's `:file` property. BUG-0006 fixed it to look at the segment after
  `src/` instead of the leading one, and that fix is correct for what it
  claims -- RULE-0001 to RULE-0003 now catch a real cross-system call under
  this tree's own layout, with tests proving it (src/graph/test/query.lisp,
  src/graph/test/rules.lisp). But the fix is still: a hardcoded string
  ("src/"), a hardcoded depth (one segment past it), applied uniformly to
  every language Loom might ever analyze, computed in loom-graph -- the
  read-only query layer -- from a fact (the path) that has no necessary
  relationship to the fact that actually matters (what namespace, package, or
  module the code is bound into).

  For directory-per-package languages with a build tool that enforces the
  match (typical single-module Java, Go), the path happens to agree with the
  real answer, which is exactly why this has not caused visible trouble here:
  DES-0001-style silent agreement, the same shape BUG-0006's own "WHY IT HID"
  section describes for a different reason. It is not guaranteed even there --
  a multi-module build can and does put one package's sources under more than
  one source root. For Common Lisp specifically it is not even usually true in
  the way it looks: IN-PACKAGE is a form like any other, evaluated in
  sequence, and nothing prevents a file at any path from containing
  `(in-package :loom-graph)` and defining a function Loom would then have to
  treat as belonging to loom-graph regardless of which directory holds that
  file. Loom's own Lisp analyzer already reads and skips IN-PACKAGE forms
  (src/analyzer/lisp-analyzer.lisp:209, `*forms-to-skip*`) without recording
  which package was in effect -- CANONICAL-NAME (around line 117) deliberately
  strips package qualification to get "a plain, package-independent lowercase
  name," so the one piece of information that would answer this correctly is
  read and thrown away today.

  A SECOND PROBLEM THIS CONVENTION HAS NO ANSWER FOR

  A flat-namespace language -- JavaScript, TypeScript -- has neither a
  Lisp-style package binding nor a Java-style enforced directory-per-package
  convention to fall back on. Nothing computed from source semantics exists to
  key on; a path-based grouping is not a compromise there, it is the only
  structural signal available at all. A single hardcoded convention cannot be
  simultaneously "read the real binding" for Lisp and "there is no real
  binding, use the path" for JS -- the two languages need different answers,
  which is the argument for making this an analyzer decision rather than a
  loom-graph one. RULE-0002's own statement already draws this boundary for a
  different purpose: "loom-analyzer: path + contents -> operations." The
  system/module an entity belongs to is exactly path-plus-contents-derived
  information, computed once, at the only point in the pipeline that has
  already parsed the language -- not re-derived downstream from the path
  alone by a query function that never sees the contents at all.

  THE FULL LANGUAGE SET THIS HAS TO EVENTUALLY COVER, NOT JUST LISP VS
  EVERYTHING ELSE

  Loom is meant to run on JavaScript, Python, TypeScript, Java, C, C++, and
  Lisp, and "the language's own grouping construct, or path if it has none"
  is not one rule with one exception -- it is four different shapes, and
  R1's property representation needs to survive all four even though only
  Lisp is implemented now:

    - Declared, file-independent, reopenable binding. IN-PACKAGE (Lisp) is
      this. C++'s `namespace` is the identical shape -- declared in source,
      not tied to a file or directory, and legally reopened across
      translation units. Java's `package` statement is also this shape in
      principle, even though a build tool conventionally (and sometimes
      structurally) keeps it aligned with the directory tree, which is why
      the path default has not visibly failed for typical single-module
      Java.

    - Directory is the actual mechanism, not a convention that happens to
      agree with it. Python: the import system's semantics ARE the
      directory structure, so a path-based default is not an approximation
      there -- it is the right answer by language design, with one
      carve-out (PEP 420 namespace packages, which can span more than one
      directory root for a single package).

    - File is the only unit; nothing groups above it. JavaScript, and
      TypeScript in its ordinary ES-module form -- a module's identity is
      its file, so path-as-default is correct by design, not a fallback.
      TypeScript's legacy `namespace`/`module` keyword is the first
      category in miniature (declared, file-independent, reopenable) but is
      rare enough in current code to not warrant special-casing now.

    - No grouping construct exists in the language at all. C: no namespace,
      no module, nothing a compiler enforces above the translation unit.
      Any "system" a human sees in a C codebase is directory or
      naming-prefix convention with zero language backing -- the path
      default is weaker here than anywhere else on this list, not
      stronger, and R4's rule authors should not expect the same
      confidence from a C grouping that they get from a Lisp or Python one.

  R2's "path-based default" therefore means three different things in
  practice -- exactly right (Python, modulo namespace packages), correct by
  design (JS/TS), and bare convention (C) -- and R3's "real binding" already
  has two more instances waiting (C++, Java) once analyzers for them exist.
  Nothing here asks for those analyzers to be built now; see WHAT THIS IS
  NOT below.

  ALTERNATIVES CONSIDERED AND SET ASIDE WHILE ARRIVING HERE

  Keeping the fix in loom-graph but comparing full paths as prefixes, rather
  than truncating to one interned keyword, was considered: it removes the
  "how many segments deep" guess and generalizes past this tree's specific
  "src/" layout, since a rule could name whatever prefix it means. It does not
  survive the IN-PACKAGE problem above -- no path-based scheme, however
  general, can be right for a language where the grouping is not path-shaped
  in the first place.

  Hashing the path (a literal suggestion made and rejected while discussing
  this) was set aside for a more basic reason: a hash of a full path is
  visually and semantically a per-file identifier, not a per-group one --
  files meant to share a group hash to unrelated values, which is the wrong
  direction entirely regardless of the language question.

  WHAT A SOLUTION HAS TO COVER

  R1  The system/module identity of an entity is a property the analyzer that
      produced it decides and asserts, the same way it already decides
      :file, :start-line, :language, and every other fact ontology.md's
      entity types carry. Nothing downstream -- loom-graph, a rule's :no-edge
      check, `check` itself -- re-derives it from the path afterward. This is
      the core move: the guess BUG-0006 patched moves out of the query layer
      entirely, because the query layer is the one place in the five-system
      stack (per CLAUDE.md's Layering section) that structurally cannot know
      what a path means in a given language -- only the analyzer that parsed
      that language can.

  R2  Every analyzer supplies this property with at least a default: the
      entity's own path (or path plus filename, exactly as recorded today),
      normalized however the architect decides. This is what BUG-0006's fix
      already computes for this tree and must not regress for any analyzer
      that is not given a stronger rule under R3 -- a repository in a
      language Loom has no special-cased analyzer for is exactly as well
      served as it is today, not worse. "Default" does not mean uniformly
      approximate: for Python and JS/TS this default is the right answer by
      language design, not a placeholder; for C it is bare convention with
      no language backing at all, and rule authors should weight it
      accordingly.

  R3  The Lisp analyzer specifically computes this property from the nearest
      preceding IN-PACKAGE form in effect at the point a definition is read --
      not from the file's path -- because that is the actual CL semantics of
      what package a symbol is interned into, and a directory guess can
      disagree with it. CANONICAL-NAME already parses past package
      qualification for its own purpose; this asks for the package the
      analyzer already sees and discards to be kept and recorded as well, not
      for new parsing capability. C++'s `namespace` and Java's `package`
      statement are the identical shape and are expected to follow the same
      pattern once analyzers for those languages exist (see WHAT THIS IS NOT
      below) -- R1's property representation should not need a breaking
      change to accommodate them then.

  R4  RULE-0001 to RULE-0003 (and any future :no-edge rule) keep naming a
      group with a plain `from-system:`/`to-system:` value exactly as they do
      today; what changes is what that value is compared against -- the
      analyzer-supplied property from R1-R3, not a path parse. Whether
      RULE-0001 through RULE-0003's existing values (`ontology`, `analyzer`,
      `graph`, `knowledge`) still work unchanged or need to become full
      package names (`loom-ontology` rather than `ontology`) is an
      architecture decision, not fixed here -- either way `check`'s behavior
      against a real cross-system call must not regress from what BUG-0006's
      tests already established.

  R5  Noted, not required: this tree's own test suites already put test code
      in a distinct package from the code under test everywhere checked
      (`loom-graph-test` vs `loom-graph`, `loom-knowledge-test` vs
      `loom-knowledge`, `loom-analyzer-test` vs `loom-analyzer`). If R1-R3 are
      built, BUG-0009's cause one -- a test helper misclassified into the same
      system as the production code it exercises, because both live under the
      same src/<system>/ directory -- may close as a side effect of grouping
      by package instead of by directory, since the two packages differ.
      Verifying that is follow-up work once this lands; this document does
      not claim it as guaranteed, only as the reason it is worth checking
      before BUG-0009 is worked as a separate directory-exclusion fix.

  WHAT THIS IS NOT

  Not a request to populate code-ontology.lisp's existing but unused
  :PACKAGE/:MODULE/:REPOSITORY entity types with real entities and :contains
  edges. Whether the analyzer-supplied identity is a string property on each
  entity (cheapest, closest to what exists today) or a real graph entity with
  structural edges (heavier, but closer to what those ontology types were
  declared for) is an architecture decision this document leaves open.

  Not a request to give every language analyzer a stronger-than-path signal in
  this pass. Only Lisp gets one here, because Loom already has a Lisp analyzer
  and this tree to prove it against; Java's package statement, C++'s
  namespace, Go's package clause, and any other declared-binding language's
  equivalent are later, analyzer-by-analyzer work following the same pattern
  once an analyzer for that language exists. Python and JS/TS are not in that
  queue for the same reason they are not in R3's queue: the path default
  already is their correct answer, not a placeholder waiting for a stronger
  signal.

  Not a fix for BUG-0009's second cause -- RULE-0003's check clause forbidding
  every call from loom-knowledge into loom-graph rather than only a write.
  That is a gap in what the `:no-edge` check kind can express (no negation, no
  "except these functions"), orthogonal to how a system is named, and this
  document does not ask the architect to redesign check kinds.

  Not a decision to remove BUG-0006's *SRC-PREFIX* special case immediately.
  It is expected to become dead code once R1-R4 land, but that is a
  consequence for whoever implements this, not something asked for here.

  LEFT OPEN, FOR THE ARCHITECT

  What shape the analyzer-supplied property takes -- a plain string, a
  keyword, or a real ontology entity per R1's "not required" note above -- and
  where in the properties table it lives (a new key, or reuse of the
  :PACKAGE entity type code-ontology.lisp already declares at line 119).

  How to normalize a Lisp package name for comparison against a rule's
  from-system/to-system value: case folding, whether a leading "loom-" is
  stripped, and how CL package nicknames (a package may have more than one
  name) are collapsed to one canonical form so a rule does not have to name
  every nickname a package might be known by.

  What happens when a single file contains more than one IN-PACKAGE form
  (legal, if unusual): whether each entity takes whichever package was
  lexically in effect when its defining form was read (the literal CL
  semantics) or something coarser is chosen for simplicity.

  Whether a mixed-language repository -- Lisp entities grouped by package,
  everything else grouped by path -- needs any unifying presentation in
  `check`'s output and `rules`' listing, or whether it is acceptable that a
  rule author already has to know which convention applies to the language
  they are writing a rule about, the same way RULE-0001 to RULE-0003 already
  only ever meant Lisp systems.

  Whether R1's property representation needs to anticipate the
  declared-binding shape (C++ namespace, Java package) before analyzers for
  those languages exist, so that adding real extraction later is additive
  rather than a breaking change to entities already indexed under the path
  default.
