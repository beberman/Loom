id: REQ-0027
title: A product built from several repositories must be answerable as one system, which needs an edge that crosses two graphs
status: implemented
date: 2026-08-12
refines: [CON-0004]
affects: [impact-set, resolve-calls, linkable-index, build-context, entity-natural-key,
          apply-transaction, retract-file]
importance: Major
tags: [multi-repo, cross-repository, ontology, game-server, front-end, req-0024]
summary: |
  The question worth asking across a repository boundary -- what in the
  front-end breaks if I change this endpoint -- is the one an agent cannot
  answer by reading either repository alone, and it is precisely the question
  Loom exists for. REQ-0023 makes a service holding several repositories usable
  by having every query name the one it means. This asks for the harder half:
  an answer that spans them.

  Split out of REQ-0023 on 2026-08-12 rather than left as its outstanding item.
  Three unanswered things sit behind it -- a JavaScript analyzer, a place for an
  edge between two graphs to live, and a vocabulary the two sides can meet in --
  each with open questions of its own, and the first of them is a requirement
  that has not been built. A document in that state is not an OUTSTANDING note
  on another requirement; it is a requirement, and holding it inside REQ-0023
  meant neither half could reach a status of its own.

  It is gated on REQ-0024 and the gate is not a preference. Without a
  JavaScript analyzer the front-end contributes no functions, no modules and no
  calls, so a cross-repository edge has no endpoint to attach to and any
  demonstration would be Loom measured against itself.
body: |
  ORDER

  REQ-0023 first, then REQ-0024, then this. REQ-0023 because an answer spanning
  two repositories is useless from a console that cannot be told which one it
  means; REQ-0024 because until the front-end has code entities there is nothing
  at the far end of the edge this requirement is about.

  Neither is a soft dependency. This requirement should not be designed around
  before REQ-0024 exists, because the shape of what a JavaScript analyzer
  produces -- whether a module is the only grouping construct, whether JSX usage
  is a call -- decides what a cross-repository edge can even connect.

  WHAT THE FRONT-END CONTRIBUTES TODAY

  Read directly rather than assumed, 2026-08-11:

      ~/github/front-end
        .js and .jsx files                          455
        Loom analyzers that claim them                0
        markdown under node_modules                4730
        of those, in a docs/ dir -> indexed         334
        the project's own documents in docs/          5

  So pointing Loom at the front-end at that date yielded no code entities and
  334 vendored documents. The second number was BUG-0024 and is fixed --
  DES-0018 asks git what the repository ignores rather than deciding for it. The
  first is REQ-0024 and is the gate on everything here.

  Both were named in REQ-0023 rather than absorbed, and the reason still holds:
  a multi-repository feature demonstrated against a repository Loom cannot read
  would be a measurement of nothing.

  EDGES ACROSS GRAPHS, AND WHAT THEY NEED

  Three things, in order of difficulty:

  A JavaScript analyzer, REQ-0024. Without it the front-end has no functions, no
  modules and no calls, so a cross-repository edge has no endpoint to attach to.
  This is the gate and it is the largest piece of work of the three.

  Somewhere for the edge to live. The ontology models one workspace; entity ids
  derive from natural keys within a graph, and no relationship type has an
  endpoint in another graph. Whether that becomes one graph with a repository
  property, a federation with cross-graph edges, or a third index that holds
  only the joins is an architecture question with different costs for
  reindexing, retraction and impact traversal.

  A vocabulary the two sides can meet in. A front-end `fetch('/public/game/
  create')` and a Lisp handler for that route share no symbol; the join is the
  HTTP contract, and game-server has already written it down -- docs/api.md
  lists the routes under "## Game Lifecycle", "## Type Definitions" and the
  rest. So the contract exists as prose in one repository and as string literals
  in the other, and the derivation is a matching problem rather than a
  call-graph one. Worth noting that api.md is 50% fenced lines, so REQ-0014's
  fence exclusion currently hides exactly the endpoint table this would need.

  The encouraging evidence is that the two repositories already mirror each
  other: front-end has src/data-api and game-server has data-api/, and both
  document soft delete. The join is real and an author has already drawn it
  twice by hand.

  THE CROSS-CUTTING DOCUMENT, WHICH IS THE REASON TO WANT THIS

  REQ-0023 records the gap and cannot close it. "Soft delete must hide a record
  from every read path" is a claim about both repositories -- game-server's
  `dhandler-delete-selector` and the front-end's docs/SoftDelete-Architecture.md
  are the two halves of it, and both already exist. Written in one repository it
  governs code the other holds; written in both it is two documents that drift.

  That is the user-visible payoff and it is worth stating separately from the
  edges, because it is possible to build cross-repository edges that answer
  `impact` and still leave a requirement with no home. An answer to this
  requirement that does not let one document govern code in two repositories has
  solved the mechanical half only.

  WHAT THIS IS NOT

  It is not a monorepo proposal. The repositories stay separate, are cloned
  separately, and branch independently; Loom watches several and answers about
  them, which is a different thing from merging them.

  It does not reopen per-repository ids. A REQ lives in one repository and
  REQ-0021's per-workspace ids stand; what this adds is the ability for a
  document in one to name code in another, which is a different mechanism from
  sharing an id space. REQ-0025's ledger is keyed on a project's root commit
  and two repositories of one product have two of those, so nothing here makes
  their id spaces one.

  It does not assume the repositories are checked out at compatible commits.
  They are not, in general -- the front-end may be running against a deployed
  backend three tags behind the worktree Loom is indexing. Any cross-repository
  answer is therefore an answer about two working trees, not about production,
  and must say so rather than imply a coherence nobody guaranteed.

  REQUIREMENTS

  R1  An edge may connect an entity in one repository to an entity in another,
      and `impact` traverses it. What breaks in the front-end if this handler
      changes is the question, and it must be answerable from either end.

  R2  Reindexing one repository does not corrupt the other. A retraction that
      removes an endpoint must leave no dangling edge and no silently surviving
      claim, which is the property the three architecture options above have
      genuinely different costs for.

  R3  A cross-repository edge is derived and reported as such. The join is a
      match between a route written as prose in one repository and a string
      literal in another; it is inference, it carries a confidence, and CON-0001
      applies -- an ambiguous match stays unresolved and is reported rather than
      guessed.

  R4  One document can govern code in two repositories. The cross-cutting
      requirement REQ-0023 records as a gap becomes writable once, and `impact`
      on either half reports it.

  R5  A cross-repository answer says which working trees it describes, and at
      which commits. Two trees at unrelated commits can be described together
      and the answer must not read as a claim about a deployed system.

  R6  Acceptance is the soft-delete question run end to end: change
      `dhandler-delete-selector` in game-server and have `impact` report the
      front-end code that consumes the affected endpoint, with the path it was
      reached by. A count of edges is not acceptance; the named answer is.

  OPEN QUESTIONS FOR THE ARCHITECTURE

  - One graph with a repository property, federated graphs with cross-graph
    edges, or a separate join index? The choice decides what reindexing one
    repository costs and whether a retraction can leave a dangling edge in
    another.
  - How does an agent working in one repository discover that another is watched
    and relevant? A prepared workspace knows its own name; nothing tells it that
    a backend it calls is also indexed.
  - Does an HTTP contract become a first-class entity type, or are route matches
    derived edges between existing ones? The first makes the contract queryable
    in its own right and is the larger change.
  - What does a cross-repository answer say about commit skew? Two working trees
    at unrelated commits can be described together, but the answer is about
    those trees and should not be readable as a claim about a deployed system.
  - Does REQ-0014's fence exclusion need an exception for an endpoint table? The
    contract this requirement needs to read is inside fenced blocks in
    game-server's docs/api.md, and fences are skipped on purpose because a fence
    is a transcript rather than a document naming something. An exception is a
    change to a rule that is currently simple and right.
