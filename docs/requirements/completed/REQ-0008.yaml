id: REQ-0008
title: Loom must run as a long-lived service, reachable over MCP and later REST
status: implemented
date: 2026-08-02
affects: [function:src/process/console.lisp:main, console, run-command, current-repository, current-graph]
importance: Critical
tags: [process, service, mcp, rest, agents, interface]
summary: |
  Loom today is one process per call: `tools/loom.sh` starts `sbcl --script
  loom.lisp`, watches the tree, runs the requested commands, pauses, and exits
  -- every invocation pays a cold reindex and no two callers can ever share a
  running graph. An MCP-capable agent has to shell out to that script and
  scrape terminal-formatted text back out of stdout rather than making a typed
  call. This asks for Loom to run as a standing process that keeps a graph
  resident across many callers, reachable first over MCP for LLM agents, with
  a REST interface for a UI to follow once MCP is settled.
body: |
  WHAT IS WRONG

  console.lisp's main is "started by the developer and pointed at a
  repository" (SS3.1, quoted in the file): it watches whatever paths are on
  argv, drops into console, and on EOF or `stop` pauses every repository and
  returns. tools/loom.sh wraps this for non-interactive callers by feeding it
  `watch "~/lisp/Loom"`, the requested commands, then `stop`, over stdin to a
  freshly spawned `sbcl --script loom.lisp`, and reading stdout back. Three
  consequences follow directly from that shape, not from anything specific to
  Lisp or to this codebase:

    Every call is a cold start. The in-memory graph lives in the OS process,
    and the process exits at the end of every invocation, so `pause`'s
    "keep the index" promise (DEC-0004) only holds within one call. The next
    call reindexes from disk regardless. Measured today via
    tools/loom-test.sh's paired timing in PLAN-0003's OUTCOME, a full rebuild
    of this tree is 135-143 ms -- cheap now, and not a bound on what it costs
    once the tree or the ruleset it checks grows.

    One process is one caller. Two agents that both want to query Loom in the
    same window -- an architect and a tester in the same multi-agent run, or
    an MCP client and a human at a terminal -- cannot share a running index;
    each spins its own cold process, and nothing stops the two from
    disagreeing if the tree changed between them.

    The interface is a terminal, not an API. SS3.2 is explicit that the
    console's line-and-quoted-arguments grammar exists so a human "who does
    not write Lisp" can type it, and every command's output is formatted with
    `~a`-style directives for a terminal, not returned as structured data.
    That is the right shape for a human at a prompt and the wrong shape for an
    MCP tool call or a REST request, both of which want a typed request in and
    structured data back, not a string to re-parse.

  WHY THIS MATTERS NOW

  CON-0004 argues Loom's own development should run through Loom, and REV-0001
  already dogfooded that with a multi-agent workflow -- architect, planner,
  coder, tester, reviewer -- each shelling out to tools/loom.sh in turn.
  Finding 1 of that review recorded one entire class of failure from exactly
  this process-per-call shape: an agent whose sandbox could not reach the
  invocation at all had no way to ask Loom anything. A standing service that
  agents reach over a protocol built for exactly this -- MCP -- removes the
  shell-out-and-scrape step and the fragility that came with it, for every
  future agent, not just the ones this session's fix happened to cover.

  The concurrency groundwork this would need already exists and is tested,
  which is what makes now a reasonable time to ask for it rather than a
  reason to wait. DES-0003 gave the graph's hash tables a shared reentrant
  lock, DES-0004 gave each repository its own lock with a stated acquisition
  order, and PLAN-0003 closed the one remaining race in id minting. All three
  were written for a console thread and a per-repository monitor thread
  sharing one graph; a persistent service multiplies the number and kind of
  callers that can be "in" the graph at once, which is a new caller shape for
  that locking to be exercised under, not a new locking problem to solve.

  WHAT A SOLUTION HAS TO COVER

  R1  Loom can run as a long-lived process that keeps one or more
      repositories indexed and watched in memory across many calls, instead
      of indexing once per call and exiting. This is an in-image server --
      a threaded HTTP/MCP listener started inside the same SBCL process that
      holds the graph, in the shape Hunchentoot or a comparable Common Lisp
      server library provides, not a supervisor script that keeps
      tools/loom.sh's spawn-per-call model alive under a wrapper. The graph
      and a caller's request must be able to share the one Lisp image; a
      design that shells out to `sbcl --script` per request would keep
      exactly the cold-start cost this requirement exists to remove.

  R2  An MCP server interface exposes the console's read vocabulary --
      find, describe, impact, context, status, check, rules -- as MCP tools
      returning structured results, not the console's terminal-formatted
      prose. An MCP-capable agent calls Loom directly; it does not shell out
      to a script and scrape stdout.

  R3  Concurrent callers are safe against each other and against the
      repository's own file-watcher thread. More than one MCP client, or an
      MCP call arriving while a REST call is in flight, must not corrupt or
      race the graph. This is a new caller shape to verify the existing
      DES-0003/DES-0004/PLAN-0003 locking under, not a new mechanism to
      design.

  R4  A REST interface exposes the full console command vocabulary over
      HTTP -- reads (find, describe, impact, context, status, check, rules),
      the commands that change state (watch, pause, unwatch, reindex), and
      R9's REPL access -- so a React-based command-and-inspection UI can be
      built directly against it, without going through MCP or the Lisp
      process another way. What a given caller may reach among those is a
      permission tier per R6, not a line drawn between what REST exposes and
      what it does not: REST is a full peer of MCP here, not a read-only
      facade in front of it.

  R5  The console keeps working exactly as it does today -- interactively via
      `sbcl --script loom.lisp` and non-interactively via `tools/loom.sh`.
      This is an additional way to reach Loom, not a replacement for the one
      CLAUDE.md, the loom skill, and every agent definition currently depend
      on, and nothing here should force a migration off it as a precondition.

  R6  Read, write (watch, pause, unwatch, reindex, and anything that changes
      which repositories are indexed), and R9's REPL are three separate
      permission tiers, each checked at the point a caller invokes it,
      regardless of whether the caller reached Loom over MCP or REST.
      RULE-0001 to RULE-0003 already draw one such line -- "Knowledge
      Services never write" -- and the requirement is that this generalizes
      rather than being read as protocol-specific: a caller granted only the
      read tier must not reach write or REPL by the mere fact of holding an
      HTTP or MCP connection. The protocol is not a proxy for trust; the
      tier a caller is authenticated for is.

  R7  A running service's lifecycle is defined and observable: how it starts,
      how a client tells a running instance apart from "nothing is
      listening," how it stops, and what becomes of in-memory watcher state
      across a restart. Today that lifecycle is "one process, one call, dies
      at the end," and something explicit has to replace it.

  R8  A malformed or invalid call reaches a structured caller the way
      run-command's handler-case reaches a human today: a name, a message,
      and no bare Lisp condition or stack trace. SS3.3's argument -- a
      mistyped command should say what to type instead, not drop the caller
      into a debugger -- applies to a bad MCP tool call or an invalid REST
      query exactly as it does to a mistyped console line, and the
      requirement is that this survives translation into each protocol, not
      that each protocol reinvents it.

  R9  A live REPL into the running service's own image is reachable through
      the same REST and MCP surfaces R2 and R4 expose, not only from a
      terminal -- the React command-and-inspection UI is meant to reach it,
      for the reason console's `repl` command exists today: sometimes the
      fastest way to inspect a stuck watcher thread or a bad graph state is
      Lisp itself, not a fixed command set, and that capability must not be
      lost when the console stops being the only way in. It is still its own
      permission tier under R6, stricter than write and never implied by it
      -- CL:EVAL is arbitrary code running inside the one process holding
      every watched repository's graph, able to shell out, touch the
      filesystem, or redefine the image's own functions, so a caller's
      access to it must be granted explicitly and separately from read or
      write, whichever protocol carries the request.

  WHAT THIS IS NOT

  Not a request to design the MCP tool schema, the REST route table, or an
  authentication model -- those are architecture-stage decisions, and R6 is
  the only boundary this requirement insists on in advance.

  Not a request to build the UI. REST is a precondition for one; the UI
  itself is separate work with its own requirement when it is taken up.

  Not a request to change what Loom knows, how it analyzes, or how it
  resolves -- loom-ontology, loom-graph, loom-analyzer, loom-knowledge and
  loom-workspace are untouched by this. This is a process- and
  interface-boundary requirement sitting on top of the existing layering,
  most likely inside or beside loom-process, the layer CLAUDE.md already
  describes as "the console."

  Not a request to drop or deprecate the console (see R5).

  LEFT OPEN, FOR THE ARCHITECT

  Where the service boundary sits in the existing layering: whether
  loom-process itself grows a serve mode alongside console, or a new system
  sits above it and calls into loom-knowledge the way console.lisp does now.

  Whether one persistent process serves both MCP and REST, or two do.

  How repository selection -- console's current-repository, which implies
  the one watched repository and refuses to guess among several -- translates
  to a caller that is not a single human at one prompt. An MCP or REST call
  most likely must always name a repository rather than relying on there
  being exactly one.

  Whether MCP tool results and REST responses should mirror the console's
  existing output shape (the plists describe-entity, impact-report and
  friends already return, which console.lisp only formats for a terminal) or
  something else -- the underlying data is already structured; only the
  console's formatting step is prose.

  Which Common Lisp server library the in-image listener is built on --
  Hunchentoot is the obvious default and is named in R1 as an example of the
  shape wanted, not a decision -- and whether MCP rides the same HTTP listener
  REST does or its own transport, both of which are architecture-stage
  choices this requirement does not make.

  How R9's REPL is shaped as a request/response call rather than an
  interactive stream: whether each call is a fresh, stateless eval -- read
  one form, eval it, return what it printed and returned, the same unit
  console's `repl` gives one line at a time -- or a caller can open a session
  that keeps its own `*package*` and bindings alive across calls the way a
  live terminal REPL does. The React UI most likely wants the latter for a
  usable REPL experience, which is a stateful piece sitting inside an
  otherwise stateless HTTP design and is worth the architect calling out
  explicitly rather than deciding by default.
