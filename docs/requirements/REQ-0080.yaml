id: REQ-0080
title: A web UI shows the documents and their relationships, edits them in
  place, and manages agents through an adapter interface, because the only
  surfaces today are a console, a REST API and MCP
status: draft
priority: p2
date: 2026-10-17
refines: [REQ-0008, REQ-0021]
affects: [handle-request, "*route-prefix*"]
importance: Major
tags: [ui, web, explorer, editor, create, responsive, mobile, css, shadow-dom, theme, react, agents, adapter, cloudcli, plugin, rest, des-0006, dec-0001]
summary: |
  Synoptik answers through `tools/synoptik.sh`, REST under `/v1/` and MCP at
  `/mcp` (REQ-0008). A person reading the documents follows `refines:` and
  `affects:` by running `describe` and `impact` and reading the output. Editing
  a document means opening a YAML file, then running `check_document` to learn
  whether it resolves. Starting an agent on a task, and seeing what it is doing,
  happens in a terminal Synoptik does not know about.

  This asks for a browser UI over the existing REST routes with two parts: the
  documents, their relationships and an editor, built as React components that
  run standalone and inside CloudCLI as a plugin; and agent launch and status,
  which CloudCLI already provides and which Synoptik reaches through an
  interface other tools can implement. CloudCLI has no concept of a document,
  so the first part is what it lacks.
body: |
  PRIORITY: P2, 2026-10-17

  Impact is that every question the index can answer is reachable only by
  someone who already knows the command vocabulary. Probability is every use.

  Sequence: REQ-0008 is the surface this sits on. REQ-0021 R8 says an agent in a
  prepared worktree reaches Synoptik through the service; the agent half of this
  is the other direction, a person reaching agents from the service.

  WHAT IS WANTED

  R1  The UI is a React application in `src/web/`, a directory beside the Lisp
      systems and not a Lisp system. Its documents, relationships and editor
      are components that reach the service through a client object they are
      given -- a function from method, path and body to a response -- and not
      through a URL they build or a global they read. One set of components
      then runs in more than one host. They use the `/v1/` routes only, hold no
      copy of the graph, and carry no logic that decides what a document means;
      that stays in synoptik-knowledge.

  R2  Two hosts for those components. A standalone shell is served by the same
      listener as REST and MCP, so a running service is a running UI with no
      second process, and its client calls `/v1/` directly. A CloudCLI plugin
      adds a Synoptik tab. CloudCLI imports a plugin as an ES module and calls
      its `mount(container, api)` in the host page, so the plugin's `mount`
      builds a client from `api.rpc` and renders the same components into
      `container`. `api.rpc` reaches only the plugin's own Node subprocess, so
      the plugin ships a small server that forwards to the Synoptik service at
      a configured address, and a service token, if one is needed, is held as
      a CloudCLI plugin secret and not in the browser. A development mode may
      use a separate dev server that proxies to the service.

  R3  Explorer. A list and a map of every document in a repository, filterable
      by type (requirement, design, plan, bug, decision, review, architecture,
      concept, rule), by status, by priority, by tag and by free text over id
      and title. Filters combine. Each document is drawn as an icon for its type,
      its id, and a short title. The title is the document's own, cut at a
      length that fits the icon, and the full title shows on hover and on
      selection.

  R4  Connections. The map draws the documents that pass the filters and the
      `refines` and `affects` links among them, with the link type on each
      edge. A filter can be widened to include the documents connected to the
      ones it matched, to a chosen number of links. Asking for the requirements
      tagged `multi-user` and widening by two links shows those requirements
      and the designs and plans that refine them, and what refines those. A
      reference that resolves to nothing is drawn and marked unresolved, as
      `check` reports it, and not omitted. Selecting a document shows its
      relationships grouped by edge type as `describe` groups them.

  R5  Editing. Selecting a document opens it in an editor. The editor builds a
      formatted view from the YAML: fields such as status, priority, tags and
      `refines` as form controls, and the summary and body as structured text
      with headings, paragraphs, numbered and bulleted lists, requirement items
      such as R1 and R2, and code. It has no font, size, colour or other styling
      control, because YAML holds none and a styling would be lost on save. It
      has the usual editing tools: undo and redo, find and replace, keyboard
      shortcuts, and a toggle to the raw YAML. A document opened and saved
      without a change is byte-identical to the file, and a change alters only
      the lines it touched. Before saving, the text goes through
      `check_document` and the result is shown beside the editor. A save made
      against a file that has changed since it was read is refused and shows
      both versions. Files are truth (DEC-0001): the UI writes the file and the
      index follows through the file monitor. It does not write to the graph.

  R6  Status transitions use the existing path. `set-status` and `complete`
      (REQ-0022) are offered as they are, including `complete`'s dry run, and
      the UI does not compute what a transition needs.

  R7  Agents are managed through an interface the UI defines and does not
      implement for any one tool. The interface has these operations: list
      sessions; launch a session given a repository, a task and optionally a
      worktree; stop a session; read a session's status; subscribe to status
      changes; and answer a request for approval where the tool supports one. A
      tool that cannot do one of them says so in a capabilities answer, and the
      UI hides what is not offered rather than showing a control that fails.
      Inside CloudCLI the host's own session, launch and terminal features are
      used and the standalone shell's agent views are not shown.

  R8  A status is one of a fixed set: working, waiting for input, waiting for
      approval, idle, finished, failed, unknown. An adapter that cannot tell
      reports unknown. It does not guess a nearer state (CON-0001).

  R9  One adapter reports what Synoptik can observe without any third-party
      tool: sessions that have called `synoptik_context` or `synoptik_context_used`
      (REQ-0036) and when. It implements list and status and declares the
      rest unsupported.

  R10 The reference adapter for the standalone shell drives CloudCLI. It is a
      separate module that talks to CloudCLI over its REST API and does not
      vendor or link CloudCLI's code. Which of the interface's operations it
      can implement is set by what that API offers, and is recorded in its
      capabilities answer rather than assumed.

  R11 Launching and stopping an agent are writes. They go through the
      service's tier check, and a read-only caller is not offered them, as MCP
      already withholds `synoptik_context_used` from a read-only caller
      (REQ-0032).

  R12 The UI works against a service with no adapter configured. Documents,
      relationships and editing do not depend on R7 to R11.

  R13 The components are responsive and every view works on a phone. At a
      360 px viewport width nothing scrolls horizontally except the editor's
      own text and the relationship graph's canvas, controls are at least 44 px
      square, and the document list, a document's relationships, the editor
      and the status transitions are all usable by touch alone. The
      relationship graph pans and zooms by touch and also offers the same
      relationships as a list, since a dense graph is unreadable at that
      width. This holds in both hosts, so a CloudCLI plugin tab works in
      CloudCLI's mobile view.

  R14 Styles do not cross the boundary of the host. CloudCLI mounts a plugin
      into its own page, with no iframe, so a global stylesheet from the
      plugin would restyle CloudCLI and CloudCLI's styles would restyle the
      plugin. Therefore the plugin renders inside a shadow root it attaches to
      the container, with the plugin's stylesheet loaded into that root and
      nowhere else. Overlays -- dialogs, menus, tooltips -- render into the
      same root and not into `document.body`. The standalone shell needs no
      shadow root and uses the same stylesheet. The styling framework is
      Tailwind (DEC-0011), built so that its output works in a shadow root and
      its reset applies nowhere else. A shadow root isolates style only: module
      plugins share the host's DOM and are trusted code.

  R15 The plugin follows CloudCLI's theme. It reads `api.context.theme`,
      subscribes with `api.onContextChange`, and switches between a dark and
      a light palette without a reload. The standalone shell follows the
      browser's `prefers-color-scheme`.

  R16 Creation. The UI creates a requirement or a bug and no other type. Designs,
      plans, decisions, reviews and the rest are drafted by agents and reviewed
      and edited here, so the UI offers no way to create them and the service
      refuses to create one through this path. A new document takes its id from
      the same allocator `tools/next-doc-id.sh` uses and starts from a template
      with the required fields present and empty sections to fill in. The author
      may name the documents it refines, chosen from the explorer's list.

  ACCEPTANCE

  Open the standalone UI against the running service. Filter to requirements
  tagged `multi-user` and widen by two links. See the designs and plans that
  refine them, each as an icon with its id and a short title, and find an
  unresolved reference marked as such. Select REQ-0077 and see its `refines`
  and `affects` links; follow one to REQ-0073.

  Open REQ-0077 in the editor, save without a change, and see the file
  unchanged. Edit its `priority`, see `check_document` report clean, save, and
  see only that line changed on disk and the index follow. Change the file from
  a terminal while the editor is open, save, and see the conflict refused with
  both versions shown. Confirm the editor has no font, size or colour control.
  Run a `complete` dry run from the UI and read the same text
  `tools/synoptik.sh 'complete ...'` prints.

  Create a new requirement and a new bug, each with the next free id and the
  template's fields. Confirm there is no way to create a design, a plan or a
  decision, and that a direct request to create one is refused.

  Install the plugin in a CloudCLI instance and check that CloudCLI's own tabs
  look the same with the plugin enabled as with it disabled, and that
  toggling CloudCLI between dark and light changes the Synoptik tab with it.

  With no adapter configured, every document view still works. With the native
  adapter alone, see which sessions have queried Synoptik and when. With the
  CloudCLI adapter configured on the standalone shell, launch a session, watch
  its status move from working to waiting or finished, and stop another.

  OPEN QUESTIONS

  - Whether a CloudCLI plugin may be MIT-licensed. CloudCLI is
    AGPL-3.0-or-later and Synoptik is MIT. A plugin is its own repository and
    reaches Synoptik over HTTP; whether loading it into the AGPL host makes it a
    derived work is not established, and CloudCLI's plugin documentation and
    NOTICE should be read before the plugin is published.
  - How the plugin repository gets the components. CloudCLI's manifest page
    puts `manifest.json` at the plugin's root and mentions neither subdirectory
    nor monorepo installs, so the plugin is its own repository. It installs by
    shallow clone and `npm install --ignore-scripts`, then `npm run build`,
    which can run any code the repository holds. It must therefore build the
    components from a published package or a pinned source, and the build
    step is part of what a user trusts.
  - What CloudCLI's REST API exposes for launching and stopping a session. The
    README lists the API as present and names no routes. R10 is bounded by
    this, and the plugin route is not.
  - Whether Tailwind builds into a shadow root as DEC-0011 requires. Its
    `rem` sizes follow the host's root font size, and Tailwind 4's `@property`
    rules are reported not to apply inside a shadow root. A spike that mounts a
    styled page into a shadow root, with the plugin starter's build, settles the
    major version before components are written.
  - How a plugin tab appears on a phone. CloudCLI is responsive and installable
    as a PWA, with a bottom bar for Chat, Files, Git and Settings. Its mobile
    page does not mention plugins, so whether a plugin tab is reachable there,
    and at what width it renders, is not established. R13 depends on it.
  - Phone access to the standalone shell. The listener refuses any Host that is
    not loopback (DEC-0008) and the service has no credential, so a phone cannot
    open the standalone shell over the network. R13's phone acceptance holds
    through the CloudCLI plugin, and for the standalone shell only in browser
    emulation, until a credential exists.
  - Which editor library gives a structured, formatted view of YAML text and
    keeps an unedited document byte-identical. Existing bodies are plain text
    with conventions such as upper-case section names and `R1` items, not
    markdown, so a rich-text editor that normalises its input would change
    files it only opened. A spike round-trips every document in `docs/` and
    counts the files that differ.
  - Whether the native adapter's source is hook events, transcript files, or
    only the service's own request log, and which of these tells waiting from
    idle.
  - Whether the editor saves through a new REST write route or through the
    `complete`/`set-status` path extended. No route today writes arbitrary
    document text.
  - Authentication for a UI on a listener that binds 127.0.0.1 by default and
    that SECURITY.md already notes serves every local user on a shared machine.
