id: REQ-0055
title: unresolved-calls should stop being a stored property and a generated entity's system should come from the call site rather than the file
status: partial
date: 2026-08-27
refines: [REQ-0015]
affects: [resolve-calls, generated-entity, entity-system]
importance: Minor
tags: [graph, ontology, resolution, des-0014, cleanup]
summary: |
  `:unresolved-calls` is still declared on four entity types in
  src/ontology/code-ontology.lisp -- lines 507, 629, 729 and 911 -- and written
  at src/graph/resolve.lisp:1295. DES-0014 explains what the property buys
  RESOLVE-CALLS and does not defer removing it, so this document is the only
  record that the removal was intended.

  The second half is separate and smaller: a generated entity's `:system` is
  taken from the file it was minted into, and the call site is what it actually
  belongs to.
body: |
  WHY IT IS STILL HERE

  The property is a resolution intermediate stored as if it were a fact about
  the entity. RESOLVE-CALLS uses it to treat a call site as still open across
  passes, which is real work, but a caller reading `describe` sees it beside
  properties the analyzer asserted from source, and the graph is DEC-0001's
  index over files rather than a place to keep a pass's own bookkeeping.

  THE CONFLICT WITH BUG-0055, STATED RATHER THAN RESOLVED

  BUG-0055 needs exactly what this property holds: it is the analyzer's own
  record of which calls it declined to attribute, and the fix for a `calls` band
  that presents a guess as a resolution is to carry that distinction through to
  the answer. So the two documents disagree about the same field on purpose.

  The order matters and is not negotiable: nothing may remove `:unresolved-calls`
  until the distinction it carries has somewhere else to live. If BUG-0055 lands
  an `inferred` marker on the edge, the property becomes redundant and this
  removal is clean. If it does not, this removal destroys the one piece of
  evidence that says which quarter of a JavaScript call band can be trusted.

  UPDATED 2026-08-27, WHEN BUG-0055 CLOSED

  R2's blocking condition is met, and the reason is worth stating exactly
  because the two fields were being conflated. BUG-0055 was about names that
  resolved to *several* candidates and were reported as though they had
  resolved to one; the marker now lives on the edge, as :EDGE-SOURCE and
  :EDGE-CONFIDENCE on a neighbour row and :INFERRED on an impact row. That is
  the confidence distinction, and it no longer needs :UNRESOLVED-CALLS.

  What :UNRESOLVED-CALLS still holds on its own is different: names that
  resolved to *nothing*. On front-end's ingestModel those are `LatLng`,
  `unknownTypeNames.push`, `unknownTypeNames.includes`, `map` and `reset` --
  genuine external dependencies and a standing record of them. R1 must account
  for that separately, and a removal that drops it silently trades one recorded
  gap for no record at all.

  REQUIREMENTS

  R1  `:unresolved-calls` is not stored on an entity. Whatever RESOLVE-CALLS
      needs across passes lives in the pass, not in the graph.

  R2  R1 does not land before the confidence distinction BUG-0055 asks for has
      another home. Met on 2026-08-27: the marker is on the edge. What is not
      met is the second job the field does, which R1 now has to answer for --
      a name that reached nothing has no other record.

  R3  A generated entity's `:system` is derived from the call site that
      generated it rather than from the file it was written into. DES-0009 makes
      `:system` the file's own package name, which is right for a definition and
      wrong for an entity minted on behalf of a call somewhere else.

  ACCEPTANCE

  `describe` on a JavaScript function returns no `unresolved-calls` property and
  a `calls` band a caller can trust, in that order. `check` reports the same
  zero violations before and after, and the rules that key on ENTITY-SYSTEM see
  a generated entity in its caller's system.

  OPEN QUESTIONS

  - Is R3 measurable on this tree? No rule names a generated entity today, so
    the change may be invisible to `check` and visible only in `structure`.

outstanding: |
  OUTSTANDING 2026-08-28: R1 AND R3 ARE WITHDRAWN, ON EVIDENCE

  Both rest on a misreading of the code, and the misreading is this document's.

  R1 SAID THE PROPERTY IS A RESOLUTION INTERMEDIATE. IT IS NOT.

  "RESOLVE-CALLS uses it to treat a call site as still open across passes."
  Nothing reads :UNRESOLVED-CALLS. It is written at src/graph/resolve.lisp:1295
  and declared on four entity types in the ontology, and there is no other
  mention of it in synoptik-graph, synoptik-analyzer, synoptik-knowledge or synoptik-workspace.
  RESOLVE-CALLS derives it from :CALL-NAMES every pass and never consults it --
  which its own docstring says, and which is DEC-0003 working rather than the
  bookkeeping this document took it for.

  What the field actually does is the job the 2026-08-27 amendment identified:
  it is the only record that a definition calls a name no definition in the
  tree answers. On front-end's ingestModel those are LatLng,
  unknownTypeNames.push, unknownTypeNames.includes, map and reset -- genuine
  external dependencies, and the evidence BUG-0055 reasoned from. Removing it
  trades a recorded gap for no record at all, which is CON-0001 inverted.

  R3 ASKED FOR A CHANGE THAT WOULD HAVE NO EFFECT.

  "A generated entity's :system is derived from the call site that generated it
  rather than from the file it was written into ... an entity minted on behalf
  of a call somewhere else."

  There is no somewhere else. GENERATED-ENTITY's docstring: ":ORIGIN-FILE is the
  *calling* file, never the macro's." The file whose :SYSTEM is taken is the
  file holding the call site, and since DES-0009 :SYSTEM is that file's package
  name -- so file-derived and call-site-derived are the same value by
  construction. Checked on this tree: the call site define-operation mints at
  src/serve/repl.lisp:195 carries system synoptik-serve, and so does
  src/serve/repl.lisp. The document's own open question suspected this and
  asked whether R3 was measurable; it is not, because there is nothing to
  measure.

  WHAT WAS DONE INSTEAD, AND IT IS THE OPPOSITE

  The one true observation underneath R1 is that the field is written by one
  line, read by no pass, and printed by nothing. That is why it looked like
  leftover state -- and the repair is to show it, not to delete it. `describe`
  now prints an `external' band beside the neighbour bands:

      -> calls: remoteServer.get (inferred 0.33), msgHandler.get (inferred
         0.33), BiMap.get (inferred 0.33), ingestPartition
      external: LatLng, unknownTypeNames.push, unknownTypeNames.includes, map,
         reset
         5 names no definition in this tree answers.

  The two bands are complements and a reader judging whether a thin `calls`
  band is thin needs both: BUG-0055 made the guesses say so, and this makes the
  gaps say so.

  R2 IS MET AND IS NOW MOOT

  BUG-0055 put the confidence distinction on the edge, which satisfied R2's
  condition. The second job the amendment worried about -- a name that reached
  nothing having no other record -- is not a problem to solve but the reason R1
  is withdrawn.
