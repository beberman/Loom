id: REQ-0069
title: A symptom that traces into a dependency outside the watched set gets no index support, and nothing suggests registering the dependency's own source tree
status: draft
date: 2026-09-10
refines: [REQ-0023]
affects: [prepare-repository, repository-for-similar]
importance: Major
tags: [watch, dependencies, federation, skill, guidance, game-server, req-0023]
summary: |
  Diagnosing game-server's REQ-0003 crash on 2026-09-01 led into `~/lisp/cl-dbi`
  and `~/lisp/cl-mysql`, local checkouts of libraries the server depends on,
  neither watched by Loom. The root cause -- `dbi:connect-cached` keying its
  cache on `(current-thread . connect-args)`, so two independent
  connection-pool members opened from one thread silently collapsed onto one
  real connection -- was found entirely by `grep`, `cat` and direct SBCL
  introspection across three packages with confusing nickname relationships
  (`dbi.cache.thread` nicknamed `dbi.cache`, `cl-mysql-system`).

  That is exactly the unfamiliar, multi-file, cross-package tracing an index
  helps most with, and it got none. `POST /v1/watch` would have registered
  either tree in one call. The gap is that nothing prompted doing so: the loom
  skill's own tree list reads as a fixed set rather than as something a session
  facing a dependency-internals bug should extend on the spot.
body: |
  WHAT IS WANTED

  R1  When a query names something the tree depends on and does not define,
      Loom says the dependency's source could be watched. The material is
      already there: a Lisp tree's `.asd` files name every `depends-on`, a JS
      tree's `package.json` names every dependency, and REQ-0059 taught a
      zero-hit `find` to report what it could not have read. A miss on a name
      that a `depends-on` supplies is a different miss from a name nothing
      supplies, and only the first has a fix.

  R2  Registering the dependency is one step from that message. A path, or the
      dependency name plus a way to find its checkout. Naming the tree and
      being told to go and construct a `POST /v1/watch` call is most of the
      friction this removes.

  R3  Loom does not go looking on its own. Watching a tree costs an index and a
      watcher, dependencies are transitive, and a tree with forty of them would
      be prepared into a tree with forty-one indexes on the strength of one
      query. R1 is a suggestion made where a caller is already stuck; the
      registration stays a caller's act.

  R4  The prepared guidance carries the same line: when a symptom traces into a
      `depends-on` name outside the watched set, register its source tree before
      falling back to grep. The skill's tree list is written as a fact about
      today and should read as a set the session may extend.

  WHY THE FEDERATION HALF ALREADY WORKS

  REQ-0023 made a repository a first-class argument and REQ-0027 R4 resolved
  `affects:` across watched trees, so a registered dependency is queryable
  beside its dependent on the day it is registered -- `find` with no repository
  already searches every watched tree and names which one answered. Nothing
  about this requirement needs the graph to change. It is a prompt and a
  shortcut over a mechanism that is finished.

  ACCEPTANCE

  A `find` against game-server for a name defined only in cl-dbi answers zero
  and names cl-dbi as a `depends-on` whose source is not watched. Registering it
  takes one step from that answer. The following `find` answers from the
  dependency's tree and says which tree it came from, which REQ-0051 already
  does.

  A tree with no unwatched dependency in the query's path answers exactly as it
  does today, with no extra band.

  OPEN QUESTIONS

  - How a dependency's checkout is located. `~/lisp/cl-dbi` is where this one
    lives because ASDF was told to look there; Quicklisp, a `.qlot` directory
    and `node_modules` are three more shapes, and a version from a registry is
    not a source tree anybody edits.
  - Whether a watched dependency should be indexed read-only. Nothing should
    write a document into a library checkout, and `init` on one would be wrong.
