id: RULE-0007
title: A workflow document lives in completed/ when its status is terminal, and nowhere else
status: retired
severity: advisory
date: 2026-08-11
refines: [CON-0004, REQ-0022]
applies-to: [document-category, repository-status]
tags: [documents, convention, prose-only, staleness]
statement: |
  RETIRED 2026-08-12. The convention below still holds and still describes the
  tree; what changed is that Loom now maintains it. `set-status <document>
  <status>` files the document where its new status belongs in the same
  operation that sets the status, and `complete` inherits that for every
  document in its cascade, so the two copies of the fact this rule worried
  about can no longer be written apart. The section at the end records what the
  retirement does and does not claim.

  Under docs/requirements, docs/design, docs/plans, docs/bugs and
  docs/reviews, a document whose status is terminal -- implemented for a REQ or
  a DES, superseded for a DES, final for a PLAN, closed for a BUG or REV --
  lives in that directory's completed/ subdirectory, and a document whose
  status is not terminal lives flat. The two must agree. A partial document
  stays flat: it has an OUTSTANDING section, which is work.

  AMENDED 2026-08-23. Superseded was not on that list, and the omission was
  this document's rather than a property of the workflow: a superseded design
  has no work left in it and belongs where the finished ones are. DES-0034 and
  DES-0036 are the instances. Both were built, measured against the numbers
  they named, and withdrawn -- DES-0034 at 38 of 45 against a baseline of 45,
  DES-0036 at 42 of 45 and 390 of 450 against a baseline of exactly those two
  numbers -- and both then sat flat in docs/design/ where `ls' and `context'
  read them as work in progress. *WORKFLOW-STATUS-VOCABULARY* and this
  paragraph were changed in the same commit, which is the discipline the rest
  of this rule is about.

  Superseded is terminal for a design and for nothing else, and that is settled
  rather than waiting on an instance. A design is produced by one piece of work
  and is finished when that work lands, which is what gives it a terminal state
  to reach. An architecture document, a decision and a rule are not process
  artifacts. They stand across the pieces of work that consult them, and each
  reaches superseded or retired only on a redesign -- which is a new piece of
  work rather than the end of the old one. A superseded ARCH is the record of
  what the structure was, read beside the one that replaced it, and a
  superseded DEC is why the tree chose what it no longer chooses; filing either
  under a name meaning "done with these" takes it away from the reader who
  needs it most. The standing half of the tree keeps both and has no completed/
  to put them in.

  Under docs/decisions, docs/arch, docs/rules and docs/concepts there is no
  completed/ at all. An accepted decision, an active rule, a named concept and
  a current architecture document are in force rather than finished, and filing
  them under a name meaning "done with these" would bury exactly the documents
  `impact' exists to surface.

  A DES belongs with the workflow half rather than the standing half, and the
  line is worth stating because it was drawn wrongly at first. A design answers
  one requirement: it is produced by a piece of work and finished when that
  work lands. What stands after it is the ARCH document describing the
  structure the design produced -- which is why architecture has no terminal
  status at all, only accepted or superseded.
summary: |
  The convention that makes `ls docs/bugs' readable without loading Loom, and
  the drift it introduces. Directory placement duplicates the status: field,
  and nothing checks that the copies agree, so this rule exists to write the
  invariant down where a human and an agent both meet it.
body: |
  WHY A DIRECTORY AND NOT A QUERY

  The honest objection was raised and overruled on ergonomics, and the
  reasoning is worth keeping because it bounds what this rule is for. Storing
  state in two places is what Loom exists to argue against: `status:' already
  holds the fact, a `documents [status]' console command could report it, and a
  directory that repeats it can disagree with it.

  What settled it is that the query is useless to a human without a running
  Loom. Loading the image, running the command and then finding the file is
  slower than reading a directory listing, and an agent working in the tree
  reaches for `ls' before it reaches for a console. Twenty-two bug documents in
  one flat directory with no way to see which seven are open is a real cost paid
  on every visit; the drift this rule guards against is a hypothetical cost paid
  when someone edits a status and forgets to move the file.

  So: the directory is the view, `status:' is the fact, and when they disagree
  the fact wins.

  WHAT IT COST TO SET UP

  Nothing in the analyzer. DOCUMENT-CATEGORY returns the first path segment
  below docs/, guarded by (when (rest below) ...), so docs/bugs/completed/
  BUG-0001.yaml still types as bugs with three segments exactly as it did with
  two. Cross-document references resolve through LINKABLE-INDEX on doc-id
  rather than on path, so refines: and supersedes: survived fifty-three files
  moving without a single break -- measured across the first forty: 195 files,
  2053 entities, 10536 relationships and 13 unresolved references before and
  after, identical.

  The one real consequence is that a :DOCUMENT's natural key is (:PATH), so
  moving a file changes its id and therefore every edge endpoint. A full
  reindex rebuilds it correctly. An incremental watcher poll across a bulk
  `git mv' is not trusted to, which is why the move is followed by a reindex
  rather than by a poll.

  WHY THIS IS NOT MACHINE-CHECKED

  The check kinds SS10.4 defines -- :no-edge, :requires-edge,
  :property-constraint, :property-absent -- are about entities and edges. This
  rule relates a property to a path segment, which none of them can express,
  and inventing a fifth kind for one convention is the trade SS10.4 explicitly
  refuses: "a rule needing more than that stays prose".

  So it stayed prose, and `status' counted it among the unenforced rules, which
  is the point -- prose-only drift stays visible rather than comfortable. A
  cheap check kind that compared a path segment against a property value would
  settle it, and would also close RULE-0005, which is unenforced for a related
  reason.

  That last sentence is where this reasoning ran out, and REQ-0022 says why: a
  check kind would have settled this rule and would still have left RULE-0005
  unenforceable, because what is missing there is not expressive power but a
  transition to observe. The answer to both turned out to be the same command
  rather than a fifth check kind.

  A NEARBY DEFECT THIS SURFACED

  BUG-0019 carried `status: fixed', which is not in the :DOCUMENT status
  vocabulary. AS-KEYWORD returns NIL for a value outside its allowed list
  rather than signalling, so the document had no status in the index at all and
  `describe BUG-0019' printed no status line. It was corrected to `closed'
  here.

  That is the same silent-drop shape as BUG-0023: a field an author filled in,
  accepted without complaint by the file format, and discarded on the way to
  the graph. An out-of-vocabulary status should be reported rather than
  dropped. Not fixed here -- it wants its own bug -- but it means the count of
  documents whose status this rule can check is one lower than it looks
  wherever someone has invented a status word.

  That is now half fixed, in the one place it can do harm. The transition
  command reads the file's own status line before writing, validates it against
  the category's vocabulary, and refuses a document whose current status it does
  not recognise rather than overwriting it -- because a document in an unknown
  state is exactly where a human should look. It does not fix the indexing side,
  where an unknown status is still dropped to NIL; it stops the command adding a
  second instance of the problem.

  WHAT REPLACED THIS RULE

  REQ-0022 and DES-0019. The two copies of the fact -- the status line and the
  directory -- are now written by one operation:

    set-status BUG-0025 closed      sets the line and moves the file to
                                    docs/bugs/completed/ in one go
    set-status BUG-0025 open        moves it back out again

  Both directions, which is what makes "they cannot disagree" a property rather
  than a hope: a status becoming terminal moves the file in, and one that stops
  being terminal moves it back. The destination is derived from the directory
  the file is already in rather than from a `docs' segment in its path, so a
  foreign tree prepared by REQ-0021 -- which may keep its documents anywhere --
  gets the same answer this one does.

  The vocabulary above is where the command reads its terminal set from:
  implemented for a REQ or a DES, superseded for a DES, final for a PLAN,
  closed for a BUG or REV, and nothing terminal at all under docs/decisions,
  docs/arch, docs/rules and docs/concepts. A partial document stays flat.

  A superseded design stayed flat until 2026-08-23 for a reason that was about
  this text rather than about the design: the paragraph above named one word,
  and departing from it in code alone would have put the rule and the tool into
  exactly the disagreement the rule exists to prevent. The fix was to move both,
  which the AMENDED note in the statement records.

  RETIRED AND NOT SUPERSEDED, for RULE-0005's reason: a developer moving a file
  by hand is not doing anything wrong, and a rule claiming the command is the
  only way would be false the first time someone used `git mv`. What changed is
  that the drift this rule guards against now has an instrument against it.
