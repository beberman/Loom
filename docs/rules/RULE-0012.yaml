id: RULE-0012
title: The knowledge services do not reach the document store
status: active
severity: error
refines: [DES-0051]
statement: |
  synoptik-knowledge answers from the graph. A document it reports on is an
  entity there, and it has no reason to read the store behind it.
  synoptik-workspace is the store's only client. DES-0051 D5.

  Because synoptik-knowledge cannot reach the store at all, the store's writes
  need no names on RULE-0003's deny list.
check:
  kind: no-edge
  from-system: synoptik-knowledge
  to-system: synoptik-docstore
  rel-types: [calls, imports, depends-on]
