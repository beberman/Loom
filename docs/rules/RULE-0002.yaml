id: RULE-0002
type: rule
title: Analyzers are storage-agnostic
status: active
severity: error
applies-to: [analyze-file, analyzer-handles-p, analyze-tree]
statement: |
  An analyzer receives a path and contents and returns ontology operations. It
  must not reach the graph, the adapter, or any store: the protocol is the only
  coupling, and that is what keeps language independence enforceable rather
  than aspirational. A cross-file fact an analyzer cannot see is recorded as a
  property for the workspace to resolve, never written directly.
check:
  kind: no-edge
  from-system: analyzer
  to-system: graph
  rel-types: [calls, imports, depends-on]
