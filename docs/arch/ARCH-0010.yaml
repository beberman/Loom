id: ARCH-0010
title: Inline DEFGENERIC methods become :METHOD entities via the shared DEFMETHOD tail parser
status: implemented
date: 2026-08-06
refines: [REQ-0012]
affects: [generic-definition-entities, method-definition-entity, method-body,
          read-source, analyze-file, make-method-entity,
          make-interface-entity]
tags: [analyzer, lisp, clos, blind-spot]
summary: |
  GENERIC-DEFINITION-ENTITY discards everything after a DEFGENERIC's lambda
  list, so an inline (:method ...) clause mints no :METHOD entity and its body
  is never walked. The fix needs no ontology change: a clause's tail is
  byte-for-byte the same shape as a DEFMETHOD's (cddr form), so the existing
  qualifier/specializer/body parsing is extracted into a shared core and
  applied per clause. Per-clause source ranges, which the reader does not
  provide for nested forms, are recovered by re-reading the DEFGENERIC's
  elements one at a time on the same whole-content stream READ-FORMS-WITH-SPANS
  already uses, with the whole-form range as the recorded fallback. Verified
  against both codebases before design: game-server has 247 inline clauses in
  158 DEFGENERIC forms (vs 376 standalone DEFMETHOD), Loom has 2 in 7.
body: |
  PROBLEM

  src/analyzer/lisp-analyzer.lisp:707, GENERIC-DEFINITION-ENTITY, reads
  (second form) for the name and (third form) for the lambda list and returns
  one :INTERFACE entity. Every (:method ...) clause after that is discarded:
  no :METHOD entity, no body walk, no :CALL-NAMES, therefore no :CALLS edges
  in either direction and no :IMPLEMENTS or :USES edges.

  All of REQ-0012's measurements were re-taken today rather than trusted:

      inline (:method ...)      Loom: 2       game-server: 247
      DEFGENERIC forms          Loom: 7       game-server: 158
      standalone DEFMETHOD                    game-server: 376

  Loom's two are src/graph/rules.lisp:34 and src/analyzer/analyzer.lisp:53,
  both unqualified. The evidence pair reproduces exactly: with game-server
  watched, `describe dhandler-delete` (inline method,
  data-api/handler.lisp:156-166, whose body calls MAKE-SELECTOR,
  DHANDLER-DELETE-ALL, DHANDLER-DELETE-SELECTOR) shows eleven incoming
  callers and zero outgoing calls; `describe dhandler-delete-selector`
  (standalone DEFMETHOD, data-api/game-handler.lisp:119-129) shows its full
  -> calls, -> implements and -> uses lists.

  Real clause shapes in game-server include qualified clauses
  ((:method :before (game &key type) ...)), EQL specializers
  ((:method ((primary (eql :oneof)) ...) ...)), wholly unspecialized lambda
  lists ((:method (kind view rule check) ...)) and &rest/&key tails. Every
  one is already handled by METHOD-DEFINITION-ENTITY's tail logic, verified
  clause by clause below.

  WHAT EACH THING BECOMES

  No ontology change of any kind: no new entity or relationship type, no
  widened endpoint, no new property. :METHOD already carries :qualifier,
  :specializers, :generic-function, :arguments and (since ARCH-0009) :system,
  and its natural key (:file :name :qualifier :specializers) already
  distinguishes everything that needs distinguishing. Everything below is
  analyzer-internal reshaping inside src/analyzer/lisp-analyzer.lisp.

  METHOD-ENTITY-FROM-TAIL (new; the extracted core). Owns the parsing that
  METHOD-DEFINITION-ENTITY does today from (cddr form): optional-qualifier
  detection ((and (first tail) (symbolp (first tail))), which correctly
  refuses NIL and a lambda list), lambda list, specializer names, and the
  MAKE-METHOD-ENTITY call. Takes (name tail start end path system). The
  alignment fact that makes this safe, verified against source: a DEFMETHOD
  form is (DEFMETHOD name . tail) and an inline clause is (:METHOD . tail) --
  the tails are the same grammar, and the only thing the clause lacks is the
  name, which the enclosing DEFGENERIC supplies. The one inherited limit:
  only a single qualifier is captured, for clause and DEFMETHOD alike --
  parity, not a new gap.

  METHOD-DEFINITION-ENTITY becomes a thin wrapper: name from
  (definition-name (second form)), tail from (cddr form), core does the rest.
  Contract: for every DEFMETHOD it must produce an entity property-for-
  property identical to today's, id included.

  METHOD-BODY grows the same split: a tail-taking core (pop the qualifier if
  present, skip the lambda list, return the rest) shared by the DEFMETHOD
  wrapper and the clause path, so the body handed to pass 2 is computed by
  one piece of code in both spellings.

  READ-FORMS-WITH-SPANS widens its tuple from (form start-line end-line) to
  (form start-line end-line start-offset), where start-offset is the
  character offset it already computes and currently discards after
  converting to a line. Its only consumer is ANALYZE-FILE's pass-1
  destructuring. The offset exists so the clause re-read below can seek to
  the form.

  ELEMENT-SPANS (new). Given the file contents and a form's start offset,
  re-reads that form's elements one at a time and returns a list of
  (element start-line end-line), or NIL if anything signals. Mechanism: seek
  the whole-content stream to start-offset + 1 (past the open paren), then
  loop SKIP-WHITESPACE-AND-COMMENTS / READ-PRESERVING-WHITESPACE, recording
  FILE-POSITION before and after each element, stopping at the closing paren.
  It must establish the same reader environment as READ-FORMS-WITH-SPANS --
  throwaway package, *READ-EVAL* nil, the PACKAGE-ERROR CONTINUE handler --
  because it reads the same foreign source. It deliberately reuses the
  whole-content-stream technique whose rationale READ-FORMS-WITH-SPANS's
  docstring records: a sub-range string stream leaves FILE-POSITION
  ambiguous across SBCL builds; the whole-string stream does not. Cost is
  one extra bounded read per DEFGENERIC form only (158 forms in game-server),
  not per file.

  What is computable and what is not (the R3 answer): exact per-clause line
  ranges ARE recoverable this way, because the re-read applies the identical
  reader settings to the identical text, so its element sequence matches the
  first read's structurally -- including under read-time conditionals, since
  *FEATURES* has not changed between the two reads. What is NOT computable:
  a span for anything if the re-read fails, and exact starts when a #|...|#
  block comment precedes a clause (the comment's start is folded into the
  clause's span -- the same imprecision top-level forms already have today,
  since SKIP-WHITESPACE-AND-COMMENTS handles only line comments). Fallback
  in both cases: the whole DEFGENERIC's range on every inline method. That
  is a wider truth, not a fabricated fact -- the clause genuinely lies
  within it -- which is the side CON-0001 requires erring on. Alignment is
  checked by zipping positionally and comparing lengths; on mismatch, fall
  back rather than misattribute.

  GENERIC-DEFINITION-ENTITY becomes GENERIC-DEFINITION-ENTITIES, plural,
  following CLASS-DEFINITION-ENTITIES and STRUCT-DEFINITION-ENTITIES.
  Returns an ordered list of (entity . body) pairs: first the :INTERFACE,
  body NIL, unchanged in name, :members (from (third form)) and whole-form
  range; then one :METHOD per clause in (cdddr form) whose head's TOKEN-NAME
  is "method" (the head is a keyword, so it interns identically regardless
  of the scratch package). Each method entity gets: name = the generic's
  name via DEFINITION-NAME (so (setf foo) generics render correctly),
  qualifier/specializers/arguments from the clause tail via the shared core,
  :generic-function = the generic's name, the clause's own range from
  ELEMENT-SPANS (or the fallback), and the same SYSTEM argument the
  interface gets -- CURRENT-SYSTEM at the form, per ARCH-0009's convention
  of SYSTEM after PATH. (:documentation ...), (declare ...),
  (:method-combination ...) and every other option clause are skipped, as
  today.

  ANALYZE-FILE's defgeneric branch calls the plural function and
  NOTE-DEFINITION's each pair -- the interface as today, each method with
  :body so pass 2 records its :CALL-NAMES. No :local for methods, for the
  reason the pass-1 comment already states for DEFMETHOD: a call names the
  generic, and which method runs is a runtime question, so edges are left
  for resolution to fan out.

  The graph side needs nothing. RESOLVE-CALLS walks :METHOD callers
  (resolve.lisp:544), RESOLVE-IMPLEMENTS derives the :IMPLEMENTS edge from
  the :generic-function property via UNIQUE-MATCH, RESOLVE-SPECIALIZERS
  derives :USES from :specializers, and the dispatched-call fan-out
  (resolve.lisp:478) will include inline methods among a generic's
  candidates automatically. All are derive-never-consume passes (DEC-0003),
  so the new entities' edges rebuild on every pass for free.

  The interface keeps spanning the method bodies it now shares with them.
  Checked before deciding: line ranges are display-only -- ENTITY-SUMMARY's
  location string and the definer-call-site locations are the only
  consumers, and no query maps a line to its containing entity -- so
  overlapping ranges double-count nothing. :CONTAINS stays file->definition
  for interface and methods alike, exactly as a DEFGENERIC-plus-DEFMETHOD
  pair produces today; no interface->method containment edge is added (see
  alternatives). No call name is ever recorded on the :INTERFACE, so impact
  cannot count a call twice: the method owns its body's names, the
  interface owns none.

  The R4 collision answer, from the declared key (:file :name :qualifier
  :specializers): two clauses on one generic differing only by qualifier
  are two entities -- the qualifier is a key component and survives via the
  shared core by construction. An inline method and a standalone DEFMETHOD
  with identical name, qualifier and specializers in DIFFERENT files are
  two entities -- :file separates them, which is right: both bodies exist
  in source, and in CL the pair is a load-order redefinition, a union of
  real facts rather than a guess. The same pair in ONE file collides into
  one id and the later assert wins -- which mirrors CL's own semantics,
  where the later definition replaces the earlier, and matches source
  order. Disclosed, not fixed. Narrower than stated, as implementation
  measured: "the later assert wins" is true of the entity's properties and
  false of its outgoing edges, which survive from both definitions as a
  union because a relationship's natural key includes the callee -- BUG-0012
  records the case, its two instances in game-server, and the candidate
  fixes.

  ALTERNATIVES CONSIDERED

  Fabricate a DEFMETHOD form per clause -- (list* 'defmethod name (cdr
  clause)) -- and call METHOD-DEFINITION-ENTITY unchanged. Rejected:
  METHOD-BODY needs the same one-cell adjustment, so the fake form would be
  consed twice per clause or threaded through, and a synthesized head that
  nothing ever reads is a lie waiting for the first reader. The extracted
  core is the same amount of code and serves both call sites honestly.

  Record the clause bodies' call names on the :INTERFACE instead of minting
  :METHOD entities. Rejected: RESOLVE-CALLS walks only :FUNCTION, :METHOD
  and :TEST callers, so the names would strand (REQ-0012 verified zero call
  names on :INTERFACE entities in both codebases -- the moot point is
  measured); two clauses would merge into one bag of names, destroying
  qualifiers and specializers; and REQ-0012 R1 asks for :METHOD entities in
  so many words.

  Per-clause spans by textual scan for "(:method". Rejected: a string or
  comment containing the text false-matches, and finding the clause's end
  means matching parens by hand -- half a reader, badly. The element
  re-read uses only the reader machinery this file already trusts.

  Per-clause spans from SBCL source tracking or an instrumented readtable.
  Rejected: the portable reader exposes no sub-form positions, so this ties
  the analyzer to SBCL internals for a problem 15 lines of standard CL
  solve. It would also not survive the second-language test -- though note
  the whole span problem is Lisp-specific: a TypeScript analyzer gets
  member positions from its parser, and the ontology this design leaves
  untouched already models "container declares members with their own
  ranges" (interface + methods), so nothing here is Lisp-shaped except the
  contained machinery.

  Give inline methods the whole DEFGENERIC's range and skip per-clause
  spans. Rejected as the primary answer: R3 asks otherwise, and in
  game-server's handler.lisp 21 generics sit in one file, so `find` and
  `describe` would point every default method at its form's head with many
  identical wide ranges. Retained as the recorded fallback when the
  re-read fails or misaligns.

  Add an interface->method :CONTAINS edge. Rejected: :CONTAINS is
  file->definition everywhere today, so this widens an endpoint's meaning
  (the cheap-but-not-free kind of ontology change) with no consumer --
  :IMPLEMENTS already expresses the association, and `describe` on the
  generic shows it.

  REQUIREMENTS

  R1  READ-FORMS-WITH-SPANS returns (form start-line end-line start-offset);
      ANALYZE-FILE's destructuring updates. No other consumer exists.

  R2  ELEMENT-SPANS reads a form's elements under the same reader
      environment as READ-FORMS-WITH-SPANS on the same whole-content
      stream, returning (element start-line end-line) per element, NIL on
      any signalled condition.

  R3  METHOD-ENTITY-FROM-TAIL and the tail-taking METHOD-BODY core are the
      single copies of tail parsing; METHOD-DEFINITION-ENTITY and
      METHOD-BODY become wrappers producing bit-identical results for every
      DEFMETHOD, guarded by a regression test over an existing fixture.

  R4  GENERIC-DEFINITION-ENTITIES returns ((interface . nil)
      (method . body) ...): interface unchanged in name, :members and
      whole-form range; one :METHOD per (:method ...) clause carrying
      name, qualifier, specializers, arguments, :generic-function, the
      clause's own range -- whole-form range only as the declared fallback
      -- and :system = CURRENT-SYSTEM, positionally after PATH per
      ARCH-0009.

  R5  ANALYZE-FILE hands each inline method's body to pass 2 so
      :CALL-NAMES are recorded; methods are not :local.

  R6  Tests per CON-0003, failing without the change: a fixture DEFGENERIC
      with an inline method whose body calls another fixture definition,
      asserting (a) the :METHOD entity exists with the clause's own line
      range, not the form's; (b) a qualified and an unqualified clause on
      one generic yield two entities differing in :qualifier; (c) the
      :CALLS edge to the fixture-local callee exists after resolution.

  R7  Acceptance is measured on both trees. Loom: entity count rises by
      exactly 2, suite green, `check` unchanged modulo BUG-0009's known
      false positives. game-server: a :METHOD entity named dhandler-delete
      exists at data-api/handler.lisp:158-166 with call names
      make-selector, dhandler-delete-all, dhandler-delete-selector; the
      :CALLS totals before (5,152 per REQ-0012) and after are recorded,
      replacing REQ-0012's ~500-edge estimate with a fact.

  R8  Acceptance queries go through the :METHOD entity or through impact,
      not through describe-by-name alone: `find dhandler-delete method`
      then describe by id must show the outgoing calls, and
      `impact dhandler-delete 2` must reach dhandler-delete-all and
      dhandler-delete-selector. Reason under CONSEQUENCES.

  CONSEQUENCES

  R7's MAKE-SELECTOR criterion, unmet when PLAN-0009 implemented this design,
  is met as of 2026-08-08: BUG-0011's fix (PLAN-0011) records the name a
  function quotation designates, so the DHANDLER-DELETE :METHOD at
  data-api/handler.lisp:158-166 now carries make-selector alongside
  dhandler-delete-all and dhandler-delete-selector. R7 is the only document
  anywhere that made MAKE-SELECTOR an acceptance criterion; REQ-0012's R5 asks
  for the other two only, and its OUTSTANDING item 2 records the closure.

  REQ-0012 R5's literal wording -- "describe dhandler-delete must report
  outgoing calls" -- cannot be promised as written, and R8 above restates
  it. Measured today: `describe` resolves a name via SEARCH-ENTITIES' first
  hit, whose sort ranks match quality only, so an exact-name tie between
  the :INTERFACE and the new same-named :METHOD falls to index order --
  `describe analyze-file` already picks the interface over its two methods.
  The calls land on the :METHOD entity; on the interface they are one
  :IMPLEMENTS hop away, which impact traverses and describe shows as
  <- implements. Whether describe should prefer, merge or disambiguate
  same-named entities is a loom-knowledge question this design leaves
  alone.

  Code that changes: lisp-analyzer.lisp only -- the two entity functions
  and METHOD-BODY refactor into wrappers over shared cores,
  READ-FORMS-WITH-SPANS widens its tuple, ELEMENT-SPANS is added,
  ANALYZE-FILE's defgeneric branch fans out. GENERIC-DEFINITION-ENTITY is
  renamed to GENERIC-DEFINITION-ENTITIES, so the implementing plan must
  update the affects lists naming the old symbol (this document's and
  REQ-0012's) when it lands, or `check` will report the dangling
  reference -- which is that mechanism working, not a defect.

  What gets simpler: one copy of method-tail grammar instead of the
  two-and-a-half that would otherwise accrete, and the first machinery for
  sub-form spans, which any future container form (DEFCLASS accessor
  ranges, say) can reuse.

  The obligation every future change carries: anything touching method
  parsing now serves two spellings through one core, and must keep the
  DEFMETHOD wrapper bit-identical; anything touching READ-FORMS-WITH-SPANS
  must preserve the start-offset element and the whole-content-stream
  property ELEMENT-SPANS also depends on.

  Out of scope, deliberately: ambiguous call resolution (REQ-0013,
  REQ-0015). Those are the incoming direction's defect; this is the
  outgoing one. Fixing inline methods does not make `impact cascade-delete`
  correct in game-server -- those sites are dropped because two
  definitions share a name -- and several of its call sites are both
  inside inline methods and ambiguous, so the two fixes compose but
  neither substitutes for the other.

  OUTSTANDING

  1. R2's mechanism was replaced on 2026-08-09 by ARCH-0013, implemented at
     PLAN-0013 step 4. The requirement stands and this document stays
     `implemented': a DEFGENERIC's inline (:method ...) clause still gets a
     range of its own, and the interface-plus-methods return, the single copy
     of tail parsing, and R4's whole-form fallback are all untouched. What
     went is how the range is obtained. ELEMENT-SPANS re-read the form's
     elements one at a time on the same whole-content stream under the same
     reader environment, and the clause walk zipped the two sequences after
     comparing their lengths; READ-SOURCE records a range for every cons at
     every depth as it reads, and GENERIC-DEFINITION-ENTITIES asks FORM-RANGE
     for the clause cons itself.

     Three consequences worth having next to the original argument rather
     than only in ARCH-0013, on the ARCH-0007 precedent that a corrected
     claim is worth less than the correction beside it:

     - The alignment check is gone because there is nothing to align. A
       length mismatch was the failure this document spent a paragraph
       defending against, and it cannot arise from asking an object for its
       own range. R4's fallback survives for a caller with no READING.

     - The two shapes R2's mechanism returned NIL for -- a #|...|# block
       comment before the closing paren, a DEFGENERIC behind a # reader macro
       -- now get per-clause ranges like any other form. Both occurred zero
       times in either indexed tree, so no line number moved on this tree;
       the gap closed is in what the mechanism can answer, not in what it
       was answering wrongly.

     - The obligation under CONSEQUENCES above is half discharged. R1's
       start-offset element is preserved -- READING-FORMS keeps the
       four-element tuple, vestigial and documented as such, precisely
       because R1 named it -- but the whole-content-stream property is moot:
       there is no second read for FILE-POSITION to be ambiguous about,
       which is the hazard two of the deleted docstrings spent sixty lines
       on.
