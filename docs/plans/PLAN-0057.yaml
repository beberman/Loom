         :METHOD that MATCH-REGISTRATION matches, and each :REGISTRATION
         on a :VARIABLE, every name or dotted element in :ARGUMENTS and
         :POSITIONAL is resolved by binding (risk 6). When it reaches a
         declaring variable, the registered entity gets a :READS edge to
         that setting, with the variable's file as origin (refinement 2).
         A string literal in a list under a keyword the entry lists in
         `settings:` names the setting directly, with the registered
         entity's own file as origin.
     Sources are collected per name first, and each setting is asserted
