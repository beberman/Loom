     A new pass, RESOLVE-ENTRY-POINTS, takes :ENTRY-POINTS. It reads
     :DECORATORS on :FUNCTION and :METHOD, :REGISTRATION on :VARIABLE,
     and :CODEBASES on every :FILE. It returns operations. For every
     entity carrying :DECORATORS or :REGISTRATION it writes :TRIGGER and
     :ENTRY-POINT, as values or NIL, every pass:
       - :TRIGGER is the trigger keyword when one registration matched,
         :MULTIPLE when several did, NIL when none did.
       - :ENTRY-POINT is one plist per matching registration: :FRAMEWORK,
         :TRIGGER, :CALLEE (module.name), :OPTIONS ((label . value) ...,
         with a positional argument labelled by `positional:` or by its
         index), :LINE, and, when a codebase covers the file, :CODEBASE,
         :RUNTIME and :DEPLOYED.
     Coverage: firebase.json at directory P with source S covers paths
     under P/S/. The longest prefix wins. Two at one length give no
     codebase, and the tie goes into the plist as :CODEBASE-TIE with both
     paths. An ignore glob is matched relative to S, with `*` and `?`
     inside one segment and `**` across segments. A plain name such as
     "tests" matches that segment at any depth below S, as Firebase reads
     it. Any other glob syntax is listed on the codebase as uninterpreted
     and excludes nothing.
     :DEPLOYED for :LANGUAGE :PYTHON: :YES, :NO or :UNKNOWN by D6, with
     refinement 4. Every other language gives :UNKNOWN.
     A :DEPENDS-ON edge goes from each :YES entity to the firebase.json
     :FILE, with <source>/main.py as origin (refinement 2).
     RESOLVE-AND-CHECK submits it after resolve-settings and before
     resolve-document-links. Its docstring's sequence gains the name.

