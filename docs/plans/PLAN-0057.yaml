id: PLAN-0057
title: DES-0054 S1 to S9 in ten steps -- ontology first, the decorator encoding, the two frameworks.yaml keys, the firebase analyzer, settings, the entry-point pass, the surfaces, init's proposal, acceptance on lfia and Loom, complete; JavaScript (S10) split to its own plan
status: draft
date: 2026-10-05
refines: [DES-0054]
affects: [py-decorators, py-decorator-value, literal_value, Extractor.visit_decorator,
          parse-frameworks, frameworks-problems, read-json-file, propose-domains,
          resolve-settings, resolve-one, resolve-and-check, walk-attribute-path,
          walk-stars, validate-entity, repository-files, entry-point-report,
          structure-report, describe-entity, impact-report, search-entities,
          prepare-repository, plan-preparation]
tags: [analyzer, python, firebase, cloud-functions, entry-points, secrets,
       settings, frameworks, ontology, des-0054, req-0078, con-0001, con-0003,
       dec-0003]
summary: |
  Ten steps that implement DES-0054 S1 to S9: R1 to R11 and the lfia and
  Loom halves of R13. Step 1 is the ontology, moved ahead of the extractor.
  Step 2 changes the decorator encoding and adds :VALUE-CALL. Step 3 reads
  the two new frameworks.yaml keys. Step 4 adds the firebase analyzer and
  admits .firebaserc. Step 5 mints settings from declarations and widens
  RESOLVE-ONE. Step 6 is RESOLVE-ENTRY-POINTS. Step 7 is describe, impact,
  structure, find --trigger and status. Step 8 is init's proposal and the
  Python template. Step 9 is acceptance on ~/github/lfia-accounting and on
  Loom's own tree. Step 10 runs `complete`.

  S10, the JavaScript half (R12 and the front-end half of R13), is split
  into its own plan. DES-0054 S10 says it "can be split into its own plan
  without touching S1 to S9". This plan builds everything that plan needs
  except extract.js, js-analyzer.lisp, the JavaScript template and init's
  nodejs proposal. THE SECOND PLAN lists it.

  Out of scope, as DES-0054 defers them: REQ-0078 R10 (dependency names),
  set_global_options merging, hosting rewrites, `.value` reads, a call
  inside a decorator argument, enum translation, pytest.ini as a proposal
  signal, and fixture injection.
body: |
  BASELINE

  Loom at a64c80c on req-0078-firebase, with BUG-0069 untracked,
  `tools/loom.sh 'status' 'check'`:

      index      : 485 files, 4962 entities, 23506 relationships
      rules      : 0 violations, 2 unenforced
      unresolved : 8 document references, 7 ambiguous, 5 definer macros
      imports    : 4 resolved, 57 external, ... 0 unrooted
      unclaimed  : 42 tracked files -- 10 .json, 10 .md, 6 .sh, 5 (none),
                   3 .js, 2 .docx, 6 other
      check      : No violations, 8 unresolved, 7 ambiguous, 16 prose
                   file references

  ~/github/lfia-accounting at 8044c09 on its branch plan-0001, with two
  untracked entries: .loom/frameworks.yaml (written with the user's consent)
  and web/ (not ours):

      index      : 63 files, 554 entities, 1028 relationships
      tests      : 103 tests covering 5 units in 12 test files
      imports    : 73 resolved, 101 external, 34 unrooted
      domains    : .loom/frameworks.yaml declares nothing usable: a
                   definer-macros entry needs both macro: and defines:
      unclaimed  : 17 tracked files -- 4 .json, 3 .png, 2 (none), 2 .md, ...
      structure  : 33 definitions with no caller
      check      : 0 violations, 0 unresolved, 0 ambiguous

  The lfia tree has moved since DES-0054 measured it. The design says 31
  no-caller rows and an unrooted count of 25 then 34. Today main.py still
  has eight decorated functions: sync_zeffy and sync_zeffy_ledger on
  scheduler_fn.on_schedule, and six on https_fn.on_request. Four carry
  secrets=[ZEFFY_API_KEY]. So this plan predicts deltas, not absolute
  counts, and step 9 takes a fresh lfia baseline before it measures.

  "Green" after a step means three things. `tools/loom-test.sh` passes on
  all twelve systems with zero Python skips. `check` on Loom prints No
  violations, 8 unresolved and 7 ambiguous. `sbcl --script
  tools/test/load-test.lisp loom-serve` prints T. A step that moves one of
  these numbers says which one and to what. Run everything with
  /usr/bin/sbcl through tools/loom-test.sh, and say so in each commit.

  After any change to Loom's source, run `tools/loom-serve.sh update`
  before using a loom_* tool.

  This plan's `affects:` names only functions that exist at a64c80c. A
  function this plan creates is named in the body.

  WHEN lfia's "declares nothing usable" CLEARS

  The file holds only entry-points: and setting-declarations:. Today
  PARSE-FRAMEWORKS ignores both keys. FRAMEWORKS-PROBLEMS tests three keys
  and finds all three empty, so `status` prints "declares nothing usable".
  Nothing reports unknown keys today. Step 3 clears the line. Until step 3,
  lfia's status prints it on every run, and that is expected. lfia's file
  has no domains: key, so the `domains` line disappears after step 3
  rather than listing a domain. Step 9 covers what that means for R13's
  `unrooted 0`.

  REORDERED FROM DES-0054

  One change to the design's order. DES-0054's S2 (ontology) becomes step
  1, ahead of S1 (extractor). The reason: step 2 writes :VALUE-CALL on
  :VARIABLE. VALIDATE-ENTITY ignores an undeclared key on an assert, so the
  analyzer could write it before it is declared, and no test would notice.
  An UPDATE-PROPERTIES naming the same key would be refused. Declaring
  first means every later step writes a declared property. PLAN-0056 also
  put the ontology first. The rest follows the design: S3, S4, S5, S6, S7,
  S8, S9.

  Two pieces move earlier than the design implies:

    - The registration matcher (D3's matching rule, both languages) lands
      in step 5, not step 6. RESOLVE-SETTINGS needs it to know which
      decorator arguments belong to a registration, before
      RESOLVE-ENTRY-POINTS exists.
    - R3's "RESOLVE-AND-CHECK hands both lists to the passes" is split.
      Step 3 adds the two accessor functions. Steps 5 and 6 pass the lists
      to the passes as those passes are written. A keyword argument with no
      reader would be untestable in step 3.

  REFINEMENTS DES-0054 LEAVES OPEN

  1. The value encoding, in Lisp. D1 names three kinds and does not say how
     each is stored. This plan stores:
       literal     the bare value, as today: a string, a number, T, :FALSE
                   or :NONE. So every existing literal assertion holds.
       name        (:NAME "KEY" :BINDING :LOCAL), or (:NAME "KEY" :BINDING
                   :IMPORT :SPECIFIER "s" :PATH ("a" "b")).
       dotted      (:DOTTED "options.MemoryOption.MB_512"), plus :SPECIFIER
                   and :PATH when the first name is an import binding.
       list        (:LIST e1 e2 ...), each element encoded as above.
       other       :EXPRESSION, as today.
     The decoder is moved out of python-analyzer.lisp into analyzer.lisp
     and renamed DECODE-ARGUMENT-VALUE, so js-analyzer.lisp can call it in
     the second plan. PY-DECORATOR-VALUE stays as a one-line caller.

  2. Which file owns a derived edge. ASSERT-EDGE's :ORIGIN-FILE decides
     which file's reanalysis retracts an edge. A derived edge can go stale
     when a file other than its source changes, and no full reindex runs.
     So:
       - A :READS edge from a registered function to a setting, drawn
         through a variable, takes the declaring variable's file as its
         origin. Editing that file alone retracts it. Editing the
         function's file retracts the function and its edges.
       - A :DEPENDS-ON edge from a deployed function to firebase.json takes
         <source>/main.py as its origin, because main.py's bindings decided
         :DEPLOYED. Editing firebase.json retracts the target. Editing the
         function's file retracts the source.
     Steps 5 and 6 each test this: edit only the deciding file, poll, and
     compare with a full reindex.

  3. RESOLVE-ONE gets a view. It takes (index name) today and cannot see
     edges. It gains a keyword, :VIEW. The setting clause accepts a
     :VARIABLE that carries the name in :ENVIRONMENT-READS (today's rule)
     or that has a :READS edge to the setting (D5's rule, when :VIEW is
     given). Keeping the old clause as a disjunct means a caller that
     passes no view, such as UNAMBIGUOUS-NAMES in architecture.lisp,
     behaves exactly as today. That is R5's "nothing that resolves today
     stops resolving" by construction. RESOLVE-DOCUMENT-LINKS and
     DOCUMENT-REFERENCE-REPORT pass the view.

  4. A main.py with a damaged region cannot prove :NO. D6 gives :NO when
     main.py is indexed, nothing reaches the function, and no star import
     failed. DES-0053 D7 drops a statement that does not parse. The
     missing binding may be in that statement. So a main.py whose :FILE
     carries :SUPPRESSED-REGIONS with reason "python syntax error" gives
     :UNKNOWN. This is REV-0003 finding 2 again: no miss is reported where
     the language might resolve it.

  5. The deploys line needs the declarations at status time. The count of
     declaring variables with no :FIRST-STRING (D5) is computed by
     `status` from the graph and the repository's declarations. It is not
     stored. R7 declares no property for it.

  6. A trigger name typed at `find --trigger` is looked up with FIND-SYMBOL
     in the keyword package and never interned. An unknown trigger finds
     nothing. DES-0047 D1 bounds keywords by the declarations, and console
     input must not widen that.

  FILES

  New:
    src/analyzer/firebase-analyzer.lisp         the D4 analyzer
    src/analyzer/test/firebase-analyzer.lisp    its tests
    src/workspace/templates/firebase-functions-python.yaml
                                                the Python template (D3, R10)

  Changed:
    src/ontology/root-ontology.lisp     defentity :CLOSED; VALIDATE-ENTITY
    src/ontology/code-ontology.lisp     R7's properties, :DEPENDS-ON :FROM,
                                        :SETTING closed, :SOURCES docs
    src/ontology/package.lisp           exports, if defentity's option
                                        needs one
    src/ontology/test/root-ontology.lisp, test/code-ontology.lisp
    src/graph/test/transaction.lisp     a closed :SETTING assert is refused
    src/analyzer/test/lisp-analyzer.lisp  the DEFMETHOD and DEFUN property
                                        fingerprints (risk 1)
    tools/py/extract.py                 literal_value, visit_decorator,
                                        :VALUE-CALL on module-level bindings
    src/analyzer/analyzer.lisp          DECODE-ARGUMENT-VALUE
    src/analyzer/python-analyzer.lisp   py-decorators (:POSITIONAL),
                                        py-decorator-value, :VALUE-CALL
    src/analyzer/test/python-extract.lisp, test/python-analyzer.lisp
    src/analyzer/frameworks.lisp        PARSE-FRAMEWORKS' two keys,
                                        FRAMEWORKS-PROBLEMS, PARSE-JSON-TEXT,
                                        PROPOSE-DOMAINS' firebase.json signal
    src/analyzer/test/frameworks.lisp
    src/analyzer/loom-analyzer.asd      firebase-analyzer after frameworks;
                                        its test file
    src/analyzer/package.lisp           exports
    src/graph/resolve.lisp              MATCH-REGISTRATION, RESOLVE-SETTINGS,
                                        RESOLVE-ONE, RESOLVE-ENTRY-POINTS
    src/graph/package.lisp              exports
    src/graph/test/resolve.lisp
    src/workspace/workspace.lisp        *ADMITTED-DOT-FILES*, REPOSITORY-FILES,
                                        REPOSITORY-ENTRY-POINTS,
                                        REPOSITORY-SETTING-DECLARATIONS,
                                        RESOLVE-AND-CHECK, the status plist
    src/workspace/init.lisp             PLAN-PREPARATION, PREPARE-REPOSITORY
    src/workspace/test/workspace.lisp, test/init.lisp, test/domains.lisp
    src/knowledge/services.lisp         DESCRIBE-ENTITY, IMPACT-REPORT rows
    src/knowledge/structure.lisp        ENTRY-POINT-REPORT, a trigger band
    src/knowledge/test/services.lisp, test/structure.lisp
    src/process/console.lisp            find --trigger, describe, impact
                                        suffix, status deploys line
    src/process/test/console.lisp
    src/serve/operations.lisp           :find gains trigger; :status if it
                                        builds its plist key by key
    src/serve/test/operations.lisp, src/rest/test/routes.lisp,
    src/mcp/test/tools.lisp
    docs/requirements/REQ-0078.yaml     OUTSTANDING, in step 10
    docs/design/DES-0054.yaml           OUTSTANDING, in step 10

  Deleted: none. No .asd gains a dependency.

  BLAST RADIUS

  What Loom reports, from `impact <name> 3` at a64c80c:

    PY-DECORATORS          5 entities (truncated): PY-ITEM, PY-MODULE-ITEMS,
                           MAKE-PY-FILE-ENTITY, the Python ANALYZE-FILE.
                           Every Python file in every tree is reanalyzed
                           after step 2.
    PY-DECORATOR-VALUE     4 (truncated): the same chain.
    RESOLVE-ONE            41 (truncated). RESOLVE-DOCUMENT-LINKS,
                           DOCUMENT-REFERENCE-REPORT (the console and serve
                           `check`, and draft checking in transition.lisp),
                           and UNAMBIGUOUS-NAMES (architecture's describes).
    RESOLVE-SETTINGS       48 (truncated). RESOLVE-AND-CHECK, so
                           INDEX-REPOSITORY, POLL-ONCE and ENRICH-REPOSITORY.
    REPOSITORY-FILES       87 (truncated). INDEX-REPOSITORY, POLL-ONCE (the
                           monitor) and UNINDEXED-FILES. POLL-ONCE reaches
                           the analyzers only through REPOSITORY-FILES, so
                           one edit there is "both REPOSITORY-FILES and the
                           monitor" in R4.
    VALIDATE-ENTITY        498 (truncated). Every assert. Only a type that
                           declares :CLOSED behaves differently.

  Decisions Loom attaches: DES-0054 itself, DES-0053, DES-0047 (domains),
  DES-0025 (frameworks.yaml, D4), DES-0018 (the walker's skips), DES-0051
  (the document store), DEC-0003 (derive, never consume), DES-0014 and
  DES-0029 (RESOLVE-ONE's declined candidates). Nothing here contradicts
  one. DEC-0003 binds steps 5 and 6: both passes derive from
  analyzer-written properties and rewrite only their own outputs.

  What Loom cannot see, and why:

    - Readers of :DECORATORS outside the Python analyzer. Loom finds
      PYTHON-ARITY in services.lisp, which reads only :NAME. A REST caller
      reading describe's properties is outside every index (risk 3).
    - The DEFMETHOD fingerprints in lisp-analyzer.lisp list every declared
      :METHOD property. A declaration is not a call, so `impact` on
      code-ontology.lisp does not reach those tests (risk 1).
    - Most callers of the passes are `test` forms, a macro body. DES-0001
      says these under-report.
    - console.lisp and operations.lisp cross the loom-process/loom-serve
      boundary, which no rule covers. load-test is the instrument.
    - The document store's own dot filter, DOTTED-P in file-store.lisp,
      is a second walk. .firebaserc is not a document, so the store never
      needs it. But the file stamps and the freshness line read from a
      listing, and Loom has no edge that says which listing (risk 5).

  RISKS

  1. Fingerprint tests. Step 1 declares :TRIGGER and :ENTRY-POINT on
     :FUNCTION and :METHOD. The DEFMETHOD and DEFUN fingerprints in
     src/analyzer/test/lisp-analyzer.lisp (around lines 1031 to 1105) list
     every declared property alphabetically. They change in step 1 for
     that reason, as PLAN-0056 step 1's NOTES recorded. Nothing the
     analyzer writes moves. Check the diff of that file adds only
     `(:entry-point nil)` and `(:trigger nil)` entries.

  2. The existing decorator tests encode the `names` kind. Two assertions
     fail in step 2 because the format changed, not because a property
     broke:
       src/analyzer/test/python-extract.lisp, the decorator test (about
       line 236): `secrets=[KEY]` is read as '("KEY") from {kind: names}.
       src/analyzer/test/python-analyzer.lisp,
       DECORATORS-ARE-RECORDED-WITH-THEIR-RESOLVED-PATH-AND-LITERAL-ARGUMENTS:
       expects ("secrets" "KEY").
     Step 2 changes those two assertions and nothing else in either test.
     The schedule, timeout_sec, retry (:FALSE), memory (:NONE), region
     (:EXPRESSION), specifier, path and :IMPORTED-CALLS assertions pass
     unedited. That is the check that the Python analyzer keeps its
     behaviour where D1 does not change it. `git diff` on the two test
     files in step 2 shows only those two edits plus added tests.
     The region= case is `pick()`, a call, so it stays :EXPRESSION under D1.

  3. The :DECORATORS change is visible over REST. A describe over
     /v1/describe returns properties. `secrets` changes from ["KEY"] to an
     encoded list, and a nested plist may not encode as JSON the way a
     reader expects. Step 2 adds a REST test that describes a decorated
     Python function and asserts the JSON parses and holds "KEY" and
     "options.MemoryOption.MB_512". No test in src/rest, src/mcp or
     src/serve names decorators today. The change is behaviour change 5 in
     DES-0054's CONSEQUENCES, and step 2's commit message says so.

  4. A refused :SETTING drops every setting in that pass.
     RESOLVE-AND-CHECK's SUBMIT applies a pass's operations as one
     transaction. On an error it calls NOTE-ERROR and goes on. If one
     :SETTING carries an undeclared key after step 1, the whole
     resolve-settings transaction fails, and every setting and :READS edge
     vanishes for that pass. Only `log` and status's error line show it.
     So step 5 computes each setting's :SOURCES as the union over all its
     inputs and asserts each setting once. Two asserts of one natural key
     with different :SOURCES would also be wrong: the graph upserts, and
     the second would overwrite the first (CON-0005's shape, in a pass).
     After steps 1 and 5, run `tools/loom.sh 'log 20'` on Loom and lfia and
     confirm no resolve-settings error.

  5. .firebaserc and the stamps. REPOSITORY-FILES admits it in step 4. The
     document store's DOTTED-P still skips it, which is correct for
     documents. If file stamps or UNINDEXED-FILES come from a listing that
     skips dot names, .firebaserc would read as unindexed or drifted after
     every pass. Step 4's workspace test indexes a tree holding
     .firebaserc, then asserts freshness reads current, drift is 0,
     UNINDEXED-FILES is empty, and a POLL-ONCE after editing .firebaserc
     reanalyzes it.

  6. Fan-out by name (REV-0003 finding 1). A registration argument such as
     `secrets=[ZEFFY_API_KEY]` is resolved only through its binding. A
     local name goes to the module-level :VARIABLE of that name in the
     same file. An import binding goes through WALK-ATTRIBUTE-PATH. No
     lookup across the tree by spelling. A name with no binding target
     names nothing. Registration matching is on the bound module path and
     never on the decorator's spelling. A decorator with no import binding
     never matches. A Python declaration matches only by the Python rule,
     and a JavaScript registration only by the JavaScript rule. Step 5
     tests each.

  7. A false miss (REV-0003 finding 2). :DEPLOYED :NO is printed by
     `structure` as a defect. It must not appear where Python would deploy
     the function. Step 6 tests: a star import in main.py that resolves
     gives :YES; one that does not resolve gives :UNKNOWN; a re-export
     through a package's __init__.py gives :YES; a damaged main.py gives
     :UNKNOWN (refinement 4); `import handlers` gives :NO, which is
     Firebase's real behaviour.

  8. A document naming a shared name (REV-0003 finding 3). On lfia,
     ZEFFY_API_KEY is both variable:functions/main.py:ZEFFY_API_KEY and
     setting:ZEFFY_API_KEY after step 5. REV-0003 found the stage-1 test
     used a reader named "load", so it passed for a shape the real case
     did not have. Step 5's test uses a :VARIABLE of the same name as the
     setting, built by the analyzer from `ZEFFY_API_KEY =
     SecretParam("ZEFFY_API_KEY")`, plus an environment-read variable of
     the same name in another file. The set must resolve to the setting.
     A same-named variable that reads nothing keeps it ambiguous.

  9. RULE-0003's deny list. Both new passes return operations, as
     RESOLVE-CALLS does. If a helper calls ADD-ENTITY or
     APPLY-TRANSACTION directly, its name goes into
     docs/rules/RULE-0003.yaml's to-names in the same commit.

  10. The peer property. Step 7 edits console.lisp and operations.lisp.
      Run load-test after it. It must print T.

  11. find's term is required. The :find operation's shape lists `term`
      as required, and TOOL-INPUT-SCHEMA turns that into MCP's `required`
      vector. Step 7 keeps `term` required and accepts "" when `trigger`
      is given. The console's `find` accepts no name when --trigger is
      present. Changing `term` to optional would change the MCP schema,
      which a client may cache.

  12. The template's trigger list. It is read from lfia's installed SDK
      (firebase_functions 0.6.0 under functions/venv, which is untracked
      and not indexed). Reading it to write a template is authoring, not
      indexing. A trigger the SDK adds later is absent until a repository
      adds it. The miss is visible: the function stays in the no-caller
      band.

  13. The lfia tree moves under its author. Its branch and uncommitted
      edits changed between DES-0054's measurement and this plan. Step 9
      takes its own baseline. Nothing in this plan writes to lfia. Its
      untracked web/ and .loom/frameworks.yaml are read, never edited.
      Step 8's init check runs PLAN-PREPARATION, which writes nothing, and
      `git -C ~/github/lfia-accounting status --short` is compared before
      and after.

  14. BUG-0069 is open: `complete` with no verdicts writes when every
      refined document is blocked. If the JavaScript plan exists as a
      draft refining DES-0054 when step 10 runs, DES-0054 is blocked, and
      the dry run may write. Run `git status` after the dry run.

  STEPS

  Each step is one commit on req-0078-firebase, made by the caller. Step 1
  is the first that can be run.

  1. THE ONTOLOGY (DES-0054 S2, R7, and R8's refusal).
     src/ontology/root-ontology.lisp, src/ontology/code-ontology.lisp,
     src/ontology/package.lisp, src/ontology/test/root-ontology.lisp,
     src/ontology/test/code-ontology.lisp, src/graph/test/transaction.lisp,
     src/analyzer/test/lisp-analyzer.lisp.

     defentity takes :CLOSED. The entity-type spec records it. When it is
     true, VALIDATE-ENTITY also reports every key in the properties table
     that the type does not declare, with the problem "undeclared property
     on a closed type". Open types are unchanged.

     code-ontology.lisp, as R7:
       - :SETTING is :CLOSED T. It declares :NAME, :SOURCES, :LANGUAGE and
         :DOMAIN, as now. :SOURCES' documentation lists :ENVIRONMENT,
         :SECRET and :PARAM.
       - :DEPENDS-ON :FROM gains :FUNCTION, :METHOD and :VARIABLE.
       - :VARIABLE gains :VALUE-CALL and :REGISTRATION.
       - :FUNCTION, :METHOD and :VARIABLE gain :TRIGGER (keyword) and
         :ENTRY-POINT (list).
       - :FILE gains :CODEBASES, :PROJECT-ALIASES and
         :UNNAMED-REGISTRATIONS.
     Each documentation string names the DES-0054 decision that writes it.
     No entity type and no relationship type is added.

     Verification. New tests:
       - A :SETTING carrying :VALUE fails VALIDATE-ENTITY. A :FUNCTION
         carrying an undeclared key still validates (open types unchanged).
       - In transaction.lisp: a transaction asserting a :SETTING with
         :VALUE "x" is rejected whole, and the graph holds no setting
         afterwards.
       - A :DEPENDS-ON edge from a :FUNCTION to a :FILE is permitted. One
         from a :CLASS is dropped.
       - Each new property validates on its type.
     Before the edit, the refusal tests fail: an undeclared key is ignored.
     CON-0003: remove the closed clause from VALIDATE-ENTITY and see both
     refusal tests fail; revert. Risk 1's fingerprints change in this
     commit. Green. No count moves: nothing writes the new vocabulary.
     RULE-0001 holds: loom-ontology gains no dependency.

  2. THE DECORATOR ENCODING AND :VALUE-CALL (DES-0054 S1, R1, R2).
     tools/py/extract.py, src/analyzer/analyzer.lisp,
     src/analyzer/python-analyzer.lisp, src/analyzer/package.lisp,
     src/analyzer/test/python-extract.lisp,
     src/analyzer/test/python-analyzer.lisp, src/rest/test/routes.lisp.

     extract.py. literal_value gains the kinds `name` (with the D2 binding
     of that name: local, or import with specifier and path), `dotted` (an
     attribute chain of plain names, as written, with the first name's
     import binding when it has one), and `list` (a list or tuple whose
     every element is a literal, a name or a dotted chain). It loses
     `names`. Anything else stays `expression`. visit_decorator records
     positional arguments in order under `positional`, with the same
     encoding.

     A module-level assignment whose value is a single call writes
     `valueCall` on that variable: the callee's binding (specifier and
     path, or name for a local) and line. It writes `firstString` only
     when the first positional argument is a string literal. It writes no
     other argument. The call's :CALL-SITE (DES-0053 D4) is unchanged.

     Lisp. DECODE-ARGUMENT-VALUE in analyzer.lisp decodes refinement 1's
     encoding. PY-DECORATOR-VALUE calls it. PY-DECORATORS adds :POSITIONAL
     beside :ARGUMENTS. The variable's entity carries :VALUE-CALL as
     (:SPECIFIER s :PATH p :LINE n [:FIRST-STRING k]) or (:NAME n :LINE n
     [:FIRST-STRING k]).

     Verification. In python-extract.lisp and python-analyzer.lisp:
       - lfia's decorator line `@https_fn.on_request(secrets=[ZEFFY_API_KEY],
         timeout_sec=540, memory=options.MemoryOption.MB_512)` gives secrets
         as (:LIST (:NAME "ZEFFY_API_KEY" :BINDING :LOCAL)), memory as
         (:DOTTED "options.MemoryOption.MB_512" :SPECIFIER
         "firebase_functions" :PATH ("options")), and no :EXPRESSION.
       - `secrets=["K"]` is (:LIST "K").
       - `@app.route("/x")` records "/x" under :POSITIONAL.
       - `secrets=[SecretParam("K")]` is :EXPRESSION (a call).
       - `K = SecretParam("K")` with `from firebase_functions.params import
         SecretParam` gives :VALUE-CALL with specifier
         "firebase_functions.params", path ("SecretParam") and
         :FIRST-STRING "K".
       - R2: `P = StringParam("K", "dflt")` and `Q = StringParam("K",
         default="dflt")` both record "K". The test serializes the whole
