     MATCH-REGISTRATION (new) takes a registration plist, the language of
     the entity carrying it, and a list of declarations. It returns the
     single matching declaration, or NIL and the list when two match.
     Python: the specifier and path joined with "." equal module and name
     joined with ".". JavaScript: the specifier equals the module, and the
     path joined with "." equals the name. A relative specifier never
     matches. A registration with no specifier never matches. Any other
     language matches nothing. The same function matches a :VALUE-CALL
     against setting-declarations.

     RESOLVE-SETTINGS takes :SETTING-DECLARATIONS and :ENTRY-POINTS. It
