id: PLAN-0058
title: DES-0054 S10 in seven steps -- extract.js records registrations and value calls, js-analyzer.lisp writes them, the passes on a JavaScript tree, the JavaScript template and init's nodejs proposal, the unnamed-registration count in status, acceptance on front-end with a before/after index census, complete
status: draft
date: 2026-10-05
refines: [DES-0054, REQ-0078]
affects: [extract, calleeNames, make-js-definition-entity, make-js-file-entity,
          decode-argument-value, py-decorators, py-value-call, template-proposals,
          deploys-report, print-deploys]
tags: [analyzer, javascript, firebase, cloud-functions, entry-points, secrets,
       settings, frameworks, des-0054, req-0078, req-0024, con-0001, con-0003,
       des-0014]
summary: |
  PLAN-0057 built DES-0054 S1 to S9 for Python trees and left S10 to this
  plan: REQ-0078 R12 (DES-0054's R12, the JavaScript half of its R10) and
  the front-end clause of DES-0054 R13. On ~/github/front-end today,
  functions/index.js's `export const api = functions.https.onRequest(...)`
  is a :VARIABLE with no trigger, and `status` reports codebase default with
  0 entry points.

  Step 1 teaches tools/js/extract.js to report a registration, a value call
  and an unnamed registration in its reply. Step 2 makes js-analyzer.lisp
  write :REGISTRATION and :VALUE-CALL on the :VARIABLE and
  :UNNAMED-REGISTRATIONS on the :FILE, through decoders shared with the
  Python analyzer. Step 3 proves the PLAN-0057 passes work on a JavaScript
  tree with no change, as DES-0054 R12 requires. Step 4 adds
  firebase-functions-js.yaml and replaces init's "no template until the
  JavaScript plan" note. Step 5 puts the unnamed-registration count on
  status' deploys line. Step 6 is acceptance: a before/after index dump of
  front-end, read-only, and the R13 queries. Step 7 runs `complete`.

  Out of scope, each with its reason in DEFERRED below: hosting rewrites,
  setGlobalOptions, naming default-exported registrations, `.value` reads,
  an imported name in a registration argument, CommonJS and TypeScript
  functions trees, a handler passed by name, the calls inside a
  registration's handler, v1's chained builders, REQ-0078 R10 dependency
  names, and REQ-0078 R1, R2 and R4.
body: |
  BASELINE

  Loom at 87918aa on req-0078-js, no edits. The running service (same
  commit) reports:

      index        : 488 files, 5180 entities, 24766 relationships
      unclaimed    : 43 tracked files, .yaml 2
      check        : 0 violations, 8 unresolved, 7 ambiguous
      call sites   : tools/test/call-site-census.lisp prints 508 against
                     *CALL-SITE-CEILING* 512; js-test 91 resolving sites;
                     41 ambiguous occurrences

  ~/github/front-end at ab34be6 on branch
  bug-0048-reshape-then-delete-leaves-stray-shape, with its author's edits
  (one modified file, three untracked). `git status --short` there is four
  lines and is saved before every run in this plan. `sbcl --script
  tools/test/index-dump.lisp ~/github/front-end` at 87918aa takes 14s and
  prints 106672 lines:

      files 947, entities 11335, relationships 95294
      unclaimed 116; unparsed 0; violations 0
      unresolved references 120, ambiguous references 5
      imports: resolved 3728, external 693, unclaimed-target 7, unresolved 4
      deploys: codebase default at functions, runtime NIL, 0 entry points;
               project default=aigames-216202; declared NIL
      variable:functions/index.js:api       :ENTRY-POINT NIL, no :VALUE-CALL
      variable:functions/hello.js:hello      exists (see FINDINGS)
      variable:functions/api/simple.js:simple  exists
      variable:functions/api/handlers.js:handlers  exists

  front-end's functions/node_modules holds firebase-functions 6.6.0. Its
  package.json maps "." to lib/v2/index.js, so `import functions from
  "firebase-functions"` is the v2 API, and functions.https has onRequest,
  onCall and onCallGenkit.

  A syntax census, run with the vendored acorn over every tracked .js, .jsx,
  .mjs and .cjs file outside vendored and dot directories, with
  extract.js's own 80-name GLOBAL_VALUES, using the callee rule in
  REFINEMENT 2:

                                                front-end   Loom   game-server
      files parsed                                  797        1        0
      module-level const NAME = call(...) with a
        function or arrow argument (:REGISTRATION)    8        0        0
      the same with no such argument (:VALUE-CALL)  377        0        0
        of which the callee is import-bound         366
        of which the first argument is a string     227
        files holding at least one                  308
      export default call(...) with a function
        argument (:UNNAMED-REGISTRATIONS)             2        0        0

  The eight registrations are api (firebase-functions), four forwardRef
  calls from react (DragMapContainer, MyMap, LayerEditor, MapEditor),
  vi.hoisted and vi.fn from vitest in two test files, and project in a test
  file, whose callee is a relative import. Only api matches the template.
  The census counts tracked files, so an untracked front-end file adds to
  the real number; step 6 compares dumps, not this table.

  "Green" after a step means: tools/loom-test.sh passes on all twelve
  systems with no skip (node and python3 are both present here); `check` on
  Loom prints 0 violations, 8 unresolved, 7 ambiguous; call-site-census
  prints 508 total and 41 ambiguous; and, for steps 5 and 7, `sbcl --script
  tools/test/load-test.lisp loom-serve` prints T. Run with /usr/bin/sbcl
  through tools/loom-test.sh and say so in each commit. Run
  `tools/loom-serve.sh update` before using the service after any change to
  Loom's source.

  FINDINGS THAT CHANGE WHAT DES-0054 SAYS

  1. The two default exports already mint entities. DES-0054's PROBLEM says
     "The two default exports mint no entity." They mint
     variable:functions/hello.js:hello and
     variable:functions/api/simple.js:simple: extract.js records an
     anonymous default export that is not a re-export object (BUG-0056), and
     JS-DEFINITION-NAME names it after the module. D9's "mints nothing"
     therefore means this plan mints nothing new. Both entities stay as they
     are and carry no :REGISTRATION. :UNNAMED-REGISTRATIONS goes on their
     :FILE. Step 7 adds a dated correction to D9.

  2. The import walk for a registration argument is Python only.
     REFERENCE-VARIABLE in resolve.lisp walks an imported name for
     :PYTHON and returns NIL otherwise, and PLAN-0057's step 5 note says "a
     JavaScript registration resolves local names only until the JavaScript
     plan supplies a resolver." DES-0054 R12 says "the passes need no
     language-specific code beyond D3's matching rule." A JavaScript binding
     walk would be such code. This plan does not add one; DEFERRED records
     it, and step 3 pins the gap with a test.

  3. The DES-0014 ceiling has 4 sites of headroom. A js-test or domain-test
     body is a body-swallowing macro, so every resolving call inside one is
     a :CALL-SITE. Fifteen new js-tests with four calls each would raise the
     total from 508 to about 568. So every test this plan adds is a plain
     fiveam `test` with the node guard written inline, `(if (js-available-p)
     (progn ...) (skip "..."))`, as workspace.lisp's Python tests do with
     PYTHON-CHILD-STARTABLE-P. A `test` body's calls are attributed to its
     :TEST entity, so `describe' on the new functions also lists the tests.
     The ceiling is not raised.

  REFINEMENTS DES-0054 LEAVES OPEN

  1. The reply's shape. extract.js writes three new keys, in the shapes
     tools/py/extract.py already uses, so the Lisp decoders are shared:
       registration          on a variable definition:
                             {name, specifier, path, line, positional: [v],
                              arguments: [{name, value: v}]}
       valueCall             on a variable definition:
                             {specifier, path, line, firstString} or
                             {name, line, firstString}
       unnamedRegistrations  on the reply, an integer, absent when zero
     Each v is {kind, value, ...} with the kinds DECODE-ARGUMENT-VALUE reads:
     literal, none, true, false, name, dotted, list, expression. An option's
     key travels as the string under `name`, never as a JSON object key:
     cl-json would turn `timeoutSeconds` into :TIMEOUT-SECONDS.

  2. Which callee records anything. As the Python child does: a callee that
     is a bare identifier (not one of GLOBAL_VALUES), or a non-computed
     member chain of identifiers whose first name is bound by an import
     declaration. A chain rooted in a local (`raw.elements.filter`), in a
     call (`[...].map`), or in a global (`Object.keys`) records nothing.
     Only a `const` declarator with an identifier target qualifies, exported
     or not, as D9 says. `let`, `var` and destructuring record nothing.

  3. The binding of a callee. Built from every ImportDeclaration in the
     module before definitions are walked, since imports are hoisted:
       import functions from "m"      functions.a.b  -> m, (default a b)
       import * as ns from "m"        ns.a.b         -> m, (a b)
       import {a} from "m"            a.b            -> m, (a b)
       import {a as x} from "m"       x.b            -> m, (a b)
       a local identifier f           f              -> :NAME "f"
     This is D3's JavaScript rule: the `default` step is kept, and the
     template lists both spellings.

  4. Which argument goes where. D9 reads :ARGUMENTS from an object-literal
     argument's keys. A non-computed key that is an identifier or a string
     is read; a spread or a computed key is skipped. :POSITIONAL holds the
     other arguments in order, leaving out function and arrow arguments (the
     registered code itself) and every object literal whose keys were read.
     So `onSchedule("every 5 minutes", fn)` gives :POSITIONAL ("every 5
     minutes"), which the template labels `schedule`, and
     `onSchedule({schedule: "..."}, fn)` gives it under :ARGUMENTS. Both
     print schedule="every 5 minutes". Without this, every https entry point
     would print `0=<expression>` for its handler.

  5. The value encoding in JavaScript. A string, number, or a template
     literal with no expressions is a literal. `null` is none, `true` and
     `false` are true and false, `undefined` is a name. An identifier is a
     name with its binding: an import (specifier, and path (imported) or
     (default) or ()), or local. A member chain of identifiers is dotted,
     with the first name's binding when it is imported. An array whose every
     element is one of those is a list. Anything else, including a call such
     as `secrets: [defineSecret("K")]`, is expression.

  6. What counts as an unnamed registration. An `export default` whose
     declaration is a call that would have been a :REGISTRATION under
     refinements 2 and 4 had it been bound to a const. The extractor cannot
     tell Firebase from React: `export default memo(() => ...)` counts too.
     The count is a syntactic fact on the :FILE. Step 5's status line sums it
     only over files a firebase.json codebase covers, so a React tree's
     memo calls never reach a reader as "registrations".

  7. Shared decoders. Step 2 moves PY-VALUE-CALL's body into analyzer.lisp
     as DECODE-VALUE-CALL, and the one-decorator body of PY-DECORATORS as
     DECODE-REGISTRATION. PY-VALUE-CALL stays as a one-line caller, as
     PY-DECORATOR-VALUE did in PLAN-0057. Both read the reply with
     (cdr (assoc ...)), as DECODE-ARGUMENT-VALUE does, because JGET is
     defined in js-analyzer.lisp, which loads after analyzer.lisp. find
     reports no existing definition named decode-registration or
     decode-value-call.

  FILES

  New:
    src/workspace/templates/firebase-functions-js.yaml   step 4

  Changed:
    tools/js/extract.js                  step 1: the import binding table,
                                         argument encoding, registration,
                                         valueCall, unnamedRegistrations
    src/analyzer/analyzer.lisp           step 2: DECODE-REGISTRATION,
                                         DECODE-VALUE-CALL
    src/analyzer/python-analyzer.lisp    step 2: PY-DECORATORS and
                                         PY-VALUE-CALL call the shared
                                         decoders
    src/analyzer/js-analyzer.lisp        step 2: MAKE-JS-DEFINITION-ENTITY
                                         and MAKE-JS-FILE-ENTITY
    src/analyzer/test/js-analyzer.lisp   steps 1 and 2
    src/rest/test/routes.lisp            step 2: a JavaScript describe
                                         encodes
    src/workspace/test/workspace.lisp    steps 3 and 5
    src/workspace/init.lisp              step 4: TEMPLATE-PROPOSALS'
                                         :nodejs branch
    src/workspace/test/init.lisp         step 4
    src/workspace/workspace.lisp         step 5: DEPLOYS-REPORT
    src/process/console.lisp             step 5: PRINT-DEPLOYS
    src/process/test/console.lisp        step 5
    docs/design/DES-0054.yaml            step 7: OUTSTANDING, DEFERRED,
                                         the D9 correction
    docs/requirements/REQ-0078.yaml      step 7: OUTSTANDING

  Not changed, and a change to any is a finding to report: the ontology
  (PLAN-0057 step 1 declared every property this plan writes),
  src/graph/resolve.lisp, src/knowledge/, src/serve/operations.lisp, every
  .asd. Deleted: none.

  BLAST RADIUS

  What Loom reports, from `impact <name> 3` on the service at 87918aa:

    make-js-definition-entity  159 (truncated): ANALYZE-FILE, then every
                               caller of the generic ANALYZE-FILE through
                               `calls?' edges -- ANALYZE-PATH, INDEX-CONTENTS,
                               ANALYZE-TREE, CHECK-DOCUMENT-REFERENCES -- and
                               124 tests, nearly all for other analyzers. The
                               real reach is every JavaScript file in every
                               watched tree, reanalyzed on the first pass
                               after step 2.
    make-js-file-entity        159 (truncated): the same chain.
    decode-argument-value      6 (truncated): PY-DECORATOR-VALUE,
                               PY-DECORATORS, PY-ITEM. One test,
                               THE-DECODER-READS-EVERY-KIND-AND-A-LITERAL-LIST.
    py-decorators,
    py-value-call              5 each (truncated): PY-ITEM, PY-MODULE-ITEMS,
                               MAKE-PY-FILE-ENTITY, the Python ANALYZE-FILE.
    calleeNames                4: extract, superclassName, analyze, pump.
    extract                    2: analyze, pump. The chain ends at pump.
    template-proposals         54: PLAN-PREPARATION, PREPARE-REPOSITORY, the
                               console and serve call sites of
                               PREPARE-REPOSITORY, 47 tests.
    deploys-report             41 (truncated): REPOSITORY-STATUS, its six
                               console and four serve call sites, and
                               tools/test/index-dump.lisp's STATUS-LINES,
                               which makes step 5 visible in every dump's S
                               lines.
    print-deploys              7: PRINT-STATUS and its five call sites.

  Decisions Loom attaches: DES-0054 (decode-argument-value,
  template-proposals, py-decorators), DES-0029, DES-0045, DES-0047 and
  DES-0051 (make-js-definition-entity), DES-0048 and DES-0044
  (template-proposals), DES-0022, DES-0002, DES-0006, DES-0017, DES-0019,
  DEC-0004 and DES-0047 (deploys-report). Nothing here contradicts one.
  DES-0045 D1 binds step 1: the extractor reports syntax and the analyzer
  decides, so extract.js knows no Firebase name. DES-0025 D4 binds step 4:
  Firebase's names live in a template a repository copies, never in Lisp.

  What Loom cannot see, and why:

    - The child-process boundary. extract.js's impact ends at pump, and
      nothing links pump's stdout to PARSE-JAVASCRIPT or to the JGET calls
      that read each key. A key renamed on one side and not the other breaks
      silently. Step 1's reply-level tests and step 2's entity-level tests
      are the only link.
    - Every js-test case in src/analyzer/test/js-analyzer.lisp. The macro
      swallows its body, so those 45 tests reach the analyzer through
      :CALL-SITE entities and are absent from the `tests' bands above.
    - Readers of a :VARIABLE's properties outside Loom. A REST describe of
      any of front-end's 385 affected variables returns two new keys (risk
      3).
    - The registry and console boundary. Step 5 edits console.lisp, which no
      rule covers. load-test is the instrument.

  RISKS

  1. Every front-end answer depends on extract.js. A wrong encoding, a
     thrown exception, or a reply key that collides with an existing one
     changes every JavaScript file's index. extract.js already turns an
     exception into a one-file error reply, so a crash costs that file its
     definitions. Mitigation: step 1 changes the reply and nothing reads the
     new keys, and its census must show an empty dump diff on front-end.
     Step 2's census must show only the named properties moving. Each check
     runs both versions of Loom over the same front-end state, back to back.

  2. front-end moves under its author. It is on a feature branch with
     uncommitted edits. A before/after dump taken at two different times
     compares two trees. Steps 1, 2, 5 and 6 build the "before" dump from a
     worktree of Loom at 87918aa and the "after" from the branch, one
     immediately after the other, and compare `git -C ~/github/front-end
     status --short` before and after both. A difference in the status means
     the pair is discarded and taken again.

  3. The :VARIABLE shape changes over REST. About 385 front-end variables
     gain :VALUE-CALL or :REGISTRATION. A nested plist must encode as JSON.
     PLAN-0057 step 2 tested this for Python's :DECORATORS and :VALUE-CALL;
     step 2 adds the JavaScript case to routes.lisp.

  4. The DES-0014 ceiling. FINDINGS 3. Every new test is a plain `test`.
     call-site-census runs after steps 1 to 5 and must print 508 and 41. A
     rise in the ambiguous count is a new helper whose name collides with
     another package's, and is fixed by renaming the helper, as PLAN-0057
     steps 6 and 9 did (GLOB-PATH-SEGMENTS, SLOT-OF). Each new Lisp function
     name is checked with `find' before it is written.

  5. The Python analyzer in step 2. Moving the decoders touches
     python-analyzer.lisp. Every test in src/analyzer/test/python-extract.lisp
     and python-analyzer.lisp must pass unedited; `git diff` on both test
     files after step 2 is empty. lfia's dump before and after step 2 must be
     identical apart from any JavaScript under its untracked web/.

  6. A template entry that never matches. The template is data with no
     compiler. A misspelled module or name is silent: the function stays in
     the no-caller band. Step 4's test asserts named callees exist in the
     parsed template, and step 3's fixture is re-run with the template in
     place of hand-written declarations.

  7. Case. JavaScript names are case-sensitive, and BUG-0029 found
     resolution folding case. MATCH-REGISTRATION compares with STRING=, and
     VARIABLE-TABLE keys on (file . name) with EQUAL, so neither folds. A
     document naming a setting goes through LINKABLE-INDEX, which
     downcases. Step 3 tests `const API_KEY = defineSecret("API_KEY")`,
     the same-name case REV-0003 finding 3 named, and expects the setting.

  8. Tests that change because the behaviour they pin changes:
       src/workspace/test/init.lisp
       A-NODEJS-CODEBASE-GETS-NO-TEMPLATE-AND-SAYS-WHY asserts the note "no
       template until the JavaScript plan". Step 4 replaces it with a test
       that the nodejs codebase proposes firebase-functions-js.yaml. Its
       third assertion, no domain proposal for a nodejs codebase, is kept.
     No other existing test is expected to change. If one does, the step
     stops and the reason is recorded in NOTES before it is edited.

  9. A node-less machine. Every new test needing node skips without it.
     Step 4's template-parse test and step 5's console test need no node and
     must not skip.

  10. The peer property. Step 5 edits console.lisp and workspace.lisp.
      load-test must print T.

  11. lfia's provenance. DES-0054's OUTSTANDING says lfia's `unrooted 0`
      holds because "the functions domain is declared in lfia's untracked
      .loom/frameworks.yaml, by us." This plan cannot change that. Whether
      it blocks DES-0054=implemented is the user's call (step 7).

  12. Consent for front-end. R13's clause is "api carries the https trigger
      under codebase default". That needs entry-points in front-end's
      tracked .loom/frameworks.yaml. The user consented on 2026-10-05, and
      the declarations are already appended there, uncommitted on front-end's
      branch: one https entry point naming default.https.onRequest and
      https.onRequest, and setting-declarations for firebase-functions/params.
      Step 6 runs on the real tree. Until step 2 lands, front-end's deploys
      line reads 0 entry points, which is the baseline step 6 compares to.
      lfia's own file is left alone, by the user's decision.

  DEFERRED, WITH REASONS

  Each of these is a decision. Step 7 writes the ones DES-0054 does not
  already list into its DEFERRED section.

  - Hosting rewrites. front-end's firebase.json routes /helloWorld to
    helloWorld and /api/** to api. That is a route claim keyed on a function
    name, and DES-0054 DEFERRED says it needs its own design. It is also the
    only place front-end states hello.js's deployed name.
  - setGlobalOptions, the JavaScript set_global_options. DES-0054 DEFERRED.
    front-end calls it 0 times.
  - Naming a default-exported registration. DES-0054 D9 and DEFERRED. Naming
    it means following `import helloWorld from "./hello.js"` and `export {
    helloWorld }` to package.json's `main`. It is counted instead.
  - `.value` reads of a param handle. DES-0054 DEFERRED.
  - An imported name in a registration argument. FINDINGS 2. `import
    {apiKey} from "./params.js"` then `secrets: [apiKey]` reads nothing.
    R12 rules out language-specific pass code, and a JavaScript binding walk
    is that. front-end has no secrets.
  - CommonJS and TypeScript functions trees. `const {onRequest} =
    require("firebase-functions/v2/https")` binds through a call to a
    global, so the callee has no import binding, and `exports.api =
    onRequest(...)` is an assignment, which mints no entity today. This is
    the shape `firebase init` writes for JavaScript, so the template's header
    says it is not read. A TypeScript codebase (functions/src/index.ts) is
    not claimed at all (REQ-0024 WHAT THIS IS NOT). front-end is ESM
    ("type": "module").
  - A handler passed by name. `export const api = onRequest(handler)` has no
    function argument, so D9 makes it a :VALUE-CALL, which no entry-points
    entry is matched against. front-end has 0. Changing D9's rule is a
    design question.
  - The calls inside a registration's handler. A module-level variable's
    initialiser calls are dropped, because :CALLS may not start at a
    :VARIABLE (REQ-0024 NOT IN, BUG-0017). So `impact` on a helper the
    handler calls does not reach api. For front-end that loses
    logger.info, which is external, and handlers[route], which is computed
    and resolves to nothing anyway. A :CALL-SITE for that position is the
    designed answer and is its own change.
  - v1's chained builders. `functions.pubsub.schedule("...").onRun(fn)` and
    `functions.firestore.document("x").onWrite(fn)` have a callee rooted in
    a call, which binds no import. Only v1's direct
    `functions.https.onRequest` and `onCall` are matched.
  - Option rendering in Python spelling. OPTION-TEXT prints JavaScript true,
    false and null as True, False and None. The stored value is right; the
    printer is Python-flavoured. Not changed.
  - REQ-0078 R10 dependency names, and R1, R2 and R4. REQ-0078's own
    OUTSTANDING. DES-0054 DEFERRED names a :MODULE shape for R10.

  STEPS

  Each step is one commit on req-0078-js, made by the caller. Step 1 is the
  first that can be run.

  1. extract.js REPORTS REGISTRATIONS, VALUE CALLS AND UNNAMED
     REGISTRATIONS (R12, extractor half).
     tools/js/extract.js, src/analyzer/test/js-analyzer.lisp.

     In extract(): a pre-pass over ast.body builds the local-to-binding map
     from every ImportDeclaration (refinement 3). A function encodeValue(node)
     returns refinement 5's encoding. A function calleeBinding(node) returns
     refinement 2 and 3's callee binding or null. In walkDeclaration, a
     `const` declarator with an identifier target whose init is a
     CallExpression with a non-null calleeBinding gets `registration` when
     some argument is a FunctionExpression or ArrowFunctionExpression, and
     `valueCall` otherwise (refinement 4 splits the arguments; a valueCall
     keeps only firstString, the first argument when it is a string
     literal). The variable record and its walkBody are otherwise unchanged.
     In the ExportDefaultDeclaration branch, a CallExpression declaration
     that would have been a registration increments unnamedRegistrations;
     the existing anonymous-variable record is untouched (FINDINGS 1). The
     damage reply and the error reply carry unnamedRegistrations 0 or omit
     it. extract.js names no Firebase identifier anywhere (DES-0045 D1).

     Verification. New plain `test` forms with the inline node guard, each
     calling LOOM-ANALYZER::PARSE-JAVASCRIPT and reading the decoded reply:
       - front-end's index.js, verbatim: api's registration has name
         "functions.https.onRequest", specifier "firebase-functions", path
         ("default" "https" "onRequest"), line 9, no positional, no
         arguments.
       - `import {onRequest} from "firebase-functions/v2/https"` and
         `export const f = onRequest({timeoutSeconds: 60, secrets: [k,
         "LIT"]}, (q, s) => {})` with `const k = defineSecret("K")`: path
         ("onRequest"); arguments timeoutSeconds 60 and secrets a list of a
         local name k and a literal "LIT".
       - `import * as v2 from "firebase-functions/v2"` then
         `v2.scheduler.onSchedule("every 5 minutes", async () => {})`: path
         ("scheduler" "onSchedule"), positional ("every 5 minutes").
       - `import {defineString as ds} from "firebase-functions/params"` and
         `const p = ds("P", {default: "SENTINEL-DEFAULT"})`: valueCall path
         ("defineString"), firstString "P". The whole reply, printed to a
         string, does not contain "SENTINEL-DEFAULT".
       - `const q = defineInt(name)`: valueCall with no firstString.
       - `const r = raw.items.filter(x => x)` and `const n =
         Object.keys(o)`: neither key.
       - hello.js verbatim: unnamedRegistrations 1, and the anonymous
         definition is still in the reply.
       - `export default memo(() => null)` with memo imported from react:
         unnamedRegistrations 1 (refinement 6, pinned on purpose).
       - `let x = onRequest(() => {})`: neither key.
       - `secrets: [defineSecret("K")]` encodes as list of expression.
     CON-0003: before the edit every new test fails, since no key exists.
     Then make encodeValue return expression for an Identifier and see the
     second test fail; revert.

     Census. Back to back (risk 2), the "before" dump from a worktree of
     Loom at 87918aa (`git worktree add <scratch>/loom-base 87918aa`) and
