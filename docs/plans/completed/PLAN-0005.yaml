  PREDICTIONS THAT CAME OUT WRONG

  1. "Fourteen registry entries." Fifteen. DES-0006 R4 counts fourteen and R7
  separately asks that server-status be a read-tier entry reachable over both
  protocols, so the arithmetic in step 6's test name was wrong rather than the
  design. The test is named every-operation-is-routed and iterates
  ALL-OPERATIONS, which is what the plan actually wanted from it.

  2. "Step 7(b) fails with the lock commented out, and that is the CON-0003
  evidence." It does not fail, and the plan's own instruction -- raise the
  iteration count rather than weaken the assertion -- does not rescue it. Run
  with *WORKSPACE-REGISTRY-LOCK* removed from both entries, 6 threads x 20
  watch/unwatch cycles passed twice. The reason is arithmetic: the unguarded
  region in WATCH-REPOSITORY is a read, a CONS and a write -- tens of
  nanoseconds -- inside a cycle that spends ~200 ms indexing and stopping a
  monitor, so two threads overlapping inside it is a one-in-ten-million event
  per cycle and the count needed is millions, which is not a test. FINDING 2 is
  still real; it is simply rare enough that the symptom cannot be reproduced on
  demand. The assertion stays, and a second test was added that fails the
  moment the lock is removed:
  the-registry-entries-serialize-on-the-registry-lock holds the lock from
  another thread for 500 ms and asserts the watch waited. Without the lock it
  measures 0.000 s. That is the CON-0003 witness, and it tests the mechanism
  rather than the symptom because the symptom is not testable.

  3. "Concurrent REST callers all return 200." They do not: a read arriving
  between REINDEX-REPOSITORY's graph swap and the moment a file is re-analyzed
  sees an index that does not hold the term yet and answers 404. That is
  DES-0004 R5's lock-free read path working as designed, not a torn view -- the
  count comparison against a quiet rebuild is what would catch one. The
  assertion is now 200-or-404, with no 500, which is what DES-0006 R3 actually
  states.

  4. "cl-json's key naming, if unbound, camelCases silently." True, and the fix
  went further than the plan's: nothing in the walker ever hands cl-json a
  symbol, so no special variable of cl-json's is load-bearing and no caller can
  change the spelling of :full-tokens by rebinding one. The emitter also writes
  its own braces rather than handing cl-json a hash table, because MAPHASH order
  is implementation-defined and a JSON answer whose key order changes between
  runs of the same request is a diff nobody can read.

  DECISIONS TAKEN DURING IMPLEMENTATION THAT THE PLAN DID NOT STATE

  Five, each small, each with its reason in the file that carries it.

  1. A REQUEST-ERROR condition family. The plan has INVOKE-OPERATION signalling
  a refused tier and a missing argument while returning an error plist for
  anything the operation signalled -- which works only while the check happens
  before the call. REQUIRE-REPOSITORY and RESOLVE-ENTITY signal from *inside*
  the operation, so the first draft returned an unknown repository through the
  same path as an analyzer blowing up, and the skin had nothing left to tell 400
  from 500 with. MALFORMED-REQUEST, UNKNOWN-ENTITY and CAPABILITY-ERROR are now
  subtypes of one REQUEST-ERROR class that INVOKE-OPERATION re-signals ahead of
  the guard. UNKNOWN-ENTITY is a subtype of MALFORMED-REQUEST for the same
  reason: step 2 wants an unresolvable term to be a malformed request and step 6
  wants 404 for it and 400 for an unknown repository, and subtyping satisfies
  both without a third rule.

  2. GUARDED-CONDITION as a DEFTYPE rather than WITH-CONDITION-GUARD as a macro.
  Four handlers name the type list and it must not drift; a type is what
  HANDLER-CASE already accepts, and a macro would have forced errors.lisp ahead
  of registry.lisp in the .asd for no other reason. The component order is
  errors, capability, registry regardless, because a type must exist when the
  file naming it compiles.

  3. Routes derived from the registry rather than a hand-written table. Every
  route does the same five steps, REQ-0008 excludes the exact route table, and
  DES-0006 commits only to the shape. /v1/<operation-name>, GET for read
  entries and POST for write and repl ones. The failure the plan's step 6(e)
  guards against -- an operation with no route -- cannot occur, and the test
  asserts it by issuing a real request for every entry rather than by inspecting
  a table.

  4. DEFAULT-JSON-KEY-NAME downcases only an all-uppercase symbol name. MCP's
  schema keys are camelCase and are not this system's to rename, and the reader
  upcases an ordinary keyword. So :full-tokens becomes "full-tokens" and
  :|inputSchema| stays "inputSchema", and one encoder still serves both skins,
  which was the reason for putting the walker in loom-serve at all.

  5. *STATIC-GRANTS* as a variable behind RESOLVE-CALLER-GRANTS. The refusal
  path is the half of a capability system that has to be tested, and a test
  cannot exercise it by binding a special -- grants are resolved in a
  Hunchentoot worker thread and a binding made in the test thread is invisible
  there. The same trap applies to *HANDLERS*, and both test macros say so.

  OUTSTANDING, AND HANDED OFF RATHER THAN DONE

  .claude/skills/loom/SKILL.md still says "Six systems, per-system pass/fail
