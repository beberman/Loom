       HEADLESS, selected by a --headless argument: `loom-serve:serve-forever`,
       which watches the given paths through WATCH-REPOSITORY directly, installs
       its own debugger hook, starts the server, installs a SIGTERM/SIGINT
       handler that pauses every repository and stops the server, and blocks in
