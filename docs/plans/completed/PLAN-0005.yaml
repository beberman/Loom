       (src/workspace/workspace.lisp:356-363), for MONITOR-SLEEP's reason: a
       single long SLEEP makes a stop request wait out the interval.
     `install-service-debugger-hook` is loom-serve's own, not
     loom-process:install-debugger-hook, because HEADLESS never enters `main`
     and loom-serve may not depend on loom-process. Same shape --- log, write to
     *error-output*, and do not block --- with one difference worth a comment:
     `main`'s hook calls (abort), which in a Hunchentoot worker thread may find
     no ABORT restart, so the service's hook must not assume one.
     Verification, and this step is the one whose verification is not a FiveAM
     test, which is worth saying rather than hiding:
       a. HEADLESS with stdin closed stays up. Start it in the background with
          stdin from /dev/null, wait, curl the status route, assert 200, then
          send SIGTERM and assert the process exits and the port stops
          answering. That the process is still alive after several seconds is
          the whole point of the mode: DES-0006 predicts that a naive script
          calling `main` would exit within its first second because READ-LINE
          returns :eof immediately, and a run of this test against the
          interactive mode with stdin closed should show exactly that. Run it
