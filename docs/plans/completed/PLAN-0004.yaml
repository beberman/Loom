    suite                     6 of 6 systems green
    ontology  291 -> 301      analyzer  134 -> 139
    graph     206 unchanged   workspace  51 unchanged
    knowledge  51 ->  77      process    79 ->  92

  The two numbers that had to hold did: graph and workspace did not move, and
  no .asd changed. `check` reported no violation at any step.

  Four predictions came out wrong, none of them harmfully, and one of them was
  a defect in this document's own code.

  The baseline's "88 files exactly" was 89 before step 1 ran. DES-0006 landed
  in the tree from another task while this plan was being written. The
  prediction that mattered -- no new file beyond what FILES names -- held: the
  count was 89 at step 1 and 89 at step 7, and every definition went into a
  file the systems already listed.

  The per-step test-count predictions were all low, because FiveAM reports
  assertions and this plan counted tests. Ontology went 291 -> 301 where 293
  was predicted (two tests, ten assertions); analyzer 134 -> 139 for three
  tests; knowledge 51 -> 77 for seven; process 79 -> 92 for four. The
  instrument was still the right one -- every number moved in the system that
  was edited and nowhere else.

  Step 6's format string, as written in this document, was wrong, and its
  first test passed anyway. `~@[, truncated~]` does not use up the argument it
  tested: an ~@[ leaves the argument for its clause, and a clause containing
  no directive therefore consumes nothing, so the flag survived into the
  following ~a and every truncated summary printed as "T". DES-0005's
  original `~:[~; , truncated~]` is a two-clause conditional and does consume
  it; this document's "correction" of the space before the comma silently
  swapped one directive for another. The fix is `~:[~;, truncated~]`, which
  keeps the intended spacing and consumes the argument.

  It was caught by the acceptance command at the end of step 6 and not by the
  suite. describe-says-when-it-cut-something asserted that "truncated"
  appeared and that the tail of the summary did not -- both true of a summary
  printing as the single character T. That is CON-0003's failure mode exactly,
  in a test this document's own RISKS section had named three other instances
  of. The test now also asserts the head of the summary is present, which is
  what a summary printing as its own flag cannot satisfy.

  The console fixture named its source file src/alpha.lisp, and
  `describe alpha` then resolved to the file rather than to the function:
  SIGNIFICANT-NAME strips a file's directory and extension, so a file of that
  name answers to the same term. The fixture file is src/code.lisp. Worth
  recording because the fixture was copied from
  src/workspace/test/workspace.lisp, where the collision is harmless because
  nothing there resolves a bare name.

  Two smaller notes for whoever is next.

  RISKS predicted the console fixture might leak a watched repository and turn
  a-command-that-signals-prints-and-continues red. It did not; the
  UNWIND-PROTECT held across four tests including one that rebinds a special.

