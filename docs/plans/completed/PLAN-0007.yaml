  THREE PREDICTIONS THAT CAME OUT WRONG

  Step 3(d) expected `check` to report unresolved document references between
  steps 3 and 6, because DES-0008 and BUG-0008 name force-load-systems and
  reload-code in their `affects:`. It reported 0 at every point. A name that
  resolves to nothing is not counted -- BASELINE already carried reload-code in
  BUG-0008's `affects:` with 0 unresolved, and reload-code was never an entity.
  So `check` is a weaker staleness detector for `affects:` than this plan and
  CLAUDE.md both assume; the two lists were corrected at step 6 anyway, and
  this is worth a bug of its own rather than a line here.

  Step 1(b)'s procedure, above: measured too early, 0 of 3, until a settle was
  added.

  Step 2 predicted serve at ~157 and this plan's VERIFICATION predicted the
  final serve at roughly 125. Actual: 156 and 124.

  THE QUESTION LEFT FOR THE CODER

  Resolved in favour of SB-THREAD. BT:MAKE-THREAD on SBCL is
  SB-THREAD:MAKE-THREAD verbatim (bordeaux-threads-v0.9.4
  apiv1/impl-sbcl.lisp:19-20), so the thread it returns is one
  SB-THREAD:JOIN-THREAD can join with a :TIMEOUT. AWAIT-THREAD carries that as
  its `#+sbcl` branch and the BT:THREAD-ALIVE-P deadline poll as its `#-sbcl`
  branch, and its docstring says which one this image takes. Both of step 2's
  tests were run against the chosen branch and both were also run against the
  wrong implementations they exist to catch: the ordering test fails against
  the undrained STOP-SERVER with "stop-server returned while /slow was still in
  its handler" while its own "the response arrived" assertion passes, which is
  measurement (3) confirmed rather than argued; the bound test fails against a
  `:soft t` called on the calling thread with "stop-server took 10.01s".

