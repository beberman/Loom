  3994841397, indexed-at 3994841397 at the moment `start` returned, indexed-at
  3994841398 twelve seconds later, `status` reporting stale from then on over a
  tree nothing had touched. So the cause named in this plan's measurement (1)
  is right, and BUG-0007's own POLL-ONCE diagnosis is wrong.

