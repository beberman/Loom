  STEP 1(b), THE MEASUREMENT WHOSE PROCEDURE HAD TO CHANGE

  Run as written -- `start` immediately followed by `status`, three times --
  the before-count was 0 of 3. That is not the symptom failing to reproduce;
  it is the procedure sampling too early, and the reason is worth keeping.
  `tools/loom-serve.sh start` returns as soon as `probe` gets an answer, and
  `probe` answers while the redundant post-start reindex is still running. A
  status read at that instant reads the *previous* index's stamp and says
  "current"; one sampled mid-reindex showed 663 entities against an eventual
  1275. The stale answer appears a second or two later.

  With a 12-second settle between `start` and `status`, three cold starts each:

    before the fix   2 of 3 stale
    after the fix    3 of 3 current

