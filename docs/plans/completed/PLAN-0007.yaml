id: PLAN-0007
title: Sequence the removal of in-place reload and the soft-drained stop, closing BUG-0008 and BUG-0007
status: final
date: 2026-08-04
refines: [DES-0008, BUG-0008, BUG-0007]
affects: [stop-server, start-server, serve-forever, watch-repository,
          index-repository, repository-indexed-at, find-operation,
          all-repositories, register-handler, invoke-operation]
tags: [service, lifecycle, concurrency, rest, prototype, plan]
summary: |
  Six steps that land DES-0008's R1-R7 in dependency order. BUG-0007 first --
  DES-0008 R6 names it a prerequisite worth landing ahead, and this plan
  accepts that rather than deferring it, for a reason R6 could not know: while
  measuring this plan's own BASELINE, BUG-0007's stated cause was disproved and
  a different, smaller one was found, which makes the fix a one-form change in
  SERVE-FOREVER rather than an open investigation in POLL-ONCE. Then
  STOP-SERVER's bounded soft drain, so that `restart` is already lossless
  before it becomes the only way to bring code up to date. Then the deletion of
  RELOAD-CODE and its five supporting definitions, their two exports, their
  five tests, and the guard loom-rest's own suite wrapped around them. Then
  tools/loom-serve.sh, then the two agent-facing documents, then the document
  statuses this makes false.

  Every step compiles and leaves the nine-system suite green. Three steps name
  a FiveAM assertion that fails without them; the two that cannot be
  FiveAM-tested (a shell script, a process lifecycle) name a manual procedure
  with a measured before-and-after instead of a pass/fail, because a manual
  check with no baseline is CON-0003's failure mode in a shell.

  Out of scope and deliberately so: any drain-in-place mechanism (DES-0008's
  ALTERNATIVES rejects it); a REST- or MCP-reachable "restart yourself"
  operation (same section); persisting the watched repository set across a
  restart (DES-0006 deferred it, DES-0008 does not reopen it); any change to
  RESOLVE-CALLER-GRANTS or CHECK-CAPABILITY (REQ-0010 forbids reopening R6);
  the duplicate pre-start watch in loom-serve.lisp, which costs one redundant
  index at startup and no correctness (STEP 1 names it, measured, as deferred);
  and any edit to console.lisp, loom.lisp, loom-process.asd or
  src/process/package.lisp, which DES-0006 R5 protects.
body: |
  BASELINE

  Measured today, 2026-08-04, branch server, /usr/bin/sbcl, via
  `tools/loom.sh 'status | check'` and `tools/loom-test.sh`:

    index      : 127 files, 1274 entities, 5667 relationships
    documents  : 46
    tests      : 340 tests covering 232 units
    watcher    : watching
    rules      : 0 violations, 2 unenforced
    unresolved : 0 document references, 1 definer macro

    suite                     9 of 9 systems passed
    ontology  301     analyzer  139     graph  206
    workspace  54     knowledge  77     process  92
    serve    151      rest       81     mcp     23

  The two unenforced rules are RULE-0004 and RULE-0005; the one definer macro
  is DEFENTITY. Both are the standing state prior plans left and are not this
  plan's business. Only `serve` and `rest` are expected to move, and both are
  expected to move *down*: this plan deletes more test code than it adds.

  FOUR MEASUREMENTS TAKEN WHILE WRITING THIS PLAN, BECAUSE THREE DOCUMENTS
  DEPEND ON FACTS NONE OF THEM CHECKED

  These are the reason the steps below are shaped the way they are. Each was
  run rather than reasoned about, and each contradicts something a settled
  document says.

  (1) BUG-0007's stated cause is wrong, and the real one is smaller.

  BUG-0007 locates itself in POLL-ONCE -- "poll-once found at least one file it
  counted as changed on its first pass" -- and names a settle-window boundary
  or a `>=`-for-`>` as the candidates. Both were checked directly against this
  tree, /usr/bin/sbcl, with a script under /tmp:

    WATCH-REPOSITORY over the Loom root, monitor off: 127 files, 127 stamped,
    0 unstamped. Two manual POLL-ONCE calls three seconds apart: 0 changed
    both times, REPOSITORY-INDEXED-AT unmoved.

    WATCH-REPOSITORY with the monitor thread running, sampled every 2s for
    16s: REPOSITORY-INDEXED-AT never moved, delta from the watch instant 0 at
    every sample.

  POLL-ONCE does not do what BUG-0007 says it does. What does is the sequence
  loom-serve.lisp performs at startup. HEADLESS watches every path (line 103),
  calls START-SERVER (116), which records *SERVER-STARTED-AT*, and then calls
  `(serve-forever paths :already-started t)` -- whose own body watches every
  path again (server.lisp:371-377). WATCH-REPOSITORY on an already-registered
  root calls REINDEX-REPOSITORY (workspace.lisp:428-431), and INDEX-REPOSITORY
  ends by setting REPOSITORY-INDEXED-AT to GET-UNIVERSAL-TIME (241). So the
  running process re-indexes itself *after* the instant it reports as
  :started-at, and whenever that second index crosses a whole-second boundary
  -- GET-UNIVERSAL-TIME counts in whole seconds -- :indexed-at lands one
  second past :started-at and `probe`'s `indexed > baseline` test reports
  stale, permanently, over a tree nothing touched. That is BUG-0007's exact
  measured symptom (":indexed-at one later", once, then holding) with a cause
  that is not in loom-workspace at all.

  Honest about what was not shown: a simulation of that startup order landed
  inside a single second and reported `current`, so the boundary crossing is
  probabilistic rather than certain. That is why STEP 1's verification counts
  repeated starts before and after rather than asserting a single one.

  (2) `(hunchentoot:stop acceptor :soft t)` cannot be bounded from inside
  Hunchentoot, and waits once rather than in a loop.

  acceptor.lisp:319-336, read directly. The wait is a bare
  `(condition-variable-wait (acceptor-shutdown-queue acceptor)
  (acceptor-shutdown-lock acceptor))` with no timeout argument, guarded by a
  single `(when (plusp (acceptor-requests-in-progress acceptor)) ...)` and not
  by a loop. Two consequences the implementing step has to carry rather than
  discover: the bound DES-0008 R3 requires must be imposed by the caller,
  because the primitive has no way to express one; and with two or more
  overlapping requests the wait returns when the *first* one finishes rather
  than the last, so `:soft t` is "wait for an in-flight request" and not "wait
  for all of them." STEP 2's tests are written for one in-flight request for
  that reason, and the residual is recorded rather than papered over.

  (3) A hard stop does not kill an in-flight worker, so the obvious drain test
  passes without the change.

  taskmaster.lisp:349-352: `shutdown` on the ONE-THREAD-PER-CONNECTION
  taskmaster joins the *acceptor* thread and returns. It does not touch worker
  threads, and `stop` closes only the listening socket. A request in flight
  when today's hard STOP-SERVER runs therefore finishes and is answered. The
  in-flight work BUG-0008 says is dropped is dropped by the *process exiting*
  underneath it a moment later, not by Hunchentoot. So a test shaped
  "fire a slow request, stop the server, assert the response arrived" passes
  against today's code and proves nothing -- CON-0003's exact failure mode.
  STEP 2's test asserts the ordering instead: that the handler had already
  finished by the time STOP-SERVER *returned*. That is the property a caller
  which exits the process next actually needs, and it is false today.

  (4) The request counter is per request, not per connection.

  acceptor.lisp:482 wraps PROCESS-REQUEST, inside the connection loop, in
  WITH-ACCEPTOR-REQUEST-COUNT-INCREMENTED. An idle keep-alive connection --
  drakma leaves them open, and every test in three suites uses drakma -- does
  not hold the counter above zero. Without this, every soft stop in the suite
  would block for the full bound and this plan would be proposing to add ~25
  five-second waits to a test run. It does not.

  FILES

  src/serve/server.lisp
      Steps 1, 2, 3. Step 1: SERVE-FOREVER's watch loop becomes conditional on
      ALREADY-STARTED. Step 2: *STOP-DRAIN-TIMEOUT* and DRAIN-AND-STOP added
      beside STOP-SERVER, which calls the latter. Step 3: lines 156-277 --
      the whole "Reloading this image's own code" section, its banner comment
      included -- deleted.

  src/serve/package.lisp
      Step 3. The #:*reload-function* and #:*reload-systems* exports and their
      comment (86-90) removed. Nothing is added: *STOP-DRAIN-TIMEOUT* stays
      internal, matching *RELOAD-LOCK*'s own precedent, so the net export
      change is exactly the -2 DES-0008 names.

  src/serve/test/server.lisp
      Steps 1, 2, 3. One test added at step 1, two at step 2, one at step 3,
      and the five RELOAD-CODE tests (146-225) with their section banner
      (134-144) deleted at step 3.

  src/rest/test/routes.lisp
      Step 3. EVERY-OPERATION-IS-ROUTED loses the *RELOAD-FUNCTION* rebind and
      its UNWIND-PROTECT (135-137, 152) and the comment paragraph explaining
      it (129-134), reverting to the shape it had before PLAN-0006. This is
      not optional and not deferrable to a later step: *RELOAD-FUNCTION* stops
      being an exported symbol at step 3, so loom-rest's suite does not
      compile until this lands in the same step.

  tools/loom-serve.sh
      Step 4. `cmd_reload` becomes a two-line alias for `cmd_restart`;
      `reloaded_at_file` and the "later of :started-at and .reloaded-at"
      branch in `probe` are removed; `cmd_update`'s `stale)` branch calls
      `cmd_restart`; the header comment's two lines about reload are
      corrected. Six verbs stay six.

  .claude/agents/tools.md, .claude/skills/loom/SKILL.md
      Step 5. R7's documentation obligation, narrowed by measurement: the verb
      tables (tools.md:103-108, SKILL.md:136-140) and the `update` paragraphs
      that follow each.

  docs/bugs/BUG-0007.yaml
      Step 1. status open -> closed, and its CAUSE section rewritten to the
      mechanism measured above rather than the POLL-ONCE story it currently
      tells.

  docs/bugs/BUG-0008.yaml, docs/design/DES-0008.yaml,
  docs/requirements/REQ-0010.yaml, docs/design/DES-0007.yaml,
  docs/plans/PLAN-0006.yaml, docs/plans/PLAN-0007.yaml
      Step 6. The statuses and the two `affects:` lists this work makes false.

  Deliberately not changed, each with its reason:

    CLAUDE.md. DES-0008 R7 names it as describing `reload` and it does not:
    grepped directly, the string "reload" does not occur in the file, and its
    "Running it as a service" section lists the two `sbcl --script` forms and
    no verbs at all. R7 is over-inclusive here; correcting a file that is
    already right would be the edit, not the omission.

    src/mcp/tools.lisp. RELOAD-CODE was never registered as an MCP tool
    (write-tier operations are off MCP's surface by DES-0006), grepped and
    confirmed: no occurrence of "reload" anywhere under src/mcp. `mcp` at 23
    is one of the numbers that must not move.

    src/rest/routes.lisp. The route table is derived from the registry, so
    /v1/reload-code disappears when the registry entry does. No edit, and the
    step-3 verification asserts the disappearance rather than assuming it.

    loom-serve.lisp. STEP 1's fix lives in SERVE-FOREVER rather than in this
    script, so that a FiveAM test can reach it; see STEP 1's own note on the
    alternative that would have edited this file instead and could not be
    tested.

    src/workspace/workspace.lisp. Measurement (1) exonerates POLL-ONCE. The
    line PLAN-0006 step 1 added is correct and stays.

    src/serve/capability.lisp. R6 is not reopened. DES-0008 reads
    RESOLVE-CALLER-GRANTS as part of its argument and changes nothing in it.

  BLAST RADIUS

  What Loom reports today, at depth 3:

    force-load-systems     1 impacted: the file that contains it. Nothing
                           calls it but *RELOAD-FUNCTION*'s initform, which is
                           a value rather than a call and therefore invisible.
                           Documents attached: DES-0007, DES-0008, PLAN-0006.

    stop-server           27 impacted, and this is the number that matters.
                           d1 WITH-TEST-SERVER and SERVE-FOREVER; d2 twenty-
                           three tests across all three service suites --
                           loom-serve/test, loom-rest/test and loom-mcp/test
                           -- every one of which reaches STOP-SERVER through
                           WITH-TEST-SERVER's own UNWIND-PROTECT. Documents
                           attached: DES-0006, DES-0007, DES-0008,
                           BUG-0008, PLAN-0005, PLAN-0006, REQ-0010. STEP 2
                           changes a primitive twenty-three passing tests call
                           twice each, which is why measurement (4) above --
                           the counter is per request, so an idle keep-alive
                           connection cannot make a drain wait -- was taken
                           before this plan was written rather than after a
                           suite run went strange.

    reload-code            Not an entity. `find reload` returns the four
                           variables, and the tests whose names contain the
                           string, and no function: DEFINE-OPERATION's body is
                           a macro expansion and DES-0001's macro blindness
                           covers it. So `impact` cannot answer "what calls
                           the reload operation" at all, and the answer is
                           known by other means: loom-rest reaches it through
                           FIND-OPERATION on a string from the URL path, and
                           tools/loom-serve.sh reaches that over HTTP.

  What Loom cannot see, and this plan believes anyway:

    Everything tools/loom-serve.sh does. Bash is not indexed; `check` has
    nothing to say about step 4.

    Everything loom-serve.lisp does. It reaches every function through
    READ-FROM-STRING, which PLAN-0005 and PLAN-0006 both recorded as below
    `impact`'s floor. STEP 1's change is in SERVE-FOREVER partly for this
    reason.

    That removing the registry entry removes the REST route. The derivation
    runs at request time through FIND-OPERATION, so no edge exists to follow.

    BUG-0006 is open: `check` cannot verify a layering claim, because
    ENTITY-SYSTEM reads the path segment before the first slash and every file
    in this tree is in system "src". Nothing in this plan crosses a layer, but
    a clean `check` is not evidence of that either way.

  RISKS

  A drain that waits forever because the bound was left to Hunchentoot.
  Measurement (2): `:soft t` has no timeout and cannot be given one. An
  implementation that calls it on the calling thread and trusts it to return
  turns every `tools/loom-serve.sh stop` into an indefinite block the moment
  one request hangs, and the symptom is the script's own "pid N has not
  removed the pidfile after ~20s" rather than anything that names a drain.
  STEP 2's second test is the guard, and it is written to fail against exactly
  that implementation rather than against today's code -- stated in the step,
  because a test whose failure mode is a hang is worth knowing about before
  running it.

  A drain test that passes for the wrong reason. Measurement (3): a hard stop
  does not kill workers, so "the response arrived" is true today. The
  ordering assertion is the whole of the test's value; a coder who simplifies
  it back to "the request completed" has removed the test while leaving it
  green. CON-0003, in the one place in this plan where it is easy to get
  wrong.

  A parked drain thread outliving its bound. When the bound elapses the drain
  thread is still blocked on Hunchentoot's condition variable and there is no
  way to wake it that does not involve a request completing. It is left
  parked, and the calling thread completes the stop itself. Two consequences,
  both accepted rather than solved: the thread may wake later and run
  Hunchentoot's own stop tail against an already-closed socket, which is why
  the drain thread's body is wrapped in IGNORE-ERRORS rather than the caller's
  call alone; and a process that timed out a drain leaks one thread until it
  exits, which for a process being stopped is a non-cost and for the test
  suite is one thread per deliberately-timed-out test.

  A false "stale" costing a restart on every session. This is DES-0008 R6's
  named interaction, and it is the reason BUG-0007 is step 1 rather than
  deferred. If step 1 turns out not to close BUG-0007 -- the mechanism is
  measured but the symptom is probabilistic -- then steps 2-6 still land and
  the cost is a ~4.3s restart per SessionStart hook rather than a ~30ms no-op.
  That is a degraded-performance defect and not a wrong answer, and it does
  not block the rest of the plan. STEP 1 says so explicitly rather than
  leaving a coder to decide mid-plan.

  An interim state between steps 3 and 4 where the script POSTs to a route
  that no longer exists. `cmd_reload`'s curl gets a 404, `curl -sf` fails,
  `body` is empty, `json_bool reloaded` is empty, and the script falls through
  to "reload did not succeed; restarting" and restarts. Degraded, correct, and
  loud. Named so that a coder who lands step 3 and stops for the day knows
  what they are looking at.

  Tests likely to break, and why:

    loom-rest/test EVERY-OPERATION-IS-ROUTED, at step 3, if its guard is not
    removed in the same step: *RELOAD-FUNCTION* is unexported and then
    undefined, so the file does not compile. This is a compile failure rather
    than an assertion failure and it is the one thing that makes step 3
    indivisible.

    The five RELOAD-CODE tests in loom-serve/test, at step 3, by deletion.

    Nothing else. loom-serve/test's other five files (registry, operations,
    repl, json), loom-mcp/test, and every non-service system are untouched. A
    movement in any of them means a step edited a file this plan does not
    name -- with one exception worth stating: all twenty-three tests that use
    WITH-TEST-SERVER run through step 2's new STOP-SERVER, so a hang or a
    slowdown in any of the three service suites at step 2 is this plan's
    business even though no assertion in them changes.

  STEPS

  1. loom-serve: SERVE-FOREVER stops re-indexing what its caller already
     watched. Closes BUG-0007.
     First, and this is the step that can be run first, because DES-0008 R6
     asks for it ahead of the rest and because after step 3 every false
     "stale" costs a full restart instead of a reload.
     src/serve/server.lisp, SERVE-FOREVER (346-394): the `(dolist (path
     paths) ...)` watch loop at 371-377 is wrapped in `(unless
     already-started ...)`, and an `(when already-started (dolist
     (repository (all-repositories)) (log-event "watch" "~a"
     (repository-root repository))))` takes its place for the log line, so
     HEADLESS's own log still records which roots are watched. ALREADY-STARTED's
     docstring paragraph (360-368) is extended by one sentence: the keyword
     now means the caller has already watched PATHS *and* started the
     listener, which is what loom-serve.lisp's HEADLESS branch has always
     done, and re-watching after START-SERVER has recorded :started-at is what
     made a fresh process report its own code stale.
     Why here and not in loom-serve.lisp. The alternative fix -- pass `'()`
     for PATHS at loom-serve.lisp:122-123 -- is one character shorter and
     cannot be tested by anything: the script is not an ASDF component and
     PLAN-0005 and PLAN-0006 both recorded its contents as untestable. Putting
     the condition in SERVE-FOREVER puts it where a FiveAM test can reach it.
     Deferred, named rather than absent: loom-serve.lisp's `paths` still
     carries this tree's root twice (the script prepends *here* and
     tools/loom-serve.sh's `start` also passes `$root`), so startup performs
     two full indexes rather than one. Both happen strictly before
     START-SERVER records :started-at, so this costs startup time and nothing
     else. Not fixed here; deduplicating a list of paths that have not been
     normalized yet is its own small correctness question and this plan does
     not need the answer.
     Verification, both halves:
       a. FiveAM, in src/serve/test/server.lisp's `server` suite, appended
          after STARTING-TWICE-IS-REFUSED-RATHER-THAN-LEAKED:
          `serve-forever-does-not-reindex-what-the-caller-already-watched`.
          WITH-OPERATIONS-FIXTURE binds a small temporary repository; record
          `before` as its REPOSITORY-INDEXED-AT; spin until GET-UNIVERSAL-TIME
          exceeds `before` (the same whole-second discipline
          A-WRITE-ROUTE-CHANGES-WHAT-STATUS-REPORTS already uses, and the
          reason this assertion means anything: without the tick, a re-index
          inside the same second writes an equal value and the test passes
          either way); SETF `loom-serve::*stopping*` to NIL; run
          `(serve-forever (list (namestring (repository-root repository)))
          :already-started t)` in a BT thread; sleep ~1s; SETF
          `loom-serve::*stopping*` to T; BT:JOIN-THREAD; assert
          REPOSITORY-INDEXED-AT is still EQL to `before`. It fails today,
          because the watch loop reindexes and INDEX-REPOSITORY writes a
          strictly later timestamp. *STOPPING* by SETF and not LET, for
          WITH-SAVED-HANDLERS' own documented reason: the thread that reads it
          is not this one.
          No port is bound anywhere in this test -- ALREADY-STARTED skips
          START-SERVER -- so it cannot collide with a developer's own service
          or with another test's acceptor.
       b. Manual, with a before and an after, because the symptom is
          probabilistic (measurement (1)). Before editing: `tools/loom-serve.sh
          stop`, then three times over, `start` immediately followed by
          `status`; record how many of the three say "code stale". After
          editing: the same three, and all three must say "code current".
          Record both counts in this plan's OUTCOME. If the before-count is 0
          the symptom did not reproduce on that machine that day and the
          after-count proves nothing -- say so rather than claiming a fix.
     Documents: docs/bugs/BUG-0007.yaml status open -> closed, its CAUSE
     rewritten to the measured mechanism, its WHY IT HID naming that the
     original diagnosis pointed at POLL-ONCE because :indexed-at is the slot
     POLL-ONCE writes in the steady state, and its `affects:` corrected from
     [poll-once, repository-indexed-at, repository-status, index-repository]
     to [serve-forever, watch-repository, index-repository,
     repository-indexed-at] -- every name in both lists resolves today, so
     `check` stays at 0 unresolved across this edit.
     DES-0008 status draft -> accepted here: a design whose first step lands
     is settled.
     Suite after this step: serve 151 -> 152 (one new test, one assertion),
     everything else exactly at BASELINE.

  2. loom-serve: STOP-SERVER drains, bounded. DES-0008 R3.
     Before step 3 and not after, because R2 makes a restart the only way to
     bring code up to date and a restart that drops in-flight work is a worse
     answer than the reload it replaces.
     src/serve/server.lisp, beside STOP-SERVER:
       `(defparameter *stop-drain-timeout* 5 "...")`. Internal, not exported,
       matching *RELOAD-LOCK*'s own precedent. Five seconds and not ten, for a
       reason worth putting in the docstring: SERVE-FOREVER stops every
       monitor before it calls STOP-SERVER and *MONITOR-STOP-TIMEOUT* is 10s,
       while tools/loom-serve.sh's `stop` gives up on the pidfile after ~20s
       -- so the two bounds have to sum to less than that with margin, and
       15 + margin does while 20 does not.
       `(defun drain-and-stop (acceptor &optional (timeout *stop-drain-timeout*))
       "...")`. Spawn one BT thread whose whole body is `(ignore-errors
       (hunchentoot:stop acceptor :soft t))` -- IGNORE-ERRORS inside the
       thread and not around the spawn, because the condition this guards
       against is raised in that thread, possibly long after this function has
       returned (see RISKS). Then poll `(bt:thread-alive-p thread)` every 0.05s
       against a deadline computed from GET-INTERNAL-REAL-TIME. If the thread
       finished, it performed the whole stop and there is nothing left to do.
       If the deadline elapsed first, call `(ignore-errors (hunchentoot:stop
       acceptor))` from this thread -- the unconditional stop today's code
       already performs -- and leave the drain thread parked.
       The docstring carries measurement (2): Hunchentoot's `:soft t` takes no
       timeout and waits on a bare condition variable once rather than in a
       loop, so the bound cannot live inside the primitive and a second
       overlapping request may still be running when the wait returns. Both
       are properties of acceptor.lisp:319-336, cited by line, so the next
       reader does not have to re-derive them from a library.
       STOP-SERVER (132-138) changes exactly one form: `(ignore-errors
       (hunchentoot:stop *server*))` becomes `(drain-and-stop *server*)`. The
       *SERVER*/*SERVER-STARTED-AT* clearing and the SERVER-STATUS return are
       untouched.
     Verification: two tests in src/serve/test/server.lisp's `server` suite,
     each with a stated failure mode, since they fail against different wrong
     implementations:
       a. `stop-server-waits-for-an-in-flight-request-before-it-returns`.
          WITH-SAVED-HANDLERS; `*handlers*` cleared; REGISTER-HANDLER on
          "/slow" with a function that SETFs a `started` flag, sleeps ~1.5s,
          SETFs a `finished` flag, and returns a JSON body. START-SERVER on
          *TEST-PORT*; fire HTTP-CALL "/slow" in a BT thread; poll until
          `started` is true (never sleep a fixed amount to "make sure it
          started" -- that is a race written down); then call `(stop-server)`
          from the test thread and, the instant it returns, assert `finished`
          is already true. Assert also that the request thread's own body is
          the JSON the handler returned.
          It fails today: today's STOP-SERVER returns immediately with
          `finished` still NIL. Measurement (3) is why the assertion is on the
          ordering rather than on the response arriving -- a hard stop does
          not kill the worker, so the response arrives either way and an
          assertion about it alone would pass unchanged against the code this
          step replaces.
          Two flags and not one: `started` is what makes the stop actually
          concurrent with the request, and without it the test can call
          STOP-SERVER before the worker has incremented the counter, in which
          case there is nothing to drain and the test passes vacuously.
       b. `a-drain-that-cannot-finish-is-bounded-rather-than-forever`.
          The same fixture with the handler sleeping ~10s, and
          `loom-serve::*stop-drain-timeout*` LET-bound to 0.5. LET and not
          SETF here, and the difference from (a)'s flags is worth stating: the
          timeout is read by DRAIN-AND-STOP on the thread that calls
          STOP-SERVER, which is this one, so an ordinary binding is visible
          where it needs to be. Record GET-INTERNAL-REAL-TIME, call
          `(stop-server)`, assert it returned in well under the handler's own
          sleep -- 3 seconds is a generous bound that still fails an unbounded
          implementation by seven -- and that the returned status has :running
          NIL.
          It does not fail against today's code; it fails against the wrong
          version of this step, the one that calls `:soft t` on the calling
          thread and waits. Stated here rather than left as a CON-0003 hole:
          this test's job is to hold the bound in place, and its failure mode
          if the bound is ever removed is a ~10s hang in the serve suite
          rather than a red assertion.
       Then the whole suite, with attention to the twenty-three tests in
       BLAST RADIUS: `serve`, `rest` and `mcp` must all stay green and none
       may take noticeably longer than BASELINE. A suite that slows by
       ~5 seconds per test is measurement (4) turning out to be wrong.
     Suite after this step: serve 152 -> ~157 (five or so assertions across
