  LEFT FOR THE CODER TO RESOLVE

  One question this plan deliberately does not answer, because answering it
  needs the code in front of you. DRAIN-AND-STOP polls BT:THREAD-ALIVE-P
  against a deadline because BORDEAUX-THREADS' portable JOIN-THREAD takes no
  timeout, while SB-THREAD:JOIN-THREAD does -- `(sb-thread:join-thread thread
  :timeout timeout :default :timed-out)`, which DES-0008's own R3 paragraph
  suggests and which is cleaner if BT:MAKE-THREAD on this image returns a
  native SB-THREAD:THREAD. If it does, use it behind the same `#+sbcl`
  conditional FORCE-LOAD-SYSTEMS used, with the polling loop as the `#-sbcl`
  branch, and say in the docstring which one this image takes. If it does not,
  the polling loop is the whole implementation and this paragraph is the
  record of why. Either way the observable behaviour, and both of step 2's
  tests, are unchanged -- which is what makes this a coder's choice rather
  than a design one.

