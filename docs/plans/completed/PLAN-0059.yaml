     (resolve-dependencies view &key workspace-id dependency-modules) returns
     ops. It reads :MODULE entities, :UNRESOLVED-IMPORTS (cause :EXTERNAL) and
     :IMPORT-MODULES on module-scoped :FILEs, :UNRESOLVED-IMPORTED-CALLS
     (cause :EXTERNAL) on :FUNCTION, :METHOD, :TEST and :CALL-SITE, and its
     own previous edges, which it reads only to sweep them. It writes nothing
     it reads.
       a. Manifests by ecosystem: directory -> the :MODULEs declared there.
          :PROVIDES for each :NPM :MODULE is (its own name). For each :PYPI
          :MODULE it is the :MODULES of the declaration whose :KEY equals
          DISTRIBUTION-NAME-KEY of the module's name, or NIL. A changed value
          is written with UPDATE-PROPERTIES.
       b. NPM-PACKAGE-NAME: the first segment of a specifier, or the first
          two when it begins with `@`. A specifier starting with `node:`
          returns NIL and counts as stdlib (FINDINGS 4).
       c. NEAREST-DECLARING-MODULES (path ecosystem key): walk from the
          importer's directory up to the root. Take the first directory whose
          manifests of that ecosystem declare the key, and return every
          declaring :MODULE in that directory (D4).
       d. :IMPORTS. For a :JAVASCRIPT file, each :EXTERNAL specifier joins by
          NPM-PACKAGE-NAME through c. For a :PYTHON file, each :EXTERNAL
          source S takes the :IMPORT-MODULES entries with :SOURCE S. Each
          entry's module is matched by longest dotted prefix against every
          declaration (FINDINGS 6). A unique winner joins through c. A tie
          marks S :AMBIGUOUS. An entry with :STDLIB T is skipped. One
          ASSERT-EDGE :IMPORTS per (file, :MODULE).
       e. :DEPENDS-ON. Python only. For each caller entry with cause
          :EXTERNAL, the dotted name is the specifier and the :PATH joined
          with `.`. It is matched as in d from the caller's :FILE, with one
          edge per (caller, :MODULE).
       f. :UNDECLARED-IMPORTS, written unconditionally on every module-scoped
          :FILE that has :IMPORT-SOURCES: the :EXTERNAL specifiers that are not
          stdlib, not `node:`, and joined nothing, as plists (:SPECIFIER s)
          with :AMBIGUOUS T where d refused.
       g. The sweep (FINDINGS 2): RETRACT each existing :IMPORTS or
          :DEPENDS-ON edge whose target is a :MODULE and which a-to-e did not
          derive on this pass.
     RESOLVE-AND-CHECK submits it as "resolve-dependencies" after
     resolve-entry-points and before resolve-document-links, and passes
     (repository-dependency-modules repository). Its docstring's sequence is
