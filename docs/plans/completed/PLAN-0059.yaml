id: PLAN-0059
title: DES-0055 Plan A in nine steps -- :MODULE re-keyed as a declared dependency, the manifest analyzer, extract.py's stdlib flag, the dependency-modules key, RESOLVE-DEPENDENCIES, status and describe, init's proposal, acceptance on fixtures and front-end, complete
status: final
date: 2026-10-08
refines: [DES-0055, REQ-0078]
affects: [entity-at-path, documentation-relative-p, parse-frameworks,
          frameworks-problems, resolve-and-check, resolve-imports, import-summary,
          repository-entry-points, tracked-paths, hub-report, kind-types,
          describe-entity, print-status, make-py-file-entity, Extractor.add_import,
          venv-prefixes, template-proposals, plan-preparation, prepare-repository]
tags: [analyzer, python, javascript, dependencies, requirements-txt,
       package-json, ontology, module, frameworks, init, des-0055, req-0078,
       con-0001, con-0003, con-0005, dec-0003]
summary: |
  DES-0055 R1 to R8, which cover REQ-0078 R1 and R10. A requirements*.txt line
  or a package.json dependency becomes a :MODULE entity, one per (manifest,
  name). A new graph pass joins an external import to it: by Node's package-name
  rule for npm, and by a declared dependency-modules: map for Python, never by
  spelling (U1). `status`, `describe` and `find` report the result, and `init`
  proposes the Python map from a venv's RECORD files (U2). When it completes,
  REQ-0078's OUTSTANDING line for R4 is rewritten as met (U5).

  Out of scope: DES-0055 R9 to R12, the call-site shapes and :VIA. Those are
  Plan B, a separate plan, and REQ-0078 R2 stays outstanding until it lands.
  Also out of scope, each with its reason under DEFERRED: dotted-name addressing
  of an in-tree module, pyproject.toml and the other manifest formats, lock
  files, transitive dependencies, function-level :DEPENDS-ON for JavaScript,
  and any write to ~/github/lfia-accounting (U6).
body: |
  BASELINE

  Loom at 698e747 on req-0078-python-completion. `tools/loom.sh 'status |
  check'`, run 2026-10-08 before this file existed, printed the figures below.
  The branch has since moved to 09c5185, which edits REQ-0078 only, and with
  this plan added `status` reads 491 files, 5243 entities, 25263
  relationships and 301 documents, with check still 0, 8 and 7. The suite
  passed 12 of 12 systems under /usr/bin/sbcl at 698e747.

      index        : 490 files, 5242 entities, 25166 relationships
      documents    : 300
      tests        : 1452 tests covering 465 units
      rules        : 0 violations, 2 unenforced
      unresolved   : 8 document references, 7 ambiguous, 5 definer macros
      imports      : 4 resolved, 57 external, 0 out-of-domain, 0 unresolved,
                     0 target unclaimed, 0 unrooted
      unclaimed    : 44 tracked files -- 10 .json, 10 .md, 6 .sh, 5 (none),
                     3 .js, 3 .yaml, 7 other
      call sites   : `sbcl --script tools/test/call-site-census.lisp` prints 508
                     minted against *CALL-SITE-CEILING* 512, 41 ambiguous

  Loom tracks two package.json files, both under tools/js/vendor/, and no
  requirements*.txt. VENDORED-PATH-P refuses the first two, so on Loom this plan
  mints no :MODULE.

  ~/github/front-end at ab34be6 with five uncommitted entries in
  `git status --short` (.loom/frameworks.yaml, layerIntents.js and its new
  test, BUG-0048.yaml, DES-0022.yaml). Its .loom/frameworks.yaml has no
  dependency-modules: key, and the npm join needs none. This plan writes
  nothing there.

  "Green" after a step means: tools/loom-test.sh passes on all twelve systems
  with no skip, under /usr/bin/sbcl, and the commit says so; `check` on Loom
  prints 0 violations, 8 unresolved, 7 ambiguous; call-site-census prints 508
  and 41; for steps 1, 6 and 7, `sbcl --script tools/test/load-test.lisp
  loom-serve` prints T. New tests add :TEST entities to Loom's own index, so
  Loom's entity and relationship totals rise with every step and are not an
  exit condition. Loom's :MODULE count, its `unclaimed` line and its document
  count are.

  Every new test is a plain fiveam `test` with any python3 or node guard
  written inline, as PLAN-0058 FINDINGS 3 did. A js-test or domain-test body
  mints :CALL-SITE entities, and the ceiling has 4 sites of headroom. Every new
  Lisp function name is checked with `find` before it is written. A name that
  another package already defines raises the ambiguous count. init.lisp already
  defines MANIFEST-PATH, MANIFEST-ENTRY and five more manifest-* functions, so
  the analyzer's new functions are named requirement-*, package-json-* and
  dependency-*.

  FINDINGS THAT CHANGE OR SHARPEN WHAT DES-0055 SAYS

  1. IMPORT-SUMMARY would count the new edges as resolved imports.
     It counts every :IMPORTS edge leaving a :FILE as `resolved`. Once
     RESOLVE-DEPENDENCIES draws :FILE-to-:MODULE :IMPORTS edges, front-end's
     `imports: 3728 resolved` would rise by about 592, and every one of those
     imports also stays :EXTERNAL in :UNRESOLVED-IMPORTS. One import would be
     counted twice. Step 5 makes IMPORT-SUMMARY count only edges whose target
     is a :FILE. DES-0055 does not mention this.

  2. A pass that only asserts leaves a stale edge when a nearer manifest
     appears. Say front-end gains web/package.json declaring react. The
     manifest is analyzed and the importer is not. The old edge from the
     importer to the root's react :MODULE survives, because nothing retracts
     it, and the pass adds the new edge beside it. Analyzers never write an
     edge to a :MODULE, so every such edge belongs to RESOLVE-DEPENDENCIES.
     Step 5 retracts, every pass, each :IMPORTS or :DEPENDS-ON edge to a
     :MODULE that this pass did not derive. That is the shape of
     CALL-SITE-RETRACTIONS in RESOLVE-CALLS. It reads its own previous output
     only to remove it, and never derives a fact from it (DEC-0003).

  3. :STDLIB needs somewhere to land in the index. DES-0055 R4 says extract.py
     marks each import, and R3 lists no :FILE property to carry the mark.
     `from S import a` also needs both S and S.a (D6), and :IMPORT-BINDINGS
     holds module-level imports only. lfia's `from google.cloud import
     secretmanager` would then join nothing when it sits inside a function.
     Step 1 declares one more :FILE property, :IMPORT-MODULES: one plist per
     absolute import in any scope, (:SOURCE s :MODULE m :STDLIB bool). Step 3
     makes the Python analyzer write it. A relative import is left out,
     because it is never :EXTERNAL.

  4. DES-0055 contradicts itself on `node:`. D8 says :UNDECLARED-IMPORTS holds
     specifiers that are "not stdlib, not `node:`". ACCEPTANCE says "`node:fs`
     is undeclared". This plan follows D8. A `node:` specifier joins nothing and
     is not in :UNDECLARED-IMPORTS. `status` counts it in the npm line's
     stdlib bucket, which is D5's "a Node builtin by its syntax". A bare `fs`
     with no declaring manifest stays undeclared, as D5 says. Step 9 adds a
     dated correction to DES-0055's ACCEPTANCE.

  5. A dependency would rank as a structure hub. STRUCTURE's
     *DEFINITION-TYPES* includes :MODULE. HUB-REPORT ranks those types by
     inbound edges, so front-end's react :MODULE, with about 149 inbound
     :IMPORTS, would head the hub band. The parameter's docstring defines it
     as "definitions in source", and a declared dependency is not one. Step 1
     removes :MODULE from the list. Nothing mints a :MODULE today, so no
     current count moves. D9 lists the reader surfaces and does not name
     `structure`, so this plan reads D9 as leaving structure unchanged.

  6. The Python longest-prefix match runs over the declarations, not over the
     manifests. D6 says a module "joins the dependency whose declared prefix is
     the longest dotted prefix of it". This plan computes the longest prefix
     over every dependency-modules: entry, which names a distribution. It then
     applies D4 to that distribution: the nearest directory above the importer
     holding a PyPI manifest that lists the distribution. A tie between two
     distributions on the longest prefix joins nothing and counts as
     :AMBIGUOUS. A distribution that is declared and listed in no manifest
     joins nothing, and the import is undeclared. lfia's google-cloud-firestore
     is in that position: firebase-admin installs it and no manifest lists it.

  7. `complete` will refuse DES-0055 while Plan B is a draft. Plan B also
     refines DES-0055, and `complete` refuses to touch a document another
     unfinished plan refines. Step 9 says what to do in that case.

  FILES

  New:
    src/analyzer/manifest-analyzer.lisp        step 2
    src/analyzer/test/manifest-analyzer.lisp   step 2
    tools/py/record_modules.py                 step 7. Loaded at runtime by
                                               init, as extract.py is by the
                                               analyzer.

  Changed:
    src/ontology/code-ontology.lisp      step 1: :MODULE re-keyed and
                                         re-documented, its D2 properties; the
                                         :FILE properties :INCLUDES,
                                         :UNNAMED-REQUIREMENTS,
                                         :UNDECLARED-IMPORTS, :IMPORT-MODULES;
                                         :DEPENDS-ON's :FROM gains :TEST and
                                         :CALL-SITE
    src/ontology/test/code-ontology.lisp step 1
    src/workspace/federate.lisp          step 1: ENTITY-AT-PATH drops its
                                         :MODULE branch
    src/workspace/test/federate.lisp     step 1
    src/knowledge/structure.lisp         step 1: *DEFINITION-TYPES* loses
                                         :MODULE (FINDINGS 5)
    src/knowledge/test/structure.lisp    step 1
    src/analyzer/analyzer.lisp           step 2: REQUIREMENTS-FILE-P, shared by
                                         the markdown analyzer and the manifest
                                         analyzer
    src/analyzer/markdown-analyzer.lisp  step 2: its ANALYZER-HANDLES-P method
                                         declines requirements*.txt
    src/analyzer/test/markdown-analyzer.lisp  step 2
    src/analyzer/loom-analyzer.asd       step 2: the two new components. No
                                         :depends-on change.
    src/analyzer/package.lisp            step 2, if anything is exported
    tools/py/extract.py                  step 3: `stdlib` on each import entry
    src/analyzer/python-analyzer.lisp    step 3: MAKE-PY-FILE-ENTITY writes
                                         :IMPORT-MODULES
    src/analyzer/test/python-extract.lisp,
    src/analyzer/test/python-analyzer.lisp    step 3
    src/utils/parsing.lisp, src/utils/package.lisp,
    src/utils/test/suite.lisp            step 4: DISTRIBUTION-NAME-KEY, PEP
                                         503 normalisation
    src/analyzer/frameworks.lisp         step 4: PARSE-FRAMEWORKS reads
                                         dependency-modules:,
                                         FRAMEWORKS-PROBLEMS counts it
    src/analyzer/test/frameworks.lisp    step 4
    src/workspace/workspace.lisp         step 4: REPOSITORY-DEPENDENCY-MODULES.
                                         Step 5: RESOLVE-AND-CHECK runs the new
                                         pass, and IMPORT-SUMMARY counts only
                                         :FILE targets. Step 6: a :DEPENDENCIES
                                         plist in REPOSITORY-STATUS.
    src/graph/resolve.lisp               step 5: RESOLVE-DEPENDENCIES and its
                                         helpers
    src/graph/package.lisp               step 5: export RESOLVE-DEPENDENCIES
    src/graph/test/resolve.lisp          step 5
    src/workspace/test/workspace.lisp    steps 5, 6 and 8
    src/knowledge/services.lisp          step 6: DESCRIBE-ENTITY lifts a
                                         :DEPENDENCY plist
    src/knowledge/test/services.lisp     step 6
    src/process/console.lisp             step 6: PRINT-STATUS and `describe`.
                                         Step 7: `init` prints the proposal.
    src/process/test/console.lisp        steps 6 and 7
    src/serve/json.lisp                  steps 6 and 7, only if an empty list
                                         must encode as [] (see the tests)
    src/serve/test/operations.lisp, src/rest/test/routes.lisp   steps 6 and 7
    src/workspace/init.lisp              step 7: DEPENDENCY-MODULE-PROPOSAL,
                                         carried on PREPARE-REPOSITORY's report
    src/workspace/test/init.lisp         step 7
    docs/design/DES-0055.yaml            step 9: OUTSTANDING, FINDINGS 4's
                                         correction
    docs/requirements/REQ-0078.yaml      step 9: OUTSTANDING (U5)

  Not changed, and a change to any one is a finding to report:
  tools/js/extract.js, src/analyzer/js-analyzer.lisp, src/analyzer/
  lisp-analyzer.lisp, RESOLVE-CALLS, ASSERT-EDGE (Plan B changes it), every
  .asd's :depends-on, src/rest/ and src/mcp/ source, and every docs/rules/
  file. Deleted: none.

  BLAST RADIUS

  What Loom reports, from `impact <name> 3` at 698e747:

    entity-at-path           14 (truncated): FEDERATED-MENTIONS-OPS,
                             UNRESOLVED-PATH-REFERENCES, FEDERATE-REPOSITORIES,
                             the console's unresolved-path-references call site,
                             and six federate tests. Decisions: DES-0055.
    documentation-relative-p 25 (truncated): the markdown analyzer's claim, then
                             FIND-ANALYZER and ANALYZABLE-P, so every path every
                             pass hands to an analyzer. 21 tests. Decisions:
                             DES-0047, DES-0018, DES-0029, DES-0051, DES-0011,
                             DES-0053, DES-0055, DES-0023.
    parse-frameworks         44 (truncated): READ-FRAMEWORKS, then every
                             repository load and status. 70 tests. 17 decisions,
                             DES-0047, DES-0054 and DES-0055 among them.
    resolve-and-check        42 (truncated) at depth 2: every indexing path,
                             watch, poll, reindex, and enrich. 66 tests.
    import-summary           41 (truncated): REPOSITORY-STATUS and its console
                             and serve call sites. 15 tests, among them
                             THE-IMPORT-SUMMARY-COUNTS-AN-UNROOTED-PYTHON-IMPORT.
    assert-edge              155 (truncated). This plan calls it and does not
                             change it.

  None of the attached decisions is contradicted. DES-0047 records that a
  changed .loom/frameworks.yaml takes effect on the next reindex, and step 4
  inherits that cost for dependency-modules:. DES-0054 D7 says the index may
  hold a name and not a value. Step 2's SENTINEL test enforces it for URLs and
  credentials in manifests. DES-0053 D11 says a venv is never indexed. Step 7
  reads a venv's RECORD files for a proposal only, and nothing it reads reaches
  the index.

  What Loom cannot see, and why:

    - The child-process boundary. extract.py's impact ends at the child's
      reply. No index edge links `stdlib` in the reply to the JGET in
      MAKE-PY-FILE-ENTITY that reads it. Step 3's reply-level and entity-level
      tests are the only link. record_modules.py and init.lisp are joined in
      the same way, and step 7's test is that link.
    - The registry and console boundary. Steps 6 and 7 edit console.lisp and
      the status and init plists that the serve operations encode. No rule
      covers loom-serve, loom-rest, loom-mcp or loom-process. load-test is the
      instrument.
    - Every reader of a :FILE's properties outside Loom. A REST `describe` of a
      Python file returns :IMPORT-MODULES and :UNDECLARED-IMPORTS after steps 3
      and 5.
    - Readers of `name` across entity types. LINKABLE-INDEX, MARKDOWN-MENTIONS
      and `describe`'s resolution all key on an entity's name. A :MODULE named
      `react` or `requests` becomes a target for a document's affects: and for
      a backticked word in prose. On a foreign tree a function of the same
      name makes the reference ambiguous. Step 8 measures the ambiguous count
      on front-end.
    - Rule checks. A :MODULE carries no :SYSTEM, and EDGES-BETWEEN-SYSTEMS
      skips an edge whose target has none. So no layering rule on any tree
      sees the new edges. Step 2 asserts that the analyzer writes no :SYSTEM.

  RISKS

  1. A credential in a manifest reaches the index. A pip line or an npm spec
     can be `https://user:token@host/...`. Step 2's test feeds both forms with
     the string SENTINEL and walks every property of every op the analyzer
     returns. As a positive control, the same walk finds SENTINEL when it is
     placed in a requirement name. That proves the walk can see what it is
     looking for.

  2. requirements*.txt leaves the markdown analyzer and becomes a :FILE. A
     markdown link to it resolved to a :DOCUMENT and now resolves to the :FILE.
     ENTITY-AT-PATH looks at :FILE first, so the link still resolves, and
     step 2 tests that. The `documents` count drops by the number of tracked
     requirements*.txt files: 0 on Loom and front-end, 2 on lfia.

  3. FIND-ANALYZER's order. The manifest analyzer is registered last, so it
     wins every path it claims. The markdown analyzer declines
     requirements*.txt explicitly as well, so the outcome does not depend on
     load order. A test asserts that each analyzer, asked directly, claims or
     declines the path.

  4. Double-counted imports (FINDINGS 1) and stale edges (FINDINGS 2). Step
     5's tests cover both. AN-INCREMENTAL-UPDATE-MATCHES-A-FULL-REBUILD is the
     model: add a nearer manifest, poll once, and compare the edges with a
     fresh index of the same tree.

  5. Tests that change because the behaviour they pin changes:
       src/workspace/test/domains.lisp
         THE-IMPORT-SUMMARY-COUNTS-AN-UNROOTED-PYTHON-IMPORT, if its fixture
         has a manifest. It is expected to pass unchanged, because step 5
         counts only :FILE targets.
       src/workspace/test/workspace.lisp
         WRITE-JS-FUNCTIONS-TREE writes functions/package.json with no
         dependencies. After step 2 that file is a claimed :FILE with no
         :MODULE. Any assertion on that fixture's unclaimed count moves by
         one. None is known; if one fails, the step stops and NOTES records
         it before the test is edited.
     No other existing test is expected to change.

  6. Name collisions raise ambiguous or unresolved counts on Loom. Each new
     function is checked with `find` first (BASELINE). The ambiguous count of
     call-site-census is the instrument. It must stay at 41.

  7. python3's stdlib list depends on the interpreter. sys.stdlib_module_names
     exists from 3.10. On an older python3 the child marks nothing as stdlib,
     and every stdlib import then counts as undeclared. Step 3 makes the child
     omit `stdlib` when the attribute is absent, and the analyzer then writes
     :STDLIB NIL. Step 6's status line prints `stdlib unknown` for an
     ecosystem whose files carry no mark. Without that, the line would show
     zero stdlib imports, which a reader would take as measured. This machine
     runs 3.10 or later; step 3 records the version.

  8. init runs a Python child against a directory Loom does not own. Step 7
     runs Loom's own python3 with -I -B, never the venv's interpreter, and
     passes site-packages as a path argument rather than putting it on
     sys.path. importlib.metadata reads RECORD as text, so no .pth file is
     processed. The test builds a .pth file that writes a marker if it is
     executed and asserts that the marker is absent.

  9. Plan B lands first or in parallel. Plan B adds :VIA to :CALLS edges and
     changes RESOLVE-CALLS and ASSERT-EDGE. This plan touches neither, and its
     only shared file is src/graph/resolve.lisp, in a different function. If
     Plan B merges first, step 5 rebases on it, and its tests must pass
     unchanged.

  10. The peer property. Steps 6 and 7 edit console.lisp and plists that serve
      encodes. load-test must print T.

  DEFERRED, WITH REASONS

  Each of these is a decision. DES-0055 DEFERRED already lists them all except
  the last two, which step 9 adds.

  - Addressing an in-tree module by its dotted name (D1). lfia's documents
    hold 4 dotted tokens, and all 4 name functions.
  - pyproject.toml, setup.cfg, setup.py, Pipfile, poetry.lock. Loom has no TOML
    reader, and neither lfia nor front-end uses one.
  - Lock files. A lock file states what is installed, which is the venv's
    question in another form.
  - Transitive dependencies. lfia's 73 imports of google.cloud.firestore and
    google.api_core are reported as undeclared, which is true of its
    manifests.
  - Function-level :DEPENDS-ON for JavaScript. extract.js records no
    import-bound calls (DES-0053 CONSEQUENCES).
  - Reacting to a .loom/frameworks.yaml edit without a reindex. DES-0047
    already accepts this cost for the file, and dependency-modules: inherits
    it.
  - Joining a `node:` specifier to anything (FINDINGS 4). Loom ships no list
    of Node's builtins, so a bare `fs` stays undeclared.

  STEPS

  Each step is one commit on req-0078-python-completion, made by the caller.
  Step 1 is the first that can be run. Every step ends green.

  1. THE ONTOLOGY: :MODULE AS A DECLARED DEPENDENCY (R1, R3).
     src/ontology/code-ontology.lisp, src/ontology/test/code-ontology.lisp,
     src/workspace/federate.lisp, src/workspace/test/federate.lisp,
     src/knowledge/structure.lisp, src/knowledge/test/structure.lisp.

     :MODULE: natural key (:file :qualified-name). The documentation is
     rewritten as D2 states: a dependency a manifest declares, never a file in
     the tree. Properties: :QUALIFIED-NAME (required), :FILE (required),
     :ECOSYSTEM keyword :one-of (:pypi :npm), :SPECS list, :SECTIONS list,
     :START-LINE integer, :PROVIDES list, :DOCUMENTATION kept. :LANGUAGE is
     kept, because EVERY-LANGUAGE-PROPERTY-SHARES-ONE-VOCABULARY requires it;
     nothing writes it.
     :FILE gains :INCLUDES list, :UNNAMED-REQUIREMENTS integer,
     :UNDECLARED-IMPORTS list and :IMPORT-MODULES list (FINDINGS 3). Each
     docstring names DES-0055 and the writer.
     :DEPENDS-ON :FROM gains :TEST and :CALL-SITE.
     ENTITY-AT-PATH drops its third clause, the :MODULE lookup by :FILE.
     STRUCTURE's *DEFINITION-TYPES* drops :MODULE, and its docstring says why
     (FINDINGS 5).

     Verification, new tests:
       - Two :MODULE entities with :QUALIFIED-NAME "react" and :FILE
         "package.json" and "functions/package.json" have different ids.
         Fails without the re-key, since both derive module:react.
       - VALIDATE-RELATIONSHIP-ENDPOINTS accepts :DEPENDS-ON from :TEST and
         from :CALL-SITE to :MODULE. Fails without the widening.
       - A graph holding only a :MODULE whose :FILE is "requirements.txt":
         ENTITY-AT-PATH on "requirements.txt" returns NIL. Fails while the
         :MODULE clause is there.
       - HUB-REPORT over a graph where a :MODULE has three inbound :IMPORTS and
         a function has one inbound :CALLS lists the function and not the
         module. Fails while :MODULE is in *DEFINITION-TYPES*.
     CON-0003: revert each change on its own and see its one test fail.
     Exit: green. Loom's `status`: 490 files plus any new test file, 0
     :MODULE (`find "" module` answers nothing of type module), unclaimed 44,
     documents 301 (this plan included).

  2. THE MANIFEST ANALYZER (R2).
     src/analyzer/analyzer.lisp, src/analyzer/manifest-analyzer.lisp (new),
     src/analyzer/markdown-analyzer.lisp, src/analyzer/loom-analyzer.asd,
     src/analyzer/test/manifest-analyzer.lisp (new),
     src/analyzer/test/markdown-analyzer.lisp.

     analyzer.lisp: REQUIREMENTS-FILE-P, true for a file name that begins
     "requirements" and has type txt (requirements.txt, requirements-dev.txt,
     requirements_test.txt), compared case-sensitively.
     markdown-analyzer.lisp: its ANALYZER-HANDLES-P method adds
     (not (requirements-file-p path)), and the docstring says why.
     manifest-analyzer.lisp, after firebase-analyzer in the .asd, modelled on
     firebase-analyzer.lisp: class MANIFEST-ANALYZER with :language nil and
     :file-types (). ANALYZER-HANDLES-P claims REQUIREMENTS-FILE-P or the name
     package.json, and refuses a path that satisfies VENDORED-PATH-P or
     PYTHON-EXCLUDED-PATH-P. ANALYZE-FILE returns RETRACT-FILE, the :FILE, and
     for each dependency a :MODULE and a :CONTAINS edge from the :FILE.
       requirements*.txt, read by REQUIREMENT-LINE-ENTRY. Blank and `#` lines
       are skipped, and a trailing ` #` comment is cut. `-r X` and `-c X` add
       "-r X" or "-c X" to :INCLUDES. Every other line starting with `-` is
       dropped and nothing of it is stored. A line with `://` or starting with
       `.` or `/` is a URL or path requirement. It yields its `#egg=` name and
       the spec kind :url, or adds 1 to :UNNAMED-REQUIREMENTS. Otherwise the
       name is the leading run of letters, digits, `-`, `_` and `.`, and the
       spec is the rest of the line, trimmed, with extras and marker kept as
       written. :ECOSYSTEM :PYPI, :START-LINE the line number.
       package.json, read by PACKAGE-JSON-DEPENDENCIES through
       PARSE-JSON-TEXT. The keys of dependencies, devDependencies,
       peerDependencies and optionalDependencies become :SECTIONS
       :DEPENDENCIES, :DEV-DEPENDENCIES, :PEER-DEPENDENCIES and
       :OPTIONAL-DEPENDENCIES. A spec is classified by DEPENDENCY-SPEC-KIND:
       a value with `://`, `git+`, `github:` or a `user/repo` form is :git or
       :url, `file:` or `link:` is :path, `npm:` is :alias, and anything else
       is stored as written. :START-LINE is the first line whose text holds
       the quoted key followed by `:`, or absent when no line does. An
       unparsable file is a :FILE with :ANALYSIS-FAILED-P and :ANALYSIS-ERROR,
       as MAKE-FIREBASE-FILE-ENTITY does.
       One :MODULE per name per file (CON-0005). A repeated name appends to
       :SPECS and :SECTIONS. No :SYSTEM, :DOMAIN or :LANGUAGE is written.

     Verification, new tests in manifest-analyzer.lisp:
       - The claim: requirements.txt, requirements-dev.txt,
         sub/requirements_test.txt, package.json and functions/package.json are
         claimed. requirements.md, my-requirements.txt, package.json.bak,
         tools/js/vendor/acorn/package.json and venv/lib/x/package.json are
         not. The markdown analyzer's ANALYZER-HANDLES-P declines
         requirements.txt and still claims design.txt. FIND-ANALYZER returns
         the manifest analyzer for requirements.txt.
       - DES-0055's fixture requirements.txt (google-auth>=2.29,
         requests>=2.31, firebase-functions>=0.4.0, tzdata) gives 4 :MODULE,
         ids module:requirements.txt:<name>, :SPECS (">=2.29") and so on,
