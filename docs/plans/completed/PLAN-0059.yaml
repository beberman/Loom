  A departure, found by tools/test/call-site-census.lisp. The plan expects 508
  sites and 41 ambiguous. HEAD at 50c9f95 printed 513 and 44. The census was
  bisected with each commit's own tools/test/ against its own tree (a bare run
  censuses the live tree with whatever code the script loaded): 508 and 41 at
  dc2922e, 8975f1d, 5928e4d and b5d8d8f, then 510 at 7005912 (step 5), 512 at
  81558db (step 6) and 513 at 50c9f95 (step 7). Two causes:
    - Three tests from steps 5 and 6 call PYTHON-AVAILABLE-P from a test body.
      Loom cannot place that name, so each call is an ambiguous :CALL-SITE.
      PYTHON-CHILD-STARTABLE-P exists for exactly this, and its docstring says
      so. Commit a6e699c changes those three calls. The five new tests of this
      step use it from the start. The census is 510 and 41 with this step.
    - Two orphaned define-command pairs: print-dependency in describe (step 6)
      and print-dependency-proposal in init (step 7). Each is a call in a
      define-command body, which DES-0014 mints a site for. They remain: 510 is
      508 plus these two, and the ceiling of 512 holds. Removing them is a source
      change to steps 6 and 7 that this step does not make.
  With the five new tests calling PYTHON-AVAILABLE-P directly, the ceiling test
  a-call-site-exists-only-where-a-calls-edge-from-a-definition-is-impossible
  failed at 514 against 512, which is how the cause was found.

