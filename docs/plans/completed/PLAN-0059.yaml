  The fixtures. Three tests in src/workspace/test/workspace.lisp:
  the-declared-fixture-joins-what-a-declaration-maps-and-nothing-else (17
  checks), the-fixture-without-a-declaration-joins-no-python-import (7) and
  find-reaches-a-declared-dependency-as-code-and-not-as-documentation (2). They
  passed at their first run, because steps 1 to 7 had built what they assert.
  Each was then run against a mutation of the source, copied aside and restored:
    - RESOLVE-DEPENDENCIES returns NIL before drawing: 7 of 17 fail in the first
      test, 1 of 7 in the second, none in the third.
    - the (plusp length) guard in LONGEST-PREFIX-DECLARATIONS removed, which is
      step 5's zero-length bug: 2 of 17 fail, the two that read
      :UNDECLARED-IMPORTS. With every declaration tied at length 0, the entries
      for google.cloud and firebase_functions no longer equal the bare
      (:specifier ...) plists; the cause is inferred from the assertions and
      the entries were not printed.
    - a spelling join in PYPI-JOINS (an import with no declaration joined to the
      requirement whose normalised name equals it): 3 of 17 fail and 4 of 7 fail.
      firebase_functions joins firebase-functions, requests and pytest join.
    - :MODULE added to *DOCUMENT-TYPES*: both checks of the third test fail.
    - the markdown analyzer's requirements-file-p exclusion replaced by T: no
      failure. The manifest analyzer is registered later and FIND-ANALYZER
      returns the latest claimant, so the exclusion is redundant at the current
      load order, and these tests cannot see it. src/analyzer/test/
      manifest-analyzer.lisp's the-markdown-analyzer-declines-requirements-and-
      keeps-other-text covers the exclusion itself.
  The second fixture passes with or without the pass, as the plan says; one of
