id: PLAN-0006
title: Sequence the self-watch fix, RELOAD-CODE, and tools/loom-serve.sh
status: final
date: 2026-08-03
refines: [DES-0007]
affects: [poll-once, repository-indexed-at, start-server, stop-server,
          server-status, serve-forever, function:src/process/console.lisp:main, register-operation,
          define-operation, all-repositories, watch-repository]
tags: [process, service, mcp, lifecycle, workspace, prototype, plan]
summary: |
  Six steps that land DES-0007's R1-R5 in dependency order: the POLL-ONCE
  fix first (landed already -- see STEP 1), because R1's comparison is
  dishonest without it and every later step's manual verification depends on
  `status` telling the truth; then RELOAD-CODE, with a rebindable seam so its
  failure path and its :reloaded-at answer are FiveAM assertions rather than
  a hope; then loom-serve.lisp's own three additions wired together, which
  cannot be FiveAM-tested and are verified by running the script, twice, on
  purpose; then tools/loom-serve.sh; then the permission and SessionStart
  wiring; then the documents this makes false. Every code step compiles,
  leaves the nine-system suite green, and names a verification that fails
  without it; the two script steps name a manual procedure instead, because a
  launcher and a SIGTERM handler are not FiveAM's business.

  Revised from this plan's own first draft, which sequenced a PORT-IN-USE
  condition into src/serve/server.lisp as its own step 2. DES-0007 no longer
  mints one: traced rather than assumed, start-server already signals
  usocket:address-in-use-error unedited, and loom-serve.lisp catching that
  condition directly around its own two lifecycle calls is simpler than a
  wrapper condition neither loom-rest nor loom-mcp ever needs to see. That
  step is removed here rather than left stale beside a design that moved on
  without it; the renumbering below is a consequence of that removal, not an
  independent decision.

  One refinement beyond DES-0007's own text, decided here because a coder
  needs it and the architecture document does not commit to an implementation
  detail at this depth: RELOAD-CODE's actual reload call sits behind a
  rebindable special, *RELOAD-FUNCTION*, so its own test suite never asks a
  FiveAM run to force-reload the nine systems it is itself running inside of.
  *STATIC-GRANTS* (src/serve/capability.lisp:23-31) is the precedent and its
  own comment states the reason this plan reuses: "a test cannot exercise
  [the refusal path] by binding a special... A variable a test can SETF and
  restore is what makes an assertion out of a hope."

  Out of scope and deliberately so: any auth model beyond DES-0007's own
  unchanged RESOLVE-CALLER-GRANTS (REQ-0010 point 4 forbids reopening it); a
  config file remembering repositories other than the Loom root across a
  restart (DES-0006 deferred it, DES-0007 does not revisit it); a
  classification of which source changes are safe to reload versus which need
  a restart (DES-0007's own ALTERNATIVES CONSIDERED rejects building one);
  a non-Linux identity check for a pidfile's own pid (DES-0007's own
  CONSEQUENCES names this as a residual gap rather than something this plan
  closes); and any edit to console.lisp, loom.lisp, loom-process.asd or
  src/process/package.lisp, which DES-0006 R5 protects and DES-0007 does
  not touch.
body: |
  BASELINE

  Measured today, 2026-08-03, branch server, /usr/bin/sbcl, via
  `tools/loom.sh 'status | check'` and `tools/loom-test.sh`, after step 1 had
  already landed in the working tree (STEP 1 records how this was found):

    index      : 124 files, 1257 entities, 5607 relationships
    documents  : 43
    tests      : 335 tests covering 232 units
    watcher    : watching
    rules      : 0 violations, 2 unenforced
    unresolved : 0 document references, 1 definer macro

    suite                     9 of 9 systems passed
    ontology  301     analyzer  139     graph  206
    workspace  54     knowledge  77     process  92
    serve    117      rest       79     mcp     23

  The two unenforced rules are RULE-0004 and RULE-0005; the one definer macro
  is DEFENTITY. All are the standing state prior plans left and are not this
  plan's business. `loom-workspace/test` already carries step 1's own +3
  (51 -> 54); it and `loom-serve/test` (117, growing at step 2) are the only
  two numbers expected to move from here. A movement anywhere else is
  unexplained and worth stopping for -- DES-0007 touches nothing under
  src/graph, src/analyzer, src/ontology, src/knowledge, src/rest, src/mcp or
  src/process.

  FILES

  src/workspace/workspace.lisp, src/workspace/test/workspace.lisp
      Step 1. Already landed -- see STEP 1.

  src/serve/server.lisp
      Step 2. *RELOAD-FUNCTION*, *RELOAD-SYSTEMS*, *RELOAD-LOCK*, and the
      RELOAD-CODE operation, added beside SERVER-STATUS and STOP-SERVER.
      SERVE-FOREVER gains one additive keyword, `&key already-started`,
      defaulting to NIL, skipping its own START-SERVER call when true --
      DES-0007's own resolution of the conflict its fifth PROBLEM finding
      traces (SERVE-FOREVER's unconditional internal START-SERVER call would
      otherwise fail against START-SERVER's own re-entrant guard the moment
      loom-serve.lisp has already started one itself, per step 3). START-
      SERVER, STOP-SERVER and SERVER-STATUS are unedited.

  src/serve/package.lisp
      Step 2. Two new exports: *RELOAD-FUNCTION*, *RELOAD-SYSTEMS*
      (*RELOAD-LOCK* stays internal, matching WITH-REPOSITORY-LOCK's own
      unexported precedent).

  src/serve/test/server.lisp
      Step 2. Four new tests, appended after the existing lifecycle section.

  loom-serve.lisp
      Step 3. Unconditional self-watch of the script's own root, prepended
      to whatever paths were given, in both modes. Both modes wrap their own
      lifecycle call (START-SERVER directly in INTERACTIVE-WITH-SERVICE,
      SERVE-FOREVER in HEADLESS) in a HANDLER-CASE naming
      USOCKET:ADDRESS-IN-USE-ERROR directly -- no new condition type.
      HEADLESS, after its own call succeeds: computes
      /tmp/loom-serve-<sanitized-root>.pid (the sanitizing rule is stated
      once, precisely, under STEP 3, so this file and tools/loom-serve.sh
      agree on it without either passing the other an argument) and writes
      its pid there; an UNWIND-PROTECT around the SERVE-FOREVER call deletes
      it on a clean stop or an ordinary caught error. Never written
      speculatively -- DES-0007's own fifth PROBLEM finding is why.

  tools/loom-serve.sh
      Step 4. New. `status`, `start`, `stop`, `restart`, `reload`, `update`.
      Computes the same /tmp paths loom-serve.lisp computes for its pidfile,
      plus a matching .log and .reloaded-at, all under /tmp and named from
      the watched root. Owns the shared pidfile liveness-and-identity check
      every mutating and status-reading verb routes through.

  tools/allow-loom.py
      Step 5. DRIVER's regex gains `loom-serve` alongside `loom|loom-test|
      next-doc-id`.

  tools/test-allow-loom.py
      Step 5. ALLOW gains the same shapes the other three scripts already
      have (bare, `./`-relative, absolute, with `-v` and quoted arguments);
      no FALL_THROUGH case changes, since the regex addition does not touch
      what the pattern refuses.

  .claude/settings.json
      Step 5. Three `allow` entries for tools/loom-serve.sh, matching the
      three each of the other three scripts already carry. One new
      `SessionStart` hook entry calling `tools/loom-serve.sh update`.

  .claude/agents/tools.md, .claude/skills/loom/SKILL.md
      Step 6. R5's documentation obligation: the six verbs, the SessionStart
      hook and why it is the chosen trigger (DES-0007's WHY A SESSIONSTART
      HOOK), and the one manual fallback the hook cannot cover.

  docs/design/DES-0007.yaml, docs/requirements/REQ-0010.yaml
      Step 6. status draft -> accepted at step 2 (once RELOAD-CODE lands the
      design is settled and being sequenced end to end); -> implemented or
      partial at step 6, per RULE-0005.

  docs/plans/PLAN-0006.yaml
      This file. draft -> final at step 6, with an OUTCOME section.

  Deliberately not changed:

    src/serve/operations.lisp. RELOAD-CODE is a lifecycle primitive beside
    SERVER-STATUS, STOP-SERVER and START-SERVER, all of which already live in
    server.lisp; operations.lisp holds the repository-scoped read and write
    tier and gains nothing that takes no repository.

    src/serve/capability.lisp, RESOLVE-CALLER-GRANTS, CHECK-CAPABILITY. R6 is
    not reopened; RELOAD-CODE sits at :write, a tier every credential already
    carries.

    src/serve/loom-serve.asd. No library dependency is added: usocket is
    already loaded transitively through hunchentoot by the time
    loom-serve.lisp's own HANDLER-CASE forms run, and loom-serve.lisp is a
    script rather than an ASDF component, so it carries no :depends-on of
    its own for this plan to widen.

    src/mcp/tools.lisp. RELOAD-CODE is REST-only, matching the four existing
    write-tier operations DES-0006 keeps off MCP's surface; DES-0007 does
    not reopen that scoping and neither does this plan.

  BLAST RADIUS

  What Loom reports today:

    reload-code            0 impacted -- it does not exist until step 2.
    start-server            3 impacted, d1: server-status (calls it), and
                            two tests. loom-serve.lisp's own self-watch,
                            pidfile and handler-case additions are invisible:
                            loom-serve.lisp reaches functions through
                            READ-FROM-STRING, exactly the blindness
                            PLAN-0005 recorded for `main`.
    all-repositories        9 impacted (truncated). The set worth checking
                            before touching loom-serve.lisp's own self-watch
                            call, which does not appear in it for the same
                            READ-FROM-STRING reason.

  What Loom cannot see, and this plan believes anyway:

    Everything loom-serve.lisp does. Step 3 is entirely below `impact`'s
    floor; its own verification is therefore a run of the script, not a
    query against the graph.

    Everything tools/loom-serve.sh does, including the pidfile
    liveness-and-identity check. It is bash, not indexed at all; `check` has
    nothing to say about steps 4 or 5.

  RISKS

  Testing RELOAD-CODE by actually reloading the nine systems a running FiveAM
  suite is itself part of. The obvious test -- rebind nothing, call the
  operation, assert :reloaded is T -- would force ASDF to recompile
  loom-ontology through loom-mcp while `loom-serve-test`'s own suite is
  executing inside a package one of those recompiles could redefine out from
  under it. *RELOAD-FUNCTION* exists to make this untestable path
  unnecessary: every FiveAM test rebinds it to a stub, and the one real,
  full-force call is exercised exactly once, manually, in step 3's procedure,
  against a process nothing else in the image depends on continuing to run
  correctly afterward.

  A pidfile clobbered by a losing process's own cleanup. DES-0007's own
  fifth PROBLEM finding traces this exactly for a speculative-write design
  this plan does not use; step 3's manual procedure (b) is the reproduction
  that would have caught it, and the design it verifies -- write only after
  START-SERVER succeeds -- has no interleaving for the argument to apply to,
  which is worth confirming by running the same two-concurrent-processes
  procedure anyway rather than trusting the "removes the race by
  construction" argument untested.

  A pidfile that outlives its process. `kill -9`, an OOM kill, or a crash
  leaves .pid on disk under /tmp naming a process that no longer exists, and
  eventually a pid the OS could recycle to something unrelated. Step 4's
  shared liveness-and-identity check (`kill -0` plus a /proc/<pid>/cmdline
  match) is what closes this, and its own risk is the one DES-0007's
  CONSEQUENCES already names: it is Linux-specific, matching WSL Ubuntu, and
  a step 4 test that only checks `kill -0` without also checking cmdline
  would still pass every scenario this plan's own procedure exercises,
  because nothing in a manual procedure run on one machine can force a pid
  to be recycled to prove the identity half is doing anything -- named here
  as an argued rather than reproduced property, matching CON-0001's
  discipline about the difference between the two.

  Two independent implementations of one naming rule silently disagreeing.
  loom-serve.lisp computes its own pidfile path and tools/loom-serve.sh
  computes the same path to find it, and nothing forces the two to agree
  beyond both following the same prose rule precisely. Step 3's manual
  procedure asserts the exact path loom-serve.lisp writes to by inspecting
  /tmp directly; step 4's asserts tools/loom-serve.sh finds a pidfile at
  all. If they diverge, `stop` and `restart` fail with "nothing to stop"
  against a process that is plainly running, which is the symptom to expect
  and the one that names this risk rather than a permission or network
  error.

  `:force :all` recompiling more than expected inside the test suite. Step
  2's tests must never call the real *RELOAD-FUNCTION*; a test that forgets
  to rebind it and passes anyway (because ASDF happens to find nothing stale
  that run) is CON-0003's failure mode exactly, and the guard is that every
  reload test asserts something about *RELOAD-SYSTEMS*, the argument the
  stub received, not merely that the operation returned without signalling
  -- which would pass just as well against a stub that does nothing at all.

  Tests likely to break, and why:

    None outside src/serve/test/server.lisp from here on -- step 1 already
    landed and loom-workspace/test's count above already includes it.
    loom-serve/test's other five files (registry, operations, repl, json)
    are untouched; a movement in any of them means a step edited a file this
    plan does not name.

  STEPS

  1. loom-workspace: REPOSITORY-INDEXED-AT stops under-reporting what the
     monitor thread already knows. ALREADY LANDED.
     Found already in the working tree while gathering this plan's own
     BASELINE, not sequenced and then executed in the usual order: `git diff
     src/workspace/workspace.lisp` shows POLL-ONCE's existing `(when (or
     changed removed) ...)` branch gained `(setf (repository-indexed-at
     repository) now)` after the existing RESOLVE-AND-CHECK call, using the
     `now` already bound at the top of the function -- exactly this plan's
     own design for the step, including the comment naming DES-0007 and
     CON-0001's fabricated-fact argument. `git diff src/workspace/test/
     workspace.lisp` shows one new test, poll-once-that-finds-a-change-
     moves-indexed-at, asserting both halves this plan's own CON-0003
     pairing calls for: a poll that reindexed moves the timestamp forward
     of a recorded `before` and past the write's own instant, and a
     second poll that finds nothing leaves it exactly where it was.
     Recorded here rather than silently accepted so this document's own
     claim to have sequenced the work stays honest: this step was verified
     by reading a diff already on disk, not by writing and running the code
     from this plan's own steps.
     DES-0007 status draft -> accepted here, since the design landing
     step 1 without waiting is itself evidence it is settled.
     Verification, re-run rather than trusted from the diff alone:
     `loom-workspace/test` at 54 (up 3 from the BASELINE of a plan written
     before this step landed), full nine-system suite green, and
     `tools/loom.sh 'status | check'` unchanged from what BASELINE already
     shows -- nothing about Loom's own self-index moves from this step
     alone, since nothing calls POLL-ONCE differently yet.

  2. loom-serve: RELOAD-CODE, and the seam that keeps its test from
     recompiling the suite it runs inside.
     src/serve/server.lisp, after RELOAD-CODE's neighbours SERVER-STATUS and
     STOP-SERVER:
       `(defparameter *reload-systems* '(:loom-process :loom-rest :loom-mcp)
       "...")` -- documented with the reason all three and not one: loom-
       process is not a dependency of loom-rest or loom-mcp, and the union of
       the three systems' transitive plans is exactly the nine systems R1
       defines staleness against (DES-0007's own accounting, restated in the
       docstring so a reader does not have to re-derive it).
       `(defparameter *reload-function* (lambda (systems) (dolist (s systems)
       (asdf:load-system s :force :all))) "...")` -- documented with
       *STATIC-GRANTS*'s own precedent and reason, quoted in this plan's own
       summary above: a test seam, not production configuration a caller
       would ever have reason to rebind. `:force :all` and not `:force t`,
       per DES-0007's own corrected PROBLEM finding: not because the plain,
       unforced load would miss a dependency (it would not; ASDF's ordinary
       incremental build already reaches it), but because only `:force :all`
       closes the same-second write-then-reload race *mtime-settle-seconds*
       already names -- the docstring says this rather than the older,
       superseded "reaches every dependency" reasoning, so a reader of the
       code alone gets the argument that actually holds.
       `(defvar *reload-lock* (bt:make-recursive-lock "loom-serve-reload"))`,
       documented against *WORKSPACE-REGISTRY-LOCK*'s own reasoning
       (src/serve/operations.lisp:21-42): ASDF's OPERATE is not written to
       expect two concurrent plans over the same registry, and nothing else
       in this design guarantees two RELOAD-CODE calls never overlap without
       a lock of its own.
       `(define-operation :reload-code :write () "Force-reload
       *RELOAD-SYSTEMS* -- and, transitively, everything beneath them -- from
       disk into this running image." (bt:with-recursive-lock-held
       (*reload-lock*) (let ((condition nil)) (handler-case (funcall
       *reload-function* *reload-systems*) (serious-condition (c) (setf
       condition (operation-error->plist c)))) (if condition (list :reloaded
       nil :systems *reload-systems* :name (getf condition :name) :message
       (getf condition :message)) (list :reloaded t :systems *reload-systems*
       :reloaded-at (get-universal-time))))))`. The `:reloaded-at` key on
       success and not on failure is deliberate and matches DES-0007's own
       third PROBLEM finding: a failed reload changed nothing about what code
       is running, so there is no new "currently loaded" instant to report,
       and a caller that read a stale or absent :reloaded-at as "still the
       one from last time" would be reasoning correctly rather than being
       told a fact this operation cannot know.
     src/serve/package.lisp: export *RELOAD-FUNCTION*, *RELOAD-SYSTEMS* (the
     lock is internal, matching WITH-REPOSITORY-LOCK's own unexported
     precedent -- nothing outside this file has a reason to acquire it).
     Verification: four new tests in src/serve/test/server.lisp, every one
     rebinding *RELOAD-FUNCTION* and never calling the real one -- RISKS
     names why and names the guard against a test that forgets to check what
     the stub received.
       a. reload-code-calls-the-reload-function-with-the-configured-systems:
          rebind *RELOAD-FUNCTION* to a closure that pushes its argument onto
          a list a LET captures; call the :reload-code operation; assert the
          captured argument is EQUAL to *RELOAD-SYSTEMS*'s default value.
          Fails today -- there is no operation.
       b. a-successful-reload-reports-reloaded-at-no-earlier-than-it-started:
          record a `before` timestamp; the stub returns normally; the
          operation's result has :reloaded T, :systems *reload-systems*, and
          a :reloaded-at that is present and >= `before` -- the "on success
          it carries a completion time" half of DES-0007's third finding,
          and the reason this test's name says "no earlier than it started"
          rather than merely "is present": a hardcoded or stale timestamp
          would satisfy "present" and fail this comparison.
       c. a-signalling-reload-is-a-successful-request-carrying-the-condition:
          the stub signals (error "boom"); the operation itself does not
          error -- it is invoked directly, not through INVOKE-OPERATION's own
          guard, so a request-level escape here would be this function's own
          defect and not R8's net catching it -- and its result is (:reloaded
          nil :systems ... :name "SIMPLE-ERROR" :message "boom") with no
          :reloaded-at key at all, asserted by its absence rather than by a
          NIL value, matching the operation's own (if condition ...) shape
          above. This is DES-0006's REPL-tier distinction reused for a
          different operation, named in the test's docstring: a condition the
          action itself produced is the answer, not a failed request.
       d. reload-code-is-write-tier-and-takes-no-repository: grants '(:read)
          is refused capability-error; grants '(:write) with an explicit
          :repository argument the stub ignores still succeeds -- the second
          half guards against a future edit accidentally routing this
          through REQUIRE-REPOSITORY, which would turn every reload into a
          malformed request the day nobody names a repository, exactly the
          bug SERVER-STATUS already avoids by taking no designator.
     Then `loom-serve/test`, 117 -> 121, and the full suite. Then
     `tools/loom.sh 'reindex | status | check'` against step 1's baseline:
     unchanged, since nothing here is called by anything yet.

  3. loom-serve.lisp: self-watch, a pidfile written only once it is true,
     and a lost race that exits instead of crashing.
     Not FiveAM-testable -- an entry script's own process lifecycle is
     DES-0006's own precedent for "run it and watch," restated under
     PROBLEM there for MAIN's EOF behaviour and reused here for the same
     reason. SERVE-FOREVER's own new keyword is narrow enough not to need a
     dedicated unit test either: its only effect is skipping one function
     call, and the one caller that ever passes T is this step's own code,
     exercised by procedure (a) below actually reaching the blocking loop
     without SERVE-FOREVER's internal START-SERVER call raising "already
     running" against the server this step's own code just started --
     which is the one way this keyword can be wrong and the one thing
     procedure (a) could not pass without it being right.
     loom-serve.lisp: `here` (already computed for the ASDF registry pushes)
     is prepended to `paths` before either mode runs -- one line, above the
     existing `headless`/`paths` LET*. The pidfile path, computed once and
     used identically by tools/loom-serve.sh at step 4, is stated here
     precisely so both implementations agree without either passing the
     other an argument: `(string-trim "/" (namestring here))` with every
     remaining `#\/` replaced by `#\-`, under `/tmp/loom-serve-`, suffixed
     `.pid` -- for this tree, /tmp/loom-serve-home-beberman-lisp-Loom.pid.
     HEADLESS branch, restructured around step 2's own `already-started`
     keyword rather than calling SERVE-FOREVER as a single opaque call:
     watch each path directly (`(dolist (path paths) (watch-repository
     path :quiet t))`, the same call SERVE-FOREVER's own body already
     makes, run from this frame instead of that one so nothing about
     watching itself changes); call `loom-serve:start-server` directly,
     inside a HANDLER-CASE naming USOCKET:ADDRESS-IN-USE-ERROR -- on catch,
     print the one-line message to *ERROR-OUTPUT* and return without
     writing a pidfile or calling SERVE-FOREVER, since there is no listener
     for it to block on; on success, write the pidfile immediately (an
     UNWIND-PROTECT from this point covers its deletion on every exit path
     below), then call `(loom-serve:serve-forever paths :already-started
     t)` for the blocking loop and shutdown sequence -- SERVE-FOREVER's own
     watching is redundant with the watch already done above but harmless
     (WATCH-REPOSITORY dedupes and reindexes rather than double-registering,
     per DES-0007's own note), and its own START-SERVER call is skipped
     entirely by the keyword, which is the one piece step 2 exists to make
     true. INTERACTIVE-WITH-SERVICE is unchanged from before this step:
     its own direct call to START-SERVER and its own HANDLER-CASE around it
     never involved SERVE-FOREVER and are not touched here.
     Verification, a manual procedure run once and recorded in this step's
     own notes:
       a. `sbcl --script loom-serve.lisp --headless` from a clean state (no
          pidfile at /tmp/loom-serve-home-beberman-lisp-Loom.pid, nothing on
          port 4780): process starts, the pidfile appears containing a live
          pid, `curl 127.0.0.1:4780/v1/status?repository=Loom` answers 200
          naming the Loom root. SIGTERM the pid; the pidfile disappears and
          the process exits.
       b. Two processes started within the same second, backgrounded:
          `sbcl --script loom-serve.lisp --headless & sbcl --script
          loom-serve.lisp --headless &`. Exactly one pidfile exists once both
          have either bound or exited, and it names whichever process is
          still answering `curl .../v1/server-status` -- the specific check
          DES-0007's fifth PROBLEM finding exists to make true, and the one
          RISKS names as worth confirming rather than trusting. The losing
          process's own stderr contains the one-line message and no Lisp
          backtrace; `ps` shows exactly one sbcl process still running that
          was started this way.
       c. Edit a file under src/ while (a)'s process is running; within
          *POLL-INTERVAL* (2s) plus a margin, `curl .../v1/status?
          repository=Loom` shows :indexed-at greater than the :started-at
          `curl .../v1/server-status` reported at start -- step 1's fix,
          exercised end to end for the first time.
     Nothing to record beyond the procedure's own pass/fail: step 2 already
     fixed the keyword's name and default, so step 4's own description of
     loom-serve.lisp's behaviour is written against a settled signature
     rather than a placeholder.

  4. tools/loom-serve.sh: the R4 script.
     New file, executable, header comment in tools/loom.sh's own shape
     (the invocation, why it exists, what it does not do).
     Path bookkeeping, computed once near the top of the file: `root`, the
     tree's own absolute path (hardcoded the same way tools/loom.sh and
     tools/loom-test.sh already hardcode it); `sanitized`, `root` with its
     leading and trailing `/` trimmed and every remaining `/` turned into
     `-` -- the exact rule step 3 states for loom-serve.lisp's own pidfile
     computation, restated here in shell rather than Lisp so a reader can
     compare the two directly rather than trusting they agree; `pidfile`,
     `logfile` and `reloaded_at_file`, each `/tmp/loom-serve-${sanitized}`
     with `.pid`, `.log` and `.reloaded-at` respectively.
     A shared function, `live_pid_or_clean`: reads `pidfile`; empty or
     missing, returns nothing; else checks `kill -0 "$pid"` and, on Linux,
     `grep -q loom-serve.lisp /proc/$pid/cmdline` (NUL-separated, so grep's
     own binary-data handling is relied on rather than worked around, per
     DES-0007's own naming of this as a Linux-specific, WSL-Ubuntu-matching
     mechanism); on either check failing, `rm -f "$pidfile"` and returns
     nothing; otherwise prints `$pid`. `status`, `start`, `stop` and
     `restart` all call this rather than reading `$pidfile` directly.
     `status`: curl -sf --max-time 2 against /v1/server-status and, if that
     answers, /v1/status?repository=Loom; prints not-running (exit 1),
     running-and-current (exit 0), running-and-stale (exit 0, comparing
     :indexed-at against the later of :started-at and the contents of
     `reloaded_at_file` if it exists), or running-self-watch-unregistered
     (exit 0) per DES-0007's own four-way answer under R1.
     `start`: calls `live_pid_or_clean` first (discarding its result; the
     side effect, clearing a stale pidfile, is the point), then spawns
     `sbcl --script loom-serve.lisp --headless /path/to/Loom`
     detached (`nohup ... >>"$logfile" 2>&1 & disown`), then polls
     `status`'s own running check for up to ~10s (a generous multiple of the
     seconds-scale startup PLAN-0005 measured); reports which of "started"
     or "already running" happened -- both are success, per R2. Writes no
     pidfile itself; step 3's own process writes it, and only after winning.
     `stop`: `live_pid_or_clean`; if it names a live, verified process,
     sends SIGTERM and polls for the pidfile's disappearance up to ~15s
     (SERVE-FOREVER's own *MONITOR-STOP-TIMEOUT* precedent of 10s, plus
     margin for STOP-SERVER itself); if `server-status` still answers but
     `live_pid_or_clean` found nothing, refuses with the message DES-0007
     names ("a Loom service is running but this script did not start it, or
     lost track of it") rather than guessing a pid.
     `restart`: `stop`, then `start`.
     `reload`: requires `status` to report running (else points at `start`
     and exits nonzero); POSTs /v1/reload-code. On a decoded `:reloaded`
     true, writes the decoded `:reloaded-at` to `reloaded_at_file`; on
     false, or a follow-up `status` call failing to answer within a short
     timeout, calls `restart` and says so; otherwise reports success.
     `update`: not running -> `start`; running and current or unknown ->
     no-op, reports which; running and stale -> `reload`.
     Verification, manual, against step 3's already-verified process
     lifecycle:
       a. `tools/loom-serve.sh status` with nothing running reports not
          running and exits 1.
       b. `tools/loom-serve.sh update` starts it; a second, immediate
          `tools/loom-serve.sh update` is a no-op reporting current.
       c. Edit a file under src/, wait past *POLL-INTERVAL*,
          `tools/loom-serve.sh status` reports stale.
       d. `tools/loom-serve.sh reload` against that stale state reports
          success (or, if it did not, falls back to restart and says so);
          `tools/loom-serve.sh status` immediately after reports current,
          and `cat /tmp/loom-serve-home-beberman-lisp-Loom.reloaded-at`
          shows a timestamp at or after `d`'s own start.
       e. `kill -9` the running pid directly, bypassing this script
          entirely; `tools/loom-serve.sh status` reports not running (the
          port is closed, since the process is actually gone) and the
          pidfile is still present on disk naming the now-dead pid;
          `tools/loom-serve.sh start` cleans it up and starts a fresh
          process, and the pidfile now names the new pid, not the old one
          -- the case this plan's own course correction exists to cover,
          run for real rather than argued.
       f. `tools/loom-serve.sh stop` stops it cleanly; a second `stop`
          reports nothing to do rather than erroring.
     Recorded in this step: the wall-clock time `reload` and `restart` each
     took, since DES-0007's CONSEQUENCES and REQ-0010's own "seconds-scale"
     framing are claims this step is positioned to check for the first time
     against real numbers rather than PLAN-0005's borrowed ones.

