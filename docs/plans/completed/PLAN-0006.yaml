  THE DEVIATION FROM STEP 2, NAMED RATHER THAN LEFT IN THE DIFF

  Step 2 above specifies `:force :all` verbatim, twice, and argues for it
  against `:force t`. The implementation does not do that, and the reason is
  a measured crash rather than a preference.

  `:force :all` forces ASDF's entire transitive plan, third-party systems
  included. Recompiling an already-loaded quicklisp system in a live image is
  not a slow no-op: string-case, reached through cl-yaml -> serapeum, dies
  with "overwriting old FUN-INFO ... for STRING-CASE::NUMERIC-CHAR=". A real
  `tools/loom-serve.sh reload` against a running service failed with exactly
  that, and its restart fallback then missed its own poll window too -- the
  worst outcome R3 can produce, slower than a restart and reported as a
  failure. DES-0007's PROBLEM second finding measured `:force :all` against
  a two-system ASDF fixture with no third-party dependencies, which is why
  neither that document nor this plan saw it.

  What is implemented: `:force <list>`, naming Loom's own nine systems
  (*RELOAD-FORCE-SYSTEMS*, src/serve/server.lisp). ASDF forces exactly those
  and leaves the rest of the plan to its ordinary timestamp comparison, so the
  same-second write/reload race *MTIME-SETTLE-SECONDS* names -- the real
  reason for forcing anything, and the part of DES-0007's argument that
  survives -- is still closed for every file this design cares about.

  A second correction the same fixture could not have shown. Forcing
  loom-ontology recompiles src/ontology/package.lisp, whose DEFPACKAGE is
  permanently at variance with the live package because DEFENTITY exports
  each entity class and its accessors at load time. SBCL signals a full
  WARNING, COMPILE-FILE sets failure-p, ASDF raises COMPILE-FILE-ERROR: a
  correctly scoped force still failed on the first file it touched. FORCE-
  LOAD-SYSTEMS muffles SB-INT:PACKAGE-AT-VARIANCE and nothing wider -- a
  reload that swallowed every full warning would report `:reloaded t` over an
  edit that did not compile, which is CON-0001's fabricated fact and the exact
  property that makes a reload worth believing.

  Two shape changes fall out of that and are recorded because step 2 named
  neither: *RELOAD-FUNCTION*'s default is now #'FORCE-LOAD-SYSTEMS, a named
  function rather than an inline lambda, because its reason needs a docstring;
  and *RELOAD-FORCE-SYSTEMS* is a second defparameter, internal, matching
  *RELOAD-LOCK*'s precedent rather than the two exports step 2 lists.

  WALL CLOCK, WHICH STEP 4 ASKED FOR

    start, cold                            4.3s
    reload, in place, live service         5.1s   pid unchanged across it
    update when current                    0.03s  no-op, no HTTP work
    update when stale                      4.4s   reloads, does not restart
    restart (the failed reload's fallback) 4.4s

  DES-0007's CONSEQUENCES and REQ-0010's "seconds-scale" framing hold
  against real numbers for the first time. The 0.03s no-op is real but is
  narrower than DES-0007's own "most sessions start with nothing having
  changed" argument assumes, for a reason only running it showed:

    A cold start reports *stale* within a second or two of coming up, every
    time. Measured directly: `started-at` and `indexed-at` are equal the
    instant the service answers, and the monitor's first poll then moves
    `indexed-at` one second past `started-at` -- step 1's own fix firing on
    something poll-once counts as changed on its first pass over a tree
    nobody has touched. So the sequence a real session sees is `start`
    (4.3s), then one `update` that reloads (4.4s) rather than no-ops, and
    only after that does the 0.03s path apply, because `reload` writes
    .reloaded-at and that becomes the later baseline.
    Not a defect introduced by this plan and not fixed by it: the answer errs
    toward stale, never toward a fabricated "current," which is the direction
    CON-0001 asks for. But it means `update`'s cost on a fresh session is one
    reload rather than nothing. Filed as BUG-0007 rather than left in this
    section, since the fix is in poll-once and the next step is to have it
    report which paths it counted as changed on that first poll.

  Two verifications this plan asked for that were not run as written, named
  rather than implied:

    Step 5's "a fresh Claude Code session shows the hook ran." The hook is
    installed and `tools/loom-serve.sh update` was run directly, repeatedly,
    from both a stopped and a running state. Whether Claude Code fires it
    before the MCP handshake cannot be checked from inside the session that
    would need to have already started.

    The MCP `loom_describe`-returns-the-new-definition check in VERIFICATION.
    What was checked instead, and is the same fact by a more direct route:
    the fasls under ~/.cache/common-lisp for src/knowledge/ carry the
    timestamp of the live reload, written by the running process itself, so
    the image demonstrably recompiled from disk rather than reporting a
    reload it did not perform.

  One thing this plan verified only against an idle service, which is where
  BUG-0008 came from. Every reload measured above was measured with no other
  caller, because that is how the manual procedures in steps 3 and 4 are
  written. Run again with six concurrent requests across the reload's own
  window, one came back 500 -- a generic function ASDF had momentarily
  emptied of its methods. Neither this plan nor DES-0007 has a concurrency
  story for R3; the numbers above are all still correct and all still
  single-caller. A procedure that says "run it and watch" needs to say what
  else is running while you watch.

  One more prediction that came out wrong, in step 4(e). It expects that
  after a `kill -9`, "`tools/loom-serve.sh status` reports not running ... and
  the pidfile is still present on disk naming the now-dead pid." It reports
  not running and exits 1, correctly -- but the pidfile is already gone by
  then, because `status` routes through live_pid_or_clean like every other
  verb and that check deletes a stale file wherever it is first noticed. The
  step's own design is what makes its own expectation false; the behaviour is
  right and the prediction was written before the shared check existed. The
  substantive half holds: `start` afterwards spawns cleanly and the pidfile
  names the new pid, and a second `stop` reports nothing to do rather than
  erroring.

