id: PLAN-0014
title: Land the sparse :CALL-SITE entity in eleven steps, one generator per step, with the entity delta measured before anything is written
status: final
date: 2026-08-09
refines: [DES-0014, REQ-0015, BUG-0016, BUG-0017]
affects: [collect-call-names, analyze-file, handle-variable, handle-defclass,
          handle-define-condition, make-variable-entity, class-definition-entities,
          definer-call-site, call-targets, resolve-calls,
          resolve-generated-definitions, generated-entity-retractions,
          body-swallowing-macro-names, unhandled-definer-macros, callable-index,
          dispatch-confidence, resolve-tests, retract-file, entity-natural-key,
          derive-id, entity-summary, describe-entity, group-neighbors,
          search-entities, linkable-index, resolve-one, impact-report,
