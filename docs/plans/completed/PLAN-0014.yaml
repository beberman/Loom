summary: |
  DES-0014 in eleven ordered steps. The ontology and the resolution plumbing
  land first and mint nothing, so the three generators can each land alone and
  each move a number that is attributable to it: initforms (BUG-0017), definer
  call sites (BUG-0016), ambiguity (REQ-0015). Two things DES-0014 did not
  name are required before any of them and are steps of their own: a keyword in
  operator position is not a call, and COLLECT-CALL-NAMES currently records one
  as though it were -- which on this tree would mint five fabricated :CALLS
  edges out of loom-ontology and hand RULE-0001, the one machine-checked rule
  whose output is currently trustworthy, its first false positives. Measured
  census taken 2026-08-09 under /usr/bin/sbcl before a line was written: 481
  orphaned (definer-site, name) pairs of which 132 resolve to something, 20
  initform (form, name) pairs of which 13 resolve, and 18 ambiguous call
  occurrences at 18 distinct sites. R4 is therefore implemented as "mint where
  the name resolves", which is what makes the delta order 160 rather than order
  520 and what DES-0014's own R9 ("order 100 against 1604") already expects.
  Out of scope: an :OPERATION entity type, the lambda-list-default half of
  BUG-0017, removing :UNRESOLVED-CALLS, and REQ-0013's per-query reporting.

  LANDED 2026-08-10, all eleven steps, suite green at 9 of 9 systems. R9's
  number, which DES-0014 required this plan to state exactly rather than
  estimate: 162 :CALL-SITE entities on this tree, by kind 20 :variable, 124
  :definer-call and 18 :ambiguous. The per-step deltas are not that split and
  the difference is worth keeping straight: steps 6, 7 and 8 minted 20, 117 and
  25, because 7 of the 124 :definer-call sites carry an ambiguous name and
  CALL-TARGETS refuses one until step 8's clause exists, so they are minted by
  step 8 while remaining :definer-call. Against the original 2026-08-09 baseline,
  entities 1684 -> 1890 and relationships 8261 -> 9065; against step 1's
  re-baseline, which is the honest comparison because it already contains this
  plan's own two files, entities 1698 -> 1890. The 206-entity difference is 162
  call sites and 44 entities of new source and tests, this plan being indexed
  like anything else. Tests 481 -> 503 covering 325 units, up from 322 by the
  three units the new code adds and unmoved by call sites, which is where
  step 4's confirmation that RESOLVE-TESTS is unaffected gets cashed. Documents
  81 -> 83. Violations 32, every one RULE-0003 and every one BUG-0009's
  described false positive, with RULE-0001 empty throughout. Unresolved
  document references 0. Definer macros 4 -> 3, DEFRELATIONSHIP having left the
  list because all twelve of its apparent call names were keyword heads.
  No review was performed on this work, so no REV-nnnn exists for it.
body: |
  BEFORE ANYTHING

  Two measurements, both taken 2026-08-09 under /usr/bin/sbcl on this working
  tree. Take them again immediately before step 1: this tree is under active
  edit and a baseline taken a day early is not a baseline.

  The index baseline, from `tools/loom.sh 'status'`:

      files          178        tests            481 covering 322 units
      entities      1684        definer macros     4
      relationships 8261        violations        32 (all BUG-0009 RULE-0003)
      documents       81        unresolved doc refs 0
                                unread   2 suppressed, 0 recovered

  The census of what the three generators would mint, computed by walking this
  tree's own index and replaying each generator's predicate without changing
  anything:

      R3  initform (form, name) pairs                        20
            of which resolve to a callee                     13
            of which resolve to nothing                       7
            distinct (file, line, name)                      20

      R4  orphaned definer (site, name) pairs               481
            of which resolve to a callee                    132
              one plain function                            111
              one interface                                  14
              two or more plain functions                     7
            of which resolve to nothing                     349
            distinct (file, line, name)                     481
            by macro, resolving only:
              define-command   68   define-operation  50
              defentity         8   let*               4
              register-handler  2

      R5  ambiguous occurrences (2+ plain functions,
          no methods, not exactly one interface)             18
            distinct (file, caller-line, name)               18
            names: fixture-inspection 10, discover-units 4,
                   log-event 2, read-inspection-file 2

  RE-BASELINE, taken at the end of step 1 and the number every later step is
  compared against. Both measurements above predate two files this plan itself
  adds -- PLAN-0014.yaml and tools/call-site-census.lisp -- and the script is
  indexed like any other, so the baseline moved before a line of production
  code was written:

      files          180        tests            481 covering 322 units
      entities      1698        definer macros     4
      relationships 8374        violations        32 (all BUG-0009 RULE-0003)
      documents       82        unresolved doc refs 0
                                unread   2 suppressed, 0 recovered

  The census re-run at that baseline reproduces every minting number above
  exactly -- 132 resolving orphans (define-command 68, define-operation 50,
  defentity 8, let* 4, register-handler 2), 20 initform pairs of which 13
  resolve, 18 ambiguous occurrences at 18 distinct sites, 170 to be minted --
  and moves one number that is not a minting number: 484 orphaned pairs rather
  than 481. The three extra are `system', `here' and `load-system', read out of
  the census script's own registry preamble, and all three resolve to nothing.

  Two names in that script had to be changed before the numbers agreed, and the
  reason is worth keeping. A function named REPORT put REPORT into the callable
  index, so two `report' names orphaned by DEFINE-COMMAND bodies in console.lisp
  resolved to it and the resolving count read 134; a function named TALLY did
  the same for a call in enrich.lisp and for an analyzer test, which moved
  `tests covering' from 322 units to 323. An instrument that perturbs its own
  population by 2 is not measuring this tree, and CENSUS-REPORT and CENSUS-TALLY
  are why every name that file defines is now prefixed or compound.

  Three facts in that table decide three things this plan does.

  481 against 132. DES-0014 R4 reads "one :CALL-SITE per call name on a
  definer call site that produced no entity", which taken literally mints 481
  entities -- a 28.6% entity growth, and 349 of them nodes for names that
  resolve to nothing at all. That contradicts the design's own census
  reasoning ("a node per absent callee is a node per thing that is not there")
  and its own R9 ("expected order 100 against 1604"). This plan implements R4
  as: mint where CALL-TARGETS returns something. See DECISIONS below.

  defentity's 8. Those eight are `line-count` and `unresolved-references`,
  read out of `(:line-count integer)` and `(:unresolved-references list)` in
  code-ontology.lisp -- keyword heads of property declarations, not calls.
  Minted as call sites they produce five :CALLS edges leaving loom-ontology
  for loom-analyzer and loom-graph, which is exactly what RULE-0001 forbids
  and exactly what `check` would report as a real violation. Step 2 exists
  because of those five edges.

  18 and 18. Every ambiguous occurrence on this tree is its own (file, line,
  name), so the ambiguous generator's node count equals its occurrence count
  here. That will not be true on game-server, where `id` has 144 dropped sites
  across many callers; the key collapses per caller line, not per name.

  DECISIONS THIS PLAN MAKES THAT DES-0014 LEFT TO IT

  Every one of these is an implementation choice inside the settled design.
  None of them reopens it, and each is written down here because a reader of
  the code will otherwise read it as a departure.

  1. The natural key is (:file :start-line :call-name), not (:file :start-line
     :name), and the entity's NAME slot carries a label rather than the bare
     referenced name.

     ENTITY-NATURAL-KEY treats the key element :name as the *name slot*, not as
     a property, so DES-0014's spelling would force NAME to be the referenced
     name. That is unsafe in two measured ways. LINKABLE-INDEX keys every named
     entity in the graph, and RESOLVE-ONE refuses a name matching several
     entities -- so 163 call sites named exactly like the functions they call
     would turn resolved `affects:` references into unresolved ones and move
     the pinned "0 unresolved document references" off zero. And RESOLVE-ENTITY
     takes SEARCH-ENTITIES' single best match, where an exact-name call site
     ties with the function at match-rank 0 and the winner is hash order, so
     `describe violation-summary` could describe a call site.

     So: property :call-name holds the referenced name and is the key
     component; NAME holds "<call-name>@<file>:<line>", e.g.
     "violation-summary@src/serve/operations.lisp:186". The derived id is then
     "call-site:src/serve/operations.lisp:186:violation-summary", which reads
     the way every other derived id in this codebase reads. Semantically this
     is DES-0014's key exactly: a file, a line and a referenced name.

  2. R4 mints only where the name resolves. Justified above by 481 against 132
     and by R9's own expectation. The rule DES-0014 states -- a node earns its
     place when it carries a fact that has nowhere else to live -- is what
     decides it: a name that resolves to nothing carries no edge, and the fact
     that it went nowhere already lives on the site's :CALL-NAMES and in
     `check`'s definer-macro report. The predicate is CALL-TARGETS, which
     RESOLVE-GENERATED-DEFINITIONS can call because loom-graph holds the
     callable index; the analyzer cannot, which is why R3 keeps minting all 20.
     The asymmetry is deliberate and is 7 extra nodes.

  3. :CONTAINS also gains :function, :method and :test as sources. R1 lists
     only :variable, but R7 requires `describe` on a *caller* to show an
     ambiguous site as one neighbour, and there is no edge from the caller to
     the site without this. The chain reads function contains call-site calls
     candidate, every link an edge type that already exists, which is the
     argument R1 makes for the :variable case.

  4. :CALL-SITE also declares :call-names and :unresolved-calls. RESOLVE-CALLS
     is the one place a name becomes an edge, and letting it treat a call site
     as one more kind of caller is what keeps DEC-0003's rebuild property, the
     method fan-out and the confidence handling working for call sites without
     a second copy of any of it. :UNRESOLVED-CALLS on a call site is where the
     7 initform names that resolve to nothing are recorded rather than dropped.

  5. "At the initform's line" is the enclosing form's start line. DES-0013
     deleted ELEMENT-SPANS; pass 1 has one range per top-level form and no
     sub-form positions, so a DEFPARAMETER's call sites carry the
     DEFPARAMETER's line. Same for an ambiguous site, which carries its
     caller's start line because :CALL-NAMES records no position at all.

  6. A :CALL-SITE whose own name is ambiguous fans out directly and mints no
     second node. Seven of the 132 resolving definer-call names are ambiguous.
     The node exists to be the anchor for an ambiguity; a call site already is
     one, so CALL-TARGETS' new clause checks the caller's type and returns the
     N edges with no entity when the caller is already a :CALL-SITE. Without
     this the pass mints a call site from a call site.

  7. The keyword-head correction (step 2) is not in DES-0014 and is required
     by it. BUG-0016's FIX PART 1 section names the defect and records that
     nobody had filed it. Step 2 files it as BUG-0020 and fixes it, because
     R7's "rules neither gain nor lose violations" cannot hold otherwise.

  FILES

  Created:

    docs/bugs/BUG-0020.yaml
        COLLECT-CALL-NAMES reads a keyword in operator position as a call.
        Filed in step 2 and closed by it.
    tools/call-site-census.lisp
        The census above, as a script: the three generators' populations
        against the current index, re-runnable after every step. Under tools/
        rather than /tmp because R2's ceiling is a number that has to be
        re-measured, and a measurement nobody can repeat is an anecdote.
        Note it is itself indexed, so step 1 re-baselines after adding it.

  Changed:

    src/analyzer/lisp-analyzer.lisp
        COLLECT-CALL-NAMES: a keyword head contributes no name (step 2).
        INITFORM-CALL-SITES, new: the initforms of one DEFVAR / DEFPARAMETER /
          DEFCLASS / DEFINE-CONDITION form, as (name . line) evidence (step 6).
        HANDLE-VARIABLE, HANDLE-DEFCLASS, HANDLE-DEFINE-CONDITION: each hands
          its initforms to that function and notes the resulting call sites
          (step 6).
        ANALYZE-FILE: pass 1's NOTE-DEFINITION gains a way to record an owned
          call site; pass 3 emits its assert and the :CONTAINS edge from the
          variable or class (step 6).
    src/ontology/code-ontology.lisp
        DEFENTITY :call-site; MAKE-CALL-SITE-ENTITY and CALL-SITE-LABEL beside
        it; :CALLS :from widened; :CONTAINS :from and :to widened (step 3).
    src/ontology/package.lisp
        Export MAKE-CALL-SITE-ENTITY and CALL-SITE-LABEL. The DEFENTITY class
        and its accessors export themselves (step 3).
    src/graph/resolve.lisp
        RESOLVE-CALLS: :call-site joins the caller types; CALLER-CALL-NAMES,
          new, reads :call-name for one and :call-names for the rest (step 4).
        CALL-TARGETS: the ambiguity clause before (t nil) (step 8).
        RESOLVE-GENERATED-DEFINITIONS: mint a call site per resolving orphaned
          name (step 7), plus the sweep of the ones it no longer produces
          (step 9).
        RESOLVE-CALLS: the same sweep for ambiguous sites (step 9).
    src/knowledge/services.lisp
        ENTITY-SUMMARY gains :referrer-kind, NIL for every other type (step 10).
    src/process/console.lisp
        The describe neighbour line prints the kind when a neighbour has one
        (step 10). Two lines.
    src/analyzer/test/lisp-analyzer.lisp, src/graph/test/resolve.lisp,
    src/ontology/test/code-ontology.lisp, src/knowledge/test/services.lisp,
    src/workspace/test/workspace.lisp
        The tests named per step.
    CLAUDE.md, .claude/skills/loom/SKILL.md
        R10 (step 11).
    docs/design/DES-0014.yaml, docs/requirements/REQ-0015.yaml,
    docs/bugs/BUG-0016.yaml, docs/bugs/BUG-0017.yaml, this plan
        Statuses and the measured delta (step 11).

  Unchanged, and worth saying so: RETRACT-FILE, APPLY-TRANSACTION, the absorb
  machinery, RESOLVE-TESTS, :CALL-NAMES' meaning and ownership, and every one
  of the 2527 call names that resolve to exactly one callee today.

  BLAST RADIUS

  What Loom says. `impact call-targets 3` reaches 44 entities (truncated) --
  RESOLVE-CALLS, its file, and 20 tests in src/graph/test/resolve.lisp reached
  through RESOLVE-CALLS, then RESOLVE-AND-CHECK, INDEX-REPOSITORY,
  ENRICH-REPOSITORY, POLL-ONCE and the workspace tests behind them. `impact
  resolve-generated-definitions 3` reaches 39, the same spine plus the twelve
  generated-definition tests. Both attach DEC-0003, and
  RESOLVE-GENERATED-DEFINITIONS also attaches DEC-0004. Read DEC-0003 before
  touching either: nothing here may consume what it reads.

  What Loom cannot say, and this is most of it. Every test in this tree is a
  fiveam TEST form, so the calls inside it are attributed to the minted :TEST
  entity and the ones inside macro bodies are not attributed at all -- which is
  this design's own subject. Treat the test lists above as a floor. Loom is
  also blind to the loom-serve / loom-rest / loom-mcp / loom-process boundary
  (no rule names those systems), and 51 of the 132 resolving definer-call names
  cross it, so a clean `check` there proves nothing either way.

  What I believe it reaches and Loom does not show:

    - src/knowledge/context.lisp. SEED-TYPE-RANK ranks an unlisted type last
      and seeds cap at 8, so a call site will essentially never seed a bundle;
      but CONTEXT-ITEM's neighbour expansion is capped at 12 per entity and
      call sites will now compete for those slots. Measured in step 10.
    - The REST and MCP surfaces. Both render ENTITY-SUMMARY, so step 10's new
      field appears in their JSON without either being edited. That is a wire
      change nobody asked for and it is additive.
    - `find`. A call site's label contains the callee name, so `find
      violation-summary` gains substring hits ranked below the exact match.
      The 20-hit cap is silent (REQ-0005), so a name with many call sites can
      now push a real definition off the end of a `find`.

  RISKS

  RULE-0001 acquires its first false positives. Five orphaned names in
  code-ontology.lisp are keyword heads of property declarations that happen to
  match real functions in loom-analyzer and loom-graph. Minted before step 2,
  they are five :CALLS edges leaving loom-ontology and `check` reports them as
  errors -- and CLAUDE.md currently tells every agent that RULE-0001's output is
  the trustworthy one. Step 2 lands before any minting step for this reason
  alone. Residual risk: the keyword-head fix is a heuristic-free rule (a
  keyword can never name a function in Common Lisp), but it changes
  :CALL-NAMES on ordinary callables too -- a CASE clause head like `(:file ...)`
  is a keyword head inside a real body -- so the :CALLS edge count can move.
  Step 2 measures that movement and attributes it; if it exceeds a handful,
  stop and find out which names, because a lost edge is a lost answer.

  RULE-0003's 32 lines are BUG-0009 noise and will be joined by more. Twenty
  of the ambiguous candidate edges cross a system boundary and every one of
  them is new. None of the 18 sites is in loom-knowledge, so RULE-0003's
  population should not move on this tree -- but "should not" is a prediction,
  and step 8 checks it rather than assuming it. A rise here is not evidence of
  a defect until someone reads the lines; a rise in RULE-0001 is.

  The suite gains a whole-tree indexing test. R2's ceiling has to be counted
  over this tree, and no existing test indexes it -- the workspace fixture is a
  four-file synthetic tree. The new test costs one full index. If it adds more
  than ~30 seconds, the fallback recorded here is to move the assertion into
  tools/call-site-census.lisp and have the verification step run it, keeping a
  cheap invariant test ("an ordinary DEFUN calling a uniquely-named function
  mints no call site") in the suite. Do not delete the assertion; DES-0014's
  RISKS section is explicit that the ceiling is the guard against the uniform
  model arriving by accident.

  Two owners, one natural key. The analyzer mints initform sites and the graph
  mints the other two, and if the two ever disagree about how a key is spelled
  the graph grows a duplicate per pass that nothing retracts. MAKE-CALL-SITE-
  ENTITY in loom-ontology, called by both, is DES-0014's own suggested
  insurance and step 3 takes it. Neither minting site may construct a
  CALL-SITE-ENTITY directly; step 3's test asserts the two owners' keys agree
  on identical inputs.

  A derived call site that stops being derived. RETRACT-FILE ages out a call
  site when the file it was read from changes, which covers the analyzer's.
  It does not cover the case GENERATED-ENTITY-RETRACTIONS exists for: a name
  that stops being ambiguous because one of two definitions was deleted from
  *another* file leaves an ambiguous call site behind with a live edge to the
  surviving candidate, and an orphaned definer site whose macro becomes
  characterised leaves its call sites behind. DES-0014 R6 says RETRACT-FILE
  needs nothing; that is true of the analyzer's third and false of the other
  two. Step 9 is the sweep, and it is the step most likely to be skipped
  because nothing fails without it until a week later.

  The ambiguous clause can recurse. A definer-call site whose name is
  ambiguous -- 7 of 132 here -- would mint a call site from a call site, at a
  key derived from the first one's file and line, on every pass. Decision 6
  above is the guard and step 8's test is the check.

  Tests likely to break, and why:

    - src/graph/test/resolve.lisp: resolve-refuses-to-guess-between-two-
      definitions-of-a-name asserts today's behaviour directly and must be
      rewritten in step 8, not deleted. Its replacement asserts the caller
      still has no direct edge to either candidate.
    - src/graph/test/resolve.lisp: resolve-records-what-did-not-link-without-
      consuming-what-did and any test asserting :UNRESOLVED-CALLS contents
      where the name is ambiguous. Ambiguous names leave :UNRESOLVED-CALLS in
      step 8, by design (REQ-0015 R3 keeps only names matching nothing).
    - src/analyzer/test/lisp-analyzer.lisp: any test counting the ops
      ANALYZE-FILE returns for the fixture, once step 6 adds call sites to it.
    - src/workspace/test/workspace.lisp: reindexing-produces-an-identical-index
      and an-incremental-update-matches-a-full-rebuild. These are the two that
      matter most and neither should break: if either does, a call site's key
      depends on something that is not (file, line, name), which is exactly the
      failure decision 1 exists to avoid.
    - src/knowledge/test/services.lisp: anything asserting the exact shape of
      ENTITY-SUMMARY's plist (step 10).

  STEPS

  Step 1 -- the census, and the re-baseline. First step that can be run; it is
  also the only step before which nothing has changed.

  Confirm BUG-0016's first half has already landed: DES-0014 says it is cheap,
  independent and should go first, and it did, on 2026-08-09.
  BODY-SWALLOWING-MACRO-NAMES is at src/graph/resolve.lisp:457-503 and
  UNHANDLED-DEFINER-MACROS folds its population in, so `check` reports four
  definer macros with per-macro counts. Nothing to write; confirm and move on.

  Write tools/call-site-census.lisp: index this tree, then report the three
  populations exactly as the table under BEFORE ANYTHING gives them, including
  the resolve/no-resolve split and the per-macro breakdown. It must use
  LOOM-GRAPH's own EFFECTIVE-GENERATOR-REGISTRY, GENERATED-DEFINITION-PLAN and
  CALLABLE-INDEX rather than reimplementing any predicate, so that what it
  measures is what the passes will do.

  Verification: the script reproduces the numbers above (481 / 132 / 20 / 18);
  then `tools/loom.sh 'status'` re-read and recorded, because the script is
  itself a file this tree indexes and the entity baseline has just moved.
  Record the new baseline in this plan.

  Step 2 -- a keyword in operator position is not a call. BUG-0020.

  In COLLECT-CALL-NAMES (src/analyzer/lisp-analyzer.lisp:52), the clause that
  notes an operator name drops a head that is a keyword. TOKEN-NAME renders
  :FILE and FILE identically, which is why the whole tree cannot currently tell
  `(:unresolved-references list)` from a call; the test is on the symbol, in
  the walk, before TOKEN-NAME is applied. Nothing else in the walk changes: the
  FUNCTION exception, the head-only discipline and QUOTATIONP are untouched.

  File docs/bugs/BUG-0020.yaml recording the defect BUG-0016's FIX PART 1
  identified and left unfiled, its measured population (177 of defentity's
  pairs, 19 of defrelationship's, and the five that would have crossed
  loom-ontology's boundary), and its fix. Status fixed on landing.

  Verification, and this step is all verification: re-run the census and record
  the new orphan counts; run `tools/loom.sh 'status | check'` and record the
  :CALLS edge movement, the definer-macro count -- which may fall from 4 to 3
  or 2, since DEFRELATIONSHIP's 12 names are entirely keyword heads and
  BODY-SWALLOWING-MACRO-NAMES needs a non-empty :CALL-NAMES -- and the rule
  violation count. A test in src/analyzer/test/lisp-analyzer.lisp handing
  ANALYZE-SOURCE a body containing a literal `(:file string :required t)` in a
  non-quoted list asserts "file" is absent from :CALL-NAMES; it records "file"
  today, so it fails without this step (CON-0003).

  Step 3 -- the ontology, minting nothing.

  In src/ontology/code-ontology.lisp, beside the other definition types:

    DEFENTITY :call-site, natural key (:file :start-line :call-name),
    properties :file (required), :start-line (required), :end-line,
    :call-name (required), :referrer-kind (keyword, one-of :variable :class
    :definer-call :ambiguous), :candidate-count (integer), :call-names (list),
    :unresolved-calls (list), :generated-by (string), :language, :system.

  Then, in the same file and immediately below it so the key and its
  constructor cannot drift apart, CALL-SITE-LABEL (call-name file start-line)
  returning "<call-name>@<file>:<line>", and MAKE-CALL-SITE-ENTITY taking
  :file :start-line :end-line :call-name :referrer-kind :candidate-count
  :language :system :generated-by, setting NAME to the label and ORIGIN-FILE to
  the file. Natural-key properties are passed at construction and never SETP'd
  afterwards, for the reason the comment at lisp-analyzer.lisp:415 gives.
  Export both from src/ontology/package.lisp.

  Widen three endpoint lists and no others: :CALLS :from gains :call-site;
  :CONTAINS :to gains :call-site; :CONTAINS :from gains :variable, :function,
  :method and :test. Each widening gets a sentence of documentation naming
  DES-0014 and, for the caller-side :CONTAINS, decision 3 above.

  Tests in src/ontology/test/code-ontology.lisp: the derived id is
  "call-site:a.lisp:12:target"; two constructions with identical inputs derive
  identical keys; a :CALLS edge from a call site and a :CONTAINS edge from a
  variable and from a function each validate.

  Verification: full suite green, `status` byte-identical to step 2's -- no
  entity of the new type exists yet, which is what makes this step reviewable
  on its own.

  Step 4 -- RESOLVE-CALLS learns a fourth kind of caller. Still mints nothing.

  In src/graph/resolve.lisp, RESOLVE-CALLS' caller loop takes '(:function
  :method :test :call-site). Add CALLER-CALL-NAMES (caller): for a :call-site,
  the one-element list of its :call-name; for the rest, :call-names as today.
  Everything downstream -- CALL-TARGETS, the confidence branch, the
  :UNRESOLVED-CALLS write -- is untouched and now applies to call sites too.

  Confirm RESOLVE-TESTS is unaffected: it walks RELATIONSHIPS-FROM a :TEST and
  filters on *TESTED-TYPES*, so an edge sourced at a call site is not a test's
  edge and the "481 tests covering 322 units" line must not move. This is R7's
  third clause and it is confirmed here, where the change that could break it
  lands.

  Test in src/graph/test/resolve.lisp: a hand-built :CALL-SITE entity carrying
  :call-name "target" beside a function TARGET in another file resolves to one
  :CALLS edge from the call site. It fails without this step because
  RESOLVE-CALLS does not look at the type.

  Verification: full suite green, `status` unchanged. No pass mints a call
  site yet, so the loop runs over an empty population.

  Step 5 -- the ceiling test, before there is anything to count.

