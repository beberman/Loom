id: PLAN-0023
title: Prepare a tree, ask before touching what is not ours, and record enough to undo it
status: final
date: 2026-08-13
refines: [DES-0022]
affects: [set-document-status, complete-plan, repository-commit, watch-repository,
          document-category, register-document-type, repository-status]
tags: [init, bootstrap, consent, manifest, req-0021]
summary: |
  DES-0022 S2: the directories, the workflow concept, the skill, the CLAUDE.md
  pointer, the .mcp.json registration and the manifest that makes all of it
  removable. The Loom-side half only -- a command with tests behind it, which
  D3 requires because a shell script is the one artifact nine test systems do
  not cover.

  The decisions D6 left open are settled here rather than deferred again, and
  the settling is short: one manifest file holding every choice and every path
  written, markers around anything appended to a file Loom did not write, and a
  workflow concept transcribed from a template in this tree rather than
  generated from CON-0004.

  Nothing in this plan runs against a repository anybody cares about. The tests
  build scratch trees and the acceptance runs against a copy of game-server,
  not game-server.
body: |
  WHAT D6 LEFT OPEN, SETTLED

  The manifest is one file, `.loom/manifest.yaml`, in the prepared tree. YAML
  because everything else Loom writes is YAML and a human opening it should not
  meet a third format; under `.loom/` rather than in the document directory
  because it is Loom's bookkeeping and not one of the team's documents -- it
  must not be indexed, and a dot-directory is already skipped by
  REPOSITORY-FILES. It holds the chosen document directory (R2), the consent
  answers (R16), and every path init created or appended to (R13b).

  One file rather than two: R2 needs the directory recorded and R13b needs the
  output recorded, and splitting them would make removal read two files that
  can disagree.

  The workflow concept is transcribed from a template in this tree, not
  generated from CON-0004. Generating it would couple a prepared workspace's
  conventions to this repository's own document, so editing CON-0004 would
  silently change what the next prepared tree is told -- and CON-0004 contains
  Loom-specific history that has no business travelling. The template is a
  separate file that a human maintains knowing it is copied.

  The service endpoint is a parameter with a default of 127.0.0.1:4780,
  substituted into the skill and the CLAUDE.md pointer. A team running Loom on
  a shared host needs it, and hard-coding localhost would be discovered by that
  team rather than by us.

  FILES

  src/workspace/init.lisp         new. PREPARE-REPOSITORY and the manifest.
  src/workspace/templates/        new. The workflow concept, the skill, the
                                  CLAUDE.md pointer, the .mcp.json fragment.
  src/workspace/package.lisp      exports PREPARE-REPOSITORY, REMOVE-PREPARATION.
  src/workspace/loom-workspace.asd  the new component and its test component.
  src/workspace/test/init.lisp    new.
  src/process/console.lisp        `init` and its consent arguments.
  src/serve/operations.lisp       :INIT, write tier.

  Not this plan: the shell script, and starting or finding the service. D3
  gives those to the script because only a script can do them, and the command
  has to exist before a script can call it.

  Not this plan: S3's generated ARCH documents and S4's removal. REMOVE-
  PREPARATION is exported and stubbed to the manifest read only -- S4 fills it.

  RISKS

  Writing into a repository that is not ours is the whole risk and it does not
  reduce to one item. Three shapes, all guarded differently:

  A file we did not write, damaged. Only CLAUDE.md and .mcp.json are ever
  appended to, only between markers, and only after the file has been read and
  found not to contain our markers already. Everything else is create-only and
  refuses rather than overwrites.

  A partial preparation. Init writes a directory tree, several documents and up
  to two appends, and a filesystem is not transactional. The transition command
  already solved this shape -- plan every write, refuse on any problem, then
  apply -- and this reuses that discipline rather than inventing a second one.

  A run that cannot be undone. The manifest is written *before* the files it
  records, not after, so a run that dies midway leaves a manifest naming what
  it intended and removal has something to work from. A manifest written last
  is a manifest that does not exist exactly when it is needed.

  And one that is not about writing: the acceptance must not run against
  game-server. It runs against a copy. A test that prepares somebody's
  actual repository to prove it can is a test that has already done the damage
  it was checking for.

  STEPS

  1. The manifest: read, write, and the "already prepared" test. First because
     every later step records into it and because idempotence (R17, R11) is
     decided by it.

  2. The template set and their substitution. The workflow concept, the skill,
     the CLAUDE.md pointer, the .mcp.json fragment; substitutions for the
     document directory and the service endpoint. Templates as files in the
     tree rather than strings in the source, so a human can read what a
     prepared workspace will be told.

  3. PLAN-PREPARATION: every directory to create, every file to write, every
     append to make, and every problem, computed before anything is written.
     The transition command's split, applied to a wider set of writes.

  4. APPLY-PREPARATION, and the marked append. A marked region is written only
     when the file does not already contain one; a file with our markers is
     already prepared and the run reports it and changes nothing.

  5. Consent: two answers threaded through as arguments -- prepare, and
     append-to-claude-md -- with no prompting inside the command. A command
     that prompts cannot be called by a script, a test or the service, and R16
     puts the asking in the script where a terminal is.

  6. The console command and the :INIT operation.

  7. Tests: a fresh tree, a tree with a CLAUDE.md, a tree that declines the
     append, a second run, a tree with an existing docs/ directory, and a
     refusal leaving nothing written.

  8. Acceptance: prepare a *copy* of game-server, then index the copy
     and require that the document count rises by exactly what the manifest
     records, that `unresolved` stays at 0, and that a second run changes
     nothing. Then report what a run against the real tree would do, and ask
     before doing it.

  9. Close it: `complete PLAN-0023 DES-0022=<verdict> REQ-0021=<verdict>`. Both
     stay partial -- S3 and S4 remain -- so this plan's own completion is the
     case BUG-0026 was about, and the verdicts must name only what the walk
     reaches.

  VERIFICATION

  Per step; then `tools/synoptik-test.sh`, and `tools/synoptik.sh 'status' 'check'`.
  The call-site ceiling will move again -- one console command and one
  operation -- so census it rather than adjusting it.

  OUTCOME

  Steps 1 to 8 landed; step 9 is this document being completed. Twelve tests in
  a new `init` suite, 55 checks, nine of nine systems.

  TWO THINGS THE TESTS FOUND IN THE CODE, NOT IN THEMSELVES

  The refusal path could not fire. PLAN-PREPARATION had one problem branch --
  the workflow concept's file already existing -- and it was unreachable, because
  NEXT-DOCUMENT-ID allocates the next *free* id and every other branch works
  around what it finds: an occupied skill is skipped, an occupied .mcp.json is
  reported. So the plan-then-apply split had no input that could refuse, and a
  split that can never refuse has never been tested. Added the check that makes
  it real -- a plain file where a document directory has to go -- and the test
  now witnesses a whole run refusing and leaving nothing behind, manifest
  included.

  The manifest could not tell created from appended. It recorded
  `claude-md-appended: yes|no', and a tree with no CLAUDE.md gets one *created*,
  which is not an append. Removal has to tell those apart: a file Loom created
  is deleted whole, a file Loom appended to has a marked region cut out of it,
  and confusing them deletes somebody's document. Now three-valued --
  created, appended, skipped.

  Both were found by writing the assertion first and watching it disagree with
  the code, which is the only way either would have surfaced before S4 tried to
  remove something.

  ONE DECISION MADE DURING THE WORK

  .mcp.json is create-only and is never appended to. JSON has no comment
  syntax, so there is no marker that survives a parse -- and merging into
  somebody's existing server list is precisely the merge R3 forbids. Where one
  exists, init reports it and says the loom server has to be added by hand.
  That is a real gap in R18 and the honest form of it: the alternative is
  parsing and rewriting a file Loom did not write.

  ACCEPTANCE, ON A COPY

  Run against a copy of game-server, never the tree itself:

      wrote 4 files:
        docs/concepts/CON-0001.yaml
        .claude/skills/loom/SKILL.md
        .mcp.json
        CLAUDE.md

  `git status` in the copy showed exactly those four against the pre-existing
  working-tree changes, and the author's 171-line CLAUDE.md is byte-identical
  above the appended region. Indexing the prepared copy: 146 -> 147 files,
  12 -> 13 documents, `unresolved` 0 both before and after -- R11's numbers
  exactly. A second run reported "already prepared", wrote nothing, and left
  CLAUDE.md md5-identical.

  Worth recording from that run: only `docs/concepts/` appears in `git status`
  of the nine document directories created, because git does not track empty
  directories. That is R13b's argument demonstrated rather than asserted --
  removal cannot infer an empty directory from anything, so the manifest is the
  only record that it was made.

  THE CEILING DID NOT FIRE

  194 against 208. Censused anyway, per the plan: ambiguous still 16, the growth
  is the console command and the operation this plan added. The re-measurement
  made last time left the headroom this one needed.

  WHAT IS STILL NOT DONE

  The shell script and starting or finding the service (DES-0022 D3 gives those
  to a script), S3's generated ARCH documents, and S4's removal.
  REMOVE-PREPARATION is not written; the manifest that S4 needs is, and the
  three-valued CLAUDE.md field is there because S4 will need to read it.

