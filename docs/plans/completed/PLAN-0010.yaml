  9. ENRICH-REPOSITORY: THE FIRST TIME ANYTHING WRITES IMAGE FACTS.

     Files: src/workspace/workspace.lisp, src/workspace/package.lisp,
     src/workspace/test/workspace.lisp.

       (defun enrich-repository (repository &key quiet inspectors) ...)

     Order, and every arrow is a dependency rather than a preference, exactly
     as RESOLVE-AND-CHECK's docstring says of its own sequence:

       find inspectors for the languages present
       -> INSPECTOR-AVAILABLE-P each, recording absences with their reasons
       -> INSPECT-REPOSITORY each
       -> ENRICH-OPS (graph, inspection)
       -> APPLY-TRANSACTION
       -> RESOLVE-AND-CHECK

     RESOLVE-AND-CHECK last and not first: an image-minted definition is
     exactly what an unresolved text call name has been waiting for, so a text
     call to a DEFENTITY accessor becomes a :structural edge in the same run
     the accessor appears. That is where the two passes compose, and running it
     first would defer every such edge to the next poll.

     Wrap the body in WITH-REPOSITORY-LOCK, for the reason INDEX-REPOSITORY
     wraps its own (DES-0004 R3): this writes to the graph and reads
     REPOSITORY-STAMPS-adjacent state, and a poll running concurrently would
     interleave two writers.

     Handle conditions the way INDEX-FILE does -- NOTE-ERROR and continue, per
     SS3.3. An inspector that signals must not take the console down.

     The repository struct gains one slot, ENRICHMENT, holding the report
     plist: per-unit statuses, absences with reasons, drop counts, edge
     confirm/add counts, duration, and a run counter. In memory only -- it is
     derivable by re-running, so DEC-0001 does not ask for a file.

     REPOSITORY-STATUS gains four SCALAR keys and no nested structure:
     :enrichment-runs, :enriched-units, :enrichment-gaps, :enrichment-at. The
     scalar constraint is not style: this plist is serialized to JSON by
     loom-serve's status operation (src/serve/operations.lisp:152) for REST and
     MCP callers, no rule covers that boundary, and a nested plist is the shape
     most likely to serialize into something a client cannot read.

     Tests:
       (a) On a fixture repository with a stub inspector returning a fixed
           inspection, ENRICH-REPOSITORY adds the expected entity and edge,
           and the text pass's facts are untouched (the step 2 (a) guard,
           re-run one layer up).
       (b) A language with no inspector produces an absence with a reason in
           the report, no error, and an index identical to before. REQ-0018 R2.
       (c) A previously unresolved text call name resolves in the same run --
           assert an entity's :unresolved-calls shrinks and the corresponding
           :CALLS edge appears. This is the compose property and it fails if
           RESOLVE-AND-CHECK is called before ENRICH-OPS rather than after.
       (d) REPOSITORY-STATUS's four new keys are present and are numbers or
           NIL, never a list.

