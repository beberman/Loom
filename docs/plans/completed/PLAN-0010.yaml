id: PLAN-0010
title: Sequence DES-0011 -- an isolated per-language inspector, a graph-aware merge, and an explicit enrich verb, in twelve steps that never let a blind assert reach the graph
status: final
date: 2026-08-07
refines: [DES-0011]
affects: [absorb-properties, absorb-relationship, absorb-provenance, absorb-entity,
          apply-transaction, assert-edge, entity-natural-key, facts-from-file,
          index-origin, resolve-and-check, index-repository, poll-once,
          repository-status, register-analyzer, find-analyzer, analyzer-handles-p,
          read-forms-with-spans, workspace-relative-path, provenanced, source,
          confidence,
          enrich-ops, enrich-repository, enriched-edge, union-sources,
          designator-key, implemented-interface-p, resolve-calls,
          generated-definition-plan, discover-units, write-driver-script,
          read-inspection-file, register-inspector, find-inspectors]
tags: [analyzer, graph, workspace, introspection, provenance, isolation, plan]
summary: |
  Twelve steps implementing DES-0011 R1 through R12, across loom-ontology,
  loom-graph, loom-analyzer, loom-workspace and loom-process. The order is
  forced by one hazard stated in DES-0011 and re-verified here: ABSORB-
  PROPERTIES replaces a matched entity's property table wholesale, so an
  image-pass assert landing on a text-pass natural key erases :call-names and,
  with it, the 50 :TESTS edges and 58 inbound :CALLS edges APPLY-TRANSACTION
  carries today. Nothing in this plan may spawn a child process until the merge
  that protects those facts exists and is tested. So: the ontology vocabulary
  widens first (step 1, the only step whose predecessor is nothing), ENRICH-OPS
  is built and proven against hand-written facts with no subprocess anywhere
  (steps 2 and 3), the inspector registry and the child driver are built and
  run standalone with nothing consuming them (steps 4, 5, 6), the bounds are
  proven to fire rather than merely configured (step 7), and only at step 9
  does anything write image facts into a real repository index. Two corrections
  to DES-0011 are carried, both mechanical: the inspection must cross into
  loom-graph as a plist and not as a loom-analyzer struct, because loom-graph
  depends on loom-ontology alone; and ASSERT-EDGE has no properties parameter,
  so the :sources union needs a constructor of its own in enrich.lisp. Out of
  scope, deliberately: BUG-0011, BUG-0012 and BUG-0013 (the user's order is
  REQ-0018 first), exposing enrich as a loom-serve operation, automatic re-run
  policy, and any change to how describe or impact render confidence.
body: |
  FILES

  Created:

    src/analyzer/inspector.lisp
        The INSPECTOR protocol and registry: INSPECTOR, INSPECTOR-AVAILABLE-P,
        INSPECT-REPOSITORY, *INSPECTORS*, REGISTER-INSPECTOR, FIND-INSPECTORS,
        and the plist accessors for an inspection. Mirrors analyzer.lisp's
        shape deliberately (step 4).

    src/analyzer/lisp-inspector.lisp
        LISP-INSPECTOR: unit discovery, the generated child driver, the
        subprocess call with its bounds, the result-file reader, the compound
        method-caller parse, and the line-range recovery (steps 5, 6, 7, 8).
        The only file in the tree that knows what SBCL is.

    src/graph/enrich.lisp
        ENRICH-OPS and its helpers, beside resolve.lisp (steps 2, 3).

    src/analyzer/test/inspector.lisp
        Registry tests, driver-script tests, subprocess tests, bound tests,
        span-recovery tests (steps 4-8).

    src/graph/test/enrich.lisp
        The R5 protection tests and the key-equality fixture (steps 2, 3).

    src/analyzer/test/fixtures/inspect/
        Four tiny ASDF systems used only by the child, never by Loom's own
        registry: fixture-ok (loads clean; a DEFUN calling a DEFUN, a
        DEFGENERIC with an inline method, a DEFMACRO generating an accessor),
        fixture-boom (signals an ERROR at load), fixture-hang (a top-level
        (loop) that never returns), fixture-hog (allocates past any sane heap
        cap). Each is one .asd plus one .lisp (steps 5-7).

  Changed:

    src/ontology/root-ontology.lisp
        One line: the SOURCE slot's :type gains :introspected (step 1).

    src/ontology/test/root-ontology.lisp
        Vocabulary tests (step 1).

    src/analyzer/loom-analyzer.asd
        Two components added; :depends-on gains #:uiop (steps 4, 5).

    src/analyzer/package.lisp
        The six inspector names exported (step 4).

    src/graph/loom-graph.asd, src/graph/package.lisp
        enrich.lisp added; ENRICH-OPS exported (step 2).

    src/graph/test/loom-graph.asd component list
        (inside loom-graph.asd) gains "enrich" (step 2).

    src/workspace/workspace.lisp, src/workspace/package.lisp
        ENRICH-REPOSITORY, the repository's ENRICHMENT slot, four new scalar
        keys on REPOSITORY-STATUS (step 9).

    src/workspace/test/workspace.lisp
        The orchestration tests and the POLL-ONCE negative test (steps 9, 10).

    src/process/console.lisp
        The `enrich [repo]` command and its help row; PRINT-STATUS gains one
        enrichment line (step 10).

    src/process/test/console.lisp
        The verb's test (step 10).

    CLAUDE.md, .claude/skills/loom/SKILL.md, .claude/agents/tools.md
        The enrich verb and the one-line statement that enrichment is
        optional, on demand, and self-aging (step 12, DES-0011 R12).

    docs/design/DES-0011.yaml, docs/requirements/REQ-0018.yaml,
    docs/plans/PLAN-0010.yaml
        Statuses restated (step 12, RULE-0005).

  Not changed, and worth saying so: no file under src/knowledge/, src/serve/,
  src/rest/ or src/mcp/. `find`, `describe`, `impact` and `context` read
  entities and edges without caring which pass produced them, and the four
  scalars step 9 adds to REPOSITORY-STATUS reach REST and MCP through
  loom-serve's existing status operation without either system being edited.
  loom-process's console.lisp is edited (the verb), which is expected: it is
  the command surface, and DES-0006 R5's "console.lisp unedited" constraint
  was about loom-serve's construction, not about adding a console command.

  BLAST RADIUS

  What Loom says. `impact apply-transaction 2` returns 108 entities
  (truncated), and the useful part is the first tier: eight function callers --
  DETECT-DELETIONS, RESOLVE-AND-CHECK, INDEX-FILE, RF-POPULATE,
  LITERAL-ENTITY, DOCS-ENTITY, ANALYZE-SOURCE, ANALYZE-FIXTURE -- plus fifty
  :TEST entities. `impact resolve-and-check 2` returns 15: INDEX-REPOSITORY
  and POLL-ONCE directly, then WATCH-REPOSITORY, REINDEX-REPOSITORY and
  MONITOR-LOOP. Those two sets are the whole of what step 9 touches on the
  write path.

  Measured baseline, taken today (2026-08-07) with `tools/loom.sh 'describe
  apply-transaction'` and `status`, and the numbers this plan is graded on:

    Loom index        147 files, 1377 entities, 6354 relationships
    documents         65
    tests             379 tests covering 250 units
    rules             32 violations, 2 unenforced
    unresolved        0 document references, 1 definer macro
    apply-transaction 50 inbound :TESTS edges, 58 inbound :CALLS edges
                      (the 50 :TEST entities plus the 8 functions above)

  The 50 and the 58 are counted, not estimated: the `<- tests:` list in
  `describe apply-transaction` has exactly 50 names, and `<- calls:` has those
  same 50 plus the 8 functions. REQ-0018's "roughly 50" and the task's "~51"
  both mean this set. Step 11's R7 guard is that both numbers are unchanged
  after `enrich` and that the 58 edges keep their ids.

  Where Loom is blind here, stated as blindness and not as a clean bill:

  - Calls inside a macro body are unattributed (DES-0001), so every `test`
    and `def-suite` form under-reports. That is the reason the 50 :TESTS edges
    exist in Loom and cannot exist in xref, which is not a defect in this
    context -- it is the fact R5 protects.
  - `check` reports 32 rule violations today. PLAN-0009 recorded them as 32
    RULE-0003 lines with no RULE-0002 line; BUG-0009 (open) says every one is
    a false positive. Compare the shape, not only the total. Nothing in this
    plan can legitimately move it, and RULE-0001 stays at zero because no .asd
    gains a dependency on anything above it.
  - No rule and no impact query covers the loom-serve / loom-rest / loom-mcp /
    loom-process boundary. This plan reaches it in exactly one place -- the
    four scalars added to REPOSITORY-STATUS, which loom-serve's status
    operation serializes to REST and MCP callers -- and that reach is read off
    src/serve/operations.lisp:152 by hand, not reported by any tool. Step 9
    runs the loom-rest and loom-mcp suites for that reason.
  - Loom cannot see a subprocess at all. Nothing in the index will ever record
    that lisp-inspector.lisp drives /usr/bin/sbcl, so the child protocol's two
    halves -- the generator in the parent and the code it generates -- are
    coupled by a string with no edge between them. Step 5 makes the generated
    script's shape a tested artifact for that reason.

  Read off the .asd files rather than from `check`, per DES-0011's own
  instruction: loom-analyzer depends on loom-ontology and cl-yaml, and gains
  only #:uiop, which ships with ASDF and adds no system; loom-graph depends on
  loom-ontology and bordeaux-threads and gains nothing; loom-workspace already
  depends on all three; loom-process already depends on loom-workspace. The
  layering table is unchanged.

  TWO CORRECTIONS TO DES-0011, BOTH MECHANICAL

  C-1  The inspection cannot cross into loom-graph as a loom-analyzer struct.
       DES-0011 says INSPECT-REPOSITORY returns "an INSPECTION: plain data",
       and ENRICH-OPS in loom-graph consumes it -- but loom-graph.asd depends
       on loom-ontology and bordeaux-threads only, so it cannot name a
       loom-analyzer accessor. This is the same wall RESOLVE-GENERATED-
       DEFINITIONS hit with *MACRO-GENERATORS*, and it takes the same answer:
       the thing that crosses is plain data handed across by loom-workspace,
       the first system that uses both packages. Concretely, the in-memory
       shape IS the wire shape -- the (:loom-inspection 1 :language ... :units
       ... :definitions ... :calls ...) plist of DES-0011's CHILD PROTOCOL,
       read with GETF on both sides. loom-analyzer may define accessor
       functions over it for its own convenience; loom-graph uses GETF and
       names nothing from loom-analyzer.

  C-2  ASSERT-EDGE takes no properties. DES-0011 R6 requires a confirmed edge
       to carry :sources, and ontology-ops.lisp:91's ASSERT-EDGE has no
       parameter for it. Rather than widen a constructor every analyzer calls,
       enrich.lisp defines ENRICHED-EDGE: the same MAKE-INSTANCE 'RELATIONSHIP
       plus :properties (properties-table (list :sources ...)), wrapped in
       ASSERT-RELATIONSHIP. Relationship properties are schema-free, so no
       declaration is needed. ENRICHED-EDGE must compute ORIGIN-FILE exactly as
       ASSERT-EDGE does -- (origin-file from), the caller entity's own origin
       file -- and never from the child's :caller-file string. See R-3.

  RISKS

  R-1  A blind assert erases the text pass. The single failure this plan is
       shaped around. ABSORB-PROPERTIES (src/graph/transaction.lisp:119)
       CLRHASHes the target's table before copying, and ABSORB-PROVENANCE
       overwrites all five provenance slots, so one ASSERT-ENTITY onto an
       existing natural key silently drops :call-names, :specializers,
       :unresolved-calls and everything else the text pass wrote -- and
       :call-names is RESOLVE-CALLS' only input, so the next resolution pass
       rebuilds nothing and the 50 :TESTS edges never come back. Mitigation is
       structural, not procedural: ENRICH-OPS looks every definition up by
       natural key first and emits ASSERT-ENTITY only on a miss (step 2), and
       no step before step 9 lets any op reach a repository graph at all.
       Step 2's verification includes making the guard fail on demand.

  R-2  The natural key computed from image facts does not match the text
       pass's. :FUNCTION keys on (:file :name); :METHOD keys on (:file :name
       :qualifier :specializers) -- read off code-ontology.lisp:149 and 265.
       Every component is a rendering: :file is the workspace-relative,
       forward-slashed path WORKSPACE-RELATIVE-PATH produces; :name is
       DEFINITION-NAME's downcased string, with (setf foo) rendered as
       "(setf foo)"; :specializers are SPECIALIZER-NAME's strings, with an EQL
       specializer rendered "(eql :svg)" and an unspecialized parameter "t".
       Any drift makes the image pass mint a duplicate entity beside the text
       one instead of confirming it -- which looks like success (entities
       went up) and is a silent doubling. Step 3's key-equality fixture is the
       guard, and CON-0003 applies to it: it must fail if either side's
       rendering moves.

  R-3  A confirmed edge changes its origin-file and the origin index goes
       stale. INDEX-ORIGIN is called from ADD-ENTITY (graph-manager.lisp:135)
       and ADD-RELATIONSHIP (line 200) and from nowhere else -- an absorb
       overwrites ORIGIN-FILE without touching the index. So if ENRICH-OPS
       asserts a confirmed :CALLS edge with a different origin-file than the
       text pass gave it, the edge's provenance says one file and the index
       that RETRACT-FILE consults says another, and the edge stops aging out
       when its caller is edited. This is a pre-existing latent defect in
       absorb, not one this plan introduces, and the plan's job is not to
       trigger it: ENRICHED-EDGE takes origin-file from the resolved caller
       entity, identically to ASSERT-EDGE, so a confirmed edge's origin-file is
       equal by construction. Step 3 asserts that equality directly rather
       than trusting it. If a later plan wants absorb to maintain the origin
       index, this paragraph is the case for it.

  R-4  The self-aging claim is unverified until someone verifies it.
       DES-0011 asserts that image facts with honest origin-files are aged out
       by existing RETRACT-FILE machinery with zero new staleness code. Read
       against the code the claim holds: RETRACT-FILE-OP calls FACTS-FROM-FILE,
       which reads GRAPH-ORIGIN-INDEX keyed by the origin-file string, and
       REMOVE-ENTITY drops inbound edges with the entity -- so an :introspected
       accessor entity minted at src/ontology/root-ontology.lisp vanishes when
       that file is re-analyzed, and comes back only at the next enrich. Two
       consequences the claim does not state and a reader will need: the
       aging-out is keyed on string equality of the path, so the relative-path
       rendering of R-2 is load-bearing here too (an absolute path would never
       match, and the fact would never age out -- it would become the permanent
       lie CON-0001 forbids); and an :introspected edge into a retracted entity
       is destroyed with it and is not rebuilt by RESOLVE-CALLS, because
       RESOLVE-CALLS derives from :call-names and the image pass writes none.
       Between enrich runs the index therefore degrades toward the text index,
       which is exactly what DES-0011 promises. Step 8 tests both halves. The
       claim holds; it deserves the test precisely because nothing else in the
       system guarantees "degrades rather than lies".

  R-5  Partial failure that reports nothing looks like a clean tree. A pass
       whose child dies on unit one and returns an empty facts document
       produces zero new entities, zero drops, and no error -- indistinguishable
       from a tree the image agrees with completely. Mitigation: unit statuses
       are the primary output, not the facts; ENRICH-REPOSITORY's report
       distinguishes "no inspector for this language" (R2's recorded absence)
       from "inspector present, unit attempted, unit failed" from "unit
       loaded"; and `enrich` prints per-unit status lines unconditionally,
       zero included, on the DES-0002 R10 precedent that a count which
       vanishes when it is nought cannot be told from a count nobody computes.
       Step 7 tests the failure path before step 9 tests the success path on a
       real tree.

  R-6  The child's per-unit HANDLER-CASE guards the wrong condition type. This
       is RULE-0004 with a measured instance. Probed today under /usr/bin/sbcl:
       a MAKE-ARRAY beyond --dynamic-space-size inside
       (handler-case ... (error (c) ...)) is NOT caught -- the child prints the
       heap-exhaustion table and dies with "unhandled condition in
       --disable-debugger mode", exit 1 -- while the same form inside
       (handler-case ... (storage-condition (c) ...)) catches
       HEAP-EXHAUSTED-ERROR, prints, and the child continues to the next form,
       exit 0. The child's per-unit guard must therefore be SERIOUS-CONDITION
       (or STORAGE-CONDITION and ERROR listed separately), never ERROR alone.
       Step 6 writes it that way and step 7 proves it with fixture-hog.

  R-7  The unit set changes the acceptance numbers, and REQ-0018 R8 does not
       say which set it means. REQ-0018 measured WHO-CALLS APPLY-TRANSACTION as
       3 callers with only :loom-process loaded and 8 with the test systems
       also loaded; the extra five -- RF-POPULATE, DOCS-ENTITY, ANALYZE-SOURCE,
       ANALYZE-FIXTURE, LITERAL-ENTITY -- are DEFUNs in test files. So "the
       image confirms 8 of the 58 inbound :CALLS edges" is true only when the
       test systems are units. This plan makes the unit set an explicit knob
       (DES-0011 defers the default to the plan): primary systems only by
       default, test systems included by a keyword. Step 11 states which
       setting each measurement was taken under. What does not vary either way:
       58 inbound :CALLS edges and 50 inbound :TESTS edges, before and after.

  R-8  Isolation breaks a target that needs the network. `unshare --user --net`
       was probed end-to-end today, not merely for exit status: game-server's
       UTILS system loads inside `unshare --user --net /usr/bin/sbcl --script`
       both with a warm fasl cache and with a cold one (ASDF_OUTPUT_TRANSLATIONS
       pointed at an empty directory, so every file was compiled fresh inside
       the namespace). So the wrapper does not break compilation or cache
       writes here. What it does break is a target whose dependencies are not
       yet installed: quicklisp cannot download inside --net, and the failure
       arrives as a unit load failure rather than as anything self-describing.
       The wrapper is therefore a slot on the inspector with a probe behind it,
       and a unit that fails under isolation is worth retrying once without it
       only if a later plan decides so -- this one does not.

  R-9  Suite runtime grows. Steps 5 through 8 add tests that spawn child SBCLs;
       fixture-hang deliberately burns its whole timeout. Keep the test timeout
       parameter bound to 2-3 seconds in tests (the probe measured `timeout 2`
       killing a hung SBCL at exactly 2.00s, exit 124) and keep fixture systems
       to one file each. Expect tools/loom-test.sh to grow by roughly 15-30
       seconds, and say so in step 8's completion note so a later slowdown has
       a baseline to be compared against.

  R-10 Tests likely to break, and why:
         Any test asserting an exact key set on REPOSITORY-STATUS -- step 9
           adds four keys. src/workspace/test/workspace.lisp:133 and :424 read
           status with GETF, which is additive-safe; src/rest/test/
           concurrency.lisp:103 does the same. Verify rather than assume.
         The loom-rest and loom-mcp suites -- they serialize whatever
           REPOSITORY-STATUS returns. Four scalars are safe; a nested plist
           may not be, which is why step 9 forbids one.
         Every test that counts entities over Loom's own tree -- steps 1
           through 12 add source files, so totals move for reasons unrelated to
           enrichment. The attributable measurement in step 11 is the count of
           entities carrying :source :introspected, which is zero before the
           first enrich by construction.
         src/analyzer/test/analyzer.lisp registry tests -- step 4 adds a second
           registry beside *ANALYZERS*. Nothing shared, but the file is edited.

  STEPS

  Step 1 is the first that can be run, and it is deliberately trivial: it is
  the only step with no predecessor, and everything from step 2 on asserts
  :source :introspected on an object whose slot type would otherwise refuse it.

  1. WIDEN THE PROVENANCE VOCABULARY.

     Files: src/ontology/root-ontology.lisp, src/ontology/test/
     root-ontology.lisp.

     One production line. The SOURCE slot at root-ontology.lisp:39 becomes

       :type (member :structural :inferred :human-validated :introspected)

     and gains a docstring naming the four members and what each means: a fact
     read from text, a fact derived by a resolution pass with fractional
     confidence, a fact a human asserted, and a fact the language's own
     toolchain reported. This is the entire ontology cost of REQ-0018 R6 -- no
     new entity type, no new relationship type, no widened endpoint.

     Tests, in the ontology suite:
       (a) An ENTITY constructed with :source :introspected has (source e) eq
           :introspected, and survives ABSORB-PROVENANCE from another entity
           carrying the same value.
       (b) A RELATIONSHIP likewise.
       (c) A value outside the four -- :guessed -- is still refused. Note that
           SBCL enforces a slot :type at MAKE-INSTANCE under default safety;
           if it does not in this image, assert through the property or skip
           (c) with a comment rather than writing a test that passes because
           nothing is checked. CON-0003 applies: a test that cannot fail is
           worse than no test.

     Verification: tools/loom-test.sh green. Confirm (a) and (b) fail without
     the production line -- revert it, run the ontology suite, observe a type
     error, restore. That falsification is the step's real verification;
     "the suite is green" is not, since it was green before.

  2. ENRICH-OPS, DEFINITIONS ONLY, WITH THE NEVER-ASSERT-EXISTING RULE.

     Files: src/graph/enrich.lisp (new), src/graph/loom-graph.asd,
     src/graph/package.lisp, src/graph/test/enrich.lisp (new).

     No subprocess exists yet and none is needed: ENRICH-OPS takes a graph and
     a facts plist and returns ops.

       (defun enrich-ops (graph inspection &key workspace-id)
         "=> (values ops report)")

     INSPECTION is the plist of DES-0011's CHILD PROTOCOL, per C-1 above.
     ENRICH-OPS reads it with GETF and names nothing from loom-analyzer.

     This step handles :definitions only; :calls is step 3.

     Mechanism:
       - For each definition, compute its natural key with the ontology's own
         machinery: build the properties the text pass would have written
         (:file, :name, :qualifier, :specializers as applicable) and look the
         key up with FIND-ENTITY-BY-KEY. Read the key components off
         ENTITY-TYPE-NATURAL-KEY rather than hard-coding (:file :name), exactly
         as GENERATED-NATURAL-KEY at resolve.lisp:227 does and for the same
         reason.
       - Key present: emit nothing. Record the id in the report's confirmed
         set, for step 3's endpoint lookups. This is the R5 protection and it
         is the whole reason this pass is graph-aware.
       - Key absent: emit ASSERT-ENTITY with :source :introspected,
         :confidence 1.0, :origin-file = the definition's workspace-relative
         file, and properties including :file, :start-line, :end-line,
         :language :lisp, :system (from DEFAULT-SYSTEM-FOR-PATH's convention --
         pass the value in on the plist rather than reaching for the analyzer),
         plus :qualifier and :specializers for a method. Filter to declared
         properties, as DECLARED-PROPERTIES-ONLY does at resolve.lisp:286.
       - A definition with no :start-line is dropped and counted in the
         report under :dropped-no-location. :START-LINE is :required on every
         code entity type, so there is no honest partial assert (CON-0001).
       - A definition whose :file is absent or does not look workspace-relative
         is dropped and counted under :dropped-not-under-root.

     The report is a plist of counts and lists: :confirmed, :added, :dropped-*
     and (step 3) :edges-confirmed, :edges-added, :edges-dropped.

     Tests (src/graph/test/enrich.lisp):
       (a) THE R5 GUARD, and the most important test in the plan. Analyze a
           two-file literal source through the lisp analyzer, apply to a
           graph, run RESOLVE-CALLS so :CALLS edges and :call-names exist.
           Record, for every entity, its id and its full property table, and
           for every edge its id, endpoints and source. Then run ENRICH-OPS
           with a facts document naming exactly those same definitions, apply
           the ops, and assert: every entity id unchanged, every property
           table EQUAL to what it was, every edge still present with the same
           id, and (length ops) is zero. The last assertion is the sharp one --
           an inspection that names only definitions the graph already has
           must produce no operations at all.
       (b) The falsification of (a), run once by hand and recorded in the
           step's completion note: temporarily delete the FIND-ENTITY-BY-KEY
           check so every definition is asserted, re-run (a), and confirm it
           goes red on the property table -- :call-names gone. Restore. A
           guard nobody has seen fail is a guard over its own output.
       (c) A definition the graph does not hold becomes exactly one
           ASSERT-ENTITY with :source :introspected and the given range.
       (d) A definition with no location is dropped and the report counts it;
           no entity appears.
       (e) Applying the same inspection twice produces the same graph -- the
           second run emits zero ops, because the first run's entities are now
           present. Idempotence, cheaply.

     Verification: tools/loom-test.sh green, with (a) through (e) in the graph
     suite. (b) executed and its failure text recorded. `check` unchanged at
     32 violations -- loom-graph gains no dependency, so RULE-0001 stays at
     zero.

  3. ENRICH-OPS, CALL EDGES, THE :SOURCES UNION, AND THE KEY-EQUALITY FIXTURE.

     Files: src/graph/enrich.lisp, src/graph/test/enrich.lisp.

     For each call fact, resolve both endpoints -- to an entity already in the
     graph, or to one this same transaction asserts (the tx remap handles the
     ordering, so an op referring to an entity asserted earlier in the same op
     list is sound). Both resolve: emit the edge. Either does not: drop and
     count under :edges-dropped, per CON-0001.

     ENRICHED-EDGE, per C-2:

       (defun enriched-edge (from to sources &key workspace-id)
         ;; ORIGIN-FILE is (origin-file from), identically to ASSERT-EDGE.
         ...)

     building a RELATIONSHIP with :rel-type :calls, :source :introspected,
     :confidence 1.0, :derived-from (list (id to)), and :properties
     (properties-table (list :sources sources)).

     SOURCES is the stable union: the existing edge's :sources property when
     it has one, else a one-element list of the existing edge's SOURCE slot,
     with :introspected added if absent, sorted into a fixed order so the
     value is stable across runs. When no edge exists, it is (:introspected).
     Stability is what makes re-running enrich a no-op rather than a churn.

     Tests:
       (a) A call fact between two entities the text pass already linked
           produces an edge with the SAME id (natural key is type plus
           endpoints), :sources (:structural :introspected), and -- asserted
           explicitly -- the same ORIGIN-FILE the text edge had. That last
           assertion is R-3's guard: write it as (is (equal old-origin
           (origin-file new))) against the value read before the merge, not
           against a literal.
       (b) A call fact between two entities the text pass did NOT link
           produces a new edge with :sources (:introspected) and source
           :introspected. This is the BUG-0011-shaped case: xref records
           #'f under funcall, mapcar and apply, one caller each, so the
           image sees calls the text pass never recorded. Predict it here,
           measure it in step 11.
