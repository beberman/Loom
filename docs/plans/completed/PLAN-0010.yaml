  5. THE CHILD DRIVER, GENERATED AND RUN BY HAND.

     Files: src/analyzer/lisp-inspector.lisp (new), src/analyzer/
     loom-analyzer.asd, src/analyzer/test/fixtures/inspect/**,
     src/analyzer/test/inspector.lisp.

     Nothing in Loom spawns anything in this step. The deliverable is a
     function that WRITES a driver script, plus four fixture systems, plus a
     test that runs the generated script with sbcl --script by hand and
     asserts on the result file. That ordering is the point: the child is
     debuggable on its own before any parent depends on its output.

     LISP-INSPECTOR slots, all with defaults and all overridable so a test can
     bind them small: TIMEOUT-SECONDS (default 300), HEAP-MB (default 4096),
     ISOLATE-P (default: the probe's answer), INCLUDE-TEST-UNITS (default NIL,
     per R-7).

     DISCOVER-UNITS (root): the system names to load, in dependency order.
     Take the stem of each .asd file under the root, excluding dot-directories
     the way REPOSITORY-FILES does, and excluding names matching a test
     pattern unless INCLUDE-TEST-UNITS. Measured shape to satisfy: game-server
     has seven .asd files -- utils, mpackage, data-api, game, media,
     game-server and test/game-integ-test -- and REQ-0018's six units are that
     set minus the last. Order: let ASDF resolve dependencies (loading utils
     first is not required for correctness, only for tidier per-unit status),
     so "dependency order" here means "the order given", and a unit whose
     dependency has not loaded is simply attempted and may pull it in.

     WRITE-DRIVER-SCRIPT: emits a self-contained Lisp file taking root,
     result-file and unit names from sb-ext:*posix-argv*. Its body, in order:
       - The registry preamble the loom skill documents: (require :asdf), load
         quicklisp/setup.lisp, and pushnew every directory under ROOT that
         contains a .asd into asdf:*central-registry*.
       - For each unit, in order: (handler-case (asdf:load-system unit)
         (serious-condition (c) ...)), then append one
         (:unit "name" :status :loaded) or (:unit "name" :status :failed
         :phase :load :error "<princ-to-string of the condition>") form to the
         result file, opening it :append and calling FINISH-OUTPUT before
         moving on. SERIOUS-CONDITION and not ERROR -- see R-6, which measured
         both.
       - Then introspect once and append the facts document.
       - Never write protocol on stdout. Compile chatter owns stdout; the
         parent captures it for the log and parses none of it.

     Introspection, per REQ-0018's measured limits:
       - Walk every package's symbols. For each, query
         SB-INTROSPECT:FIND-DEFINITION-SOURCES-BY-NAME once per kind
         (:function, :generic-function, :method, :macro, :class, :structure,
         :condition, :variable) rather than once per name -- REQ-0018 measured
         that :function returns zero sources for a generic function.
       - Keep a definition only when its source pathname truename is under
         ROOT. That single filter is what drops dependency systems' symbols
         and makes package ownership irrelevant.
       - Emit :file as the path relative to ROOT, forward-slashed. This is the
         same rendering WORKSPACE-RELATIVE-PATH produces and R-2 and R-4 both
         depend on it; the child does it because only the child knows the
         absolute path.
       - For each kept definition that is callable, SB-INTROSPECT:WHO-CALLS its
           name and emit one :calls entry per caller whose own source file is
           under ROOT. Callers outside the root are dropped and counted.
       - Every name crosses as a downcased string with its package name as a
         separate string. No symbol from target code is ever interned into a
         Loom package -- that is R3 and it is enforced here, in the child's
         printing, not in the parent's reading.
       - Method caller keys: SBCL returns a compound key, measured as
         (FAST-METHOD G (INTEGER)). Parse it here into
         (:method "g" nil ("integer")) -- generic name, qualifiers, downcased
         specializer strings. REQ-0018 R8 makes this an inspector obligation
         and DES-0011 confines SBCL's spelling to this file; nothing outside
         lisp-inspector.lisp may ever see the word FAST-METHOD.

