  WHERE THE PLAN WAS WRONG

  Three, and each was a prediction rather than an instruction, so none of them
  changed what was implemented.

  1. Step 3's verification said "if :calls moved at all here, something other
     than this plan changed the tree and steps 6 and 7 are already confounded".
     It moved, and nothing was confounded. The reasoning behind the clause was
     R-4's, which is about the new tests' *quotations* -- :key #'name and the
     like -- and those genuinely contribute nothing until the fix lands. What
     the clause forgot is that the new test file also contains ordinary
     operator-position calls (analyze-source, find-by-name, getp,
     relationships-from, to-id), and those are recorded by the walk that has
     always existed. Adding test code adds :calls edges. Step 3 exists precisely
     so that movement is on the far side of the subtraction, which is what it
     did; the verification sentence contradicted the step's own purpose.

  2. Step 7 predicted PLAN-0010's R7 guard -- APPLY-TRANSACTION's inbound
     :TESTS and :CALLS counts, 66 and 77 -- "is expected to MOVE now, upward".
     It did not move. The counts are of distinct callers, and every test that
     now designates #'apply-transaction was already calling it in operator
     position in the same body, so the new call name resolves to an edge that
     already existed. This is not a failed acceptance -- the guard was an
     equality check and it held -- but the prediction was wrong, and wrong in a
     way worth keeping: "a new call name" and "a new edge" are different
     things, and a fix that records more names will move a count of edges much
     less than a count of names.

  3. BUG-0011's FIX section warned that "a fix that pushes the tail element
     unconditionally would record lambda as a callee". R-2 had already worked
     out that this hazard was neutralised downstream by STANDARD-OPERATOR-P,
     and that turned out to be right -- but the plan then carried BUG-0011's
     framing far enough that the lambda test was written as the guard. The real
     hazard was one clause over, in the setf branch: an unguarded
     (definition-name designator) on any cons fabricates "(lambda item helper)"
     from #'(lambda (item) (helper item)), a name no filter removes and nothing
     resolves. That string was observed on :CALL-NAMES under the step 4
     mutation and is recorded in BUG-0011's RESOLUTION. A fourth thing the
     plan did not see at all, found only in review of the finished code: the
     same guard's (consp (cdr designator)) is what keeps a dotted #'(setf . g)
     away from DEFINITION-NAME, whose MAPCAR signals on a dotted list. The
     stake on that branch was an error out of ANALYZE-FILE, not just a bad
     name, and nothing in the plan or the bug records it. It is now a comment
     in the source.

  THE R-5 DECISION

  `status`'s tested-unit count went 298 -> 302, and R-5 reserved the right to
  file a bug on seeing it. A bug was filed: BUG-0018. What it is about is the
  derivation and the label, not quotations -- R-5 refuses a per-operator
  exclusion list and is right to.

  The four new units are HOP-REL-TYPE, HOP-ENTITY-ID and PROPERTY-KEY, each
  reached through a (mapcar #'accessor ...) inside a real assertion, and
  CONCURRENCY-TEXT-P, a two-line predicate defined at
  src/workspace/test/workspace.lisp:763 and reached at line 800 through
  (remove-if-not #'concurrency-text-p ...). The first three are weak but
  arguably real -- the assertion does depend on the accessor. The fourth is a
  test file credited with testing its own private filtering helper, and is not
  defensible on any reading.

  Only some of this is new, and that is the finding rather than the number.
  STRESS-COUNTS, eight lines below CONCURRENCY-TEXT-P in the same file and
  equally private to it, is called in operator position at line 791 and has
  carried a `<- tests` edge by the ordinary head-only walk for as long as that
  walk has existed. So this change added an instance to a category that was
  already there; it did not create the category. That is what makes a
  quotation-shaped fix wrong -- it would leave STRESS-COUNTS counted and
  CONCURRENCY-TEXT-P not, which is worse than either consistent answer -- and
  what makes the honest complaint a different one: RESOLVE-TESTS
  (resolve.lisp:591) states exactly what it derives and derives exactly that,
  while PRINT-STATUS (console.lisp:189) renders it as "covering", which claims
  a subject under test that reachability does not establish. BUG-0018 carries
  both candidate fixes, the cheap relabel and the loom-graph derivation change,
  and says which to do if only one is done.

  TWO THINGS THIS PLAN DID NOT SCOPE, ADDED IN CLOSE-OUT

  BUG-0017, and it is the more serious of the two. BUG-0011's SYMPTOM named
  three shapes and this plan fixed two: "a callback stored in a slot" is
  outside COLLECT-CALL-NAMES' reach entirely, because ANALYZE-FILE hands no
  :body for DEFVAR, DEFPARAMETER, DEFCLASS or DEFINE-CONDITION and a DEFUN's
  body is (cdddr form), which excludes the lambda list. Neither the bug's FIX,
  nor this plan's eight steps, nor its seven risks noticed that the third case
  could not be reached by the change being planned -- and step 4's new
  docstring paragraph repeated the three-item list verbatim, so the source
  briefly carried a comment claiming a recovery the code did not perform. Both
  the docstring and BUG-0011's RESOLUTION now name the residue explicitly.
  Live evidence: src/serve/json.lisp:76 designates DEFAULT-JSON-KEY-NAME from a
  DEFPARAMETER initform and the callee still has zero incoming :CALLS.

  A vocabulary correction. Step 9 says BUG-0011 goes "open -> fixed". CON-0004's
  status vocabulary for a bug is open/closed and every other bug in docs/bugs/
  uses one of those two, so it was closed as `closed`. Recorded rather than
  silently corrected because the plan is the document a reader checks the
