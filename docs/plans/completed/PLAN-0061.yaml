  Built. tools/test/release-scan.py (new, about 540 lines) takes `[--history]
  [--also REGEX ...]`. The credential table, the path table, the private-name table
  and the address expression are literal tuples at the top of the file. The matching
  is on bytes, so no file can fail to decode. A blob is streamed in 1 MiB chunks and
  is binary when its first 8000 bytes hold a NUL, which is git's own test. Tip mode
  reads the committed blobs of HEAD through `git ls-tree` and one `git cat-file
  --batch`, not the working tree, so an untracked file, a staged file or an
  uncommitted edit is never scanned; the docstring says so. History mode reads one
  stream, `git log --all --cc -p -U0` with a format that brackets each message, and
  counts every commit message and every line each commit added. It prints the
  number of blobs reachable from `git rev-list --all --objects` beside the commit
  count, so a later run can be compared. tools/test/test-release-scan.py (new) runs
  9 cases against throwaway repositories and takes about 2 s.

  Departures from the plan. (1) History mode attributes by added line, not by blob.
  The docstring argues that every line of every reachable blob was added by some
  commit: a line absent from a commit's added lines is in the parent's version of the
  file, and `--cc` shows the lines of a merge that are in no parent. The test plants a
  value in a merge's conflict resolution and in a branch no checkout holds, and finds
  both; with plain `git log -p` instead of `--cc` the merge case fails. The gaps are a
  binary file (counted and printed) and an object a tag names directly. (2) A count is
  lines, not occurrences: a line holding two hits counts once per class. (3) The
  script finds its repository from its own location, as doc-ids.py does, so the test
  copies it, untracked, into each fixture. (4) Exit 2 is a refusal or a bad argument:
  an --also that is not a regular expression, an empty --also, no commit, no
  repository. The refusal names the argument's position and never repeats it. (5) Four
  details the plan left open: a Windows drive path whose name is an angle-bracket
  placeholder is not a hit; a Slack token needs 10 characters and a GitHub token 36
