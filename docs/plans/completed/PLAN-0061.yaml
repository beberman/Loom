  binary or non-UTF-8 file, `left alone path:line` per committed line that names
  OLD and that no edit rewrites, and `commit OLD <abbreviated hash> <subject>:
  ...` per commit in MB..HEAD whose message names OLD. After --apply it prints that
  nothing is committed, that only the rename is staged, and the next step
