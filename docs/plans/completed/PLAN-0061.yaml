  step 6's helper, split the diff with str.splitlines, which also breaks at a form
  feed, \x0b, \x85 and U+2028. A hunk then miscounts and later lines get wrong
  numbers. It now splits at "\n" as git does. `renumber` also rewrites a line only
  if the working file still reads exactly as the diff's added text, so a
