  RISKS

  1. A moved predicate changes behaviour. JSON-VALUE's clause order depends
     on IMPROPER-LIST-P answering NIL for every atom (its own docstring says
     the CONSP guard is the whole predicate for atoms). The copies are
     verbatim, and step 1 adds Loom-side tests for the edge cases the
     library's docstrings state.

  2. The JSON decode loses its float format. utils' JSON-DECODE binds
     *READ-DEFAULT-FLOAT-FORMAT* to DOUBLE-FLOAT (utils BUG-0001). A direct
     st-json:read-json without the binding reads 0.123456789012 as a
     single-float. Step 1's round-trip test fails without the binding.

  3. The rule split goes silent. If one of the ten rule files fails to
     parse, PARSE-CHECK returns NIL and the rule becomes prose only, with
     no error. `status`' unenforced count is the detector: it must stay 2.
     Step 2 also plants a violation for two of the ten targets and sees each
     reported (CON-0003).

  4. A symbol conflict. loom-workspace :use's loom-utils, loom-ontology,
     loom-graph, loom-analyzer and loom-knowledge. READ-FILE exported from
     loom-utils and STRING-LINES exported from loom-analyzer each reach it
     once. If any other used package exports either name, loading signals a
     package conflict. `find read-file` and `find string-lines` show no
     definition in Loom today. Step 2's load is the check.

  5. The sandbox does not hide what it claims to hide. Step 3's control
     runs the sandbox on d3f2824, before R1, and must fail to load
     loom-analyzer with a missing-system error naming utils. If d3f2824
