  Departures from the plan. (1) The checkout names `ref:
  ${{ github.event.pull_request.head.sha || github.sha }}`. On a pull_request
  event the default checkout is GitHub's merge of the pull request into its base,
  a tree that already holds the base's documents, so C1 (an id HEAD added that
  BASE also carries) could not fire there. The pull request's own head commit
  is what the check compares. On push and merge_group the expression is
  github.sha, the commit that triggered the run. (2) The base is chosen in a
  step from env values: pull_request uses github.base_ref, merge_group uses
  github.event.merge_group.base_ref with `refs/heads/` removed, and push uses
  main. The result goes to the check through an env variable, not through
  inline ${{ }} text in the run line, as the first step's inputs do. (3) A
  merge_group run has HEAD equal to the merge result, so MB is the base and C1,
  C4 and C5 have nothing to compare; C2 and C3 read the merged tree. The same
  holds for a push to main. GitHub's merge queue is not offered to a repository
  owned by a user, so the trigger is inert here and costs one line.

