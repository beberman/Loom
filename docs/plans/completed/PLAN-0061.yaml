     Which document this implements. No requirement or design asks for it;
     the owner decided it on 2026-10-10. CON-0004 files "a decision taken,
     its rationale and its consequences" as a DEC, so this step writes one.
     DEC-0008, status accepted, refines [REQ-0079, DES-0006], affects
     [dispatch-request]. One paragraph each: the decision (the service is
     unauthenticated and loopback-only; every local caller holds :read and
     :write and never :repl; the listener refuses a request whose Host is not
     a loopback name for its own port); the reason (a browser page on any
     site can make requests to 127.0.0.1 through DNS rebinding, and such a
     request carries the attacker's host name in Host); the consequences
     (a prepared tree whose endpoint names another host is refused;
     authentication waits on REQ-0071 R4). The affects: entry gives
     DISPATCH-REQUEST a :decides edge, so `impact dispatch-request` reports
     the decision.

     server.lisp: LOOPBACK-HOST-P (host port) is true when HOST, compared
     case-insensitively, is one of "127.0.0.1:<port>", "localhost:<port>"
     or "[::1]:<port>", or, when PORT is 80, the same three names without a
     port. NIL and the empty string are false. DISPATCH-REQUEST's first
     clause: unless (loopback-host-p (hunchentoot:host request)
     (hunchentoot:acceptor-port (hunchentoot:request-acceptor request))),
     set the return code to 403 and the content type to application/json,
     and return (encode-result (list :name "HOST-REFUSED" :message ...)). The
     message names the Host received, the three names accepted, and DEC-0008.
     No handler runs. Both names are checked with `find` before they are
     written; neither exists today.

     Verification, new tests in src/serve/test/server.lisp, inside
     WITH-TEST-SERVER on *TEST-PORT*. A helper RAW-STATUS (path host
     &key method body) opens a usocket stream to 127.0.0.1:*TEST-PORT*,
     writes an HTTP/1.1 request with exactly the Host header given (or none
     when HOST is NIL) and `Connection: close`, and returns the status code
     from the status line and the body. drakma cannot be used for these,
     because it writes its own Host header.
       - Host evil.example on GET /v1/status: 403, body names HOST-REFUSED.
       - Host evil.example:<test port> (the DNS-rebinding shape: an
         attacker's name on the right port) on GET /v1/status: 403.
       - Host evil.example:<test port> on POST /mcp with a JSON-RPC
         tools/list body: 403, and the body holds no "jsonrpc" key, so the
         MCP handler did not run.
       - No Host header: 403 or 400, and no handler ran.
       - Host 127.0.0.1:9999 (wrong port): 403.
       - Host 127.0.0.1:<test port>, localhost:<test port>,
         LOCALHOST:<test port> and [::1]:<test port> on GET /v1/status:
         200.
       - Unit cases for LOOPBACK-HOST-P, including "localhost" with port 80
         true and with port 4780 false.
