     The converter is a python3 script in the scratchpad, using only
     zipfile and xml.etree.ElementTree, and is not committed. It reads
     word/document.xml and word/styles.xml only. It never reads
     docProps/core.xml, app.xml or custom.xml, word/comments.xml or
     word/footnotes.xml, so no creator, lastModifiedBy, company or comment
     author can reach the output. Mapping:
       style "Title"                       -> `# ` (the file's first H1, which
                                              the markdown analyzer takes as
                                              its title)
       "heading 1" with `N. Title`         -> `## N. Title`, text verbatim
       "heading 2" with `N.M Title`        -> `### N.M Title`, verbatim
       "heading 1" or "2" without a number -> `##` or `###`, verbatim
       "heading 3"                         -> `####`
       "toc 1", "toc 2"                    -> dropped
       a paragraph with numPr or a "List"
       style                               -> `- ` item
       "Source Code" style, or a run in a
       monospace font                      -> a fenced block, or a `code`
                                              span for a run
       a table                             -> a pipe table, one row per w:tr
       any other paragraph                 -> its text, then a blank line
