id: PLAN-0016
title: Sequence DES-0016 -- the markdown analyzer, then the :MENTIONS type, then the retargeting of the edge that already existed
status: final
date: 2026-08-10
refines: [DES-0016, REQ-0014]
affects: [analyze-file, analyzer-handles-p, resolve-document-links, impact-report,
          build-context, docs-relative-p, document-type-for]
tags: [plan, analyzer, markdown, ontology, mentions]
summary: |
  Nine steps in three stages. Stage A adds the ontology's :MENTIONS type and
  retargets the one existing producer onto it, which is a change to Loom's own
  index that must be made and proved before any markdown exists to confuse the
  measurement. Stage B adds the markdown analyzer itself, bottom-up: the
  scanner, then the entity, then the registration. Stage C is presentation and
  acceptance -- the impact field, the console line, and the two measurements
  REQ-0014 R6 names, taken against Loom and against ~/lisp/game-server.

  Ordered so that every step leaves the suite green and the console answering.
  The riskiest step is 2, because it changes edges the whole tree already
  carries; it is deliberately first, alone, and measured on its own.
body: |
  BEFORE ANYTHING, THE BASELINE

  Take it once and write it down, because three of the nine steps are checked
  against it:

      tools/loom.sh 'status'

  As of 2026-08-10: 189 files, 1994 entities, 9651 relationships, 88
  documents, 0 unresolved references, 32 violations. And the count that will
  move, taken the same way:

      tools/loom.sh 'impact resolve-one 3'

  whose `documents:` line is the population being retargeted.

  STAGE A -- THE ONTOLOGY, AND THE EDGE THAT ALREADY EXISTED

  Step 1. Declare :MENTIONS.
    src/ontology/code-ontology.lisp, immediately after the :DOCUMENTS
    declaration so a reader meets the pair together. Endpoints, direction and
    one-step-ness copied from :DOCUMENTS; :collect-as :mentions. The
    docstring must say what the type claims and what it does not -- DES-0016
    D7, and REQ-0014's "a backtick is evidence that a file names something, it
    is not evidence that the file governs it".
    Check: `tools/loom-test.sh` -- the ontology suite has a test asserting
    every relationship type is documented.
    Risk: none. A declared type with no producer asserts nothing.

  Step 2. Retarget the mention loop.
    src/graph/resolve.lisp:1128, `:documents` -> `:mentions`. One keyword.
    Everything around it -- *MENTION-CONFIDENCE*, :source :inferred, the
    RESOLVE-ONE ambiguity refusal, the exclusion of a document as target --
    is untouched, and DES-0016 D7 says why each stays.
    Then the tests that name the old type:
      src/graph/test/rules.lisp:93  a-prose-mention-becomes-an-inferred-edge
      src/graph/test/rules.lisp:107 a-mention-that-resolves-to-nothing-is-simply-absent
    Rename neither test; change what they assert. CON-0003: each must still
    fail without step 2's change, which is checked by reverting the keyword
    and watching them go red.
    Check: `tools/loom-test.sh`, then `tools/loom.sh 'status'` -- the
    relationship count must be unchanged. A move from one type to another is
    not a change in how many edges exist, and a different total means the
    endpoint constraint rejected something.
    Risk: this is the step that touches edges the tree already carries. If the
    relationship count drops, the cause is :MENTIONS' :to list disagreeing
    with :DOCUMENTS' -- compare the two declarations before looking anywhere
    else.

  Step 3. Carry :MENTIONS through impact and context.
    - src/graph/query.lisp: IMPACT-RESULT-MENTIONS beside
      IMPACT-RESULT-DOCUMENTS; add :mentions to IMPACT-SET's include-docs
      gate (the CASE at query.lisp:317), so a caller suppressing documentation
      suppresses both.
    - src/graph/package.lisp: export IMPACT-RESULT-MENTIONS.
    - src/knowledge/services.lisp: IMPACT-REPORT gains :mentions.
    - src/knowledge/context.lisp:177: add :mentions to the documentation
      rel-types.
    - src/process/console.lisp:424: add :mentions to the printed field list.
    - src/serve/json.lisp: add :mentions to *ARRAY-VALUED-KEYS*.
    Check: `tools/loom.sh 'impact resolve-one 3'` now prints a `mentions:`
    line carrying what `documents:` carried at baseline, and an empty
    `documents:` line prints nothing at all.
    Risk: low. The one thing to get right is the include-docs gate; a
    :mentions field that ignores it would make include-docs nil stop meaning
    what it says.

  STAGE B -- THE ANALYZER

  Step 4. The documentation-directory predicate.
    src/analyzer/markdown-analyzer.lisp, new file, added to
    loom-analyzer.asd after yaml-analyzer. *DOCUMENTATION-DIRECTORIES*,
    REGISTER-DOCUMENTATION-DIRECTORY, and a predicate over PATH-SEGMENTS --
    which yaml-analyzer.lisp already defines and which this file reuses rather
    than reimplements.
    Tests first, in src/analyzer/test/markdown-analyzer.lisp: docs/x.md and
    design/x.md claimed, README.md at the root not, src/foo.md not,
    docs/x.yaml not (the YAML analyzer's, and the two must stay disjoint).
    Risk: the root case is the one that decides REQ-0014 R6's count of 12
    against game-server's 15 markdown files. Get it wrong and the acceptance
    measurement in step 9 reads 15.

  Step 5. The scanner.
    Pure functions over a string, testable without a graph or a filesystem:
    fenced-block elision, inline code spans, link and image targets,
    reference definitions, the first H1 (ATX and setext), and target
    normalization -- fragment and title stripped, URL schemes dropped, merged
    against the document's directory, `.` and `..` collapsed.
    Tests: a fence's content produces no candidate; a span containing a space
    produces none; `../media/media-handler.lisp` inside docs/data-layer.md
    normalizes to media/media-handler.lisp; `#anchor` and
    `https://example.com` produce none; a setext H1 is found; a file with no
    H1 titles from its filename.
    Risk: the fence state machine is where a scanner of this kind goes wrong.
    Test an unterminated fence explicitly -- the rest of the file is inside
    it, and that is the correct reading, not a bug to work around.

  Step 6. The entity.
    ANALYZE-FILE for MARKDOWN-ANALYZER: RETRACT-FILE plus one
    ASSERT-ENTITY of a DOCUMENT-ENTITY named by path, with :path, :title,
    :body, :system, :format :markdown, :mentions, and :unresolved-references
    '(). No :doc-id (DES-0016 D4), and none of the four declared link fields
    (D9 -- this is what keeps `unresolved` at 0).
    Tests: run against ~/lisp/game-server's docs/data-layer.md if it is
    present, and against a fixture string otherwise, so the suite does not
    depend on a second repository being checked out.
    Risk: asserting a natural key twice. One file, one entity -- CON-0005 is
    satisfied trivially here, unlike in the Lisp analyzer.

  Step 7. Register it, and confirm the seam.
    REGISTER-ANALYZER at the foot of the file; export MARKDOWN-ANALYZER,
    *DOCUMENTATION-DIRECTORIES* and REGISTER-DOCUMENTATION-DIRECTORY from
    src/analyzer/package.lisp beside the SS10 block.
    Check: `tools/loom.sh 'status'` on Loom's own tree -- documents 88 -> 89,
    files 189 -> 190, unresolved still 0. Then `tools/loom.sh 'describe
    docs/TODO.md'`.
    Risk: FIND-ANALYZER takes the first registered analyzer that claims a
    path, and REGISTER-ANALYZER pushes. Two analyzers claiming disjoint
    extensions cannot collide, but confirm the YAML count is still 88 rather
    than assuming it.

  STAGE C -- ACCEPTANCE

  Step 8. Loom's own tree.
    - `tools/loom.sh 'status'`: 89 documents, 0 unresolved references,
      relationship count risen by whatever docs/TODO.md's spans resolve to and
      by nothing else.
    - `tools/loom.sh 'check'`: violation count unchanged from the 32 at
      baseline. A new document type that changed a rule's answer would be a
      finding, not a success.
    - `tools/loom-test.sh`: nine systems green.
    Note that `check`'s RULE-0002 and RULE-0003 lines are BUG-0009 false
    positives and are expected to stay exactly as numerous as they were.

  Step 9. game-server, which is the requirement's own acceptance test.
      tools/loom.sh 'watch "~/lisp/game-server" | status | impact dhandler-delete 3'
    Required: documents 0 -> 12; docs/data-layer.md under `mentions:`;
    `unresolved` not risen. Unwatch afterwards so the session leaves no
    second repository behind.
    Risk: game-server may have moved or changed since DES-0016's
    measurement. If the twelve are not twelve, count the markdown files under
    docs/ and design/ before concluding the predicate is wrong.

  STEP 10 -- THE RECKONING

  RULE-0005 and CON-0004: a plan reaching final makes the draft status of
  every document it refines false. On landing, DES-0016 becomes implemented,
  REQ-0014 becomes implemented, and this plan becomes final. REQ-0014's R6
  numbers are stale as written -- DES-0016 restates them and the requirement
  should be updated to point at that restatement rather than left asserting
  52 documents and an unchanged count.

  Update the three prose copies of "the analyzer claims .yaml and .yml under
  docs/ and nothing else, so a markdown file there is invisible": CLAUDE.md's
  "Where the knowledge lives", .claude/skills/loom/SKILL.md's "Writing
  documents", and yaml-analyzer.lisp's own header comment. All three become
  false the moment step 7 lands, and the skill file says outright that it is
  the authoritative copy.

  WHAT ACTUALLY HAPPENED, 2026-08-10

  All nine steps ran in order and every step's own check passed. Three things
  are worth recording because they were not what the plan predicted.

  Step 2's instrument said the right thing for the wrong reason. The
  relationship count rose 9702 -> 9707 rather than staying level, and the plan
  says a different total means an endpoint constraint rejected something. It
  did not: the same edit that retargeted the edge also added
  IMPACT-RESULT-MENTIONS, whose own :calls and :contains edges are the five.
  The check that actually settled it was comparing the two lists --
  `impact resolve-one 3` reported 38 documents before and the same 38
  mentions, in the same order, after.

  Step 8 found the violation count at 33 rather than the baseline 32, which
  the plan says would be a finding rather than a success. Read: the new line
  is `RULE-0003: calls edge from impact-report to impact-result-mentions`, one
  more instance of the BUG-0009 false positive the rule already produces for
  the seven sibling accessors on the line above it. A rule that bans every
  call from loom-knowledge to loom-graph rather than only a write cannot fail
  to add a line when a knowledge function gains an accessor call. Not a
  regression, and it goes away with BUG-0009.

  Step 8 also produced a quieter result than expected on Loom's own tree:
  docs/TODO.md is indexed and mints no edges at all. Its three inline spans
  are `context data-handler` and `unwatch` and one phrase; the first is a
  console command line with a space in it, and `unwatch` names no entity --
  the console command is DEFINE-COMMAND-generated and the callable is
  UNWATCH-REPOSITORY. So the mention resolves to nothing and is dropped, which
  is exactly R3, demonstrated on the least interesting possible file. The
  behaviour is proved by game-server in step 9, where docs/data-layer.md
  resolves 28 mentions.

  WHAT COULD GO WRONG, RANKED

  1. Step 2 changes edges the whole tree carries. It is first and alone for
     that reason; the relationship count is the instrument.
  2. The fence state machine (step 5) silently swallowing or exposing half a
     file. Tested directly, including the unterminated case.
  3. The root-directory rule (step 4) making game-server read 15 rather than
     12. Measured in step 9.
  4. A markdown mention resolving to something surprising and inflating the
     graph. Bounded by RESOLVE-ONE, which refuses ambiguity, and by the
     minimum token length -- but the relationship delta in step 8 is what
     would show it.
