       entities that have shapes" understates which E lines change. Python
       and JavaScript entities hold :CALL-SHAPES=NIL until steps 4 and 5. The
       cost of the key itself is nil on front-end: below. I therefore did not
       add the conditional append I first wrote in MAKE-CALL-SITE-ENTITY and
       GENERATED-ENTITY; with the key always present it had no effect, and
       the tests I wrote for it failed. The definer plist is not an entity, so
       :CALL-SHAPES is absent from it when empty.
