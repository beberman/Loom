  How a :CALL-SITE source is treated, which DES-0055 D11 and R11 leave open. D11
  says "a :CALL-SITE carries shapes like any other caller" and says nothing of
  the three referrer kinds. An :AMBIGUOUS site is a guess among candidates (its
  edges carry 1/N confidence), so its sites are :FAN-OUT and are in neither
  :SITES nor `sites'. A :DEFINER-CALL, :VARIABLE, :CLASS or :MODULE site is an
  ordinary caller: its sites count, with the file and the lines its own
  :CALL-SHAPES carry. Its row in `sites' names it by the site's label,
  "<call-name>@<file>:<line>", which is the entity's name. An :AMBIGUOUS site's
  shapes lines are its caller's real call lines, not the site's start line, so
  the fan-out count is of call forms.

