      `(utils:dict-value :id obj)`, is inside the first of two
      `(defmethod initialize-instance :after ((handler operator-handler) ...))`
      forms, at lines 45 and 64 of the same file. CL redefines a method with
      the same qualifier and specializers, so the second replaces the first and
      the first never runs. The analyzer asserts one method key once per file
      and the later definition replaces the earlier (CON-0005). Loom
      therefore holds one method there, lines 64-69, and the call on line 48
      has no caller. The line-48 site is dead code in the running image and
      Loom is right to omit it. The same file's duplicate is a finding about
      game-server, not about Loom.
