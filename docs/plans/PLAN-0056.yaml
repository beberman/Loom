id: PLAN-0056
title: DES-0053 in twelve steps -- ontology, the shared child, extract.py, venv exclusion, three graph passes, the analyzer, tests, arity, acceptance on lfia and tools/, complete
status: draft
date: 2026-10-04
refines: [DES-0053]
affects: [find-analyzer, register-analyzer, analyzable-p, parse-javascript,
          ensure-js-child, resolve-module-specifier, build-module-scope,
          resolve-imports, resolve-calls, call-targets, caller-call-names,
          member-call-candidates, visible-candidates, module-scoped-language-p,
          make-call-site-entity, entity-arity, render-signature,
          repository-files, import-summary, resolve-and-check,
          unresolved-references]
tags: [analyzer, python, ontology, imports, call-resolution, environment,
       tests, venv, des-0053, req-0078, con-0003, con-0005]
summary: |
  Twelve steps that implement DES-0053 R1 to R16, the Python half of
  REQ-0078. Step 1 is the ontology. Steps 2 and 3 build the shared
  child-process code and tools/py/extract.py. Step 4 excludes virtual
  environments. Steps 5 to 7 are the three graph passes, tested on entities
  built by hand. Step 8 registers the analyzer, and only then does any .py
  file in a watched tree become entities. Step 9 adds pytest and unittest
  cases. Step 10 teaches arity and signatures. Step 11 is acceptance on
  ~/github/lfia-accounting and on Loom's own tools/. Step 12 runs `complete`.

  The graph passes come before the analyzer, not after it. DES-0053 names
  the analyzer first. The graph tests build their entities by hand, so they
  do not need the analyzer. If the analyzer landed first, Loom's own ten
  tools/ files would be indexed for several commits with member calls going
  through MEMBER-CALL-CANDIDATES' third tier and no :IMPORTED-CALLS tier at
  all. That is the wrong-edge state DES-0053's PROBLEM section measures. The
  `check` counts would then move twice.

  Out of scope: REQ-0078 R7 to R11 (Firebase), dependency names from
  requirements.txt, pytest fixtures, `from x import *`, pytest.ini
  overrides, receiver types, storing call-argument shapes (REQ-0041), .pyi
  stubs, and moving the JavaScript analyzer onto :IMPORTED-CALLS. Each is
  deferred in DES-0053 and stays deferred here.
body: |
  BASELINE

  On 2026-10-04 at 715eedf, with DES-0053, REQ-0078 and BUG-0069 untracked
  in the tree, `tools/loom.sh 'status'` printed:

      rules      : 0 violations, 2 unenforced
      unresolved : 8 document references, 7 ambiguous, 5 definer macros
      imports    : 0 resolved, 0 external, 0 out-of-domain, 0 unresolved,
                   0 target unclaimed
      unclaimed  : 52 tracked files -- 10 .json, 10 .md, 10 .py, 6 .sh, ...

  "Green" after a step means three things. `tools/loom-test.sh` passes on
  all twelve systems. `check` prints No violations, 8 unresolved document
  references and 7 ambiguous. `sbcl --script tools/test/load-test.lisp
  loom-serve` prints T. A step that is expected to move one of these numbers
  says which one and to what.

  This plan's own `affects:` names only functions that exist at 715eedf. A
  function this plan creates is named in the body, where an unresolved name
  is dropped rather than reported.

  After any change to Loom's source, run `tools/loom-serve.sh update` before
  using a loom_* tool. The running service keeps the code it started with.

  FILES

  New:
    tools/py/extract.py                     the child (D1, D2, D7, D10)
    src/analyzer/extractor-child.lisp       the shared child lifecycle (R14)
    src/analyzer/python-analyzer.lisp       the analyzer (D3, D4, D8, D9,
                                            D10 placement, D11 names, D12)
    src/analyzer/test/extractor-child.lisp  lifecycle tests
    src/analyzer/test/python-extract.lisp   tests of the child's reply
    src/analyzer/test/python-analyzer.lisp  tests of the operations

  Changed:
    src/ontology/code-ontology.lisp         :SETTING, :READS, vocabulary,
                                            properties, MAKE-CALL-SITE-ENTITY
    src/ontology/package.lisp               exports
    src/ontology/test/code-ontology.lisp    vocabulary tests
    src/analyzer/js-analyzer.lisp           loses the child code to
                                            extractor-child.lisp
    src/analyzer/loom-analyzer.asd          three components, three tests
    src/analyzer/package.lisp               exports
    src/graph/resolve.lisp                  Python resolver, :UNROOTED,
                                            the :IMPORTED-CALLS tier, the two
                                            narrowings, RESOLVE-SETTINGS,
                                            MISSING-IMPORTED-CALLS
    src/graph/package.lisp                  exports
    src/graph/test/resolve.lisp             resolver, tier and settings tests
    src/workspace/workspace.lisp            pyvenv.cfg rule, :UNROOTED in
                                            IMPORT-SUMMARY, RESOLVE-SETTINGS
                                            in RESOLVE-AND-CHECK
    src/workspace/test/workspace.lisp       venv test; the unclaimed test
                                            stops using .py
    src/workspace/test/provenance.lisp      the drift test stops using .py
    src/knowledge/services.lisp             ENTITY-ARITY, *SIGNATURE-STYLES*
    src/knowledge/test/services.lisp        arity and signature tests
                                            (today's ENTITY-ARITY assertions
                                            are in test/similar.lisp; the new
                                            ones go beside the service)
    src/process/console.lisp                `status` prints :UNROOTED; `check`
                                            prints missing imported calls
    src/serve/operations.lisp               the :check operation returns
                                            :MISSING-IMPORTED-CALLS
    CLAUDE.md                               `js/` and `py/` under tools/

  Deleted: none.

  A DEPARTURE FROM DES-0053, STATED

  DES-0053 says "loom-process, loom-serve, loom-rest and loom-mcp change
  nothing". Two of its own requirements contradict that. `check` reporting
  :MISSING-IN-TARGET (R7) needs a print in the console's `check` command
  (console.lisp:1544) and a key in the serve :check operation
  (operations.lisp:656), because both build their report key by key. The
  :UNROOTED cause (R6) needs a field in the `status` imports line
  (console.lisp:361), which prints five named causes. The plan edits those
  two files. Neither edit adds a dependency: console.lisp and operations.lisp
  already call into loom-graph and loom-workspace. load-test still decides
  the peer property. loom-rest and loom-mcp carry the serve operation's
  plist through unchanged.

  A REFINEMENT DES-0053 LEAVES OPEN

  D5 says `from S import a` also tries S.a as a submodule and adds the file
  to the importer's module scope. The design does not say where the
  resolver reads `a` from. This plan reads it from :IMPORT-BINDINGS, which
  holds module-level bindings only. A from-import inside a function adds
  nothing to the module scope. Its calls still resolve, because they are
  :IMPORTED-CALLS entries and D6's walk step 3 tries the submodule.

  BLAST RADIUS

  What Loom reports, from `impact <name> 3` on 2026-10-04:

    ENSURE-JS-CHILD        32 entities. PARSE-JAVASCRIPT, the JavaScript
                           ANALYZE-FILE method, JS-AVAILABLE-P in
                           src/analyzer/test/js-analyzer.lisp, and
                           NODE-AVAILABLE-P in src/workspace/test/domains.lisp,
                           which takes *JS-CHILD-LOCK* and calls
                           ENSURE-JS-CHILD by name.
    RESOLVE-CALLS          102 (truncated). Every test that resolves.
    BUILD-MODULE-SCOPE     67 (truncated).
    REPOSITORY-FILES       82 (truncated). INDEX-REPOSITORY and POLL-ONCE,
                           so the whole pipeline and the monitor.
    MODULE-SCOPED-LANGUAGE-P  72 (truncated).
    UNRESOLVED-REFERENCES  53 (truncated).

  Decisions Loom attaches to these: DES-0014 and DES-0015 (call sites and
  symbol identity), DES-0047 (domains and specifier causes), DEC-0003
  (derive, never consume), DES-0018 (git ignores), DES-0051 (the document
  store), DES-0011, DES-0025 and DES-0053 itself. Nothing in the plan
  contradicts one of them. DEC-0003 binds steps 6 and 7: both passes derive
  from analyzer-written properties every pass and rewrite only their own
  outputs.

  What Loom cannot see, and why:

    - The JavaScript child's state is read by tests in two systems through
      `loom-analyzer::` qualified symbols: *JS-CHILD*, *JS-CHILD-LOCK*,
      *JS-UNAVAILABLE-REASON*, *NODE-PROGRAM*, STOP-JS-CHILD and
      ENSURE-JS-CHILD. A read of a special variable is not a :CALLS edge,
      so `impact` under-reports the reach of step 2.
    - Most callers of RESOLVE-CALLS are `test` forms, a macro body. DES-0001
      says these under-report.
    - Changes to console.lisp and operations.lisp cross the
      loom-process/loom-serve boundary, which no rule covers.
      load-test is the instrument there.
    - Enumerations of entity types that `find`, `describe` or `structure`
      walk. src/knowledge/structure.lisp's *DEFINITION-TYPES* and the type
      list in similar.lisp:200 do not name :SETTING. Nothing reports a type
      missing from a list. Step 7 checks `find` and `describe` on a
      :SETTING directly.

  RISKS

  1. R14 and the JavaScript tests. src/analyzer/test/js-analyzer.lisp:330-394
     let-binds *NODE-PROGRAM*, setfs *JS-UNAVAILABLE-REASON*, compares
     *JS-CHILD* with EQ across files, and calls STOP-JS-CHILD.
     domains.lisp:100 takes *JS-CHILD-LOCK*. R14 requires these to pass
     unchanged. Step 2 keeps every one of those names. The program name is
     read when the child is launched, not when the shared object is built.
     Otherwise the let-binding of *NODE-PROGRAM* stops working and
     THE-TOOLCHAIN-BEING-ABSENT-IS-RECORDED-NOT-FATAL fails.
     If *JS-CHILD* becomes a symbol macro, it cannot also be DEFVAR'd. An
     image that already loaded the old DEFVAR, such as the SBCL behind
     SLIME, signals when the new file loads. Run step 2 under
     tools/loom-test.sh (/usr/bin/sbcl, fresh image) and say so in the
     commit.

  2. Two tests depend on .py being unclaimed. From step 8, .py is claimed.
     These two fail for that reason, not because the property they test
     broke:
       src/workspace/test/workspace.lisp:1633,
         UNCLAIMED-COUNTS-TRACKED-FILES-NO-ANALYZER-CLAIMS-AND-NAMES-THE-EXTENSIONS
         (writes tools/harness.py and tools/other.py; asserts 2 .py of 3)
       src/workspace/test/provenance.lisp:61,
         AN-EDIT-TO-A-FILE-NO-ANALYZER-CLAIMS-IS-NOT-DRIFT
         (writes tools/harness.py)
     Step 8 changes both to an extension no analyzer claims, .rb, in the
     same commit. Check that the edited test still fails when its property
     is broken: claim .rb from a throwaway analyzer and run the suite once.

  3. CON-0005, one natural key per file. Nothing checks it. The Python
     analyzer can derive one key twice in three ways. Two module-level
     bindings of one name: D9 keeps the last. A property chain or overload
     set: D9 merges. Two calls of one name in one module-level statement:
     a :CALL-SITE's key is (:file :start-line :call-name), and :START-LINE
     is the statement's line, so two `main()` calls in one guard derive one
     key. Step 8 dedupes call sites on that key before emitting them. A
     test asserts one site, not two.

  4. RULE-0003's deny list. RESOLVE-SETTINGS returns operations, the way
     RESOLVE-CALLS does. It adds no function that writes the graph. If step
     7 adds a helper that calls ADD-ENTITY or APPLY-TRANSACTION directly,
     its name goes into docs/rules/RULE-0003.yaml's to-names in the same
     commit. Otherwise a knowledge-layer call to it would go unreported.

  5. Layering. extract.py's binding is single-file semantics, so it stays in
     the analyzer (CON-0005). The specifier walk needs other files, so it
     stays in loom-graph. loom-graph reads no filesystem. Package-ness comes
     from the index ("<dir>/__init__.py" is an indexed path). Domain roots
     arrive as data. A test in step 5 checks that the resolver gives the
     same answer for a path that exists on disk and is not indexed, so
     nothing reads the disk. loom-analyzer gains no dependency: uiop,
     cl-json and bordeaux-threads are already in loom-analyzer.asd.

  6. The peer property. Steps 5 and 6 edit console.lisp and
     operations.lisp. Run load-test after each step that touches either.
     It must print T.

  7. :PYTHON in *MODULE-SCOPED-LANGUAGES* routes every Python file through
     BUILD-MODULE-SCOPE. With only the JavaScript resolver there, `import
     config` reads :EXTERNAL and `.posting` reads :UNRESOLVED under JS
     extensions. So :PYTHON joins the list in step 5, in the same commit as
     the dispatch to the Python resolver, and not in step 1.

  8. Fixtures in Loom's own tree are indexed. A fixture file named
     src/analyzer/test/fixtures/python/test_x.py would be claimed from step
     8. It would add pytest cases and a `main` to Loom's own index. Every
     Python fixture in this plan is a string inside a .lisp test, passed to
     ANALYZE-FILE with a made-up path. The JavaScript tests already work
     this way. Step 4's venv test and step 11's scratch venv are written to
     a temporary directory.

  9. A virtual environment holding markdown. REPOSITORY-FILES is not the
     only walk. The document store enumerates the same tree listing
     (DES-0051), so a README.md inside an un-ignored venv would still be
     indexed. Step 4 applies the pyvenv.cfg rule in both places, and its
     test puts a .md file in the venv.

  10. python3 on PATH. The machine has python3 3.12.3. The Python tests skip
      when python3 cannot be started, the way JS-TEST skips without node. A
      skip passes for the wrong reason (CON-0003). The suite prints a skip
      count, and step 8's commit records that it is zero on this machine.

  11. RULE-0006 (warning) reports a definition silently shadowed by a
      same-key definition in its own file. D9 writes :SHADOWED-DEFINITIONS,
      so the rule may start reporting Python files. Neither tree has a case
      (DES-0053 D9). If `check` shows one, read it. Do not suppress it.

  12. BUG-0069 is open. `complete` with no verdicts writes when every
      refined document is blocked. Here DES-0053 will be awaiting a
      verdict, so the dry run in step 12 should write nothing. Run `git
      status` after the dry run to confirm.

  STEPS

  Each step is one commit on req-0078. Step 1 is the first that can be
  run.

  1. THE ONTOLOGY.  src/ontology/code-ontology.lisp, src/ontology/package.lisp,
     src/ontology/test/code-ontology.lisp.

     :SETTING. Natural key (:name). Properties: :SOURCES, a list whose only
     value in this stage is :ENVIRONMENT, plus :LANGUAGE and :DOMAIN as other
     code entities carry them. Its documentation says the graph mints it and
     no analyzer writes it (D10).

     :READS. From (:function :method :test :variable :file) to (:setting).
     :TRANSITIVE-IMPACT T, :IMPACT-DIRECTION :REVERSE, so a change to a
     setting reaches its readers and their callers.

     Vocabulary. :MODULE joins :CALL-SITE's :REFERRER-KIND :ONE-OF list.
     :UNITTEST joins :TEST's :FRAMEWORK list. :PYTEST is already there
     (code-ontology.lisp:958). :PYTHON is already in *SOURCE-LANGUAGES*.
     :PYTHON does not join *MODULE-SCOPED-LANGUAGES* here (risk 7).

     Properties. :IMPORTED-CALLS and :UNRESOLVED-IMPORTED-CALLS on :FUNCTION,
     :METHOD, :TEST and :CALL-SITE. :DECORATORS on :FUNCTION, :METHOD and
     :CLASS. :ENVIRONMENT-READS on :FUNCTION, :METHOD, :TEST, :VARIABLE and
     :FILE. :DOCUMENTATION, :IMPORT-BINDINGS and :UNNAMED-ENVIRONMENT-READS
     on :FILE. Each has a documentation string naming the D-number that
     writes it.

     MAKE-CALL-SITE-ENTITY takes :IMPORTED-CALLS and stores it.

     Verification. New tests: a :SETTING asserts with its key and a
     :VARIABLE-to-:SETTING :READS edge is permitted. A :READS edge from a
     :CLASS is dropped. A :CALL-SITE with :REFERRER-KIND :MODULE validates.
     A :TEST with :FRAMEWORK :UNITTEST validates. MAKE-CALL-SITE-ENTITY with
     :IMPORTED-CALLS returns an entity carrying it. Before the edit, each
     test fails: the type is undeclared, the keyword is outside :ONE-OF, or
     the keyword argument is unknown. Green; no count moves, because nothing
     writes the new vocabulary yet. RULE-0001 still holds, because
     loom-ontology gains no dependency.

  2. THE SHARED CHILD.  src/analyzer/extractor-child.lisp (new),
     src/analyzer/js-analyzer.lisp, src/analyzer/loom-analyzer.asd,
     src/analyzer/test/extractor-child.lisp (new).

     extractor-child.lisp goes between "analyzer" and "js-analyzer" in the
     asd. It holds a struct with these slots: a name, a function returning
     the argv (called at each launch), a timeout, the process, a lock, and
     the unavailable reason. It holds the functions ENSURE-, STOP- and an
     exchange that writes one frame and reads one JSON line, with exactly
     one retry for a dead child (js-analyzer.lisp:186-219's rule). It also
     takes WITH-TIMEOUT-OR-NIL, UTF8-BYTE-LENGTH, WRITE-FRAME and READ-REPLY
     from js-analyzer.lisp, unchanged.

     js-analyzer.lisp builds one instance whose argv function reads
     *NODE-PROGRAM* and *JS-EXTRACTOR* at launch. It keeps every name in
     risk 1. ENSURE-JS-CHILD, STOP-JS-CHILD and PARSE-JAVASCRIPT become
     wrappers. *JS-CHILD*, *JS-CHILD-LOCK* and *JS-UNAVAILABLE-REASON*
     become symbol macros over the instance's slots, so `setf`, EQ and
     BT:WITH-LOCK-HELD work on them as before.

     Verification. Every test in src/analyzer/test/js-analyzer.lisp and
     src/workspace/test/domains.lisp passes with no edit (R14). Run
     `git diff --stat` on both files and confirm it is empty. New tests in
     extractor-child.lisp drive a child written inline as `python3 -c` (or
     `node -e` when python3 is absent): the child is reused, a stopped
     child is replaced and the next exchange answers, a missing program
     records a reason naming it, and a child that never replies yields NIL
     after the timeout. CON-0003: delete the retry and see the replacement
     test fail. Make the argv a captured string and see
     THE-TOOLCHAIN-BEING-ABSENT-IS-RECORDED-NOT-FATAL fail. Revert both.
     Green; no count moves.

  3. THE EXTRACTOR.  tools/py/extract.py (new),
     src/analyzer/python-analyzer.lisp (new, the child half only),
     src/analyzer/loom-analyzer.asd, src/analyzer/test/python-extract.lisp
     (new), CLAUDE.md.

     extract.py is D1, D2, D7 and D10's recognition. It runs as `python3 -I
     -B` and reads extract.js's frame. It imports ast, tokenize, builtins,
     json and sys, and nothing else. It never calls exec, eval, compile in
     exec mode, or importlib. It writes one JSON line per frame. The reply
     holds:
       - the module docstring and every import statement, with its scope,
         specifier, names and aliases
       - module-level bindings
       - every definition with its range, arguments as written, decorators
         (name, binding, literal keyword arguments, line), docstring, and
         nesting
       - every call with its binding kind (local, import, self, member,
         builtin), its enclosing definition, its line, its positional count
         and keyword names
       - every environment read, with its key or a non-literal marker, and
         its enclosing definition
       - on a SyntaxError, D7's pieces: each damaged piece's line range and
         an error text that includes sys.version.
     The reply holds no value from a default argument of an environment read.

     python-analyzer.lisp holds only *PYTHON-PROGRAM* ("python3"),
     *PY-EXTRACTOR* (the asd-relative path to tools/py/extract.py), the
     extractor-child instance and PARSE-PYTHON. No analyzer is registered.

     CLAUDE.md: "beside `js/`, which is not a tool at all" becomes
     `js/` and `py/`, each loaded by the analyzer at runtime.

     Verification. python-extract.lisp calls PARSE-PYTHON on inline source.
     It asserts each D2 case from DES-0053's table, including the five
     worked specifier and path pairs. It also asserts:
       - a function-local import binds only in that function
       - a class body does not enclose its methods' names
       - a comprehension variable is not a module name
       - `global` rebinds to module scope
       - a parameter used as a callee is dropped
       - `print` is dropped as builtin
       - `from os import environ as E; E.get("K", "v")` records "K" and not
         "v"
       - a two-statement file with an error in the second returns the
         first's definitions and the second's exact range
       - the error text contains the interpreter's version
     R2: the source's top level opens a marker path under the scratch
     directory for writing. The test asserts the path does not exist after
     the reply. Each assertion fails before the step, because PARSE-PYTHON
     does not exist. That is weak evidence, so CON-0003 here means: change
     extract.py to drop the alias undo and see the alias test fail. Then
     add `exec(compile(source, path, "exec"))` and see the R2 test fail.
     Revert both. Green. `status` unclaimed rises from 10 .py to 11, which
     is tools/py/extract.py. No other count moves.

  4. VIRTUAL ENVIRONMENTS BY WHAT THEY ARE.  src/workspace/workspace.lisp,
     src/workspace/test/workspace.lisp.

     REPOSITORY-FILES collects the directories holding a file named
     pyvenv.cfg from the tree listing it already has, and drops every
     claimed path under one. The same predicate goes into the ignore
     function WATCH-REPOSITORY passes to the file store, so the store does
     not enumerate a document under a venv (risk 9). INDEX-REPOSITORY and
     POLL-ONCE both reach the analyzers through REPOSITORY-FILES
     (workspace.lisp:1131 and 1443). This step greps for any other caller of
     ANALYZABLE-P or TREE-LISTING that feeds INDEX-FILE and applies the rule
     there too. DES-0053 D11 names "the monitor's single-file path". At
     715eedf that path is POLL-ONCE.

     Verification. A test builds a scratch tree that is not a git
     repository, so no .gitignore applies. It holds env/pyvenv.cfg,
     env/lib/x.lisp, env/lib/README.md and src/a.lisp. It asserts that
     src/a.lisp is indexed and nothing under env/ is. Before the step,
     env/lib/x.lisp and the README are indexed, so the test fails. Step 8
     adds env/lib/site.py to the same test. Green; no count moves on
     Loom's tree.

  5. PYTHON SPECIFIERS.  src/graph/resolve.lisp, src/graph/package.lisp,
     src/graph/test/resolve.lisp, src/ontology/code-ontology.lisp,
     src/workspace/workspace.lisp, src/process/console.lisp.

     A new RESOLVE-PYTHON-SPECIFIER implements D5. It is given the importer
     path, the table of known paths, and the importer's domain root, if
     any. A relative specifier climbs one directory per dot after the first.
     An absolute one is tried under three roots, in order:
       1. the importer's directory, when it holds no indexed __init__.py
       2. the parent of the outermost package containing the importer
       3. the domain root
     Under a root, "a.b" names a/b.py or a/b/__init__.py. A miss is
     :UNRESOLVED (relative), :UNROOTED (some indexed file or package has
     that top-level name, but none of this importer's roots holds it) or
     :EXTERNAL. For each module-level :IMPORT-BINDINGS entry `from S
     import a`, it also tries S.a.

     BUILD-MODULE-SCOPE dispatches on the importer's :LANGUAGE: :PYTHON goes
     to the new resolver, and every other language goes to
     RESOLVE-MODULE-SPECIFIER unchanged. :PYTHON joins
     *MODULE-SCOPED-LANGUAGES*. IMPORT-SUMMARY counts :UNROOTED. The
     console's `status` imports line prints it as a sixth number.

     Verification. Tests in resolve.lisp, on :FILE entities built by hand
     with :LANGUAGE :PYTHON:
       - main.py in a directory with no __init__.py resolves `config` to its
         sibling (root 1)
       - ledger/posting.py resolves `ledger.hashing` with ledger/ a package
         (root 2)
       - `.posting` from ledger/__init__.py resolves
       - `..x` climbs two directories
       - "a.b" finds a/b/__init__.py when there is no a/b.py
       - tests/test_refs.py's `ledger.refs` is :UNROOTED with no domain and
         resolves once the domain root is functions/
       - `googleapiclient.discovery` is :EXTERNAL
       - `from ledger import dates` adds ledger/dates.py to the scope
       - a Python caller's same-file def wins over a same-named def in
         another file (VISIBLE-CANDIDATES' local tier, now that :PYTHON is
         module-scoped)
       - a JavaScript importer's answers are unchanged, from the existing
         RESOLVE-MODULE-SPECIFIER tests
     RESOLVE-MODULE-SPECIFIER-ANSWERS-AGAINST-THE-INDEX-AND-NOT-THE-DISK
     gets a Python twin (risk 5). Before the step, `config` comes back
     :EXTERNAL from the JavaScript path, or the Python file is not
     module-scoped and has no scope at all. Either way the tests fail.
     Green. load-test prints T (console.lisp changed). Loom's tree has no
     Python file yet, so its imports line reads six zeroes.

  6. THE :IMPORTED-CALLS TIER.  src/graph/resolve.lisp, src/graph/package.lisp,
     src/graph/test/resolve.lisp, src/process/console.lisp,
     src/serve/operations.lisp.

     RESOLVE-CALLS reads each caller's :IMPORTED-CALLS beside its call
     names. Each entry is resolved with the step-5 resolver, then walked by
     D6's four steps. A class at the end of the walk goes to
     "Class.__init__". The walk stops after 16 steps and refuses a cycle. A
     hit is one :CALLS edge at confidence 1.0. A miss goes into
     :UNRESOLVED-IMPORTED-CALLS with :EXTERNAL, :UNROOTED,
     :MISSING-IN-TARGET or :NOT-CALLABLE. That property is written
     unconditionally whenever the caller has entries, as :UNRESOLVED-CALLS
     is.

     CALLER-CALL-NAMES returns NIL for a :CALL-SITE carrying
     :IMPORTED-CALLS. A Python caller's candidates are filtered to
