      PROPOSE-DOMAINS reads two signals and proposes, never decides. A nested
      package.json declaring no `type' proposes `commonjs' at its directory; a
      jsconfig.json or tsconfig.json proposes one domain per `include' root with
      the preset its `moduleResolution' names, and translates each `paths' entry
      of the form "key/*": ["target/*"] into the prefix form. An entry with
      several targets or a non-trailing wildcard is reported and not translated,
      which is CON-0001. It also reports every directory holding module files
      that fell to `default', so a boundary neither signal marks is named rather
      than missed.

      On front-end this proposes src/ and server/ from `include' and functions/
      from its own package.json, and `bundler' for all three. server/ being
      node-esm is the one thing neither signal states.

      The proposal is written into the preparation plan PREPARE-REPOSITORY
      (init.lisp:807) already renders and shows, so the author confirms before
      anything is written.

      Verification: an init test over a fixture tree holding a jsconfig.json with
      two include roots and a nested package.json, asserting three proposals with
      the presets above and one report line for a `paths' entry with two targets.
      It fails today because PROPOSE-DOMAINS does not exist.

  15. FINISH.  `tools/loom.sh 'complete PLAN-0050 DES-0047=<verdict>''.

      Loom performs the status transitions; the verdict is the judgement it will
      not make. What to expect:

