  11. THE MEASUREMENT.  tools/test/import-census.py.

      REQ-0063 R4 and DES-0047 R14. The instrument brings the service up itself
      (RULE-0008): it calls tools/test/service.py's `ensure', which runs
      `tools/loom-serve.sh update' and waits for every named tree to reach
      `ready', and it refuses with a sentence rather than print a figure against
      a service it could not reach. `tools/loom.sh' is not the driver: it
      reindexes every tree it names on every call, and front-end is 476 module
      files.

      It prints, per repository: the number of :IMPORT-SOURCES entries, how many
      begin with a declared alias key, how many of those resolved, and the split
      by the four causes.

      The acceptance. Every alias-rooted specifier front-end records resolves
      except those whose target extension no analyzer claims, and each of those
      is counted :UNCLAIMED-TARGET rather than :UNRESOLVED. Against the
      2026-09-03 scan that is at most 7 of 1305 unresolved, and 6 of the 7 are
      .css.

      The denominator needs saying, because two scans disagree about it.
      REQ-0063 counted 1320 alias specifiers by matching `from "..."',
      `require("...")' and `import "..."'; DES-0047 counted 1305 with a narrower
      scan. What :IMPORT-SOURCES actually holds comes from acorn:
      ImportDeclaration, ExportNamedDeclaration with a source, and
      ExportAllDeclaration (tools/js/extract.js:453, 466, 487). It excludes
      dynamic `import()' and every `require()'. So the census's own count of
      alias-rooted entries is the denominator, it should fall between 1305 and
      1320, and a figure outside that band means the extractor and the scan
      disagree about what an import is -- which is a finding to record, not a
      failure of this plan.

      Also recorded, not asserted: front-end's :CALLS count before and after step
      7, which is REQ-0063's second cost and the reason VISIBLE-CANDIDATES was
