id: PLAN-0050
title: DES-0047 in fifteen steps -- the property, the declaration, the stamp, the resolver, the pass, the measurement, the address on three surfaces
status: draft
date: 2026-09-03
refines: [DES-0047]
affects: [resolve-module-specifier, build-module-scope, visible-candidates,
          resolve-calls, resolve-and-check, index-repository, repository-registry,
          parse-frameworks, read-frameworks, frameworks-problems,
          default-system-for-path, analyze-path, make-call-site-entity,
          generated-entity, declared-properties-only, inspected-properties,
          callable-lookup, find-entities, properties-match-p, search-entities,
          best-name-match, repository-status, print-status, run-command,
          current-repository, repository-token-p, find-repository,
          require-repository, invoke-operation, validate-arguments,
          check-capability, prepare-repository, module-scoped-language-p]
tags: [javascript, imports, aliases, domains, module-resolution, front-end,
       req-0063, des-0047, des-0006, des-0009, des-0021, des-0025]
summary: |
  Fifteen steps, each ending at a green `tools/loom-test.sh' and a `check' that
  still reads 0 violations, 8 unresolved and 7 ambiguous. Re-sequenced against
  DES-0047 as amended at d817913: A1 makes :DOMAIN a keyword and moves the write
  from twenty analyzer sites to one stamp in ANALYZE-PATH, and A2 makes the
  domain an address on REST and MCP as well as the console.

  The order is set by seven hard dependencies, all of which survive the
  amendments: the ontology property before anything writes it, because
  DECLARED-PROPERTIES-ONLY drops an undeclared one in silence and an
  UPDATE-PROPERTIES naming one rejects its whole transaction; the parser before
  DOMAIN-FOR-PATH; the stamp before BUILD-MODULE-SCOPE, which reads the property
  rather than recomputing it; the resolver before the scope; the scope before
  RESOLVE-IMPORTS; RESOLVE-IMPORTS before RESOLVE-AND-CHECK; and, new with A2,
  the loom-workspace designator split of step 12 before the REST and MCP address
  of step 13, which calls it.

  Step 7 wires RESOLVE-IMPORTS into RESOLVE-AND-CHECK and is the one step that
  can change what nine watched trees index. What proves it did not is the entity
  and relationship counts on the six Common Lisp trees in tools/extra-repos read
  before and after, which must be identical, since MODULE-SCOPED-LANGUAGE-P is
  false there and BUILD-MODULE-SCOPE returns an empty table before any domain is
  looked up. Steps 12 and 13 are the two that can break the peer property, and
  `sbcl --script tools/test/load-test.lisp loom-serve' is the only instrument
  that sees it: its own header names CURRENT-REPOSITORY from console.lisp as one
  of the three edits it exists to catch, and A2d's split is exactly that
  temptation.

  REQ-0063 R4's measurement first becomes takeable at step 11, after step 9 puts
  the count on `status' and step 10 writes front-end's `domains:' declaration. It
  is taken through the running service by a census under tools/test/ that calls
  service.py's ensure, because `tools/loom.sh' reindexes every tree it names on
  every call and front-end is 476 module files.

  Four things the amended design leaves unsettled are settled here and named as
  such: :UNCLAIMED-TARGET is decided inside loom-graph from
  *MODULE-FILE-EXTENSIONS*, because no analyzer's claim list is reachable from
  there; the designator split tries the whole string before splitting, because
  FIND-REPOSITORY accepts a path and a path is full of slashes;
  REQUIRE-REPOSITORY-NOW takes the same split as REQUIRE-REPOSITORY, because
  :STATUS is one of R15's six scoping operations and does not go through the
  latter; and enrich.lisp:104 is a fourth post-analysis site writing :SYSTEM
  outside the ANALYZE-PATH funnel, beside the three in resolve.lisp the design
  names. One thing is deferred rather than settled: tools/js/extract.js records
  no `require()' call as an import source, so DES-0047 R14's functions/ clause
  cannot be measured on front-end, and it is still the single OUTSTANDING item
  at step 15.

body: |
  FILES

  Created:

    src/workspace/test/domains.lisp   end-to-end fixture repository: three
                                      domains, a nested root, a cross-domain
                                      import, the alias tier (R13)
    tools/test/import-census.py       reads the imports split per repository
                                      over REST, after service.py's ensure

  Changed:

    src/ontology/code-ontology.lisp   :DOMAIN declared beside every :SYSTEM
                                      declaration (12 types); :UNRESOLVED-IMPORTS
                                      on :FILE; MAKE-CALL-SITE-ENTITY takes
                                      :DOMAIN
    src/analyzer/frameworks.lisp      `domains:' parsed; PARSE-DOMAIN,
                                      DOMAIN-TABLE, DOMAIN-PROBLEMS, the preset
                                      table
    src/analyzer/analyzer.lisp        DOMAIN-FOR-PATH and *DOMAINS* beside
                                      DEFAULT-SYSTEM-FOR-PATH; ANALYZE-PATH
                                      (line 214) stamps :DOMAIN onto every
                                      entity op it returns
    src/analyzer/package.lisp         exports for the above
    src/graph/enrich.lisp             :DOMAIN beside :SYSTEM in
                                      INSPECTED-PROPERTIES (line 104)
    src/graph/resolve.lisp            RESOLVE-MODULE-SPECIFIER takes :DOMAIN and
                                      returns a cause; the preset table;
                                      BUILD-MODULE-SCOPE takes :DOMAINS and
                                      returns the unresolved specifiers;
                                      RESOLVE-IMPORTS; :MODULE-SCOPE threaded
                                      through NAME-LOOKUP, CALLABLE-LOOKUP and
                                      RESOLVE-CALLS; :DOMAIN copied at 742, 890
                                      and 1159
    src/graph/package.lisp            RESOLVE-IMPORTS exported
    src/workspace/workspace.lisp      REPOSITORY-DOMAINS beside
                                      REPOSITORY-REGISTRY; INDEX-REPOSITORY binds
                                      *DOMAINS*; RESOLVE-AND-CHECK builds the
                                      scope once and runs RESOLVE-IMPORTS;
                                      REPOSITORY-STATUS carries
                                      :UNRESOLVED-IMPORTS and :DOMAIN-PROBLEMS
    src/workspace/init.lisp           PROPOSE-DOMAINS in the preparation plan
    src/process/console.lisp          *COMMAND-DOMAIN*, DOMAIN-FILTER;
                                      RUN-COMMAND splits the @token through
                                      loom-workspace; PRINT-STATUS gains the
                                      imports line; the index commands refuse a
                                      domain token
    src/knowledge/services.lisp       BEST-NAME-MATCH takes property-filters
    src/knowledge/context.lisp        the two seeding walks take them
    src/knowledge/similar.lisp        the candidate walk takes them
    src/serve/registry.lisp           INVOKE-OPERATION refuses a domain-bearing
                                      designator on a :WRITE or :REPL entry
    src/serve/operations.lisp         REQUIRE-REPOSITORY and
                                      REQUIRE-REPOSITORY-NOW return the domain
                                      as a second value; RESOLVE-ENTITY and the
                                      six scoping entries pass it on
    src/mcp/tools.lisp                nothing, and step 13 says how that is
                                      checked rather than assumed
    src/ontology/test/*, src/analyzer/test/frameworks.lisp,
    src/analyzer/test/analyzer.lisp, src/graph/test/resolve.lisp,
    src/workspace/test/workspace.lisp, src/process/test/console.lisp,
    src/serve/test/*, src/rest/test/*, src/mcp/test/*
                                      the per-step tests named below
    ~/github/front-end/.loom/frameworks.yaml   the `domains:' declaration, three
                                      entries, outside this repository

  BLAST RADIUS

  What Loom reports. `impact default-system-for-path 2' returns 42 entities: the
  eight analyzer sites that write :SYSTEM, ANALYZE-FILE in four analyzers,
  TYPE-SPECIFIC-PROPERTIES three times in the YAML analyzer, and 13 tests.
  `impact parse-frameworks 2' returns 13, of which 8 are the tests in
  src/analyzer/test/frameworks.lisp and one is INDEX-REPOSITORY.
  `impact run-command 2' returns 32, of which 19 are console tests reached
  through RUN-TO-STRING. `impact resolve-module-specifier 3' returns 10 and is
  truncated; its only caller is BUILD-MODULE-SCOPE, whose only caller is
  NAME-LOOKUP.

  What Loom cannot see, and why:

    - The three RESOLVE-CALLS tiers reached through the NAME-LOOKUP struct. The
      accessors are generated by DEFSTRUCT inside a macro body, so calls to
      NAME-LOOKUP-MODULE-SCOPE are unattributed (DES-0001).
    - Every test driven by `test' or `js-test'. Both are body-swallowing macros,
      so the 1045 cases under-report what they call.
    - The loom-serve, loom-rest and loom-mcp operations over SEARCH-ENTITIES.
      `impact search-entities' reaches operations.lisp:217 as a :CALL-SITE, but
      no rule and no check covers that boundary, so a clean `check' there is not
      evidence a change is contained.
    - Six of the nine trees in tools/extra-repos are not in the index at all.
      They are the regression surface for step 7 and are read over REST rather
      than asked about here.

  Five things `impact' does not report because they are not edges:

    - DECLARED-PROPERTIES-ONLY (resolve.lisp:687) filters a generated entity's
      plist through FIND-PROPERTY, so a :DOMAIN not declared on the minted type
      is dropped without a message. That is the hard dependency from step 1 to
      steps 3 and 6.
    - An UPDATE-PROPERTIES op naming an undeclared property rejects its whole
      transaction (transaction.lisp:233). :UNRESOLVED-IMPORTS is written that
      way, exactly as :UNRESOLVED-CALLS is at resolve.lisp:1287, so step 6
      cannot precede step 1.
    - FRAMEWORKS-PROBLEMS is exported and called by nothing but its own test.
      Step 9 builds the reporting path it needs rather than extending one.
    - ANALYZE-PATH (analyzer.lisp:214) is the sole production caller of
      ANALYZE-FILE; every other caller in the tree is a test helper -- JS-OPS,
      MD-OPS, DOCS-OPS, FIXTURE-OPS, ANALYZE-SOURCE and the two enrich parity
      tests all call ANALYZE-FILE directly. So A1's stamp covers every indexed
      file and no entity any analyzer test builds, which is what step 8's
      fixture has to be built through the workspace pipeline to see.
    - REQUIRE-REPOSITORY has seventeen call sites and Loom reports fifteen as
      :CALL-SITE entities. A DEFINE-OPERATION body yields one site per call name
      at the body's start line (DES-0014), so two calls to one name in one body
      collapse to one site. Fifteen is an under-count of an edit surface, not a
      smaller one.

  Four counts that must not move on Loom's own tree until step 12 changes what
  `find' selects: 409 files, 3776 entities, 18214 relationships, 251 documents.
  Step 3 adds one property per entity and no entity and no edge. :DOMAIN is a
  component of no natural key anywhere, so no id changes and no entity is
  reasserted as a second one.

  WHAT THE AMENDMENTS SETTLED, AND WHAT THEY LEFT OPEN

  Two of this plan's four decisions are now the design's. D-a -- :SYSTEM is
  declared on twelve entity types and not the eight the design first named -- is
  DES-0047 R4, with :PACKAGE, :CALL-SITE, :DESIGN and :ARCHITECTURE added and
  :CALL-SITE given the reason resolve.lisp:890 and 1159 supply. D-b is reversed:
  :DOMAIN is a keyword, matching :SYSTEM's type at all twelve declarations. The
  interning objection this plan raised does not survive R10's refusal, which
  forces a lookup of a caller's token against the declared set before anything is
  interned, and PROPERTIES-MATCH-P's EQUAL holds on a keyword because two
  occurrences of one keyword are EQ. D-d is reversed by A2: the domain is an
  address on REST and MCP as well as the console, which is step 13.

  D-c stands unchanged. :UNCLAIMED-TARGET is decided from
  *MODULE-FILE-EXTENSIONS*. DES-0047 R7 defines the cause as "a path whose
  extension no analyzer claims", and no analyzer's claim list is reachable from
  loom-graph -- loom-graph depends on loom-utils, loom-ontology and
  bordeaux-threads, which RULE-0001 and RULE-0002 enforce, and loom-ontology
  holds no extension-to-language table. The decidable form in loom-graph is: a
  rewritten path carrying an explicit extension that is not in the preset's
  extension list is :UNCLAIMED-TARGET; a path with no extension, or with one in
  the list, that is still not in KNOWN is :UNRESOLVED. That separates front-end's
  6 .css and 1 .json from a stale declaration, which is what R7 exists to do. The
  rejected alternative is handing the claim list down beside :DOMAINS, which is a
  third data channel through RESOLVE-AND-CHECK for a distinction two lists of
  extensions already make.

  Three new decisions the amendments made necessary and did not make.

  D-e. THE SPLIT TRIES THE WHOLE DESIGNATOR FIRST, THEN SPLITS AT THE LAST `/'.
  R10 says "splits a leading @token on its first `/'", which is right for a
  console token and wrong for the shared function A2d puts in loom-workspace.
  FIND-REPOSITORY accepts a name or a root path -- its own docstring's middle
  branch exists so `unwatch "~/lisp/Loom"' matches a repository registered as
  /home/beberman/lisp/Loom/ -- and every path designator contains slashes. A
  first-`/' split turns "/home/beberman/lisp/Loom" into an empty repository name
  and a domain called "home". The rule here is: look the whole designator up
  through FIND-REPOSITORY; only when that finds nothing, split at the last `/'
  and look the left half up. Both halves must be non-empty. That answers
  `front-end/server' and `/home/beberman/github/front-end/server' identically,
  leaves every designator that names a watched repository whole untouched, and
  agrees with R10 on every console token, since a token with one `/' splits the
  same way under either rule.

  D-f. REQUIRE-REPOSITORY-NOW TAKES THE SAME SPLIT. A2c names REQUIRE-REPOSITORY
  as the place the existence refusal lives. :STATUS is one of R15's six scoping
  operations and does not call it: operations.lisp:548 calls
  REQUIRE-REPOSITORY-NOW, which exists so that an introspection call is not
  blocked by the index it is introspecting. Both functions take the split and
  both return the domain as a second value, or `status @front-end/server' is
  refused as an unwatched repository.

  D-g. THE FOURTH POST-ANALYSIS SITE IS enrich.lisp:104. The design names three
  sites outside the ANALYZE-PATH funnel that copy :SYSTEM (resolve.lisp 742, 890,
  1159). INSPECTED-PROPERTIES (enrich.lisp:97-111) is a fourth: it writes
  `:system (inspected-system (getf definition :system))' onto an entity minted
  from a child image's report, and DES-0011's enrichment is opt-in and Lisp-only,
  so the value would always be the default domain. It gets the copy anyway,
  because the invariant the design states is that an entity carrying :SYSTEM
  carries :DOMAIN, and a fourth site quietly exempt is the drift A1's single
  stamp exists to prevent.

  RISKS

  R-a. Step 7 changes every tree. RESOLVE-AND-CHECK runs on nine watched
  repositories and step 7 adds a pass to it. Six of them are Common Lisp, where
  MODULE-SCOPED-LANGUAGE-P is false, BUILD-MODULE-SCOPE returns an empty table
  and RESOLVE-IMPORTS emits no op. What proves it: the entity and relationship
  counts for loom, utils, cl-dbi, cl-mysql, datascience, linear-algebra,
  numerical-utilities and game-server, read from /v1/status before and after step
  7, identical in every pair. front-end's relationship count rises, and that is
  the acceptance rather than a regression.

  R-b. RESOLVE-CALLS regresses through the scope it did not build. Step 5 gives
  RESOLVE-CALLS a `:module-scope' argument and NIL keeps it building its own, so
  every existing caller is unchanged. The failure mode is step 7 handing in a
  scope built with domains where the old one was built without: VISIBLE-CANDIDATES
  then narrows more than it did, which is the intent on front-end and a change in
  :CALLS edge counts nobody asked for elsewhere. On the six Lisp trees the table
  is empty either way. On front-end the :CALLS count is expected to fall, and the
  census in step 11 records it rather than asserting it, because a smaller
  fan-out is what REQ-0063's second paragraph asks for.

  R-c. A generated entity silently loses :DOMAIN. If step 1 declares :DOMAIN on
  fewer types than a generator can mint, DECLARED-PROPERTIES-ONLY drops it, the
  suite stays green, and every macro-minted entity is unfilterable by domain with
  nothing saying so. The test in step 1 is written against the declarations
  themselves -- every type declaring :SYSTEM declares :DOMAIN -- so a thirteenth
  type added later fails it.

  R-d. Tests likely to break, and why:

    - resolve-module-specifier-answers-against-the-index-and-not-the-disk
      (src/graph/test/resolve.lisp:1138) calls the function with three positional
      arguments. Step 4 must keep DOMAIN a keyword argument defaulting to NIL, or
      this fails, and it failing is the signal that R2's "every tree keeps the
      behaviour it has" was broken.
    - default-system-for-path-* (src/analyzer/test/analyzer.lisp:30-50). Step 3
      adds a function beside DEFAULT-SYSTEM-FOR-PATH and must not change it.
    - The seven search-entities tests (src/knowledge/test/services.lisp) and the
      eight console repository-token tests (src/process/test/console.lisp:481-598).
      Step 12 adds a filter and a token split to the code they cover.
    - The eight frameworks tests (src/analyzer/test/frameworks.lisp:30-106). Step
      2 adds a fourth key to PARSE-FRAMEWORKS' return value; a test comparing the
      whole plist rather than one GETF would break.

  R-e. front-end's declaration goes stale against jsconfig.json. Step 9's
  divergence line is the only defence and it compares keys and targets as
  strings. It is the reason step 10 copies the 32 entries rather than
  paraphrasing them.

  R-f. tools/js/extract.js records no `require()' as an import source. It handles
  ImportDeclaration, ExportNamedDeclaration with a source and ExportAllDeclaration
  (extract.js:453, 466, 487) and nothing else, so front-end/functions/index.js's
  `require('./hello')' and `require('./api/handlers')' are CallExpressions that
  never reach :IMPORT-SOURCES. DES-0047 R14's clause "functions/'s 3 extensionless
  relative specifiers resolve under `commonjs'" is therefore not measurable on
  front-end, and D3's argument for the preset -- that CommonJS guesses extensions
  where node ESM does not -- is covered by step 8's fixture alone. Extending the
  extractor is a change to what every JavaScript tree records as an import and is
  deliberately not in this plan.

  R-g. Steps 12 and 13 can break the peer property, and only one instrument
  sees it. tools/test/load-test.lisp's own header names three edits it exists to
  catch, and the third is "CURRENT-REPOSITORY or RESOLVE-ENTITY from
  console.lisp". A2d's split is exactly that temptation: loom-serve needs the
  same name/domain parse loom-process needs, and the shortest way to get it is a
  `#:loom-process' in loom-serve.asd. Putting the parse in loom-workspace is what
  keeps the peers peers, and loom-process and loom-serve both already depend on
  loom-workspace, so no .asd changes. `sbcl --script tools/test/load-test.lisp
  loom-serve' must print T after step 12 and again after step 13. `check' cannot
  say anything about it either way: no rule names loom-serve, loom-rest, loom-mcp
  or loom-process.

  R-h. A path designator gets split into a domain. Covered by D-e, and the
  regression it would cause is silent on the surface that matters least and loud
  on the one that matters most: over REST, `?repository=/home/beberman/lisp/Loom'
  on :REINDEX would be refused as an unwatched repository, which is visible; on
  the console, `unwatch "~/lisp/Loom"' would be refused the same way, which is
  the defect FIND-REPOSITORY's middle branch was written to close. The test is a
  workspace test that FIND-REPOSITORY's three existing branches answer the same
  designators after the split as before it.

  R-i. A read-tier operation accepts a domain and ignores it. This is the one
  silent wrong answer DES-0047's CONSEQUENCES leaves reachable: scoping is
  opt-in, a body that never reads REQUIRE-REPOSITORY's second value answers about
  the whole repository, and the caller who named part of it cannot tell. Step 13
  closes it as far as a test can: a test walks ALL-OPERATIONS, and every :READ
  entry must either answer differently for a domain than for its repository on a
  two-domain fixture, or be named in a list with a one-line reason -- :CHECK,
  :RULES, :STRUCTURE, :DRIFT, :SURVEY and :CHECK-DOCUMENT answer about a whole
  repository by construction. The residual is honest and worth stating: the list
  can be extended, so this converts a silent wrong answer into a decision
  somebody has to write down, not into an impossibility.
  WHICH ARROWS ARE DEPENDENCIES

  Hard, and all seven survive the amendments: 1 to 3 and 1 to 6 (the ontology
  property before anything writes it); 2 to 3 (DOMAIN-FOR-PATH needs the parsed
  declaration); 3 to 5 (BUILD-MODULE-SCOPE reads the property the stamp wrote);
  4 to 5; 5 to 6; 6 to 7; 7 to 8 and 7 to 9 (nothing to report before the pass
  runs); 9 to 11 and 10 to 11 (the measurement reads the status line and needs a
  declaration to measure); 1 to 12 and 3 to 12 (the filter tests a property that
  has to exist and be written). New with A2: 12 to 13 is hard -- step 13's two
  refusals both call the SPLIT-DESIGNATOR step 12 puts in loom-workspace.

  Preferences, with their reasons: 8 before 9, 10 and 11, so the front-end figure
  is a measurement rather than the test (CON-0003); 7 before 12, which is not a
  dependency at all, since the filter needs only the property from step 3; 14
  last but one, because its output is a proposal a human confirms.

  What moved. Steps 1 through 11 keep their numbers; 1, 2, 3, 5 and 8 changed
  and say so in their headings. Step 12 changed and 13 is new. The old step 13,
  the `init' proposal, is now 14, and the old step 14, `complete', is now 15.

  STEPS

  1. THE ONTOLOGY PROPERTIES.  src/ontology/code-ontology.lisp.  AMENDED: the
     type is `keyword', not `string'.

     Declare `(:domain keyword ...)' immediately after each of the twelve
     `(:system keyword ...)' declarations, at lines 165, 320, 372, 413, 469, 620,
     658, 738, 881, 926, 1192 and 1253 -- :FILE, :PACKAGE, :CLASS, :INTERFACE,
     :FUNCTION, :METHOD, :VARIABLE, :CALL-SITE, :TEST, :DOCUMENT, :DESIGN and
     :ARCHITECTURE, which is DES-0047 R4 as amended. No `:one-of', for the reason
     :SYSTEM gives: the vocabulary is whatever the indexed repository declared.

     Declare `(:unresolved-imports list ...)' on :FILE beside :IMPORT-SOURCES.
     Give MAKE-CALL-SITE-ENTITY (line 790) a `domain' keyword and put it in the
     properties plist beside `system'; it is not a natural-key component, so it
     may arrive with the others.

     Verification: `tools/loom-test.sh' green across all nine systems. A new test
     in the ontology suite walks every entity type and asserts that a type
     declaring :SYSTEM declares :DOMAIN and that the two declare the same type.
     It fails before this step because :DOMAIN is declared nowhere, and it fails
     again the day someone adds :SYSTEM to a thirteenth type or widens either to
     a string. `tools/loom.sh 'check'' at 0/8/7.

     This is the first step that can be run. Nothing writes :DOMAIN yet, so the
     index is byte-identical.

  2. THE DECLARATION.  src/analyzer/frameworks.lisp, src/analyzer/package.lisp,
     src/analyzer/test/frameworks.lisp.

     AMENDED: the domain name is interned as a keyword here, once, when the
     declaration is read. That is the whole of A1's answer to the interning
     objection -- the bound on the keyword package is the declaration, which is
     three entries on front-end, and :SYSTEM has always had exactly that bound.

     PARSE-DOMAIN reads one `domains:' entry into
     `(:name :root :resolution :aliases :aliases-from)', with :NAME a keyword and
     :ROOT, the alias keys and the alias targets strings. `name' and `root' are
     required; an entry missing either declares nothing. `resolution' is one of
     "bundler", "node-esm", "commonjs" and defaults to "bundler"; a fourth name
     is refused rather than defaulted. `aliases' is a key-to-repository-relative-
     path table. PARSE-FRAMEWORKS gains `:domains' as its fourth key, built the
     way `:route-callers' is.

     *RESOLUTION-PRESETS* is the table DES-0047 gives: bundler tries
     (.js .jsx .mjs .cjs .ts .tsx) with guessing and index fallback, node-esm
     tries nothing with neither, commonjs tries (.js .json .node) with both. It
     lives here because the analyzer parses the name; the graph receives the
     expansion as data in step 4.

     DOMAIN-TABLE returns keyword-to-plist with the reserved :DEFAULT entry
     (root "", no aliases, bundler) present whenever no declaration supplies one,
     and `aliases-from' resolved by copying the named domain's map. A chain is
     refused, not followed.

     DOMAIN-PROBLEMS returns human-readable strings for R3's six refusals: a
     duplicated name, a duplicated root, use of the reserved name `default', an
     `aliases-from' naming a domain that does not exist, an `aliases-from' whose
     target itself uses `aliases-from', and an unknown `resolution'. Each names
     the two entries it is about. The seventh refusal -- a root under which no
     indexed file lies -- needs the file list and is added in step 9, where the
     caller has one.

     Verification: eight new tests in src/analyzer/test/frameworks.lisp, one per
     refusal plus one asserting that longest-prefix matching over nested roots
     src/ and src/ui/ places src/ui/Home.jsx in the second. Each fails today
     because PARSE-FRAMEWORKS returns a three-key plist. Loom's own tree has no
     .loom/frameworks.yaml, so READ-FRAMEWORKS still returns NIL for it and
     `check' stays at 0/8/7.

  3. THE STAMP.  src/analyzer/analyzer.lisp, src/analyzer/package.lisp,
     src/workspace/workspace.lisp, src/graph/enrich.lisp.  AMENDED: one stamp in
     ANALYZE-PATH, not eight writes in four analyzers. The four analyzers are
     unedited by this step.

     DOMAIN-FOR-PATH beside DEFAULT-SYSTEM-FOR-PATH (analyzer.lisp:280): the
     declared domain with the longest root that is a prefix of PATH, :DEFAULT
     when none is, as a keyword. `*domains*' is the special it reads, defaulting
     to NIL, which makes every path :DEFAULT.

     ANALYZE-PATH (analyzer.lisp:214) computes the domain once for the
     workspace-relative path it already computes for ANALYZE-FILE, and stamps it
     onto every entity op ANALYZE-FILE returned. One site rather than twenty, and
     it is sound because the two properties differ in exactly the way that
     permits it: :SYSTEM varies within a file -- the :FILE entity's own docstring
     records a two-IN-PACKAGE file getting one value that does not describe all
     of it -- and a domain is a function of the path alone.

     INDEX-REPOSITORY (workspace.lisp:714) binds `*domains*' from
     REPOSITORY-DOMAINS around the file loop, in the same LET as `*route-callers*'
     and for the same reason DES-0025 D1 gives: one watched tree's aliases must
