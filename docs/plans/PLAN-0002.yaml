  STEP 1 FAILURE COUNTS, AND ONE CORRECTION TO THE TEST'S SHAPE

  The graph test as this plan specified it -- one writer, one reader -- failed
  in 0 of 10 runs. It was not an instrument, and raising the iteration count
  would not have made it one, because the reason is not sensitivity. SBCL
  2.1.11 detects concurrent *mutation* of a hash table and not a read
  overlapping a write. Measured on a bare EQUAL table: one writer against a
  thread iterating it while 100,000 keys went in never signals; two writers
  signal within the first few hundred puthashes, every run.

  The test was therefore given a second writer, which is what this plan's own
  RISKS section directs ("raise the iteration count and the thread count until
  it fails, before writing any fix"), and which is the more faithful model of
  BUG-0004 in any case -- its collision pair is the console thread inside
  REINDEX-REPOSITORY against the monitor thread inside POLL-ONCE, and both of
  those write. The reader thread was kept, because ARCH-0003 R7 claims a
  benefit for it that would otherwise have no test.

    graph concurrency test      5 of 5 runs failed, pre-fix
    workspace stress test       4 of 5 runs failed, pre-fix, at 200 iterations
                                1 of 5 at the 60 iterations first tried
    full suite, unfixed tree    4 of 4 completed runs failed in exactly the two
                                systems predicted, loom-graph and loom-workspace

  The pre-fix graph failures were not only the expected condition. Across five
  runs: "Unsafe concurrent operations", an SBCL internal AVER failure
  (= HWM (HASH-TABLE-SIZE TABLE)), "Invalid index 2 for (SIMPLE-ARRAY
  (UNSIGNED-BYTE 32) (1))", and a generic function receiving 0 where an entity
  was expected -- a hash table torn far enough to hand out its own internal
  vectors. Entity counts landed at 1743, 30, 2002, 2026 and 2 of 4000.

  The workspace test needed one correction the plan did not anticipate.
  REINDEX-REPOSITORY clears the error list as its third act, so a collision
  INDEX-FILE recorded during one iteration is erased by the next, and a check
  made only after both threads have joined sees an empty list however bad the
  run was. Each worker now samples REPOSITORY-ERRORS after every call and
  returns what it saw. Without that sampling the test was reporting on the
  last iteration only.

