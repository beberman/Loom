  A FIXTURE DEFECT THAT LOOKED LIKE A LOCKING DEFECT

  Worth recording because it cost real time and would cost the next person the
  same. After step 4 the graph test still lost four to ten entities of four
  thousand, every run, with nothing signaled. That is the exact shape of
  ARCH-0003 R8's stated residual, and it was not that.

  The fixture built its nodes with graph-manager.lisp's GRAPH-TEST-NODE, which
  declares no :natural-key, so every instance took a random uuid from
  FRESH-ID -- and RANDOM-UUID:MAKE-UUID is not thread-safe. Two threads
  generating 20,000 uuids each produced 26,039 distinct strings of 40,000;
  one thread generating 40,000 produced 40,000. Duplicate ids, second write
  wins, entities gone. Repointing the test at a fixture keyed on (:file :name)
  took the loss to zero and made the test measure the graph and nothing else.
  The uuid generator's own defect is BUG-0005 and is out of scope here.

  STEP 5. The reentrancy test passes and cannot compile without the step. The
  torn-view test is better than this plan feared: run against a copy with the
  wrapper stripped from ADD-ENTITY and ADD-RELATIONSHIP it failed 2 of 5,
  catching a relationship reachable through ALL-RELATIONSHIPS but not yet
  through RELATIONSHIPS-FROM on its own from-id. It is real CON-0003 evidence
  and not the formality the plan expected to have to apologise for. Full suite
  green, `check` clean, both step-1 tests still passing.

  STEP 6. ARCH-0003 R13 PREDICTED SINGLE-DIGIT MILLISECONDS. IT IS LOW DOUBLE
  DIGITS.

  Absolute numbers first, on the real tree, single-threaded, monitor stopped,
  median of three, beside ARCH-0004's baseline:

    operation                     ARCH-0004    now
    reindex-repository, rebuild      196 ms   216 ms
    resolve-and-check alone           24 ms    24 ms
    poll-once, nothing changed     20-24 ms    28 ms
    poll-once, one file changed       56 ms    52 ms

  Those are not a measurement of the lock. The tree grew about 7 percent in
  entities between the two, and a first attempt to control for that compared
  the working tree against a copy -- which was wrong for a reason worth
  writing down: REPOSITORY-FILES calls DIRECTORY over "**/*.*", which descends
  .git even though the results are filtered out afterwards, so a copy made
  without .git polls three times faster than the original. The idle poll
  appearing to go from 8 ms to 28 ms was that, not locking.

  The controlled comparison is copy against copy, both without .git, the two
  differing only in whether graph-manager.lisp and transaction.lisp use the
  pt- primitives and with-graph-lock. Three paired invocations, seven runs
  each, medians:

    operation                     no graph lock   with graph lock   delta
    reindex-repository, rebuild    184 176 208     196 188 208       +12 ms
    resolve-and-check alone         24  20  28      32  28  28        +4 ms
    poll-once, nothing changed       8   8   8       8   8   8         0 ms
    poll-once, one file changed     32  28  36      36  32  40        +4 ms

  About 12 ms added to a 185 ms rebuild, roughly 6 percent, of which perhaps
  2 ms is the locked copy's 1 percent extra content. R13 predicted single-digit
  milliseconds; the measurement is twelve. The prediction was the right order
  of magnitude and slightly optimistic, and it is nowhere near the 20 percent
  threshold that would trigger this plan's fallback ladder, so no fallback was
  applied. What it means practically: nothing. Twelve milliseconds on an
  operation a human types by hand, against a poll interval of two seconds.

  One caution for whoever re-measures. This machine is noisy enough that a
  single seven-run median moved between 196 ms and 260 ms for the same code,
  and an early three-run pass reported the locked tree at 200 ms and a later
  seven-run pass at 260 ms. Only the paired, alternated invocations above are
  worth quoting; a single run of a timing script on a 200 ms operation says
  very little here.

