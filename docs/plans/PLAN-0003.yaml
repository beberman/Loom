  systems, loom-ontology and loom-graph failing, which is what the step says a
  reviewer should see. `check` after the .asd edit: 0 violations, 0 unresolved
  document references.

  One deviation from the letter of the step, in the ontology test: distinctness
  is counted with a hash table rather than REMOVE-DUPLICATES. REMOVE-DUPLICATES
  is quadratic and over 40,000 ids takes longer than the minting it is
  checking, which would have made the instrument slower than the defect it
  measures.

  STEP 2. THE FIX, AND THE ZERO-MILLISECOND PREDICTION, WHICH HELD.

  (a) Both step-1 tests passed in five consecutive runs, having failed in five
  consecutive runs before. (b) Six systems green in all five, no existing test
  edited and none needed editing, so no evidence that FRESH-ID's contract
  moved. (c) `status | check`: 0 violations, 0 unresolved document references,
  1 definer macro (DEFENTITY), 2 unenforced rules (RULE-0004, RULE-0005). And,
  as the step requires stating explicitly: a green `check` is not evidence
  about RULE-0001 here. Its check kind is :no-edge over edges between indexed
  entities, external libraries have no entities, and .asd files are not
  indexed, so it could not have gone any other way. THE ONE JUDGEMENT is the
  argument; this line is not.

  The counts did move, and the plan expected that -- 83 files, 938 entities,
  4335 relationships at BASELINE against 85 files, 948 entities, 4367
  relationships now. The two new test files and the *FRESH-ID-LOCK* defvar are
  the whole of it. Documents 32 -> 33, this plan.

  (d) The prediction was zero milliseconds and the honest answer is better than
  a timing: FRESH-ID is called ZERO times during a full reindex of this tree.
  Measured by rebinding its symbol-function to a counting wrapper across one
  complete REINDEX-REPOSITORY. That is deterministic and settles what the
  timing was only ever a proxy for -- no type is minting key-less entities that
  this plan did not know about, so there is nothing to stop and find.

  The timing itself is reported for completeness and is worth less than the
  count. Paired A/B in one image, alternating the locked FRESH-ID against the
  pre-PLAN-0003 body, seven runs each, medians: 139 ms locked, 135 ms unlocked.
  A 4 ms difference on a path the function is never called from is noise, and
  PLAN-0002's OUTCOME already warns that a single median on this machine moved
  between 196 ms and 260 ms for identical code.

  FIRST PREDICTION THAT CAME OUT WRONG: THE 216 MS BASELINE DOES NOT REPRODUCE.

  Step 2(d) says to compare against PLAN-0002's re-measured 216 ms. The full
  rebuild measures 135-143 ms today, roughly 35 percent faster, on a tree that
  has grown since. This is not the lock and cannot be -- FRESH-ID is not called
  -- and it is not a regression in anyone's favour worth chasing; it is the
  machine, which is the caution PLAN-0002's OUTCOME closes with. What it means
  for anyone re-reading this: 216 ms is not a number to compare a future
  measurement against, and a paired invocation in one image, as used here, is
  the only shape that says anything.

  SECOND PREDICTION THAT CAME OUT WRONG: A PROXY THAT LOOKED LIKE A DEFECT.

  Recorded because it will cost the next person the same twenty minutes.
  ID-DERIVED-P is NIL for every entity in the indexed graph -- all 948 of them,
  including entities whose ids plainly are derived, like
  "document:docs/arch/ARCH-0001.yaml". It reads as a defect and is not one:
  GRAPH-MANAGER.LISP:131's ADD-ENTITY clears the flag deliberately, with a
  comment saying why ("the id stops tracking the natural key here"). So
  ID-DERIVED-P on a stored entity is not a proxy for "was this id derived", and
  counting it is not a way to check whether anything reached FRESH-ID. Counting
  FRESH-ID's calls is, which is what (d) above does.

