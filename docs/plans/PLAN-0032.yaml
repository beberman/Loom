id: PLAN-0032
title: DES-0026 in seven steps: the walk, the tiers, the index, the ranking
status: draft
date: 2026-08-17
refines: [DES-0026]
affects: [build-context, context-item, render-context, seed-entities, seed-matches,
          seed-score, admit-seeds, neighbors, find-entities, definition-source]
tags: [context, knowledge, ranking, retrieval, expansion, req-0016, req-0031, con-0006]
summary: |
  DES-0026 has seven steps. The order is set by which elements are measurably
  broken, not by the order the design presents them.

  R6 is the only clause of REQ-0016 still failing a measurement. The R9 count of
  2026-08-17: `context data-handler` on game-server returns 6 of 10 expected
  entities, and the four it misses -- NULL-HANDLER, TABLE-HANDLER,
  MODEL-HANDLER, GAME-HANDLER -- are two or more :INHERITS hops from the seed.
  Ranking cannot reach an entity the expansion never visits, so the cost-ordered
  walk is S1.

  S4 through S6 are last because query latency is already 0.01-0.06s. The index
  buys length normalisation over the prose field REQ-0035 added, and removes four
  constants fitted by hand to one tree.

  Each step leaves working software. After S1 the four entities R6 misses are
  reachable. After S3 REQ-0031 is closed and a bundle can carry source. After S5
  no hardcoded list of English words decides which entities a query reaches.
body: |
  WHAT IS ALREADY TRUE

  DES-0026 was written before REQ-0031 and REQ-0035 landed. Four of its premises
  have changed since.

  DEFINITION-SOURCE exists (REQ-0031, PLAN-0030 S1) in loom-workspace, with
  padding, provenance and a 400-line cap. S3 spends it rather than building it.

  :DOCUMENTATION exists (REQ-0035, PLAN-0031) on eight entity types across two
  languages: 798 entities on Loom carrying 315 KB, 462 on game-server, 999 on
  front-end. S4's field set has six fields, not five. The longest single block is
  5,639 characters and a function name averages 5, so BM25's length
  normalisation decides most of the score rather than adjusting it.

  D1a's corrections hold: the CRUD protocol arrives on :USES and not
  :IMPLEMENTS, and *CONTEXT-RELATION-LIMIT* is a recall gate rather than a
  display cap, withholding 19 relations across two seeds on R6's own query.

  REQ-0016 R7's standing clause is met already, by REQ-0035 rather than by
  anything here. No step below should be justified by it.

  FILES

  src/knowledge/expand.lisp        new. The cost table, the frontier, the walk.
  src/knowledge/context.lisp       tiers, budget, the seeder's retirements.
  src/knowledge/services.lisp      the postings index and BM25.
  src/knowledge/loom-knowledge.asd the new components.
  src/knowledge/test/*.lisp

  S1  THE COST-ORDERED WALK, AND NO TRANSIT THROUGH A CONTAINER

  DES-0026 D6 and D8, together because either alone is unusable: the cost table
  without the container rule puts all forty of a file's definitions two hops
  from any seed that shares its file.

  Multi-source best-first over NEIGHBORS. Costs keyed on relationship type and
  direction -- :INHERITS and :IMPLEMENTS 1, :USES and :SERVES 2, :CALLS 3 out
  and 4 in, :CONTAINS and :BELONGS-TO 3, :TESTS 5, document edges excluded
  because DES-0020 owns them. Horizon 4. A container may be reached and not
  expanded from.

  :CALLS costs less outward than inward. What a thing calls is bounded by its
  body and describes that thing; what calls it is unbounded and describes the
  callers. R7's startup-sequence query depends on the outward direction being
  cheap, since READ-CONFIG and INITIALIZE-GAME-API are START-SERVER's callees.

  Each neighbour carries the edge it arrived on and its distance, and
  RENDER-CONTEXT prints both. This is half of D10, and it belongs in S1 because
  the acceptance below is checked by reading rows: a row that does not name its
  edge and cost cannot be verified against the cost table.

  R6's four missing classes are at cost 1 to 3 under this table. The number to
  move is 6 of 10, to at least 8 of 10. If it does not move, the cost table is
  wrong, and no later step corrects a table that cannot reach the entities.

  S1 MEASURED, AND WHAT IT RESEQUENCES, 2026-08-17

  Reachability is complete and the numeric target was not hit, and those are the
  same sentence rather than a contradiction.

  The walk reaches 157 entities from `context data-handler`'s eight seeds, and
  all three of R6's misses are among them: TABLE-HANDLER at cost 1, GAME-HANDLER
  at cost 1, MODEL-HANDLER at cost 3. The bundle still returns 7 of 10 rather
  than the 8 this plan asked for, because the neighbour band printed **2 of the
  157** before the 2,000-token budget ran out.

  So the binding constraint moved. S1 was written against a reachability defect
  and that defect is gone; what remains on R6 is budget, which is S3's, and no
  further work on the walk will move the number.

  Two corrections fall out. DES-0026 D1a said the three classes were "two or
  more :INHERITS hops from the seed" -- they are two hops from DATA-HANDLER and
  *one* from DB-HANDLER, which is itself a seed. The reachability argument for
  the walk survives intact and the arithmetic behind it was wrong.

  And S2 moves after S3. Convergence reorders the walk's output, and reordering
  is invisible while 2 of 157 rows are printed. Measuring S2 before the tiers
  exist would mean measuring nothing. The order is now S1, S3, S2, S4, S5, S6,
  S7, and the reason is that a step whose effect cannot be seen cannot be
  checked -- which is the same argument that put the arriving edge into S1's
  output rather than into a later step.

  S2  CONVERGENCE (AFTER S3 -- SEE ABOVE)

  D7. Carry a seed-origin set on each frontier entry and union it when a node is
  reached again; discount effective cost by one per additional seed, floored at
  1. The floor is argued rather than tuned: the cheapest edge costs 1, so a
  second seed reaching an entity is worth exactly the strongest structural claim
  the table admits and never more.

  The discount reorders and does not extend -- the horizon is checked against
  raw cost -- so convergence cannot pull in an entity the walk never reached.

  This is D7's answer to R5, and R5 is the clause REQ-0016 has never had an
  answer for. Measured on the startup-sequence query: whether the eight seeds
  meet somewhere sensible, reported either way including if they do not.

  S3  THE TWO TIERS, AND REQ-0031 CLOSES

  D2 and D3. A source tier of N entities carrying padded source, and an index
  tier naming everything else recalled at one line each.

  This is REQ-0031 R8 and it takes that requirement from `partial` to
  `implemented`. DEFINITION-SOURCE already returns the text, the padded range
  and a status; the work here is the budget split and the rendering.

  *CONTEXT-TOKEN-BUDGET* = 2000 was sized for a bundle carrying names and
  locations, and a padded source block is 200-600 tokens, so it becomes two
  budgets: definitions of source, and a large allowance of one-line entries.
  DES-0020 D5a's document reserve becomes a tier assignment rather than a claim
  on someone else's room.

  *CONTEXT-RELATION-LIMIT* is resolved here rather than left as D1a's finding: a
  relation is one line, so it belongs in the index tier and the cap becomes a
  source-tier concern only. That is the 19 withheld relations on R6's query
  returned without any new mechanism.

  S3 precedes S4 because S4 and S5 admit more candidates -- retiring a stoplist
  and a share cap both widen the set -- and a single 2,000-token budget would
  spend that increase on truncation instead of on entities.

  S4  THE POSTINGS INDEX AND BM25

  D4, and the largest single step here.

  At index time, tokenise into a term-to-entity postings map: names split on
  hyphen, underscore and case boundary with the whole name kept as a term, and
  the other five fields tokenised as words. Document frequency is a postings
  list length. BM25 scores with length normalisation over six fields --
  name, :SIGNATURE, :ARGUMENTS, path words, package, :DOCUMENTATION -- weighted
  name highest and path lowest.

  Two properties fall out and should be checked rather than assumed. Substring
  matching goes away, so MATCH-RANK's four bands go with it -- prefix and
  substring ranks are artifacts of not having tokens. And the path-only match
  that SEED-MATCHES drops as rank 3 becomes a low-weighted field instead, which
  is CON-0006 applied where D1's inventory said it should be.

  The prose field is what makes normalisation load-bearing: 5,639 characters
  against 12 is not a spread any hand-written rule was going to handle, and
  DES-0028 D6 declined to invent one precisely so this step would not have to
  remove it.

  Where the index lives is this step's own decision to make and record: the
  graph is rebuilt on every file save, so a postings map is either derived on
  demand and cached per generation, or maintained by the writer. The second is
  faster and couples loom-graph to a retrieval concern; the first is honest and
  costs a rebuild. Measure before choosing.

  S5  RETIRE THE CONSTANTS

  D5. Each is a proxy for term rarity, hand-fitted to one tree, and IDF is the
  quantity they were approximating.

    *CONTEXT-STOPWORDS*, 48 words. It misses "check", which is the word that
    broke game-server, and includes "test", which is a fine discriminator on a
    tree where test helpers are the subject. PLAN-0031 S4 met this defect while
    writing a test: the word chosen for a whole-word matching test was "test",
    and it never reached the prose pass at all.

    The coverage band's 8. Summing idf(t) is the same idea measured.

    *SEED-TERM-SHARE* = 2, replaced by an MMR-style redundancy penalty. A
    penalty reorders where a cap drops, which is the CON-0006 difference.

    TASK-TERMS versus TASK-TOKENS, and SLOT-ACCESSOR-P. Both exist to survive
    the "data" fragment, and under IDF the fragment is self-limiting.

  BASELINE TAKEN 2026-08-17, BEFORE ANY OF S5

      R6        10/10     R8      1/1     R7   7/7     R4   3/3
      prose      2/2      R6-loom 1/1     front-end 2/2
      total     26/26 present, 0 missing.  Latency 0.03-0.09s.

  The acceptance set is saturated. S5 can hold it or regress it and cannot
  improve it, so the R9 count cannot justify these four retirements -- it can
  only veto them.

  Two consequences. S5 needs queries the four constants currently answer wrongly,
  or it is a refactor with measurable downside and unmeasurable upside. And the
  argument for it is unchanged but now has to stand on its own: each constant is
  fitted to one tree, and REQ-0016 exists because mechanisms fitted to one tree
  fail on the next. That is a prediction about a fourth tree, and no query
  against these three tests it.

  Before S5 runs, find the queries. The candidates are known: a task using a word
  the 48-word list suppresses on a tree where it is informative -- "test" scores
  1.74 on front-end and is suppressed there -- and a task whose terms are more
  than eight, where the coverage band's 8 saturates and stops discriminating.

  S5 also forces the caching decision S4 deferred. Retiring the stoplist and the
  coverage band requires IDF at query time, so BUILD-SEARCH-INDEX moves onto the
  query path at 99-169 ms per call unless it is cached. Correct before fast:
  build per call, measure the latency against the 0.03-0.09s above, and add a
  generation counter to the graph only if the number is unacceptable. A cache
  keyed on entity and relationship counts would miss a rename, and a stale
  search result is a fabricated fact rather than a slow one.

  What survives: the type tiers, R4's test demotion, and :EXPORTED-P, which is
  in the schema and read by nothing.

  S6  ONE ORDER OVER THE RECALLED SET

  D9. Seeds and neighbours become commensurable: BM25 lexical score, the
  structural term from S1 and S2, entity properties, and the redundancy penalty
  from S5. The tier boundary in S3 becomes a cut in this order rather than a
  band boundary.

  The lexical-to-structural weight has no defensible value before measurement,
  which D9 states. Being wrong about it costs one `describe` call: the weight
  decides which entities get a source block, and every entity not chosen is still
  named in the index tier.

  S7  ACCEPTANCE, ON THREE TREES

  D12 in full, plus the R9 recall count for every query in it, plus the measure
  D12 asks for that nothing has reported yet: grep-equivalent tool calls after
  a bundle, which is REQ-0031 R7's instrument and the number this whole line of
  work exists to move.

  Loom, game-server and front-end. Full suite green, `check` clean, no new call
  from loom-knowledge into loom-workspace.

  RISKS

  S1's table is a guess with an argument, not a measurement. Seven costs and a
  horizon, chosen from what the ontology says an edge means. The R6 number is
  the check, and if it does not move the response is to re-derive the table from
  the four missing classes' actual paths rather than to tune one number.

  S4's index is where a subtle wrong answer hides. A postings map that
  tokenises differently from the query path silently returns nothing for terms
  that should match, and the symptom is a smaller bundle rather than an error --
  CON-0006's expensive error at the mechanism level. The guard is that the
  tokeniser is one function used by both sides, tested on the compound cases
  that already broke things: "data-handler", "LayerEditor", "*call-site-ceiling*".

  S5 removes what currently works. Every constant it retires is load-bearing
  today, and the R9 count is the only thing standing between "retired" and
  "regressed".

  Prose length under S4. DES-0028 D6 deferred normalisation here on the grounds
  that BM25 would bring it. If BM25's normalisation turns out not to handle a
  5,639-character field against a 12-character one, that is a finding about the
  parameters and not a licence to add a second rule.

  Scope. S1 through S3 do not need S4, and S4 does not need S1. The temptation
  is to land the index first because it is the interesting part; R6 is the
  clause that is failing.
