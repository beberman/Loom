  Departure. The plan says the local-calls list becomes (caller callee . keys)
  so a callee reached under two keys yields one op. LOCAL-FUNCTIONS maps one
  name to one entity and callee names are deduplicated before the loop, so a
  local callee has exactly one key. The list is (caller callee key) and the
  Lisp analyzer unions nothing. RESOLVE-CALLS does, where several names can
  reach one callee.

