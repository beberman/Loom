     (key signature line) to D11's value. Keys in first-seen order,
     signatures in first-seen order under each key, lines in source order.
     Identical signatures under one key share an entry.
     lisp-analyzer.lisp: LISP-ARGUMENT-KIND (form reading) gives D10's kind:
     a string `s`; a number `n`; NIL or T `b`; a keyword `k:<name>`; a form
     the reader marked :FUNCTION, or a list headed by LAMBDA, `f`; a form
     marked :QUOTE, a vector, or a backquoted form `q`; any other symbol
     `y`; any other cons `c`; anything else `x`. LISP-CALL-SIGNATURE (form
     reading) is `<n>:<kinds>` over (cdr form), walked as conses (risk 4).
     COLLECT-CALL-NAMES returns a third value: (name signature line) for
     each head-position name it records, with the line from FORM-RANGE and
     the caller's start line when FORM-RANGE finds none. A #'f designator
     adds no occurrence (FINDINGS 4). With no :READING the third value is
     NIL. The first two values are unchanged.
     Pass 2 keeps the occurrences whose name is a local callee or is in
     :CALL-NAMES, drops the rest (standard operators, reader artifacts,
     direct recursion), and writes GROUP-CALL-SHAPES' value as
     :CALL-SHAPES when it is non-empty. INITFORM-CALL-SITE-ENTITIES passes
     each site the entries for its name. DEFINER-CALL-SITE takes the
     reading (FINDINGS 3) and its plist gains :CALL-SHAPES, filtered as its
     :CALL-NAMES are.
     resolve.lisp: GENERATED-ENTITY copies the site's :CALL-SHAPES.
     DEFINER-CALL-SITE-ENTITIES gives each site CALL-SHAPES-FOR-KEY of the
     plist for its name. CALL-TARGETS' :AMBIGUOUS site takes
     CALL-SHAPES-FOR-KEY of the caller for its name (FINDINGS 2).
