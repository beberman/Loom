     CALL-SHAPE-DISTRIBUTION (view id) reads the callee's incoming :CALLS
     edges. For each, it takes the source's :CALL-SHAPES entries whose key
     is in the edge's :VIA. A site is (file, line, key, signature) counted at
     the largest multiplicity any one caller records (FINDINGS 5). It
     returns (:SITES n :SIGNATURES ((sig count) ...) :FAN-OUT n
     :WITHOUT-FORM n :PRE-EXPANSION bool). :SIGNATURES is sorted by count,
     most common first. :FAN-OUT counts the sites reached through an
     :AMBIGUOUS call site and is excluded from :SITES. :WITHOUT-FORM counts
     edges whose keys have no entry. :PRE-EXPANSION is T when the callee
     carries :MACRO-P. DESCRIBE-ENTITY adds :CALL-SHAPES, NIL when nothing
     calls the entity.
     SHAPE-SITES (view id &key (per-group 20)) returns the groups, rarest
     first and ties by signature, each (:SIGNATURE s :COUNT n :SITES
     ((file line caller-name) ...) :MORE m).
