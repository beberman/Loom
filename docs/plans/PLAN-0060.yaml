id: PLAN-0060
title: DES-0055 Plan B in nine steps -- the D13 baseline, :VIA on :CALLS, Lisp, Python and JavaScript call shapes, the front-end gate, describe and sites, acceptance on game-server, lfia and front-end, complete
status: draft
date: 2026-10-08
refines: [DES-0055, REQ-0078, REQ-0041]
affects: [assert-edge, enriched-edge, resolve-calls, call-targets,
          caller-call-names, generated-entity, definer-call-site-entities,
          make-call-site-entity, collect-call-names, definer-call-site,
          initform-call-site-entities, py-callable-properties,
          py-test-properties, py-call-site, py-call-sites,
          Extractor.record_call, js-call-names, describe-entity]
tags: [analyzer, graph, knowledge, call-site, arity, shapes, python,
       javascript, lisp, des-0055, req-0041, req-0078, des-0014, con-0001,
       con-0003, con-0005, dec-0003]
summary: |
  DES-0055 R9 to R12, which cover REQ-0078 R2 and REQ-0041 R1 to R5, with
  REQ-0041 R2 narrowed by U4 to argument kinds and keyword names. Each analyzer
  records one signature per call occurrence, `<arity>:<kind>,...|kw=kind`, as
  :CALL-SHAPES on the caller. Every :CALLS edge carries :VIA, the call keys
  that produced it, so a callee's distribution is a join and not a second
  resolution. `describe` prints the distribution in one line and a new `sites`
  command lists the sites grouped by signature, rarest first. The cost is
  measured on front-end before any extractor changes and again after the last
  one, against D13's budget of +10% index time and +15% heap.

  Out of scope: DES-0055 R1 to R8, which are PLAN-0059's. Also out of scope,
  each with its reason under DEFERRED: shapes for JSX usages and for Lisp #'f
  designators, a :CALL-SITE per occurrence, literal values (U4), and any write
  to ~/github/lfia-accounting, ~/github/front-end or ~/lisp/game-server.
body: |
  ORDER AGAINST PLAN-0059

  PLAN-0059 lands first, through its step 9. This plan's step 1 starts on the
  commit that holds all of it. Three reasons.

  1. D13 is a delta. Plan A adds +63 :MODULE and about 592 :IMPORTS edges on
     front-end (PLAN-0059 step 8). A baseline taken before Plan A and an
     "after" taken once it has landed would charge Plan A's cost to this plan.
  2. The two plans edit the same files in different functions:
       src/graph/resolve.lisp          A: RESOLVE-DEPENDENCIES (new).
                                       B: RESOLVE-CALLS, CALL-TARGETS,
                                       GENERATED-ENTITY,
                                       DEFINER-CALL-SITE-ENTITIES.
       src/ontology/code-ontology.lisp A: :MODULE, four :FILE properties,
                                       :DEPENDS-ON's :FROM.
                                       B: :CALL-SHAPES on :FUNCTION, :METHOD,
                                       :TEST and :CALL-SITE;
                                       MAKE-CALL-SITE-ENTITY; :CALLS' docs.
       tools/py/extract.py             A: Extractor.add_import.
                                       B: Extractor.record_call.
       src/analyzer/python-analyzer.lisp  A: MAKE-PY-FILE-ENTITY.
                                       B: PY-CALLABLE-PROPERTIES,
                                       PY-TEST-PROPERTIES, PY-CALL-SITE(S).
       src/knowledge/services.lisp     both edit DESCRIBE-ENTITY.
       src/process/console.lisp        both edit `describe`'s printer.
     Sequential landing removes every textual conflict in the last two.
  3. PLAN-0059 step 9 runs `complete` while this plan is a draft and expects
     the refusal it names in its FINDINGS 7. It sets DES-0055 to partial with
     an OUTSTANDING section naming R9 to R12. This plan's step 9 then takes
     DES-0055 from partial to implemented. The reverse order would need the
     same workaround with the roles swapped and gain nothing.

  ASSERT-EDGE is the one function Plan A calls and this plan changes. Step 2
  adds a keyword argument with a NIL default, so Plan A's calls are unchanged.

  BASELINE

  Loom at 291f090 on req-0078-python-completion, before PLAN-0059 has landed,
  with this file not yet written: `tools/loom.sh 'status | check'` printed
  491 files, 5243 entities, 25263 relationships, 301 documents, 1452 tests
  covering 465 units, 0 violations, 8 unresolved, 7 ambiguous, 5 definer
  macros. PLAN-0059 moves the document and test counts. Step 1 re-records all
  of them at the commit where Plan A is complete. Those figures are the
  baseline every later step compares against.

  ~/github/front-end at ab34be6 with five uncommitted entries in
  `git status --short`. ~/github/lfia-accounting at d0cfdf0 with seven
  uncommitted entries, being edited by another agent. ~/lisp/game-server at
  448dc8e. REQ-0041's acceptance names "the commit PLAN-0002 started from".
  game-server's first PLAN-0002 commit is b1b1651 ("PLAN-0002 stage 0"), and
  its parent is 9169e64. Step 8 reads 9169e64 in a scratch clone. Nothing in
  this plan writes to any of the three trees.

  "Green" after a step means: tools/loom-test.sh passes all twelve systems
  under /usr/bin/sbcl with no skip; `check` on Loom prints 0 violations and
  the unresolved and ambiguous counts step 1 recorded; `sbcl --script
  tools/test/call-site-census.lisp` prints 508 minted and 41 ambiguous; and,
  for steps 7 and 8, `sbcl --script tools/test/load-test.lisp loom-serve`
  prints T. New tests add :TEST entities to Loom's own index, so entity and
  relationship totals are not exit conditions. The :CALLS edge count is.

  Every new Lisp function name is checked with `find` before it is written.
  On 2026-10-08 nothing in the tree defines GROUP-CALL-SHAPES,
  LISP-CALL-SIGNATURE, LISP-ARGUMENT-KIND, PY-CALL-SHAPES, JS-CALL-SHAPES,
  CALL-SHAPES-FOR-KEY, CALL-SHAPE-DISTRIBUTION or SHAPE-SITES. Every new test
  is a plain fiveam `test`, with any python3 or node guard written inline, as
  PLAN-0058 FINDINGS 3 did. A js-test or domain-test body mints :CALL-SITE
  entities, and the ceiling of 512 has 4 sites of headroom.

  FINDINGS THAT CHANGE OR SHARPEN WHAT DES-0055 SAYS

  1. An edge's properties are replaced on every re-assert, so :VIA can be
     erased silently. APPLY-OP for an ASSERT-RELATIONSHIP-OP that finds an
     edge of the same natural key calls ABSORB-RELATIONSHIP, and
     ABSORB-PROPERTIES clears the table before copying. Two consequences:
       a. RESOLVE-CALLS today emits one op per (source, callee, key). When two
          keys from one caller reach one callee, the second op wins. A
          per-key :VIA would keep only the last key. Step 2 accumulates the
          keys per (source, callee) and emits one op per edge with their
          union. The provenance of that op is what the last op carried today,
          so no confidence or source slot changes.
       b. ENRICHED-EDGE asserts a confirmed edge with only :SOURCES, and
          ENRICH-REPOSITORY re-runs that merge after RESOLVE-AND-CHECK
          (workspace.lisp, the BUG-0015 comment). Every edge `enrich` confirms
          would lose :VIA. Step 2 makes ENRICHED-EDGE copy the existing
          edge's :VIA. An edge only the image reported has no key and
          carries no :VIA.
     DES-0055 D11 says "whatever writes a :CALLS edge writes its :VIA". The
     writers are four: LISP-ANALYZER's local edges (lisp-analyzer.lisp, pass
     3), RESOLVE-CALLS' name branch and its imported-calls branch, and
     ENRICHED-EDGE. Step 2 covers all four.

  2. Shapes reach three kinds of entity the graph mints, not only the
     analyzer's callers. A Lisp :TEST is minted by GENERATED-ENTITY from a
     :DEFINER-CALL-SITES plist on the :FILE. A :DEFINER-CALL site and an
     :AMBIGUOUS site are minted by DEFINER-CALL-SITE-ENTITIES and CALL-TARGETS.
     Each copies the shapes it needs from data the analyzer wrote: the
     definer plist gains :CALL-SHAPES, and an ambiguous site takes its
     caller's entries for its one name. Copying from an analyzer property on
     every pass is a derivation (DEC-0003). GENERATED-ENTITY filters through
     DECLARED-PROPERTIES-ONLY, so :TEST must declare :CALL-SHAPES or the copy
     is dropped without a word. Step 3 declares it on all four caller types.

  3. DEFINER-CALL-SITE calls COLLECT-CALL-NAMES without :READING, so it has no
     cons positions. Step 3 passes the reading, so a definer site's shapes
     carry the line of each call form, not the site's start line.

  4. Two kinds of name produce a :CALLS edge and are not a call form. A Lisp
     #'f designator adds a name to :CALL-NAMES (BUG-0011), and a JSX usage
     adds one to the JavaScript caller's (REQ-0024 R4). D10's grammar has no
     form for either. This plan records no shape for them. Such an edge
     carries :VIA, the caller's :CALL-SHAPES holds no entry for the key, and
     `describe` counts the edge as "N without a call form" rather than
     inventing a signature. DEFERRED records it.

  5. A JavaScript test case inherits its hooks' calls. walkTestBody in
     extract.js concatenates the setup calls of every enclosing describe into
     each case, so a beforeEach call is recorded once per case. Its shape will
     be too, with the hook's line. Counting entries across callers would count
     one source occurrence N times. Step 7 counts a site as one (file, line,
     key, signature), and takes the largest multiplicity any one caller
     records for it. Two calls on one line in one caller stay two. Step 5
     measures how many front-end shape entries are inherited copies, because
     they are storage the D13 gate pays for.

  6. Three grammar points D10 leaves open, settled here so three extractors
     agree:
       - Python `**k` is written in the keyword part as `*`, with no name:
         `f(a, timeout=3, **k)` is `1:y|timeout=n,*`. `f(*a)` is `1:*`.
       - A Python decorator that is not a call, `@d`, is a call of d with the
         decorated function: `1:f`. `@app.route("/x")` records the Call node,
         `1:s`.
       - A Lisp backquoted form is data, `q`, whatever the reader's
         expansion of it is. A character literal is `x`.

  7. D10's no-literal rule covers :CALL-SHAPES. :STRING-ARGUMENTS and
     :ARGUMENTS on a definer call site already store literal text (DES-0002,
     DES-0025: a route string). This plan does not change them. The sentinel
     tests in steps 3 to 5 therefore place their literal inside a function
     body, which no other property reads.

  8. MCP is not reached through the registry alone. src/mcp/tools.lisp holds
     *TOOLS* as a written list, so `sites` needs one MAKE-TOOL line there, as
     BUG-0052 did for `similar`. REST needs nothing: /v1/<operation> finds the
     operation by name. No .asd changes, so the peer property holds, and
     load-test is the check.

  FILES

  New:
    tools/test/index-cost.lisp            step 1. The D13 instrument.

  Changed:
    src/ontology/ontology-ops.lisp        step 2: ASSERT-EDGE takes
                                          &key properties (a plist)
    src/ontology/test/root-ontology.lisp  step 2: ASSERT-EDGE's new test. No
                                          ontology test calls it today.
    src/graph/resolve.lisp                step 2: RESOLVE-CALLS writes :VIA and
                                          unions keys per edge. Step 3:
                                          GENERATED-ENTITY,
                                          DEFINER-CALL-SITE-ENTITIES and
                                          CALL-TARGETS carry :CALL-SHAPES
    src/graph/enrich.lisp                 step 2: ENRICHED-EDGE keeps :VIA
    src/graph/test/resolve.lisp           steps 2 and 3
    src/graph/test/enrich.lisp            step 2
    src/analyzer/lisp-analyzer.lisp       step 2: the local :CALLS edge carries
                                          :VIA. Step 3: COLLECT-CALL-NAMES'
                                          third value, LISP-CALL-SIGNATURE,
                                          LISP-ARGUMENT-KIND, :CALL-SHAPES on
                                          callers, initform sites and definer
                                          plists
    src/analyzer/test/lisp-analyzer.lisp  steps 2 and 3
    src/ontology/code-ontology.lisp       step 2: :CALLS' documentation names
                                          :VIA. Step 3: :CALL-SHAPES on
                                          :FUNCTION, :METHOD, :TEST and
                                          :CALL-SITE; MAKE-CALL-SITE-ENTITY
                                          takes :CALL-SHAPES
    src/ontology/test/code-ontology.lisp  step 3
    src/analyzer/analyzer.lisp            step 3: GROUP-CALL-SHAPES, shared by
                                          the three language analyzers
    tools/py/extract.py                   step 4: argument_kind,
                                          call_signature, and 'signature' on
                                          each call record
    src/analyzer/python-analyzer.lisp     step 4: PY-CALL-SHAPES; the two
                                          property builders and the site
                                          builders write :CALL-SHAPES
    src/analyzer/test/python-extract.lisp,
    src/analyzer/test/python-analyzer.lisp     step 4
    tools/js/extract.js                   step 5: argumentKind, callSignature,
                                          and a `shapes` list beside `calls`
                                          in walkBody, reaches, setupCalls and
                                          walkTestBody
    src/analyzer/js-analyzer.lisp         step 5: JS-CALL-SHAPES; :CALL-SHAPES
                                          beside :CALL-NAMES
    src/analyzer/test/js-analyzer.lisp    step 5
    src/knowledge/services.lisp           step 7: CALL-SHAPE-DISTRIBUTION,
                                          SHAPE-SITES; DESCRIBE-ENTITY gains
                                          :CALL-SHAPES
    src/knowledge/package.lisp            step 7: export SHAPE-SITES
    src/knowledge/test/services.lisp      step 7
    src/process/console.lisp              step 7: `describe` prints the
                                          distribution line; `sites` command
    src/process/test/console.lisp         step 7
    src/serve/operations.lisp             step 7: the :SITES operation, :read
    src/serve/test/operations.lisp        step 7
    src/rest/test/routes.lisp             step 7: /v1/sites answers
    src/mcp/tools.lisp                    step 7: loom_sites (FINDINGS 8)
    src/mcp/test/tools.lisp               step 7: the tool count 15 -> 16 and
                                          loom_sites present
    docs/requirements/REQ-0041.yaml       step 9: U4's narrowing of R2
    docs/requirements/REQ-0078.yaml       step 9: OUTSTANDING
    docs/design/DES-0055.yaml             step 9: OUTSTANDING; FINDINGS 4 and
                                          6 recorded in D10

  Not changed, and a change to any one is a finding to report: every .asd's
  :depends-on, src/rest/ source, ABSORB-RELATIONSHIP and ABSORB-PROPERTIES,
  RELATIONSHIP-NATURAL-KEY, *CALL-SITE-CEILING* and
  *PYTHON-CALL-SITE-CEILING*, RESOLVE-DEPENDENCIES, and every docs/rules/
  file. Deleted: none.

  BLAST RADIUS

  What Loom reports, from `impact <name> 2` at 291f090:

    resolve-calls        91 (truncated). Every indexing path, through
                         RESOLVE-AND-CHECK. 83 tests, among them
                         RESOLVE-IS-IDEMPOTENT, AN-INCREMENTAL-UPDATE-MATCHES-
                         A-FULL-REBUILD and
                         A-CONFIRMED-EDGE-KEEPS-ITS-AGREEMENT-RECORD-THROUGH-
                         THE-WHOLE-PASS. 16 decisions, DES-0014, DES-0015,
                         DES-0053 and DES-0055 among them.
    assert-edge          155 (truncated). Every analyzer and every resolution
                         pass. 14 decisions.
    collect-call-names   37 (truncated): INITFORM-CALL-SITES, DEFINER-CALL-SITE
                         and the Lisp ANALYZE-FILE, then every test that
                         analyzes a file. 5 decisions: DES-0013, DES-0014,
                         DES-0015, DES-0047, DES-0055.
    py-callable-properties  3: MAKE-PY-ENTITY, then the Python ANALYZE-FILE.
    Extractor.record_call   called by visit_call and visit_decorator.
    describe-entity      15: the console's and serve's describe call sites and
                         10 tests. 9 decisions.

  None of the attached decisions is contradicted. DES-0014's ceiling is not
  moved: no step mints a :CALL-SITE, and the census is an exit condition of
  every step. DES-0015's symbol identity is untouched: :VIA records the key
  resolution read, and resolution is unchanged. DEC-0003 holds: :CALL-SHAPES
  is analyzer-written and never rewritten, and :VIA and every graph-minted
  copy are re-derived each pass. DES-0054 D7's name-not-value line is what
  U4 applies, and steps 3 to 5 test it with a sentinel.

  What Loom cannot see, and why:

    - The child-process boundary, twice. extract.py's and extract.js's
      `signature` fields reach the analyzer through JGET on a JSON reply. No
      index edge links the producer to the reader. Steps 4 and 5 test both
      sides: the reply, and the entity built from it.
    - The edge-property seam. No index edge says ENRICHED-EDGE's absorb erases
      what RESOLVE-CALLS wrote. FINDINGS 1 found it by reading
      ABSORB-PROPERTIES and the BUG-0015 comment in ENRICH-REPOSITORY.
    - Macro bodies. Every fiveam `test` body is unattributed (DES-0001), so
      the `tests` bands above under-report. The FiveAM suite, not `impact`,
      is the measure of what breaks.
    - The serve, REST, MCP and console boundary. No rule covers it. load-test
      is the instrument in steps 7 and 8.
    - Readers of a relationship's or a caller's properties outside Loom. A
      REST describe returns the whole :PROPERTIES table, which after step 3
      holds :CALL-SHAPES. Step 8 records the largest describe payload on
      front-end.

  RISKS

  1. Shape storage over D13's budget on front-end. front-end holds about
     40735 calls in definitions, and test cases add inherited hook copies
     (FINDINGS 5). Step 1 measures before any change. Step 6 measures after
     step 5. Over budget, step 5 is not committed and the user chooses
     between DES-0055's two cheaper forms: (a) lines only for a key's
     non-dominant signatures in a caller, with a count for the dominant one;
     (b) no shapes on :TEST callers. The plan stops there; it does not pick.

  2. :VIA erased by an absorb (FINDINGS 1). Step 2's tests: two keys reaching
     one callee keep both; an `enrich` that confirms an edge keeps its :VIA.
     The existing BUG-0015 test must pass unedited, because RESOLVE-CALLS'
     ops still carry no :SOURCES.

  3. The :CALLS edge count moves. Merging per-key ops into one op per edge
     must not change which edges exist. Step 2's exit is an index-dump diff
     on Loom and on front-end: every changed R line is a :calls line gaining
     :VIA, and no R line is added or removed.

  4. An argument walk that signals costs the whole file. BUG-0068 was a
     dotted tail reaching a `for ... in` loop in a walk over call arguments.
     LISP-CALL-SIGNATURE walks an argument list with the cons-walking loop
     COLLECT-CALL-NAMES uses, and step 3's tests include a dotted argument
     list and the fixture of
     A-DOTTED-LIST-INSIDE-A-CALL-SITES-ARGUMENT-DOES-NOT-COST-THE-FILE.

  5. A literal reaches the index (U4). Steps 3, 4 and 5 each feed a call
     carrying the string SENTINEL and the number 4242 inside a function body,
     walk every property of every op returned, and find neither. Positive
     control: the walk finds SENTINEL when it is the function's name.

  6. game-server's counts differ from the scripts'. REQ-0041 states 454
     dict-value sites with 5 of arity 3, and 27 read-config sites with 19 of
     arity 2 or more. Loom reads every call form whose head is the name;
     a script may have counted #'dict-value, a form inside #+ that the
     feature policy skips, or a call under a different package. Step 8
     lists the differing sites with `sites` and records each cause. An
     unexplained difference is a defect and blocks step 9.

  7. Tests that change because the behaviour they pin changes:
       src/mcp/test/tools.lisp   the tool count, 15 -> 16 (step 7)
       Any test asserting EQUALP on a whole caller's property list or on a
       whole edge, in src/analyzer/test/ or src/graph/test/. None is known.
       If one fails, the step stops and NOTES records the test and the
       reason before the test is edited.
     No other existing test is expected to change.

  8. The JavaScript extractor's cost is node time, inside index time. A
     signature walk over every argument of every call runs in the child.
     Step 5 records extract.js' wall time on front-end alone, so a gate
     failure in step 6 can be attributed.

  DEFERRED, WITH REASONS

  - Shapes for JSX usages and Lisp #'f designators (FINDINGS 4). D10 has no
    grammar for either. A JSX element's props would be `1:o{...}`; a ruling
    on that belongs in a design, not a plan.
  - A :CALL-SITE per occurrence. DES-0014's arithmetic, restated by DES-0055:
    +12044 entities on Loom and +71522 on front-end.
  - Literal values (U4).
  - Shapes for JavaScript file-level calls. extract.js reports fileCalls, and
    js-analyzer.lisp reads none of them, so no :CALLS edge starts there and
    no shape would be joined.
  - Recording shapes in `enrich`. The image reports caller and callee, not
    the form.

  STEPS

  Each step is one commit on req-0078-python-completion, made by the caller.
  Step 1 is the first that can be run, and it runs only after PLAN-0059 is
  complete. Every step ends green.

  1. THE D13 BASELINE (R12, first half).
     tools/test/index-cost.lisp (new).

     `sbcl --script tools/test/index-cost.lisp <root> [--ballast <MB>]` loads
     the systems through tools/test/harness.lisp as index-dump.lisp does. It
     calls WATCH-REPOSITORY with :monitor nil :quiet t and times that call
     with GET-INTERNAL-REAL-TIME. It keeps the repository live, runs
     (sb-ext:gc :full t), and reads (sb-kernel:dynamic-usage). It prints one
     line per figure: seconds, heap-bytes, entities, relationships,
     calls-edges, and shape-occurrences (the number of line entries in every
     :CALL-SHAPES; 0 before step 3). --ballast allocates and retains a vector
     of that many megabytes before the GC. It exists only for the positive
     control. No vector store is built.

     Verification:
       - Positive control: on Loom, --ballast 100 raises heap-bytes by
         100 MB +/- 5 MB against a run without it. A figure that does not
         move is not measuring the heap.
       - Repeatability: three runs on one commit. Record the spread of each
         figure. A heap spread above 2% or a time spread above 5% makes the
         budget unreadable, and the step stops to say so.
     Measurement, recorded in NOTES with the commit hashes and `python3
     --version` and `node --version`:
       - front-end: three runs, median of each figure, with
         `git -C ~/github/front-end status --short` saved before the first
         run and after the last. A difference discards the set (PLAN-0058
         risk 2).
       - Loom and lfia: the same, for information. lfia is a census (U6).
       - The :CALLS edge count on each tree. Step 2's exit compares it.
     The commit this step measures is the gate's base. Step 6 builds a
     scratch worktree of Loom at that commit.
     CON-0003: the ballast control is this instrument's failing case.
     Exit: green; the figures are in NOTES.

  2. :VIA ON EVERY :CALLS EDGE (R10, second half). Moves no count.
     src/ontology/ontology-ops.lisp, src/ontology/code-ontology.lisp,
     src/analyzer/lisp-analyzer.lisp, src/graph/resolve.lisp,
     src/graph/enrich.lisp, and their tests.

     ASSERT-EDGE gains &key properties, a plist, stored with
     PROPERTIES-TABLE. NIL gives the empty table every edge has today.
     :CALLS' documentation names :VIA: the list of call keys that produced
     the edge, written by every :CALLS writer, re-derived every pass.
     Lisp analyzer, pass 3: each local edge carries (:via (callee-name)).
     The local-calls list becomes (caller callee . keys) so a callee reached
     under two keys, which cannot happen for one local name today, still
     yields one op.
     RESOLVE-CALLS: the dolist over targets and the imported-calls branch
     both write into one table per caller, keyed by (source id . callee id),
     holding the keys in first-seen order and the target plist of the last
     key. After the caller's names and entries are walked, one ASSERT-EDGE
     per table entry, with the provenance of that last target and
     (:via keys). A name branch's key is the name. An imported branch's key
     is the specifier and path joined with "." as PY-DOTTED renders them,
     which is the key step 4 writes on the caller. A fan-out edge from an
     :AMBIGUOUS site carries (:via (name)). The call-site asserts and their
     :CONTAINS edges still precede every :CALLS op that names them.
     ENRICHED-EDGE: the properties are :SOURCES plus EXISTING's :VIA when
     EXISTING has one. Its caller already holds EXISTING.

     Verification, new tests:
       - root-ontology.lisp: (assert-edge :calls a b :properties '(:via ("x"))) yields a
         relationship whose :VIA is ("x"). Without :PROPERTIES its table is
         empty. Fails without the keyword (an unknown-key error).
       - resolve.lisp: a JavaScript caller with :CALL-NAMES ("render"
         "Widget.render") and one method Widget.render in the view. The pass
         emits one :CALLS op to it, and its :VIA is ("render" "Widget.render").
         Fails with per-key ops: the second absorb leaves ("Widget.render").
       - resolve.lisp: an :AMBIGUOUS fan-out's edges each carry (:via
         (name)). A Python caller's imported-call edge carries the dotted key.
       - lisp-analyzer.lisp: a file where f calls local g yields one :CALLS
         op with :VIA ("g").
       - enrich.lisp: an edge carrying :VIA ("g"), confirmed by a stub
         inspection, still carries :VIA ("g") after ENRICHED-EDGE's op is
         applied. Fails without the copy, because ABSORB-PROPERTIES clears it.
       - RESOLVE-IS-IDEMPOTENT, AN-INCREMENTAL-UPDATE-MATCHES-A-FULL-REBUILD
         and A-CONFIRMED-EDGE-KEEPS-ITS-AGREEMENT-RECORD-THROUGH-THE-WHOLE-PASS
         pass unedited.
     CON-0003: revert the union, the ENRICHED-EDGE copy and the keyword one
     at a time, and see the matching test fail.
     Exit: green. `sbcl --script tools/test/index-dump.lisp` on Loom and on
     front-end, from step 1's commit and from this one, back to back: the
     diff holds only R lines of type :calls, each gaining :VIA, and the R
     line count is equal. The :CALLS count equals step 1's. index-cost on
     front-end, recorded: :VIA's share of the D13 budget.

  3. THE LISP SIGNATURE AND :CALL-SHAPES (R9, R10 for Lisp).
     src/ontology/code-ontology.lisp, src/analyzer/analyzer.lisp,
