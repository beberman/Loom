  STEP 2 FOLLOW-UP, THE HEAP COST OF :VIA. 2026-10-09, Loom at a4f4afa plus this
  commit.

  Where the 322 bytes went. Measured in SBCL 2.2.9 on 20000 retained objects: an
  empty EQUAL hash table is 160 bytes and one with a single entry is 484, and
  :SIZE 1 changes neither, so the first entry allocates 324 bytes of storage
  that the minimum table size fixes. On front-end's 54067 :CALLS edges the :VIA
  lists hold 55493 conses (888 KB), and 54109 of the 55493 key strings are EQ to
  a string already in the caller's :CALL-NAMES; the other 1384 are import keys,
  about 66 KB. So the table storage is 16.4 MB of the 17.4 MB and the lists and
  strings under 1 MB. Interning the lists (3320 distinct) or the strings could
  save at most 0.7 MB, 0.4 percent of the baseline, and was not done. A property
  table shared between edges was rejected: ABSORB-PROPERTIES calls CLRHASH on
  its target, so a shared table is corrupted by the first re-assert.

  The change. A relationship's PROPERTIES slot is unbound until something reads
  it, and ASSERT-EDGE stores the plist in a new PROPERTY-PLIST slot. The first
  read reaches a SLOT-UNBOUND method (root-ontology.lisp) that builds the table
  under *FRESH-ID-LOCK*, stores it and clears the plist. A relationship given a
  :PROPERTIES table keeps it as before. The method is on SLOT-UNBOUND and the
  slot keeps its reader, because a method on PROPERTIES gave it a :METHOD
  entity and moved two calls from "one interface" to "dispatched across
  methods" in the call-site census. A lock of its own was a DEFVAR whose
  initform called MAKE-LOCK, which moved the census from 510 to 511; the first
  design had both defects and this one has neither.

  Making the plist stay unbound took three more edits, found by counting bound
  tables after indexing. ADD-RELATIONSHIP and PLAN-OP asked every edge whether it
  was federated, which reads the table. They now ask only when the TO end is
  missing. REBIND-RELATIONSHIP copied through PROPERTIES; on front-end an id
  remap touches all 95972 edges. It now carries the slot as it finds it. With the
  slot alone the heap did not move (187.86 MB over six runs); after the three
  edits no relationship holds a table on Loom or front-end after indexing, and
  an edge becomes a table only when something reads it (ABSORB on a re-assert,
  `describe`). FEDERATED-EDGE-P and FEDERATED-RELATIONSHIPS read :FEDERATED
  only on :SERVES edges and on one entity's edges, so no pass reads them all.

