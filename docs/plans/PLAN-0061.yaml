  27. RULE-0010 cannot be amended in place to "every Loom system but
     loom-utils". A rule document carries exactly one check: PARSE-CHECK
     (src/analyzer/yaml-analyzer.lisp:512) reads `check:` as one mapping and
     returns NIL for anything else, and a rule with a NIL check is prose
     only. A system designator is a keyword or (:family NAME)
     (SYSTEM-SATISFIES-P, src/graph/query.lisp:133); there is no list and no
     exception. `-` is not a family delimiter, so no family covers the
     loom-* systems. So "one :no-edge per other Loom system" is ten rule
     documents with one check each. Step 2 writes them: RULE-0010 keeps its
     id, its statement and the first target, and nine new rules take the
     other nine. The ten Loom systems loom-docstore may not reach are
     loom-ontology, loom-graph, loom-analyzer, loom-embed, loom-knowledge,
     loom-workspace, loom-process, loom-serve, loom-rest and loom-mcp.
     What the split loses against `to-system: outside`: edges from
     loom-docstore to a test package, to a tools/ package (TOOLS,
     PKG-CENSUS and the like), and to any Loom system added later are no
     longer reported. A new system needs a new rule, which RULE-0010's
     statement says. The alternative that keeps one document is a
     list-valued `to-system:` or an `except:` key in PARSE-CHECK and
     SYSTEM-SATISFIES-P. That is a change to the rule language and needs a
     DES. The owner chose the ten files on 2026-10-10 (D1a).

  28. The listener has one entry point. Every request reaches
     HUNCHENTOOT:ACCEPTOR-DISPATCH-REQUEST on LOOM-ACCEPTOR
     (src/serve/server.lisp:86), which calls DISPATCH-REQUEST
     (server.lisp:71-84). loom-rest registers `/v1/` (routes.lisp:129) and
     loom-mcp registers `/mcp` (jsonrpc.lisp:178) through REGISTER-HANDLER,
     and DISPATCH-REQUEST picks the handler. `impact dispatch-request 2`
     reaches ACCEPTOR-DISPATCH-REQUEST and server.lisp, and attaches
     DES-0007 and BUG-0008. A check placed first in DISPATCH-REQUEST covers
     REST, MCP and the 404 path.
     How the existing tests reach it: src/serve/test/server.lisp's
     HTTP-CALL sends every request with drakma to
     http://127.0.0.1:47180 (*TEST-PORT*), and the rest and mcp test
     systems use the same helper. drakma writes `Host: 127.0.0.1:47180`, and
     the test acceptor listens on 47180, so those requests pass a check that
     compares against the acceptor's own port. Tests of the registry and the
     operations call Lisp functions and never reach DISPATCH-REQUEST.
     External callers: tools/loom-serve.sh uses curl on 127.0.0.1;
     tools/test/service.py uses http://127.0.0.1:4780/v1; .mcp.json points
     at http://127.0.0.1:4780/mcp. Each sends a loopback Host. One caller
     could break: a tree prepared with `--endpoint` naming a host other than
     127.0.0.1, localhost or [::1] (init's tests use loom.internal:4780 as
     data only).
     The trust model the code already has: RESOLVE-CALLER-GRANTS
     (src/serve/capability.lisp:23-42) gives every caller *STATIC-GRANTS*,
     (:read :write), and never :repl. operations.lisp defines 11 :write
     operations; repl.lisp defines the 3 :repl ones.

