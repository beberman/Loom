id: PLAN-0061
title: REQ-0079 and DES-0056 in seventeen steps -- utils removed, tools/ paths derived, the clean-room instrument, the id floor over every ref, doc-ids.py check and renumber, the workflow, the release scan, the history decision, the scrub, the private-trees note, README, INSTALL, CONTRIBUTING, document edits, acceptance in a sandbox, complete
status: draft
date: 2026-10-10
refines: [DES-0056, REQ-0079]
affects: [next-document-id, docstore-allocate-id, "*document-id-prefixes*",
