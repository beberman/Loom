summary: |
  REQ-0079 R1 to R8 and its acceptance, with DES-0056 as the design for R7
  and R8. The order is: R1 first, because nothing else can be tested on a
  machine without ~/lisp/utils until it lands. Then DES-0056's tooling, which
  touches no file the scrub touches. Then the R2 scan and the R2/R3 scrub.
  Then README, INSTALL and CONTRIBUTING. Then acceptance in a sandbox, then
  `complete`.

  The plan stops for the owner at eight named decisions, D1 to D8. Four of
  them are not the plan's to make: the licence position on third-party
  libraries, whether to accept outside contributions, history rewriting, and
  GitHub settings only the owner can set.

  Out of scope: making the GitHub repository public, publishing the utils
  repository, a graph-side duplicate-id report (REQ-0025 R7's other half),
  installing doc-ids.py into trees `init` prepares (DES-0056 R7), and any
  write to game-server, front-end, lfia-accounting or ~/lisp/utils.
body: |
  BASELINE

  Loom at d3f2824 on req-0079-open-source, clean tree, merged with main at
  df91a7f. Measured 2026-10-10 under /usr/bin/sbcl 2.2.9.debian.

    tools/loom.sh 'status | check'
      498 files, 5611 entities, 27216 relationships, 304 documents, 1638
      tests covering 481 units, 0 violations, 2 unenforced (RULE-0004,
      RULE-0008), 8 unresolved document references, 7 ambiguous, 5 definer
      macros, 16 prose file references no watched repository holds.
    tools/loom-test.sh
      12 of 12 systems ok in 2m23s. Pass counts: utils 43, embed 46,
      docstore 234, ontology 496, analyzer 1352, graph 857, workspace 1219,
      knowledge 645, process 261, serve 315, rest 123, mcp 58. Total 5649.
      This run had nvm's node v24.18.1 first on PATH.
    sbcl --script tools/test/load-test.lisp loom-serve
      prints `LOOM-SERVE loaded; (find-package "LOOM-PROCESS") => T`. T
      means clean: the value printed is (null (find-package ...)).
    tools/next-doc-id.sh PLAN -> PLAN-0061. No ref carries PLAN-0061.

  "Green" after a step means: tools/loom-test.sh prints ok for all twelve
  systems with no Fail line, and each system's Pass count is at least the
  baseline's; `check` prints 0 violations and 8 unresolved, 7 ambiguous;
  load-test prints T. Document and test counts move with new files and are
  not exit conditions unless a step names them.

  FINDINGS THAT CHANGE OR SHARPEN REQ-0079 AND DES-0056

  1. #:utils appears in seven :depends-on lists in five .asd files, not six:
       src/analyzer/loom-analyzer.asd   loom-analyzer and loom-analyzer/test
       src/docstore/loom-docstore.asd   loom-docstore
       src/graph/loom-graph.asd         loom-graph/test only
       src/serve/loom-serve.asd         loom-serve
       src/workspace/loom-workspace.asd loom-workspace and loom-workspace/test

  2. Eight names come from the library, not six. Four packages import six
     names with :import-from: loom-analyzer (read-file, string-lines),
     loom-docstore (read-file), loom-serve (improper-list-p, plistp),
     loom-workspace (read-file, string-lines, proper-list-p, alistp).
     context-log.lisp also calls utils:json-decode and binds
     utils:*json-key-to-lisp*, package-qualified, in READ-JSON-RECORD and
     STRICT-VALUE-TO-RECORD. Test code calls utils:read-file 12 times in 7
     files: analyzer/test lisp-analyzer (1), markdown-analyzer (1),
     yaml-analyzer (2); graph/test enrich (1); workspace/test init (5),
     transition (1), workspace (1). Every other `utils:` token in src/ is
     inside a string fixture (lisp-analyzer tests, lisp-reader tests,
     `(:import-from #:utils #:proper-listp)` at lisp-analyzer.lisp:312) or a
     comment. Those stay.

  3. Where each name belongs, by CLAUDE.md's loom-utils test and the rules.
       proper-list-p, alistp   called only in loom-workspace (context-log)
                               -> loom-workspace
       improper-list-p, plistp called only in loom-serve (json.lisp)
                               -> loom-serve
       json-decode, *json-key-to-lisp*
                               called only in loom-workspace -> replaced
                               there by st-json and cl-json directly, which
                               loom-workspace already declares
       string-lines            loom-analyzer and loom-workspace. Workspace
                               depends on analyzer -> loom-analyzer
       read-file               loom-analyzer, loom-workspace, loom-docstore.
     read-file is the one with no clean home. loom-analyzer and loom-docstore
     cannot depend on each other (RULE-0011, RULE-0010), which is loom-utils'
     entry condition. But RULE-0010 is :no-edge to-system outside, so
     loom-docstore may not depend on loom-utils either, and the rule engine's
     :no-edge method (src/graph/rules.lisp) has no exception list. So without
     a rule-engine change, loom-docstore needs its own copy. That is the
     precedent file-store.lisp:77 already set for DOT-PREFIXED-P. The copy
     has a cost the tree states: stamps.lisp's .asd comment says "A stamp
     hashes the text READ-FILE returns, so the stamp and the analyzer see the
     same string." Two copies keep that true only if a test says so. D1.

  4. loom-docstore calls uiop 3 times and declares only #:utils. uiop
     arrives today through utils. Removing #:utils must add #:uiop.

  5. How the library is found today: ~/quicklisp/local-projects/utils is a
     symlink to ~/lisp/utils. ~/.sbclrc also registers ~/lisp/utils/ and
     ~/lisp/game-server/ as source-registry trees, but `sbcl --script`
     skips ~/.sbclrc, so the symlink is what every tools/ script uses.
     local-projects also links Loom, game-server, cl-dbi and cl-mysql.
     Proving R1 means a run where none of them exist.

  6. No container runtime is installed: `which docker podman` prints
     nothing. bubblewrap 0.9.0 is at /usr/bin/bwrap and runs unprivileged
     here: `bwrap --ro-bind / / --tmpfs /home ... ls /home` lists an empty
     directory. wsl.exe is reachable (WSL 2.7.11.0), so a fresh distro is
     possible, but installing one changes the machine. D8.
     What bwrap proves: nothing under /home is read, including ~/lisp/utils,
     ~/quicklisp, ~/.sbclrc and nvm's node. What it does not prove: the OS
     package set. / is the host's, so libyaml-0-2, libssl3, git, python3
     3.12.3 and /usr/bin/node v18.19.1 are present whether or not INSTALL
     names them.

  7. Two node binaries exist. nvm's v24.18.1 is first on this shell's PATH.
     /usr/bin/node is v18.19.1 (Ubuntu's nodejs). The sandbox sees only the
     second. The systemd unit's PATH decides which one the service uses.
     INSTALL can name both versions as tested.

  8. Hardcoded paths that a clone elsewhere would break on:
       tools/loom-test.sh:29,38   #p"/home/beberman/lisp/Loom/" in the
                                  driver heredoc
       tools/loom.sh:50           watch "~/lisp/Loom" -- every console
                                  session indexes this path, not the clone
       tools/loom-init.sh:32      LOOM_ROOT=/home/beberman/lisp/Loom
       tools/allow-loom.py:61     the absolute driver prefix in DRIVER
       tools/test/test-allow-loom.py:28,32
       tools/test/call-site-census.lisp:262, package-census.lisp:244
                                  default root
       tools/test/summary-band.lisp:28-32
                                  five rows naming Loom, utils, game-server
       .claude/settings.json      11: 9 allow rules, 2 hook commands
       .claude/settings.local.json  3, and the file is tracked
       .claude/skills/loom/SKILL.md  the driver copy at :302 and :310
     tools/extra-repos, which REQ-0079 R2 names, is gitignored and
     `git log --all -- tools/extra-repos` prints nothing: it was never
     committed. It needs no change.
     The suite reads $HOME in two tests (workspace.lisp:188, federate.lisp:39
     and :221) to build a repository rooted at the home directory. That is
     a read of whatever $HOME is, not of a named foreign tree, and it holds
     in the sandbox.

  9. The R2 scan at the tip, over 542 tracked files (counts only):
       /home/beberman         79 in 37 files
       ~/lisp/               121 in 65 files
       ~/github/             111 in 46 files
       Windows home path       2 in 1 file (init.el:
                               c:/Users/<user>/quicklisp/slime-helper.el)
       hostname (`hostname`)   0
       IPv4 other than 127.0.0.1 and 0.0.0.0   0
       e-mail addresses        6 in 5 files: three example.com/.invalid
                               test values, three vendored acorn and
                               acorn-jsx package.json authors. None is the
                               author's.
       credential shapes       22 raw matches, 0 real. 10 are test names in
                               src/knowledge/test/context.lisp where "task-"
                               matched an `sk-` pattern written without a
                               word boundary. 12 are `user:SENTINEL@` and
                               `user:token@` placeholder URLs in 4 files
                               (manifest-analyzer.lisp and its test,
                               DES-0055, PLAN-0059). The scan script needs
                               both exclusions.
     Patterns used for credentials: AKIA[0-9A-Z]{16}; gh[pousr]_ and
     github_pat_ tokens; \bsk-(ant-)?[A-Za-z0-9_-]{20,}; xox[abprs]- Slack
     tokens; -----BEGIN ... PRIVATE KEY-----; AIza[0-9A-Za-z_-]{35};
     password/passwd/secret/api_key/access_token/auth_token assigned a quoted
     value of 8+ characters; Bearer plus 20+ characters; scheme://u:p@ with
     placeholder passwords excluded; eyJ...eyJ... JWTs; aws_secret_access_key.

  10. Files the REQ did not anticipate:
       init.el                      a personal Emacs init with the Windows
                                    home path above
       docs/DESIGN-ASSUMPTION-CHANGES.md:Zone.Identifier
       docs/Loom - A Code Knowledge Engine.docx:Zone.Identifier
                                    Windows download markers. Each holds
                                    only a ZoneId line, no URL.
       src/ontology/test/suite.lisp~  a tracked Emacs backup
       docs/Phase1 Software Architecture.docx
                                    docProps/core.xml carries creator and
                                    lastModifiedBy values
       docs/Loom - A Code Knowledge Engine.docx
                                    empty creator fields; the author's name
                                    in the body; a comments part with 0
                                    comments
       .claude/settings.local.json  a per-user file, tracked

  11. The history scan, over every object reachable from the 107 refs: 496
     commits, 2493 blobs and every commit message. Credential patterns as in
     9: 0 matches in blobs, 0 in messages. No path ever added matches .env,
     id_rsa, id_ed25519, .pem, .p12, .key, .netrc, .npmrc, .pypirc,
     "credential", "secret" or "token" (707 paths checked). Non-credential:
     /home/beberman on 102 added lines in 28 commits; the Windows home path
     in 1 commit. Commit metadata: author bseberman@gmail.com on 491
     commits, brian@tenfactorgrowth.com on 1, Claude Code noreply on 4;
     committer GitHub noreply on 11. No credential is found, so REQ-0079's
     rotation clause does not fire. D3 covers the rest.

  12. R3's scope is 282 files, not 37. 37 is the count for /home/beberman
     alone. Files naming /home/beberman, ~/github, game-server, front-end or
     lfia: docs 192, src 67, tools 18, .claude 3, CLAUDE.md, README.md.
     game-server appears 1168 times in 211 files, lfia 292 times in 23.
     front-end's 1283 matches include the ordinary English word.
     Beyond CLAUDE.md, three more files are read by every agent or shipped
     into other trees:
       .claude/skills/loom/SKILL.md   @game-server and @front-end examples,
                                      ~/lisp/Loom, ~/github/front-end
       .claude/agents/*.md            none
       src/workspace/templates/loom-skill.md:79
                                      game-server's PLAN-0002 anecdote. init
                                      writes this file into every prepared
                                      repository.
     So R3's CLAUDE.md exception should cover SKILL.md and loom-skill.md.
     Private material copied into the tree, not only cited:
       src/analyzer/test/js-analyzer.lisp:802-833  two front-end files
                                      "verbatim" (functions/index.js,
                                      functions/hello.js)
       src/analyzer/test/firebase-analyzer.lisp     lfia's firebase.json "as
                                      it stood" and a .firebaserc naming the
                                      Firebase project id
       src/analyzer/test/frameworks.lisp:27,315     game-server's and lfia's
                                      declarations
       tools/test/cases/known-item.json  450 cases naming game-server and
                                      front-end identifiers; mismatch.json
                                      and mismatch.md likewise. These are
                                      the recall harness's corpus.
     D4.

  13. README.md exists (154 lines, 2026-09-07). It documents service
     operation and tools/extra-repos. It is stale in four checkable ways: it
     names "ten libraries" and omits st-json, babel and usocket; it tells
     the reader to clone the utils library; it prints six /home/beberman
     paths; its seeding figures are game-server and front-end figures with
     no note. It states no system count, no layering, no test count and no
     blind spots.

  14. R4's last sentence cannot be met as written. A README cannot name the
     commit that contains it, so the commit it names is always older than
     the one it ships in. "Behind main" is then true after every merge, and
     a `check` keyed on it would always report. Two readings are
     checkable: figures equal to what `status` and `structure` print at
     HEAD, or a named commit with figures allowed to lag. `check` lives in
     loom-graph and knows nothing about this tree's README; adding that
     would be a design, not a plan step. D5.

  15. R5 facts from the code. python3 3.9 or later: tools/py/extract.py
     calls ast.unparse (lines 170, 174, 581, 779), which 3.9 added. Tested
     here: 3.12.3. node: tested v24.18.1 and, in the sandbox, v18.19.1. No
     floor is claimed for either SBCL (2.2.9 only) or node. Two C libraries
     load through CFFI: libyaml-0.so.2 (cl-yaml -> cl-libyaml) and libssl.so.3
     (cl+ssl, pulled by hunchentoot and drakma). The .asd files name 13
     external libraries after R1: babel, bordeaux-threads, cl-json, cl-yaml,
     drakma, eclector, fiveam, hunchentoot, random-uuid, st-json, stem, uiop,
     usocket.

  16. Third-party licences, read from each loaded system's .asd (all twelve
     systems and their test systems loaded):
       stem             "Probably LLGPL". No LICENSE file, no copyright line
                        in stem.lisp, stem.asd or ReadMe.txt.
       trivia (6 systems), type-i, lisp-namespace, trivial-cltl2
                        LLGPL. Pulled by random-uuid -> mfiano-utils ->
                        serapeum.
       puri             "GNU Lesser General Public License". Pulled by
                        drakma, a test-only dependency.
       ironclad         no :license in the .asd; its LICENSE file is a
                        Nathan Froyd copyright, BSD-style. Pulled by
                        random-uuid -> seedable-rng.
       introspect-environment  WTFPL
       the rest         MIT, BSD variants, public domain, Unlicense.
     Vendored and redistributed in the tree: acorn 8.18.0 and acorn-jsx
     5.3.2, both MIT, each with its LICENSE file under tools/js/vendor/.
     LICENSE is MIT, Copyright 2026 Brian Eberman, and every Loom .asd says
     :license "MIT". D6.

  17. GitHub, read with `gh` on 2026-10-10. beberman/Loom is private and
     user-owned; beberman/utils is private. main is not protected and the
     repository has no rulesets. Merge, squash and rebase merges are all
     allowed. Actions is enabled for all actions, so doc-ids.yml can run on
     a push to the private repository today. Per GitHub's documentation, not
     tested here: branch protection on a private repository needs a paid
     plan and is free on a public one; a merge queue is available only to
     organization-owned repositories. So DES-0056 R5's "or a merge queue" is
     not available to beberman/Loom, and "require branches to be up to date"
     is the only one of its two options. D7.

  18. DES-0056's floor, measured: 107 refs read with `git ls-tree` in 0.22s.
     For all nine categories the highest id over every ref equals the
     working tree's, so no category's next id changes today. Stale refs
     carry ARCH-0001 to 0004 and DEC-0001 to 0004, the DEC files under
     docs/design/ from before BUG-0039. A scan that globs each category's
     own directory on a ref misses those DEC files. A scan that matches
     PREFIX-nnnn.yaml anywhere under docs/ counts them. The second is what
     test-next-doc-id.py's highest_on_disk already does on the working tree,
     so the plan uses it for both the working tree and every ref, in both
     allocators.

  19. Under R8 the REQ-0079 acceptance scenario cannot be run inside one
     clone. The allocator now reads every local branch, so a second branch
     in the same clone is handed the next id and does not collide. The
     collision R7 is about needs two clones that cannot see each other: a
     fork. Step 6's fixture uses two clones of one bare repository, and adds
     a one-clone case asserting the second branch gets a different id.

  20. tools/test/test-next-doc-id.py asserts answer == working-tree highest
     + 1. After the floor change that is true on this tree today only
     because finding 18's floors coincide. It must compute the floor over
     refs too, or it starts failing the first time a branch is ahead.

  21. doc-ids.py cannot run Loom's own tools/next-doc-id.sh against a fixture
     repository: next-doc-id.sh finds its root from its own location, not
     from the current directory. The fixture therefore copies tools/doc-ids.py
     and tools/next-doc-id.sh into its own tools/, as a fork carries them.

  22. `check` cannot see an .asd :depends-on on an external library
     (RULE-0009 and RULE-0010 both say so in prose). "check reports no new
     violation" is necessary for R1 and not sufficient. The instruments are
     a grep for #:utils and the sandbox run.

  23. loom-indexes-its-own-todo-file (markdown-analyzer tests) asserts
     inside `(when e ...)`. If docs/TODO.md is deleted it passes with zero
     checks. CON-0003 applies to any scrub that removes docs/TODO.md.

  DECISIONS THE PLAN STOPS FOR

  Each is asked at the step named. Where a default is given, the step runs on
  it unless the owner says otherwise before that step starts.

    D1  read-file's home. Before step 2. Default (a).
        (a) loom-analyzer defines and exports read-file and string-lines;
            loom-workspace gets both through its existing :use of
            loom-analyzer; loom-docstore keeps a private read-file in
            stamps.lisp; one test asserts the two return identical strings.
            No rule changes. Against it: loom-analyzer/package.lisp says the
            analyzer "never had any business being the place a file is
            read".
        (b) loom-utils owns both, and RULE-0010 gains a way to permit
            loom-utils. That needs an exception field in the :no-edge check
            kind, which is a design change (a DES) and is not in this plan.
    D2  What .claude/ ships. Before step 10. No default.
        .claude/settings.json runs `tools/loom-serve.sh update` on
        SessionStart. In a clone opened in Claude Code that starts a service
        on 127.0.0.1:4780 with no authentication and eleven write-tier
        operations. It also sets defaultMode dontAsk and allows Bash(cat:*),
        Bash(python3 -) and Edit of the whole tree. Options: ship it with
        paths rewritten to $CLAUDE_PROJECT_DIR; ship it without the
        SessionStart hook; ship .claude/settings.example.json and gitignore
        settings.json. settings.local.json is untracked and gitignored in
        every option.
    D3  History. After step 9. Default: leave history as it is.
        Step 9 reports 0 credentials, so nothing must be rotated. Left in
        history if not rewritten: /home/beberman in 28 commits, a Windows
        home path in 1, and author e-mail bseberman@gmail.com on 491 commits.
        Rewriting changes every hash that 1750 commit-message tokens and the
        documents' own commit citations (de355d0, 9169e64 and others) point
        at. A .mailmap changes how `git log` displays an author and rewrites
        nothing. The owner chooses: leave, .mailmap, or rewrite.
    D4  Private-tree material. Before step 11. Defaults from REQ-0079 R3
        where it speaks; none where it does not.
        (a) measurements in docs/ and src/ comments: kept, with one note
            naming the trees (REQ-0079 R3's default).
        (b) the verbatim front-end and lfia fixtures of finding 12: keep
            with a provenance line, or replace each with a synthetic file
            that exercises the same assertions. No default.
        (c) tools/test/cases/ (450 private identifiers): keep, or move out
            of the tree and have recall.py and acceptance.py read the path
            from an environment variable. No default.
        (d) the two .docx files and docs/TODO.md, VALUE.md and
            DESIGN-ASSUMPTION-CHANGES.md: keep or remove. No default. TODO.md
            has finding 23 attached.
        (e) init.el: remove (default). It is not Loom's.
    D5  README figures policy, and R4's last sentence. Before step 12.
        (a) tools/test/readme-figures.py --check fails when any figure
            differs from HEAD's, and CONTRIBUTING makes regenerating part of
            a release, not of every pull request. Default.
        (b) the same script reports drift and never fails.
        (c) R4 as written: `check` flags it. Needs a DES first (finding 14).
        Whichever is chosen, step 15 amends R4's last sentence with a dated
        note before `complete`, as PLAN-0060 did for REQ-0041 U4.
    D6  Licences and contributions. Before step 14. No default. The plan
        does not choose.
        (a) The project licence. LICENSE says MIT. Confirm it.
        (b) stem: keep it and say "declared Probably LLGPL, no licence file"
            in the third-party list; or ask its author; or replace it with
            an implementation of Porter's algorithm written in this tree. The
            third is a code change with its own plan, because DES-0033 D4
            measured 40 of 45 with stem and a replacement must reproduce it.
        (c) The LLGPL and LGPL libraries of finding 16 are fetched by
            Quicklisp and not redistributed. Whether the third-party list
            only lists them, or also says that, is the owner's wording.
        (d) Whether to accept outside contributions. REQ-0079 R6 says this
            is DEC-level. Step 14 writes DEC-0008 with the owner's answer.
        (e) Which code of conduct, by name and version.
    D7  GitHub settings. Owner only, after step 8 and again at step 16.
        Make the repository public (when); protect main: require pull
        requests, require the doc-ids status check, require branches to be
        up to date (finding 17: no merge queue for a user-owned
        repository); allow squash for forks; Actions approval for
        first-time contributors; secret scanning and push protection.
    D8  The clean environment for acceptance. Before step 16. Default (a).
        (a) tools/test/clean-room.sh under bwrap. Proves nothing under /home
            is read. Does not prove the OS package list (finding 6).
        (b) a fresh WSL distro (`wsl.exe --install Ubuntu-24.04` under a
            new name). Proves the package list. Changes the machine.
        (c) a GitHub Actions job on ubuntu-latest that follows INSTALL.md.
            Proves the package list. Runs on GitHub only.

  FILES

  New:
    tools/test/clean-room.sh            step 3. The sandbox instrument.
    tools/doc-ids.py                    steps 5 and 6. DES-0056's script.
    tools/test/test-doc-ids.py          steps 5 and 6. DES-0056 R6.
    tools/test/next-id.lisp             step 4. Prints NEXT-DOCUMENT-ID for a
                                        directory and prefix, so the python
                                        test can compare the two allocators.
    .github/workflows/doc-ids.yml       step 7. DES-0056 R5.
    tools/test/release-scan.py          step 8. REQ-0079 R2's script.
    tools/test/test-release-scan.py     step 8.
    docs/PRIVATE-TREES.md               step 11. REQ-0079 R3's note. Indexed
                                        as a :document by the markdown
                                        analyzer.
    tools/test/readme-figures.py        step 12. REQ-0079 R4's script.
    tools/test/surface.lisp             step 12. Prints the registries
                                        `status` does not: analyzers and
                                        their file types, entity and
                                        relationship types, serve
                                        operations, MCP tools.
    INSTALL.md                          step 13.
    CONTRIBUTING.md, CODE_OF_CONDUCT.md step 14.
    THIRD-PARTY-LICENSES.md             step 14.
    docs/decisions/DEC-0008.yaml        step 14, with the owner's answer to
                                        D6 (d). The id is re-read with
                                        tools/next-doc-id.sh DEC at the time.

  Changed:
    src/serve/json.lisp, src/serve/package.lisp, src/serve/loom-serve.asd
                                        step 1
    src/serve/test/json.lisp            step 1
    src/workspace/context-log.lisp, src/workspace/package.lisp
                                        steps 1 and 2
    src/workspace/test/context-log.lisp step 1
    src/analyzer/analyzer.lisp, src/analyzer/package.lisp,
    src/analyzer/loom-analyzer.asd      step 2
