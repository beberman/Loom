id: BUG-0008
title: RELOAD-CODE redefines code under live request threads, and a concurrent request fails with a 500
status: closed
date: 2026-08-04
refines: [ARCH-0007]
affects: [start-server, stop-server, dispatch-request,
          loom-acceptor, invoke-operation]
tags: [service, concurrency, lifecycle, rest, mcp, prototype, bug]
summary: |
  Reproduced on the first attempt, not predicted: a request served while
  RELOAD-CODE is running comes back HTTP 500 with NO-APPLICABLE-METHOD-ERROR
  against LOOM-ONTOLOGY:NAME, a generic function that momentarily has zero
  methods because ASDF has loaded the fasl that redefines it and not yet
  loaded the methods back. One request in six inside a 4.4s window. R8's error
  net caught it, the process survived, and the next request was served
  normally -- so the failure mode is "some requests in the reload window fail
  visibly," not a crash.

  The important part is where it failed. loom-ontology is the deepest of the
  nine systems and the furthest thing from a service wrapper, which rules out
  the obvious fix of reloading only the "computation" systems in place and
  restarting for the service ones: any system defining a generic function or a
  class has this window, and all nine do. What decides safety is not which
  system the code is in but whether any thread is executing anywhere in it
  while it reloads.

  ARCH-0007 does not address concurrency at all. RELOAD-CODE holds
  *RELOAD-LOCK* against a second reload and nothing else, and it is itself
  reached over REST, so it already runs inside a Hunchentoot worker thread on
  the acceptor whose code it is redefining.
body: |
  THE REPRODUCTION

  Ordinary running service, one `POST /v1/reload-code` in the background, six
  `POST /v1/reindex` at 0.7s intervals across the reload's own 4.4s:

    req1  200  0.43s
    req2  200  0.40s
    req3  500  0.38s   <-- NO-APPLICABLE-METHOD-ERROR
    req4  200  0.47s
    req5  200  0.34s
    req6  200  0.34s
    reload 200 4.41s

  req3's body, in full:

    {"name":"NO-APPLICABLE-METHOD-ERROR",
     "message":"There is no applicable method for the generic function
       #<STANDARD-GENERIC-FUNCTION LOOM-ONTOLOGY:NAME (0)>
       when called with arguments (#<LOOM-ONTOLOGY:FUNCTION-ENTITY ...>)."}

  `(0)` is the method count. The generic function existed and had no methods
  at the instant the thread called it.

  THE MECHANISM

  ASDF loads a fasl by evaluating its top-level forms in order. Re-evaluating
  a DEFGENERIC removes the methods a previous DEFGENERIC established (CLHS
  7.6.6), and DEFENTITY expands into class and accessor definitions that are
  re-established the same way. Between the form that empties the generic
  function and the forms that fill it again there is a window -- microseconds
  per definition, but summed over nine systems' worth of definitions across
  4.4s, wide enough that one request in six landed in one.

  This is not the DEFSTRUCT-layout hazard ARCH-0007 already names under
  CONSEQUENCES and REQ-0010 names under R3. That one is about a live instance
  built under an old layout. This one needs no old instance and no layout
  change: identical source, recompiled and reloaded, is enough, because the
  hazard is the reload's own intermediate states rather than its result.

  WHY THE OBVIOUS SPLIT DOES NOT WORK

  The natural fix on hearing this is to split the nine: reload the systems
  that do Loom's actual computation in place, and soft-stop-and-restart for
  the service wrappers that own threads (loom-serve, loom-rest, loom-mcp,
  loom-process). The evidence above rules it out. LOOM-ONTOLOGY:NAME is in
  loom-ontology, the system that depends on nothing and owns no thread -- the
  clearest possible member of the "safe to reload" half. Every system that
  defines a generic function or a class has this window; the safety question
  is about which threads are running, not about which system is being loaded.

  WHAT THE FIX PROBABLY IS, NOT DECIDED HERE

  Hunchentoot 1.3.1 already has the drain this needs, which is worth knowing
  before anyone designs one:

    (hunchentoot:stop acceptor :soft t)   acceptor.lisp:319-336

  It sets ACCEPTOR-SHUTDOWN-P (the listener stops accepting), then waits on a
  condition variable until ACCEPTOR-REQUESTS-IN-PROGRESS reaches zero, then
  shuts the taskmaster down. The hold-and-count primitives -- a shutdown flag,
  an in-flight counter, a wait queue -- exist and are maintained by the
  library on every request. The acceptor is the stock ONE-THREAD-PER-
  CONNECTION-TASKMASTER (acceptor.lisp:182), so each request is its own
  thread and the counter is meaningful.

  Draining to zero is the shape that works, and parking threads mid-request in
  a "holding pattern" is the shape that does not: a thread held inside a
  handler is still inside code the reload is about to redefine, and returns
  into a half-loaded system. Draining leaves every worker thread outside all
  nine systems -- the acceptor loop is the only thing running -- which is the
  one state where a reload has no thread to race.

  What that costs and what it leaves open, so whoever designs this starts
  from the real constraints rather than these:

    RELOAD-CODE cannot drain the acceptor it is running on. It is invoked over
    REST, so it is itself one of the requests-in-progress the drain would wait
    for, and waiting for itself deadlocks. A drain-then-reload has to run
    somewhere other than a worker thread -- a dedicated thread the operation
    hands off to and does not wait on, or a signal to the SERVE-FOREVER loop,
    or the reload moving out of the request path entirely and back into
    tools/loom-serve.sh as a stop/reload/start sequence.

    Whichever it is, the caller's own answer changes shape. Today RELOAD-CODE
    returns :reloaded T and a completion time in the same response. A reload
    that happens after the connection is drained cannot answer on that
    connection, so tools/loom-serve.sh's `reload` verb and its .reloaded-at
    bookkeeping (ARCH-0007's third PROBLEM finding) both need rethinking with
    it.

    A soft stop and a full restart is the other end, and it is not obviously
    worse: measured at 4.3s to start and 4.4s to reload, in-place reload buys
    almost nothing in time. What it buys is watched repositories surviving and
    open REPL sessions surviving, which is REQ-0010 R3's own stated reason for
    preferring reload -- so the trade is "keep watched state, accept a
    concurrency design" against "lose watched state, keep a trivially correct
    lifecycle."

  A SMALLER, RELATED DEFECT IN THE SAME AREA

  STOP-SERVER (src/serve/server.lisp:132) calls (hunchentoot:stop *server*)
  with no :soft argument, so an ordinary stop, and therefore every
  `tools/loom-serve.sh stop` and `restart`, drops requests in progress rather
  than draining them. One keyword away from correct, but it is a behaviour
  change to a lifecycle primitive ARCH-0006 and ARCH-0007 both record as
  unedited, so it is named here rather than changed in passing.

  FIX

  Closed by PLAN-0007, which implemented ARCH-0008. Two changes, and the first
  is what closes this document rather than narrowing it:

    RELOAD-CODE is gone, along with *RELOAD-SYSTEMS*, *RELOAD-FORCE-SYSTEMS*,
    *RELOAD-FUNCTION*, FORCE-LOAD-SYSTEMS and *RELOAD-LOCK* (src/serve/
    server.lisp), their two exports, and their five tests. Nothing in
    loom-serve, loom-rest or loom-mcp calls ASDF:LOAD-SYSTEM against a running
    image any more, so there is no longer a path on which a worker thread can
    be executing inside one of the nine systems while ASDF redefines it. The
    REST route disappeared with the registry entry, verified rather than
    assumed: `POST /v1/reload-code` now answers 404 with an UNKNOWN-OPERATION
    body while `POST /v1/reindex` still answers 200. Bringing running code up
    to date is a full process restart, from outside the process being
    replaced. RELOAD-CODE-IS-NOT-AN-OPERATION-ANY-MORE (src/serve/test/
    server.lisp) is the guard against it quietly coming back.

    STOP-SERVER drains, which closes the smaller defect below for every caller
    rather than for the restart path alone. It hands `(hunchentoot:stop
    acceptor :soft t)` to a thread of its own and waits up to
    *STOP-DRAIN-TIMEOUT* (5s) for that thread to finish, completing the stop
    unconditionally if the bound elapses. The bound has to be imposed here
    because Hunchentoot's soft stop takes no timeout -- acceptor.lisp:319-336
    is a bare CONDITION-VARIABLE-WAIT -- and an implementation that ran it
    in-line would turn every `tools/loom-serve.sh stop` into an indefinite
    block the moment one request hung.

  This document's own reproduction, re-run in the shape that still exists --
  six `POST /v1/reindex` at 0.7s intervals spanning a `tools/loom-serve.sh
  restart` -- now produces one 200 (the request in flight when the stop began,
  drained and answered) and five refused connections while the process is down.
  No 500, which after the first change above is structural rather than lucky.

  A residual ARCH-0008 records as accepted, not solved: `:soft t` waits once
  rather than in a loop, so with two or more overlapping requests it returns
  when the first finishes rather than the last, and a request still running
  when the bound elapses is still dropped. Draining with a bound trades "always
  drop in-flight work" for "usually finish it", not for "never drop it".

  SCOPE AND URGENCY

  Single developer, single machine, prototype -- the window needs a concurrent
  caller to matter, and today the usual caller is one agent at a time. It
  stops being theoretical the moment two Claude Code sessions overlap: the
  SessionStart hook runs `tools/loom-serve.sh update` at every session start,
  and a session starting while another session is mid-MCP-call is exactly the
  reproduction above. The consequence is bounded -- a visible 500 that a retry
  fixes, not a corrupt graph and not a dead process -- which is why this is
  filed rather than treated as a reason to disable the hook.
