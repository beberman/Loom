id: BUG-0019
title: The index silently depended on the analyzing implementation's *features*, and recorded nothing about which reading it was
status: fixed
date: 2026-08-09
refines: [REQ-0019]
affects: [read-source, lisp-reader-client, evaluate-feature-expression,
          analyze-file]
tags: [analyzer, lisp, reader, features, blind-spot, provenance]
summary: |
  Every #+ and #- in analyzed source was decided against CL:*FEATURES* -- the
  feature list of whichever image happened to be running the analyzer, not
  anything the workspace declared. So the same repository indexed by SBCL and
  by CCL yields different entities, indexing under a different SBCL build
  yields different entities, and nothing anywhere in the index says which
  reading it was. The suppressed branch simply is not there, indistinguishable
  from source that was never written.

  Filed after the fix rather than before it, which is the wrong order and is
  recorded here as such. ARCH-0013 asked for the reverse -- "the implementing
  plan should file it as a bug before fixing it, so the gap exists on the
  record independently of the change that closes it" -- and the reason that
  matters is BUG-0017's own lesson: a defect known only through the commit
  that repaired it cannot be reasoned about later, because the record of what
  was wrong is the record of what changed. The document is written anyway, and
  dated honestly, because the alternative is that this gap exists nowhere.
body: |
  SYMPTOM

  Two things, and the second is the one that makes it a bug rather than a
  limitation.

  A definition guarded by a reader conditional the analyzing image does not
  satisfy is absent from the index. `find` reports nothing, `describe` on its
  callers shows no edge to it, `impact` never reaches it. On this tree that is
  two sites; on a portable library written to run on four implementations it
  would be most of the platform-specific code.

  And nothing records that this happened. There was no property, no count, no
  `status` line -- the suppressed region left no trace of any kind, so an
  agent asking "why is there no entity for this function" had no way to
  distinguish "the file does not define it" from "the file defines it behind a
  #+ your analyzer did not take". That is the half CON-0001 names: a recorded
  gap beats a fabricated fact, and beats a silent absence too.

  CAUSE

  READ-FORMS-WITH-SPANS bound *PACKAGE* and *READ-EVAL* and nothing else, so
  CL:READ evaluated feature expressions against the ambient CL:*FEATURES*.
  There was no policy to state because there was no mechanism that could hold
  one -- the host reader's feature handling is not a thing a caller can
  parameterise, which is why this is REQ-0019's fourth capability rather than
  a two-line fix to the function that had the problem.

  The disclosure gap is separate and worse. ELEMENT-SPANS' two NIL shapes and
  the all-or-nothing file loss were at least written down in docstrings, badly
  placed but present. This one was written down nowhere at all: no docstring,
  no document, no bug. It was found by counting what REQ-0019's substrate
  measurement turned up, which is the argument for doing that counting.

  FIX

  ARCH-0013 R6, landed as PLAN-0013 step 7. READ-SOURCE takes a FEATURES
  keyword defaulting to CL:*FEATURES*, the client carries it in a slot, and
  ECLECTOR.READER:EVALUATE-FEATURE-EXPRESSION decides against that slot. A
  slot rather than a rebinding of CL:*FEATURES*, on the same argument
  EVALUATE-EXPRESSION's method makes: a client carrying its own policy cannot
  be talked out of it by a dynamic binding up the stack.

  Both halves of the symptom are addressed, and only one of them changes
  anything today. The policy is now explicit and settable, and the default is
  the host's, so no entity count moves -- that is deliberate, and ARCH-0013 R6
  says whoever changes the default owns the movement. What does change is the
  second half: suppressed material is recorded through
  MAKE-SKIPPED-INPUT-RESULT and reaches the :FILE entity as
  :SUPPRESSED-REGIONS, with `status` summing it on the `unread` line. The two
  sites on this tree now say so instead of being invisible.

  WHAT IS NOT FIXED

  The policy still defaults to the host's *FEATURES*, so a portable library
  indexed here still loses its other implementations' branches -- it now loses
  them visibly. Choosing a better default is a real decision with an
  entity-count consequence in both directions: reading every branch of every
  #+/#- indexes definitions that exist on no single platform, and reading none
  loses the ones that do. ARCH-0013 leaves it open on purpose and this bug
  does not close it.

  Nor does the index record which feature list produced it. The regions are
  recorded per file; the policy in force is not stored anywhere, so two
  indexings under different policies are still distinguishable only by their
  contents. Worth having eventually, and out of scope here.

  TEST

  THE-FEATURE-POLICY-IS-THE-CLIENTS-AND-NOT-THE-IMAGES in
  src/analyzer/test/lisp-reader.lisp reads one source twice, once under the
  host's features and once under a policy naming the guard, and asserts the
  branch is read in the second and not the first. It fails without the change:
  before EVALUATE-FEATURE-EXPRESSION existed the FEATURES argument had nowhere
  to go, so both readings were the host's.

  A-FEATURE-SUPPRESSED-BRANCH-IS-A-RECORDED-GAP-AND-A-COMMENT-IS-NOT in
  src/analyzer/test/lisp-analyzer.lisp covers the disclosure half end to end,
  and asserts both directions at once deliberately: recording the branch is
  worthless if commentary comes with it, since 4513 comment entries burying 2
  real ones is BUG-0009's failure in a different place.
