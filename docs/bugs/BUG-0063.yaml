id: BUG-0063
title: severity is written by 48 documents and read by nothing, and priority is written into prose by 13 bugs because no field exists for it
status: open
date: 2026-09-10
amended: 2026-09-10
refines: [BUG-0062]
affects: [as-keyword,
          "method:src/analyzer/yaml-analyzer.lisp:type-specific-properties::(eql document),t,t"]
tags: [documents, ontology, severity, priority, bugs, vocabulary, con-0001,
       silent-drop, triage]
severity: high
summary: |
  48 documents under `docs/` carry a `severity:` key. No entity holds it.
  `describe BUG-0062` returns twelve properties -- title, summary, category,
  doc-id, path, body, refines, mentions, affects, status, system, format -- and
  severity is not among them, because TYPE-SPECIFIC-PROPERTIES reads `:severity`
  only in its `:rule` method (src/analyzer/yaml-analyzer.lisp:301) and the
  `:document` method (line 345) does not read it. The `:document` entity type
  declares no such property either, so there is nowhere for it to land.

  This is the exact shape the `:importance` docstring in the ontology warns
  about, in the same file, six lines above the declaration:
  "Declared here because a property this type does not declare is a field the
  author writes and nothing ever reads -- which is precisely what :AFFECTS was
  until it was declared, 67 documents carrying 610 names that resolved to
  nothing and were not reported unresolved either."

  The vocabulary spread is the visible symptom and was what led here. Loom's
  own tree carries nine distinct severities: high 10, major 9, medium 8,
  minor 6, error 6, low 3, critical 3, advisory 2, warning 1. Two bugs marked
  `high` and `major` cannot be compared, and a reader cannot tell whether
  `error` outranks `critical`. Nothing reports the spread because nothing reads
  the field.

  Underneath the spread is a second field that does not exist. Thirteen bugs
  carry a `PRIORITY:` line in their prose -- P1 through P5, all dated
  2026-08-18, one spelled `CRITICAL` instead -- because there is nowhere else to
  put it.

  Two axes, three fields, settled 2026-09-10 and written out in F6. Impact is
  one axis under two names: `importance:` on a requirement, `severity:` on a
  bug, one shared vocabulary, phrased differently because a bug is not a
  requirement. Priority is the other, derived from impact weighted by
  probability of occurrence and sequenced against the requirements already
  planned. Of the three, one is declared and unread, one is prose, and one is
  read correctly.
body: |
  WHAT IS TRUE OF THE FIELD TODAY

  D1. IT IS NOT PARSED FOR A DOCUMENT.

  TYPE-SPECIFIC-PROPERTIES has a `:rule` method that reads `:severity` through
  AS-KEYWORD against `(:error :warning :advisory)` with `:error` as the default,
  and the `:rule` entity type declares the property twice over
  (src/ontology/code-ontology.lisp:1059 and 1275). That is the whole of
  severity's implementation, and it is about a RULE-nnnn document's enforcement
  strength, not about how bad a bug is.

  Every workflow category -- arch, requirements, plans, reviews, bugs -- lands
  in the `:document` method. Its own comment names the failure mode it is
  guarding against: "a field only one genre's method reads is a field ...
  nothing sees. :AFFECTS was exactly that until BUG-0023." `severity:` is that
  field now, from the other side: read by one genre's method, written by 48
  documents of other genres.

  D2. THERE IS NO VOCABULARY, AND THE TWO CANDIDATE VOCABULARIES ARE INCOMPATIBLE.

  The rule vocabulary is `error / warning / advisory`, which answers "how
  strictly is this enforced". The nine values found in `docs/` answer at least
  two other questions: `critical / major / minor` mirrors `importance:`, and
  `high / medium / low` is a third scale on top of that. 25 of the 48 documents
  are on one of the two three-point scales and cannot be compared across them.

  A closed vocabulary for a bug's severity is therefore not a matter of copying
  the rule's -- it is a decision that has never been made. `importance:` got
  one on 2026-08-23 with the argument recorded in its docstring: "A scale with
  five points invites the middle one, and the question this answers -- would the
  product be wrong without it, or only poorer -- has three honest answers."
  Nothing equivalent was ever written for severity.

  D3. NOTHING WOULD REPORT A TYPO EVEN IF IT WERE PARSED.

  This is BUG-0062 D3 unchanged: the analyzer is silent about an
  out-of-vocabulary value on purpose and defers the report to `check` over the
  whole tree, and `check` does not do this for `importance:` and would not for
  `severity:` either. Fixing one fixes both.

  D4. PRIORITY IS A SECOND FIELD, WRITTEN INTO PROSE.

  Thirteen bugs open a body section with `PRIORITY: P<n>, 2026-08-18` -- a
  single triage session that had a judgement to record and no field to record it
  in. The scale is P1-P5 with one `CRITICAL` spelling, so the prose field has
  already drifted the way the YAML field did.

  Where both values exist they diverge, which is the proof that they answer
  different questions:

      BUG-0034  severity: high     P4
      BUG-0032  severity: high     P3
      BUG-0035  severity: high     P2
      BUG-0002  severity: medium   P5
      BUG-0015  severity: low      P5

  BUG-0034 is the clean case: bad when it happens, worked later. Nothing about
  `high` says when to do it and nothing about `P4` says what it costs, and the
  two together say something neither says alone.

  BUG-0015 is the case that exposes the confusion. Its severity is `low` and its
  own first line says the reason is priority rather than size: "PRIORITY: P5 ...
  Last, and the reason is in the section above rather than in the defect's
  size." The reasons given are all priority reasons -- half of it is fixed, the
  rest is covered by a test, enrichment is on-demand, and both remaining fixes
  were rejected by DES-0011. Read as severity the number is wrong: one unrelated
  edit runs RESOLVE-CALLS over the whole index and clears the agreement record
  from every confirmed edge, 983 of them measured. The bug fails safe -- absent
  `:sources` is evidence of nothing rather than a false claim -- but it fails
  wide.

  So the tree does both things and a reader cannot tell which. Some bugs keep
  the two apart (BUG-0034, high and P4); at least one prices severity as
  priority (BUG-0015, low and P5, with its own text disclaiming size as the
  reason). Neither convention is written down, because neither field is
  declared.

  WHY IT SURVIVED

  Nothing is broken in a way anybody could see. A document with `severity: high`
  parses, indexes, resolves its `affects:` and answers `describe` -- the field
  simply is not in the answer, and no reader of a bug document reads it from
  the index rather than from the file. The field is used by humans reading YAML
  and by nothing else, which is why nine spellings accumulated without
  friction.

  WHAT WOULD FIX IT

  F1. The vocabulary for a document's severity is `:importance`'s --
  critical / major / minor -- because F6 settles that they are one axis. The
  `:rule` vocabulary is not a candidate: error / warning / advisory answers how
  strictly a rule is enforced, which is a third question and belongs only to
  rules.

  What this does not decide is the per-document mapping. Nine spellings to three
  is a judgement per bug, not a table -- `high` and `major` may or may not be the
  same claim, and the author is gone from most of them. That is F3.

  F2. Declare `:severity` on the `:document` entity type with that `:one-of`,
  and read it in TYPE-SPECIFIC-PROPERTIES' `:document` method beside
  `:importance`.

  F3. Migrate the 48 documents. Nine values to three or four is a judgement per
  document, not a mapping -- `high` and `major` may or may not be the same
  claim, and the author is gone from most of them.

  F4. `check` reports a document whose `severity:` key is present in the YAML
  and absent from the entity, which is BUG-0062 F2 for the same reason and
  should be one implementation covering both fields.

  F5. The workflow-concept template gains the field, which is BUG-0062 F1's
  problem and inherits BUG-0062 F3's difficulty: no prepared tree can be told
  about it. Loom's own tree holding no copy of that template is the mechanism,
  and it is filed separately.

  F6. TWO AXES, THREE FIELDS. Decided 2026-09-10, by the tree's owner.

  IMPACT is one axis and carries two names because the genres ask it
  differently. `importance:` on a requirement asks whether the product would be
  wrong without it or only poorer. `severity:` on a bug asks how severe the
  impact is when it happens. The question is the same and the phrasing cannot
  be, because a bug is not a requirement -- so the two names stay and the
  vocabulary is shared, which is F1.

  PRIORITY is the other axis and has no field at all. It is when to work the
  thing, and it is derived rather than judged fresh: impact weighted by the
  probability of occurrence, then sequenced against the requirements already
  planned -- because a bug a future requirement will resolve on its way past
  should be sequenced behind that requirement rather than fixed twice.

  So `priority:` is declared as its own field. Folding it into severity loses
  the pairing that makes BUG-0034 legible, and the three inputs are not
  recoverable from the output.

  BUG-0015 is this decision's own worked example on all three inputs. Its impact
  is wide -- one unrelated edit clears the agreement record from every confirmed
  edge, 983 measured -- so its `low` is an impact value carrying a priority
  argument. Its probability is high: every poll that finds any file changed
  triggers it. And its sequence is bound to somebody else's work, because both
  remaining fixes were rejected by DES-0011 and it waits on that design being
  reopened. High impact, high probability, and last anyway. Only the third input
  explains that, and only a field can hold it.

  The thirteen prose sections migrate to the field. They carry their own dates,
  and a priority set on 2026-08-18 and never revisited is worth reporting as
  stale -- a thing a field supports and a paragraph does not.

  OPEN, and smaller than what was just settled: whether probability of
  occurrence gets a field of its own or stays an input the author weighs while
  setting priority. A recorded probability makes a stale priority checkable
  against it; an unrecorded one keeps the field count at three.

  HOW IT WAS FOUND

  Filing BUG-0062 on 2026-09-09 raised the question of what other document
  fields are written and unread. `grep -rhn "^severity:" docs/` produced nine
  distinct values; `describe BUG-0062` over REST returned twelve properties
  with severity absent; `grep -n severity src/analyzer/yaml-analyzer.lisp`
  returned one parse, in the `:rule` method.

  D4 came from being asked why BUG-0015 is `low`, 2026-09-10. Its own PRIORITY
  line answers with priority reasons and disclaims size, which raised the
  question of where priority is recorded; `grep -rln "PRIORITY:" docs/bugs/`
  answered thirteen, all dated 2026-08-18, none in a field.
