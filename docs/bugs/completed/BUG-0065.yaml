id: BUG-0065
title: complete stops at an already-finished document instead of walking through it, and reports dry-run null on the run that writes nothing
status: closed
date: 2026-09-10
amended: 2026-09-10
refines: [REQ-0022, BUG-0057]
affects: [complete-plan, terminal-status-p, refines-targets]
tags: [complete, documents, workflow, transition, dry-run, bug-0057, front-end]
severity: major
summary: |
  Two defects in COMPLETE-PLAN's report, both found closing front-end's
  documents on 2026-09-09, both in src/workspace/transition.lisp.

  D1. A document that was already terminal ends the walk. `complete
  plan=PLAN-0004` in front-end returned exactly two rows -- `PLAN-0004
  unchanged` and `DES-0006 already-finished` -- and never mentioned REQ-0004,
  which DES-0006 refines and which was still `accepted`. Nothing was blocked and
  no problem was reported. The requirement was correct, complete and closeable,
  and the plan that implemented it could not say so.

  D2. `dry-run` is null on the run that writes nothing. PLAN-0002 and PLAN-0003
  returned `"dry-run": true`; PLAN-0006, already fully terminal, returned
  `"dry-run": null` with every row `already-finished` or `unchanged`. A caller
  testing that field to learn whether a write happened reads falsy in the one
  case where nothing was written and nothing would be.
body: |
  D1. THE WALK STOPS AT A TERMINAL DOCUMENT

  transition.lisp:739-746 records `:already-finished` and does not push the
  document onto `finished`, so REFINES-TARGETS is never called for it and its
  parents never enter the frontier. The dry-run frontier extension at line 789
  excludes terminal documents by the same test, so a preview does not reach them
  either.

  The comment there gives the reasoning: "It needs no verdict, it blocks
  nothing, and the walk stops here rather than climbing through it: nothing
  about it changed, so nothing above it changed because of it."

  That is true of a document finished by this cascade and false of one finished
  in an earlier session. front-end is the case: DES-0006 was closed by hand
  weeks before PLAN-0004 was completed, so by the time the plan ran there was
  nothing left to change about the design -- and REQ-0004 above it was still
  open, still refined only by that design, and now unreachable from any plan.
  The condition that would have finished it had already happened and the walk
  could no longer observe it.

  Closing REQ-0004 needed `set-status`, which is the write path that shows no
  chain. So the one document whose verdict most deserved a dry-run review is the
  one that had to be set blind, and `set-status` -- which both the skill and the
  generated CLAUDE.md describe as the escape hatch for a *blocked* document --
  became the ordinary way through for a document that was not blocked at all.

  An `already-finished` document should be a node the walk passes through. It
  contributes no edit and no verdict; what it contributes is its own
  `refines:` targets, and it should contribute them for the same reason a
  document finished by this cascade does: its being terminal is part of why its
  parent may now be finishable. DOCUMENT-BLOCKERS already treats a terminal
  document as not blocking, so the two halves of the code disagree about what
  terminal means -- blocking-wise it is settled, walking-wise it is a stop.

  D2. DRY-RUN NULL

  `dry-run` is bound at line 658 as `(and (null parsed) (not force-write))`.
  BUG-0057's re-entry at line 843 calls COMPLETE-PLAN again with
  `:force-write t` when a dry run found nothing awaiting a verdict, so the
  answer that returns is the second call's, where `force-write` is true and
  `dry-run` is therefore NIL. NIL renders as `null` over JSON rather than as
  `false`, which is a second, smaller wrong: a boolean field that is sometimes
  `true` and never `false` gives a caller no way to tell "not a preview" from
  "field not set".

  The value is defensible on its own terms -- the second call really is not a
  dry run -- and useless to the caller, who wants to know whether the command
  wrote. On a fully-terminal plan the answer is: it did not, `changed` is empty,
  every row is `already-finished` or `unchanged`, and the one field shaped like
  the question says null.

  D3. FIXING D1 EXPOSES A GENRE THE WALK CANNOT PASS THROUGH AT ALL.

  Found 2026-09-10 while checking a different claim, and it is a consequence of
  D1's fix rather than a defect visible today.

  Four categories have no terminal status in *WORKFLOW-STATUS-VOCABULARY*:
  arch, decisions and rules carry an empty terminal column, and concepts are not
  in the table. A decision is `proposed', `accepted', `superseded' or
  `rejected', and TERMINAL-STATUS-P is false for all four.

  These do not block anything, and that is already handled: FINISHABLE-P
  (transition.lisp:539) returns false for exactly these four and
  DOCUMENT-BLOCKERS filters on it, with the reason in its docstring -- "Those
  are *in force* rather than outstanding: an active rule refining a concept is
  not unfinished work holding the concept open."

  What is not handled is the walk reaching one. The loop's clauses are ordered
  no-status, already-finished, blocked, no-verdict, verdict. A concept takes the
  first and is reported `:no-status'. A decision takes none of the first three:
  it has a status vocabulary, it is never terminal, and it blocks nothing -- so
  it falls to `:awaiting-verdict', and the all-or-nothing rule refuses the whole
  cascade until the caller supplies a verdict for a decision. Supply one and
  TERMINAL-STATUS-P is still false, so the walk stops there regardless.

  Nine documents in this tree refine DEC-0006 or another decision, so the chain
  exists. It is unreachable today only because D1 stops the walk first, which
  measured on 2026-09-10:

      complete plan=PLAN-0043
        PLAN-0043  final        unchanged
        REQ-0048   implemented  already-finished
        DES-0040   implemented  already-finished

  DES-0040 refines DEC-0006. The walk halts at DES-0040 because it is already
  terminal, and never asks what DEC-0006 would do. Fix D1 and it asks.

  So D1's fix has to pass through a non-terminal genre the way it passes through
  a terminal one: contribute no verdict and no edit, contribute REFINES-TARGETS,
  and be reported as what it is. FINISHABLE-P is the predicate that already
  names the four categories, and it is the one the walk should consult.

  The same output reproduces D2: `"dry-run": null` on a run where every row is
  `already-finished` or `unchanged` and `changed` is empty.

  WHAT WOULD FIX IT

  F1. A terminal document is walked through: recorded `already-finished` as
  now, and its REFINES-TARGETS added to the next frontier. The all-or-nothing
  verdict rule is untouched -- a parent reached this way still needs a verdict
  and still refuses without one.

  F1b. A document whose category has no terminal status is walked through the
  same way and never asked for a verdict. FINISHABLE-P is false for exactly the
  four categories concerned and is the test to use, so a decision, rule,
  architecture note or concept in the chain contributes its REFINES-TARGETS and
  is reported as in force rather than as awaiting anything. Without this, F1
  turns a walk that stops early into a cascade that refuses.

  F2. `dry-run` is `false` rather than null on any run that is not a preview,
  and the answer carries something a caller can test for "nothing was written":
  `changed` being empty already says it, and saying so in the field named after
  the question is the fix. The re-entry must not be the thing that decides it.

  F3. CON-0003: a test that fails without F1 is a plan whose only refined
  document is already terminal above an open grandparent, and one for F2 asserts
  `dry-run` is false rather than null on the BUG-0057 re-entry path. F1b needs a
  third: a chain running plan -> design -> decision, where the decision must
  neither be asked for a verdict nor end the walk. PLAN-0043 -> DES-0040 ->
  DEC-0006 is that chain in this tree and needs no fixture.

  WHAT LANDED, 2026-09-10

  The walk gained a second accumulator. FINISHED is what this cascade decided;
  PASSED is what it walked through -- already terminal, or of a category with
  no terminal status. Both contribute REFINES-TARGETS to the next frontier;
  only FINISHED joins SETTLED, because SETTLED is what the cascade is in the
  act of finishing and a passed document is not.

  F1b gained a report action of its own, `:in-force', from FINISHABLE-P's own
  sentence about why these genres do not block: they are in force rather than
  outstanding.

  F2 is at the serve boundary rather than in COMPLETE-PLAN, and that is
  layering rather than taste. loom-workspace does not depend on loom-serve, and
  *JSON-FALSE* is truthy to Lisp -- the console reads (getf report :dry-run)
  directly and would read every false as true if that value reached it.
  BOOLEAN-FIELDS converts at the one place that encodes.

  MEASURED ON THIS TREE. `complete plan=PLAN-0043' returned three rows before
  and ten after:

      PLAN-0043  final         would-set
      REQ-0048   implemented   already-finished
      DES-0040   implemented   already-finished
      DEC-0006   accepted      in-force
      REQ-0047   implemented   already-finished
      REQ-0037   partial       blocked
      REQ-0016   implemented   already-finished
      REQ-0039   partial       awaiting-verdict
      REQ-0036   implemented   already-finished
      CON-0007   (none)        no-status

  Everything from DEC-0006 down was unreachable from any plan. That REQ-0039
  awaits a verdict and REQ-0037 is blocked are facts this tree held and could
  not be asked for.

  D2, on three plans that take BUG-0057's re-entry -- PLAN-0047, PLAN-0019,
  PLAN-0036 -- now reads `dry-run: false' where it read `null', with `changed'
  empty beside it.

  F2's second clause is WITHDRAWN rather than built. It asked for "something a
  caller can test for nothing was written"; `changed' being empty already is
  that, and a second field carrying the same fact would be a second thing to
  keep true.

  CON-0003. Removing PASSED from the frontier computation fails
  THE-WALK-PASSES-THROUGH-A-DOCUMENT-THAT-WAS-ALREADY-FINISHED and
  A-DECISION-IN-THE-CHAIN-IS-IN-FORCE-RATHER-THAN-AWAITING-A-VERDICT and
  nothing else; the serve test asserts the JSON false directly.

  HOW IT WAS FOUND

  front-end, closing REQ-0001 and REQ-0004, 2026-09-09. Both confirmed against
  Loom's source on 2026-09-10 at transition.lisp:658, 739-746, 789 and 843.
  D3 was found on 2026-09-10 while checking a different claim, and is a
  consequence of D1's fix rather than a defect that was ever observable.
