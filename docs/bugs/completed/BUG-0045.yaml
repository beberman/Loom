id: BUG-0045
title: A context record does not survive being read and written back, because :FALSE is write-only and returns as null
status: closed
severity: minor
date: 2026-08-23
affects: [encode-record-value, read-json-record, record-context-call, drain-context-log]
tags: [context-log, json, round-trip, req-0036, plan-0036, con-0001]
summary: |
  ENCODE-RECORD-VALUE writes `:FALSE` as JSON `false`. JSON:DECODE-JSON reads
  `false` back as NIL. Re-encoding NIL writes `null`. So a record cannot be
  read and written back unchanged, and the field that fails is `truncated`,
  which every context record carries.

  Measured 2026-08-23 over .loom/context: decode each file and re-encode it
  through the same writer, and 47 of 88 differ. Every difference is the same
  one:

      on disk    "budget":4000,"tokensUsed":1160,"truncated":false}}
      re-encoded "budget":4000,"tokensUsed":1160,"truncated":null}}
body: |
  HOW IT WAS FOUND

  PLAN-0036 S5 replaces this hand-written encoder with UTILS:JSON-ENCODE, and
  its acceptance is a single sentence: "a record written before the change
  reads back identically after it". Building that check before making the
  change -- against the *current* code, so the instrument could be trusted --
  is what surfaced it. The stage cannot be judged by its own criterion, because
  the criterion already fails.

  WHY IT HAS NOT BITTEN

  Nothing reads a record and writes it back. RECORD-CONTEXT-CALL writes a new
  file; RECORD-CONTEXT-USE writes a sibling `<id>.used.json` rather than
  editing the record; tools/acceptance.py reads with Python, where JSON `false`
  decodes to False and is never re-encoded by Loom.

  So this is latent rather than active, which is why it has survived since
  DES-0030. It becomes live the moment anything rewrites a record -- a
  migration, a compaction, a repair pass -- and at that point every `truncated:
  false` in the corpus silently becomes `truncated: null`.

  WHY NULL IS THE WRONG ANSWER RATHER THAN A COSMETIC ONE

  The encoder's own docstring says why the marker exists: "NIL is also how a
  record says a value is absent, and a boolean field writes :FALSE so a reader
  sees a boolean rather than a null it has to interpret." The round trip
  destroys exactly the distinction the marker was introduced to preserve. A
  reader after the rewrite cannot tell "this bundle was not truncated" from
  "nobody recorded whether it was", which is CON-0001's recorded gap turning
  into a fabricated one.

  WHERE THE ASYMMETRY IS

  Three values and one of them is not a bijection:

      :FALSE  -> false -> NIL      lost
      NIL     -> null  -> NIL      fine
      T       -> true  -> T        fine

  CL-JSON has no distinguished false. JSON:DECODE-JSON maps both `false` and
  `null` onto NIL, so the information is gone at the reader rather than at the
  writer, and no change to ENCODE-RECORD-VALUE alone can fix it.

  THE FIX IS A DECISION, NOT A PATCH

  Three candidates and none is obviously right:

    Read false back as :FALSE. A decoder option or a post-pass over the alist
    restoring the marker. Correct and the most work, and it has to know which
    fields are boolean or it will turn a legitimate JSON `false` in some future
    payload into a keyword nothing expects.

    Stop writing :FALSE and write null. Loses the distinction the marker exists
    for, and DES-0030 argued for it deliberately.

    Write booleans as true/false with no NIL case for those fields. The
    honest version: a field that is a boolean always writes a boolean, so
    `truncated` is never absent and null never means false. This is a schema
    statement rather than an encoder change.

  PLAN-0036 S5 should not be attempted before one is chosen, because the stage
  is a substitution whose only acceptance test is a round trip that does not
  currently hold. Swapping the encoder while the criterion is broken would
  attribute a pre-existing defect to the swap, or hide it.

  HOW TO REPRODUCE

  For each file in .loom/context, READ-JSON-RECORD it and re-encode the result
  with ENCODE-RECORD-VALUE, then compare with the bytes on disk. 47 of 88
  diverge and every divergence is `false` becoming `null`. 41 are identical,
  and those are the records with no boolean field set.

  RESOLVED 2026-08-23

  None of the three candidates above. The library had already solved it and
  says so in its own docstring: UTILS:JSON-DECODE's default is lossy in exactly
  this direction -- "false, null, and an empty array all arrive as NIL and
  cannot be told apart afterwards" -- and `:strict t' returns :TRUE, :FALSE and
  :NULL as three distinct values, for the stated reason that "a caller reading
  a document it must round-trip, or one that has to distinguish an absent field
  from a false one, wants this and cannot get it from the default".

  So READ-JSON-RECORD decodes strictly and STRICT-VALUE-TO-RECORD maps the
  result back onto the shape every caller already reads: an alist with keyword
  keys, :TRUE to T, :FALSE staying :FALSE, :NULL to NIL. No caller changed and
  no schema was declared.

      round-trip: 105 identical, 0 differ

  against 41 identical and 47 differing before.

  THE SECOND DEFECT, WHICH THE FIRST FIX INTRODUCED

  Scoping. A strict decode keeps object keys as strings and never consults the
  key policy; it is the conversion that interns them. The binding was written
  around UTILS:JSON-DECODE, where it does nothing, so the default policy
  applied and `latencySeconds' read back and re-encoded as `latencyseconds'.

  That is precisely the failure PLAN-0036 S5 warns this file is exposed to: a
  key-spelling regression that no Lisp test sees, because tools/acceptance.py
  reads these files with Python. It was caught by the round-trip instrument and
  by nothing else, three lines after the instrument had reported success on the
  half it was built for.

  UTILS:*JSON-KEY-TO-LISP* is bound to JSON:CAMEL-CASE-TO-LISP around the
  conversion, because the writer uses LISP-TO-CAMEL-CASE. The library's own
  docstring says the two are policy and belong set as a pair; setting one is
  what produced the bug.

  WHAT THIS UNBLOCKS AND WHAT IT DOES NOT

  PLAN-0036 S5's acceptance now holds, so the stage is no longer blocked. The
  stage itself is half done: the read side is the library's, and
  ENCODE-RECORD-VALUE is still hand-written. Swapping it is now a change that
  can be judged, which it could not be before.

