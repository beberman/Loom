id: BUG-0035
title: A JavaScript call matches every same-named definition in the repository, including when the calling file defines one itself
status: closed
priority: p2
date: 2026-08-18
refines: [BUG-0029]
affects: [candidate-entities, call-targets, resolve-calls, entities-by-name]
tags: [resolution, javascript, scope, modules, con-0001, req-0015, bug-0029]
severity: critical
body: |
  FIXED 2026-08-18

  CANDIDATE-ENTITIES narrows through VISIBLE-CANDIDATES after it narrows
  through SAME-IDENTIFIER-CANDIDATES: which spellings are this identifier, then
  which of those this module can see. Two tiers, in the language's own order. A
  definition in the calling file shadows every same-named definition elsewhere,
  so if any candidate is local the local ones are the whole answer. Otherwise
  the candidates in files this one imports are, because a name from a module
  nobody imported is not in scope at all.

  It never empties a set. Where neither tier applies the original is returned
  unchanged, which is what the answer to this document's third open question
  turned out to be: a rule that can only reduce a fan-out cannot delete a real
  edge, and a name module scope does not govern keeps every candidate it had.

  The import side needed no new analyzer output. tools/js/extract.js has
  emitted an `imports` array since REQ-0024 and js-analyzer.lisp already stored
  the module specifiers as :IMPORT-SOURCES on the :FILE entity -- "recorded, not
  resolved", in that property's own words. This resolves them.
  RESOLVE-MODULE-SPECIFIER answers against the *index* and never against the
  filesystem, which is what keeps it inside loom-graph: a specifier naming a
  file no analyzer claimed resolves to nothing, and that is the right answer
  either way.

  *MODULE-SCOPED-LANGUAGES* joins *CASE-INSENSITIVE-LANGUAGES* in the ontology,
  for the reason BUG-0029 put the first one there. Common Lisp is the other
  kind: a symbol is visible throughout its package however many files it spans,
  so a file boundary tells resolution nothing, and narrowing on one would
  delete the cross-file edges RESOLVE-CALLS exists to draw.

  This document asked whether same-file-wins was worth landing on its own. It
  was not: the import tier needed no analyzer change either, and it closes
  another 51.

  MEASURED, ALL THREE TREES, 2026-08-18

                        entities              relationships
      Loom            2838 -> 2847           14549 -> 14569
      game-server     3873 -> 3873           21163 -> 21163
      front-end       4128 -> 4015            2731 ->  2455

  Loom's movement is this change's own source. game-server is identical in both
  columns. front-end loses 276 edges and 113 entities, and every one of the 113
  is a :CALL-SITE -- the census is otherwise identical, METHOD 1452, FUNCTION
  1012, VARIABLE 782, FILE 471, CLASS 211, DOCUMENT 37 before and after.

      :CALL-SITE fan-outs on front-end       163 -> 50
      of which a candidate is local           73 ->  0

  ACCEPTANCE MET

  DesignHome.jsx's `<Error />` draws one edge, to DesignHome.jsx:163, which is
  the component the file defines and renders. The components in
  AsyncRedirect.jsx and SaveDesign.jsx have no inbound calls at all. The
  same-file subset is 0. Loom and game-server index unchanged.

  WHAT REMAINS, MEASURED

  50 fan-outs, and they are two populations rather than a tail.

  About 40 are member calls. `log.commit()` contributes the bare name `commit`,
  and GestureLog.js, CircleGraphic.js and others each define one -- so the
  candidate set is every `commit` in the repository and module scope has
  nothing to say about it, because a method is a property of an object rather
  than a module binding. The question there is the receiver's type, which is a
  different defect and is filed as BUG-0036.

  10 are aliased specifiers. front-end's jsconfig.json declares 32 path
  aliases -- `partition/*` to `src/domain/partition/*`, and so on -- so
  `import { PartitionNode } from 'partition/PartitionNode.js'` is neither
  relative nor an npm package, and RESOLVE-MODULE-SPECIFIER declines it. Reading
  jsconfig.json or tsconfig.json would close exactly ten of the fifty, measured
  by transcribing the table and re-running the narrowing.

  The cheap alternative was considered and refused. Matching a specifier as a
  unique suffix of an indexed path needs no configuration and would resolve
  `partition/PartitionNode.js` today -- and would also resolve an npm package
  path that happened to have a namesake directory in the tree, narrowing a
  labelled fan-out into a confident wrong edge. That trade is the wrong way
  round: CON-0001 prefers the reported guess. An alias map read from the
  project's own configuration has no such failure mode, and it needs somewhere
  for per-repository configuration to live -- which .loom/frameworks.yaml and
  *ROUTE-CALLERS* already are, so the work is a design question rather than a
  patch.

  WHAT THE TESTS COVER

  Eight in the resolve suite. Four assert the narrowing -- local shadows,
  an imported module is in scope and an unimported one is not, a specifier
  naming a directory index, a specifier climbing out of its directory -- and
  four are guards: a name no tier governs keeps its candidates, a bare
  specifier narrows nothing, a Lisp caller is untouched, and
  RESOLVE-MODULE-SPECIFIER answers against the index rather than the disk.
  Verified against CON-0003 by emptying *MODULE-SCOPED-LANGUAGES*, which fails
  six assertions across the four narrowing tests and leaves every guard
  passing.

  PRIORITY: P2, 2026-08-18

  Filed on the strength of the measurement below rather than on an argument.
  73 of front-end's 163 call sites fan out to a set containing a definition
  from the calling file, which is the subset where the answer was available and
  a guess was recorded instead. It is behind BUG-0025 because the fan-out is
  labelled -- a reported guess is CON-0001's recorded gap, where BUG-0025's
  false edge is CON-0001's fabricated fact -- and ahead of the P3 tier because
  it is wrong on the tree Loom is most likely to be pointed at next.

  WHAT HAPPENS

  src/ui/edit/design/pages/DesignHome.jsx defines a component at line 163:

      const Error = (error) => { ... }

  and renders it twice, at 273 and 308. Loom draws three edges, one to each
  component in the repository named exactly `Error' -- the local one, and two
  in AsyncRedirect.jsx and SaveDesign.jsx that the file neither imports nor
  mentions. Each is reported `(ambiguous)' through a :CALL-SITE at 1/3.

  One of the three is right. The other two are the resolver matching a bare
  name across a whole repository in a language where a module's top-level
  binding is private unless exported and unreachable unless imported.

  MEASURED, ~/github/front-end, 2026-08-18

      :CALL-SITE entities                                    163
      fanning out to two or more candidates                  163
        of which one candidate is defined in the calling file 73

  All 163 are after BUG-0029's fix; before it there were 284. The 73 is the
  cheaply decidable subset, not the whole defect: a call whose target is
  imported from a named module is equally determinable and is not counted here,
  because Loom does not record imports.

  WHY IT IS NOT REQ-0015's AMBIGUITY, AND WHY IT LOOKS LIKE IT

  REQ-0015 is about a name that genuinely matches several definitions and a
  resolver that cannot tell which was meant. Here the language can tell. A
  definition in the calling file shadows every same-named definition elsewhere
  unless the file imports one, and a definition in another module is not a
  candidate at all unless it is exported and imported. The candidate set is not
  ambiguous; it was assembled without the information that would have narrowed
  it.

  This is the same shape as BUG-0029 one level up. There the matcher lacked the
  language's case rule; here it lacks the language's scope rule. Both were
  invisible while every indexed language was Common Lisp, where a symbol is
  global to its package and a file boundary means nothing to resolution.

  WHAT A FIX HAS TO DECIDE

  - Whether the narrowing is the analyzer's or the resolver's. The JavaScript
    analyzer sees `import { X } from './y'` and records nothing of it today.
    An :IMPORTS edge or an :IMPORTED-NAMES property is a change to what a
    JavaScript file *is* in the index, and it is what a correct answer needs;
    same-file-wins is a resolver-only approximation of it.

  - Whether same-file-wins is worth landing on its own. It closes 73 of 163
    with no new analyzer output and no new entity property, and it is right in
    every case it fires -- a local definition does shadow. It is also a rule
    Common Lisp does not want, so it has to be conditioned on the language the
    way BUG-0029's case rule now is, through
    LOOM-ONTOLOGY:*CASE-INSENSITIVE-LANGUAGES*' precedent rather than beside it.

  - What an unresolvable name should do. A call to something genuinely
    imported from node_modules has no definition in the index, and the honest
    answer is the unresolved record it already gets.

  ACCEPTANCE

  DesignHome.jsx's `<Error />` draws one edge, to DesignHome.jsx:163. The
  same-file subset of front-end's fan-outs falls from 73 to 0. Loom and
  game-server index with the entity and relationship counts they have now,
  because neither has a language this rule applies to.
