id: BUG-0067
title: A recall harness measured half the seeder for a whole sweep, because the vector stores were gone and `ready` does not mean a repository has one
status: closed
severity: major
priority: p2
date: 2026-09-12
refines: [REQ-0036]
affects: [repository-state, vector-build-status, vector-store-on-disk-p,
          repository-status, build-vector-store, assemble-vector-store]
tags: [harness, measurement, vectors, recall, rule-0008, req-0048, des-0050]
summary: |
  A four-cell sweep of DES-0050's fusion settings returned known-item 409 of
  450 and mismatch 9 of 120, identical in all four cells however the weights
  moved. The numbers were printed, formatted correctly, and meant nothing: the
  vector stores for every watched repository were gone, so `context' answered
  from the lexical seeder alone and no weight between two lists could matter
  when there was one list.

  9 of 120 is the giveaway in hindsight. `tools/test/cases/mismatch.md' records
  exactly that as the bar before dense retrieval existed: "mismatch strict
  9/120 7.5%". The harness reproduced a number from a document rather than
  measuring the tree, and nothing said so.

  This is RULE-0008's failure mode -- a measurement that did not happen must
  not read like one that returned nothing to say -- reaching the half of the
  service `ensure' does not check.
body: |
  NOT IN affects:

  `tools/test/service.py' and `loom-serve.sh's START_VECTOR_BUILDS are both
  changed by this bug and neither is in affects:, because affects: resolves
  against the index and Loom indexes neither -- there is no Python analyzer,
  and a shell function is not a definition. Naming them there made `check'
  report two unresolved references, which is the field working correctly.

  WHAT ensure CHECKS AND WHAT IT DOES NOT

  `tools/test/service.py' runs `loom-serve.sh update' and waits for every
  repository a case file names to reach `ready'. That covers the index. It does
  not cover the vector store, and the two are separate: REPOSITORY-STATE reports
  :EMBEDDING while a store is building and :READY once it is not, which is also
  what it reports for a repository that has no store at all and never started
  one.

  So `ready' means "the index can be queried". A caller reading it as "the
  service is whole" gets a lexical-only answer with no warning, and for
  `recall.py' against the mismatch family that is a measurement of something
  else entirely.

  `similar' already refuses this case correctly and says so -- "front-end has
  no vector store. Run embed on it first." -- which is how the absence was
  finally seen. `context' cannot refuse it, and should not: REQ-0048 R6 makes
  the lexical answer a good answer rather than a degraded one. The gap is that
  the instrument cannot tell which answer it got.

  THE SECOND HAZARD, FOUND WHILE CHASING THE FIRST, AND IT IS WORSE

  `loom-serve.sh status' printed "code current" while the previous image was
  answering. A mismatch run started immediately after `update' returned the old
  image's numbers and looked successful. It was caught only because two
  configurations that must differ returned byte-identical results.

  The cause is in PROBE and it is not a race in `status'. PROBE decided
  staleness by comparing this tree's :INDEXED-AT against the service's
  :STARTED-AT -- an index newer than the image means the source moved. But
  :INDEXED-AT only moves once the watcher has reindexed Loom's own tree, which
  is asynchronous and takes seconds. Between an edit and that reindex, PROBE
  said `current' about an image that predated the edit.

  CMD_UPDATE then believed it. Its supervised branch restarts only on `stale'
  and otherwise prints "nothing to do" and returns, so an edit followed by
  `update' could leave the old image running with nothing said. Every harness
  run in that window measured the code it had just replaced.

  The second half is that `cmd_restart' hands the verb to systemd and returns
  while eleven systems load. The old process answers for most of a minute
  after `update' has returned successfully.

  A behavioural probe is what settled it during the session: fe-11 in
  `acceptance.py' passes under :RELATIVE-SCORE and fails under
  :RECIPROCAL-RANK, so one case says which code is answering. That is a
  workaround that happened to exist because this defect had a case.

  WHAT LANDED, 2026-09-12

  R1  `repository-status' carries :VECTOR-STORE, :PRESENT or :ABSENT, from a
      PROBE-FILE on the store header rather than a five megabyte load, and
      :VECTORS, the count when a store is loaded and NIL when none is. A
      keyword and not a boolean because NIL encodes to JSON null and null is
      also what a service too old to carry the field returns.

  R2  `service.py's DESCRIBE prints "HAS NO VECTOR STORE -- this run measures
      the lexical seeder alone" per repository that has none. Said rather than
      refused: a tree with no store is the ordinary case and REQ-0048 R6 makes
      its answer a good one. What must not happen is the figure being read
      without it.

  R3  PROBE asks the filesystem. SOURCE_NEWER_THAN converts :STARTED-AT from
      universal to Unix time and runs `find -newermt' over src/, loom.lisp and
      loom-serve.lisp, so an edit makes the image stale the instant it is
      saved and no watcher is in the loop. AWAIT_FRESH_IMAGE then polls PROBE
      after a restart until it reports current, which waits for exactly the
      right thing: while the old process answers, its :STARTED-AT predates the
      edit and the mtime test keeps it stale.

      Verified behaviourally rather than by reading the script. With the
      service on :RECIPROCAL-RANK, fe-11 fails; flipping *FUSION* and running
      `update'; fe-11 passes on the first call after `update' returns. Before
      the change the same sequence returned the old image's answer.

  R4, DIAGNOSED 2026-09-12: NOTHING REMOVED THEM

  The stores were never deleted. They were overwritten with a shape their own
  loader refuses, and every query then answered as though the tree had none.

  BUILD-VECTOR-STORE computed its dimension count as

      (if vectors (length (first vectors)) 0)

  so a repository whose index held no candidates produced no documents, no
  vectors, and dimensions 0. ASSEMBLE-VECTOR-STORE wrote that -- count 0,
  dimensions 0 -- over whatever store was already there.
  LOAD-VECTOR-STORE tests (PLUSP DIMENSIONS) and refuses it, for the rest of
  the file's life. The result is a store that exists on disk, parses as JSON,
  and can never load.

  That explains every symptom and contradicts the one this bug opened with.
  `similar' said "has no vector store" because REPOSITORY-VECTORS got NIL from
  the loader, not because a file was missing. Every watched repository went at
  once because the trigger arrives per repository from one place. The unwatched
  `datascience' store survived because nothing embedded it.

  HOW IT IS REACHED

  `tools/loom-serve.sh's START_VECTOR_BUILDS POSTs /embed for every repository
  as soon as PROBE reports the listener answering, and the listener answers
  before indexing has finished. An embed that arrives in that window sees an
  empty VECTOR-CANDIDATES. Fifteen service restarts across a DES-0050
  measurement session is fifteen chances at it.

  A second path keeps it poisoned once it happens: /embed builds when there is
  no loadable store, and the poisoned store is not loadable, so the next embed
  against a still-empty index writes dimensions 0 again.

  THE FIX, AND WHERE IT IS

  BUILD-VECTOR-STORE returns NIL and writes nothing when there is nothing to
  embed. ASSEMBLE-VECTOR-STORE refuses a dimension count below 1 outright.

  Guarded at the writer rather than at the launcher, and that is the load-
  bearing choice: the launcher race is one way in, and a file its own reader
  refuses must not be writable by any way in. A writer that can produce one is
  worse than a writer that errors, because the file looks like an answer.

  Two tests, each checked to fail without the change. The first writes a good
  store, runs an empty build against it, and asserts the good store still
  loads. The second asserts the dimension guard signals.

  WHAT R1 WOULD AND WOULD NOT HAVE CAUGHT

  R1 reports :VECTOR-STORE :PRESENT from a PROBE-FILE, and the poisoned file is
  present. So R1 would have said :PRESENT throughout the void sweep and caught
  nothing. It remains worth having for the case it does cover -- a store that
  was never built -- and it is not the guard for this one. The guard for this
  one is that the file can no longer be written.

  WHAT IS WANTED

  R1  `status' distinguishes a repository with no vector store from one whose
      store is built. :READY covers both today and they are not the same state.

  R2  `service.py's ensure refuses, or says plainly what it is measuring, when
      a repository named by the case file has no vector store. RULE-0008's
      posture: exit with a sentence rather than print a figure against a
      service it could not reach, extended to a service it reached in half.

  R3  `loom-serve.sh status' does not report "code current" until the reloaded
      code is answering. A check that leads the thing it checks is worse than
      no check, because it is trusted.

  R4  Whatever lost the stores is found. Diagnosed and fixed: nothing lost
      them. A build against a not-yet-indexed repository wrote a
      zero-dimension store over the good one, and the loader refuses that
      forever. The section below has it.

  ACCEPTANCE

  With a repository's vector store deleted, `status' says so and `recall.py'
  refuses to score against it. A sweep like DES-0050's cannot silently produce
  the pre-dense bar and present it as a result.

  WHAT IT COST

  One four-cell sweep, re-run after rebuilding the stores. The re-run put the
  same configuration at known-item 435, mismatch 30 and acceptance 35, against
  the void run's 409, 9 and 33 -- so the defect did not merely add noise, it
  reversed the conclusion. DES-0050 D10 has both tables and the note that the
  first is void.
