id: BUG-0080
type: bug
title: A context query rebuilt a word table for every entity and scanned every name for every token, which was 60% of its CPU and 37 MB of its allocation
status: closed
severity: minor
date: 2026-10-12
importance: Minor
refines: [REQ-0079, BUG-0078]
affects: [seed-matches, find-entities, documents-touching, graph-derived, prose-word-index]
tags: [performance, context, seeding, multi-user, graph-generation, bug-0078]
summary: |
  SEED-MATCHES split every entity's documentation into words and hashed them on
  every query, FIND-ENTITIES compared every name with every token using
  CHAR-EQUAL, and DOCUMENTS-TOUCHING recomputed a document's rank on each
  comparison of a sort. On the shared install one thread answered 9 lexical
  `context' queries a second.
body: |
  Found 2026-10-12 while asking where the time went in BUG-0078's measurement
  of 24 clients on 8 processors. The disk and the hypervisor were idle (iowait 0,
  steal 0.0 to 0.2%, no blocks read) and the CPUs were 88% user. A new script,
  tools/test/profile-context.lisp, runs the :context operation's own call with
  SB-SPROF and reports the garbage collector and the allocation.

  Measured, lexical mode, 200 queries from tools/test/cases/loom-mismatch.json,
  Loom's own tree, one thread, on the development machine: 8.0 to 9.8 queries a
  second, 96 to 118 ms of CPU a query, 37.37 MB allocated a query, 0.44 to 0.61 s
  of garbage collection in the run. BUILD-CONTEXT took 91% of the samples,
  SEED-ENTITIES 63.5% and SEED-MATCHES 61.5%. Under them:

  - PLAIN-WORDS and the hashing under it, 22%. The prose pass walked every
    entity with documentation, split the prose and built a new table of its
    words, for every query. The comment above it said an inverted index was the
    fix.
  - NAME-MATCHES-P through SEARCH, 21.4%, from FIND-ENTITIES with :NAME-LIKE.
    SEED-MATCHES calls it once per token and it compared the token with every
    entity's name using CHAR-EQUAL.
  - DOCUMENTS-TOUCHING, 18%. Its sort called MENTION-RANK in the comparator,
    which walked the document's edges on every comparison.

  Fixed 2026-10-12.

  - The graph has a generation, a counter WITH-GRAPH-LOCK increments when it is
    left however it is left. Every use of that macro is a mutator. GRAPH-DERIVED
    builds a table from the graph holding the lock and keeps it with the
    generation it was built at, so a table is rebuilt once after a change and
    never before.
  - PROSE-WORD-INDEX is the word to entities table, with each entity's position
    in ALL-ENTITIES so that matches come back in the order the walk gave them.
    SEED-MATCHES looks each task token up in it and applies the same stale,
    type and property filters.
  - FIND-ENTITIES with :NAME-LIKE reads the names lowercased once per
    generation and compares with CONTAINS-P, a substring test written for two
    simple character strings.
  - DOCUMENTS-TOUCHING ranks each document once, with the entity ids in a table.

  Witnesses. Oracle tests keep the old SEED-MATCHES in the test file and require
  the new one to return the same entities, ranks and order on 120 generated
  entities for six tasks, with a type filter and with a property filter, and
  after an entity is added, marked stale and removed. They also pass without the
  change, since they assert that the answer did not move. The tests that fail
  without it are the structural ones: the word table is the same object for two
  queries and a new one after a change, GRAPH-DERIVED builds once per
  generation, a failed change still moves the generation, a name search sees a
  name added after the first search, and CONTAINS-P agrees with SEARCH on ten
  strings. The full suite passes 12 of 12.

  Measured after, on the same machine and queries, one thread: after the tables
  and before CONTAINS-P, 23.7 to 24.0 queries a second, 39.3 to 39.8 ms of CPU a
  query, 8.79 MB allocated a query, 0.07 to 0.08 s of garbage collection. With
  CONTAINS-P, 39.9 to 42.4 queries a second and 22.2 to 23.5 ms.

  On the shared install virtual machine (8 vCPUs, 4 cores with 2 threads each):

  - lexical, 1 thread: 9.3 to 33.9 queries a second, 107 to 29.5 ms a query.
  - lexical, 8 threads: 21.0 to 54.3 queries a second. CPU a query was 270 ms
    and is 103 ms, and 5.6 processors were busy.
  - semantic `context' through the service with Ollama, 1 client: 6.3 to 14.4 a
    second, median 156 to 66 ms. 8 clients: 18.7 to 33.8 a second, median 0.41 to
    0.23 s. 24 clients, with BUG-0078's limit of 16 threads and no queue: 572 of
    25,266 requests answered 200, median 0.57 s, 95th percentile 0.65 s and
    slowest 1.01 s (0.93, 1.27 and 1.89 s before).
  - the share of semantic answers containing the expected name was 27.4% and
    27.7% against 27.8% before.

  OUTSTANDING. Eight threads give 1.6 times the throughput of one on a machine
  with 4 cores, and each query costs 3.5 times the CPU it costs alone. Allocation
  is 8.7 MB a query and the collector took 0.62 s of 7.4 s. Neither the cause of
  the scaling nor the memory the tables hold was measured. The name search is
  still a scan of every name for every token, now with the case folded; an index
  of substrings would remove it. One semantic query alone takes 66 ms of which
  Ollama's embedding is about 29 ms.
