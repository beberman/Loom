id: BUG-0021
title: A call to a generic function whose methods come from slot accessors resolves to nothing, and the candidate set it fails to choose from spans unrelated packages
status: open
date: 2026-08-10
refines: [REQ-0020, REQ-0015, PLAN-0014]
affects: [call-targets, callable-index, slot-accessor-names,
          class-definition-entities, make-interface-entity, resolve-calls]
tags: [analyzer, graph, resolution, clos, accessor, package, con-0001,
       game-server]
summary: |
  On game-server a call to `id' produces no :CALLS edge at all -- 144 call
  sites, nothing recorded -- and `describe id' shows no caller. Two defects
  compound. CALLABLE-INDEX keys candidates on (string-downcase name) with no
  package, so mpackage/object's `id' generic, integration-test's unrelated
  `id' and data-api-test's unrelated `id' merge into one six-member candidate
  set. And within a single package one generic function's accessor
  declarations mint one :INTERFACE entity each and no :METHOD entities at all,
  so CALL-TARGETS sees N interfaces, has a clause for exactly one and none for
  N, and returns NIL. Either defect alone would drop the call; together they
  also make the obvious fix dangerous, because fanning N interfaces out as
  dispatch on today's package-blind index would assert edges between packages
  that share nothing but a string.
body: |
  SYMPTOM

  Measured on ~/lisp/game-server, 134 files, 4121 entities, /usr/bin/sbcl,
  2026-08-10, with PLAN-0014's code in the image:

      find id                6 :interface, 0 :function, 0 :method
      describe id            <- contains only; no incoming :CALLS
      impact cascade-delete 3
                             1 impacted: its own file

  Expected: a call to an accessor reaches the accessor. REQ-0015 counted 144
  dropped call sites for `id' and roughly 12 for `cascade-delete'.

  `cascade-delete' fails in a way that is worse than silence. It has a real
  DEFGENERIC at mpackage/obj-types.lisp:134 whose body declares a default
  method, (:method (obj) nil), and an `:accessor cascade-delete' at
  mpackage/reference-types.lisp:104. Loom mints two :INTERFACE entities and
  one :METHOD -- the default. CALL-TARGETS' method clause fires on that single
  method, so every call is attributed to the method that returns NIL and the
  accessor that actually answers receives nothing. The index is not merely
  incomplete here; it points at the wrong implementation.

  CAUSE

  Two independent defects that happen to hit the same names.

  1. CALLABLE-INDEX is package-blind. Candidates are looked up by
     (string-downcase name) (src/graph/resolve.lisp:681), so every definition
     sharing a name string is a candidate regardless of package. On
     game-server `id' is at least three unrelated generic functions:
     mpackage/object's, which mpackage/filter extends by importing the symbol
     -- (:import-from :mpackage/object :name :id) at filter.lisp:14 -- and
     the `id' accessors in :integration-test and :data-api-test, whose
     DEFPACKAGE forms (test/package.lisp:6, data-api/test/package.lisp:6) use
     only :cl :fiveam :utils :cl-json :drakma and friends and import nothing
     from mpackage. Three generics, one candidate set of six.

  2. An accessor-generated generic function is modelled as N unrelated
     protocols. SLOT-ACCESSOR-NAMES feeds MAKE-INTERFACE-ENTITY
     (src/analyzer/lisp-analyzer.lisp:834), so each `:accessor'/`:reader'
     declaration mints its own :INTERFACE and nothing mints a :METHOD. A
     DEFGENERIC mints another :INTERFACE. Nothing relates them. CALL-TARGETS
     has a clause for exactly one interface (line 694) and, after PLAN-0014,
     one for two or more plain functions (line 711); N interfaces matches
     neither and falls to (t nil).

  Either alone drops the call. Both together are why the fix has an order.

  WHY IT HID

  Loom is not a CLOS codebase. It has few generic functions, its accessors are
  mostly DEFSTRUCT accessors -- which are plain functions and resolve fine --
  and all 18 of its ambiguous call occurrences are plain functions. So every
  test ARCH-0014 R8 asked for passes, the ceiling test passes, and 503 green
  tests say nothing about any of this.

  The check that would have caught it existed and was prose. REQ-0015 R6 named
  game-server's `impact cascade-delete 3' as the acceptance criterion, and it
  stayed unrun through an eleven-step plan that verified everything else it
  named, because nothing fails when an unrun criterion stays unrun. It was run
  for the first time on 2026-08-10, after PLAN-0014 was already marked final.

  ARCH-0014 wrote "This is the third time a mechanism has been correct against
  Loom and wrong against game-server." This is the fourth. The recurrence is
  the durable lesson: a design validated on this tree alone has not been
  validated, and the second tree needs to be a step somebody runs rather than
  a sentence somebody writes.

  There is a second lesson worth keeping, about the shape of the misdiagnosis.
  REQ-0015 recorded "`id' has 7 definitions" without recording what kind, and
  every document downstream inherited the framing that these were rivals to
  choose between. The first draft of REQ-0020 accordingly asked for an
  ambiguity fan-out at 1/N -- which would have asserted that five of the six
  candidates are probably wrong, when within one generic function all of them
  are right. A count that does not say what it counted is how a fabricated
  fact gets specified rather than merely written.

  FIX

  Not settled, and it is ARCH-level because it changes how the ontology models
  a generic function. What is settled is the order, and it is the load-bearing
  part of this document.

  The package defect must be fixed first, or not-fixed-but-respected. Minting
  accessors as :METHOD entities so the existing dispatch clause fans them out
  is a small, tempting change that uses machinery already present and already
  correct for dispatch -- and on today's index it would fan a caller in
  mpackage out to :integration-test's test fixture accessor, six edges across
  three unrelated generics, every one fabricated. CON-0001 forbids exactly
  this, and the failure would be invisible in the same way the current one is:
  a plausible number in the right place.

  Resolving unqualified calls by package needs more than ARCH-0013 provides.
  :QUALIFIED-CALLS records a *written* prefix and, as ARCH-0014 noted, nothing
  in resolve.lisp reads it yet -- but these calls are written (id obj), with no
  prefix to read. HANDLE-IN-PACKAGE exists but feeds :SYSTEM, which is a
  different question with a coincidentally similar input.

  HOW A SYMBOL REACHES A PACKAGE

  This is the part that has to be modelled, and it is worth stating exactly,
  because "same name" and "same symbol" are different questions and this whole
  defect is what happens when a tool asks the first and reports the second.

  A symbol is interned in exactly one home package. Every other package that
  can see it sees the same object, and there are exactly three routes:

    1. IMPORT.  (:import-from :mpackage/object :id) makes that package's ID
       accessible here. Same symbol; the home package does not change. This is
       mpackage/filter.lisp:14 and it is why filter's `:reader id' extends
       mpackage/object's generic rather than starting a new one.

    2. INHERITANCE.  (:use :some-package) makes every symbol that package
       EXPORTS accessible here -- and only the exported ones. So resolving a
       name through :use requires the used package's export list, not just the
       fact of the :use. The ontology already has somewhere to put it:
       :PACKAGE carries an :EXPORTS property (code-ontology.lisp:162).

    3. INTERNING.  If neither route makes a symbol of that name accessible,
       reading the name interns a new symbol whose home is the current
       package. It is a different symbol from every same-named symbol
       elsewhere, and a generic function named by it is a different generic
       function. This is :integration-test's `id' (test/package.lisp:6, which
       uses :cl :fiveam :utils :cl-json :drakma and imports nothing from
       mpackage) and :data-api-test's.

  So the assignment rule for a name at a call site is: take the file's current
  package; if the name is imported, the home package is the exporter; else if
  it is inherited through a :use whose target exports it, the home package is
  that target; else the home package is the current package itself. Two
  definitions are the same generic function when their names resolve to the
  same home package, and not otherwise.

  Three complications that are not optional, all of them present in
  game-server:

    NICKNAMES.  mpackage/filter.lisp:7 is (uiop/package:define-package
    :mpackage/filter (:nicknames :mpackage.filter) ...) and line 27 is
    (in-package :mpackage.filter). The declaring name and the using name are
    different strings for one package, so package identity has to canonicalise
    nicknames before anything compares them.

    DEFINE-PACKAGE.  game-server uses uiop/package:define-package rather than
    DEFPACKAGE, which adds clauses CL does not have -- :use-reexport, :mix,
    :recycle -- each of which moves symbols. Handling DEFPACKAGE alone would
    read this tree's packages as having no imports at all.

    SHADOWING.  :shadow and :shadowing-import-from override inheritance, so a
    name accessible by route 2 can still be a different symbol. Rarer, and it
    must not be assumed away silently.

  WHERE THE TRACKING LIVES

  Not wholly in the analyzer, though that is the intuitive place. The analyzer
  is per-file by construction -- path + contents -> operations, never touching
  the graph (RULE-0002) -- and only some of this is a per-file fact.
  mpackage/filter.lisp declares its package in the same file that uses it, so
  one file is enough there. test/fixture.lisp is only (in-package
  :integration-test), and that package is defined in test/package.lisp, so no
  single-file pass can resolve it.

  The split is therefore the one ARCH-0014 already made for definer call
  sites. The analyzer RECORDS the evidence: this file's current package, and
  every DEFPACKAGE / DEFINE-PACKAGE it sees with its nicknames, :use,
  :import-from, :export and shadowing clauses. The graph ASSEMBLES the package
  graph across all files and performs the assignment, because only it has
  every file. ARCH-0014 R4 decided the identical question the identical way --
  "whether a definer call site is orphaned depends on the whole workspace's
  macro registry, which RULE-0002 keeps an analyzer from knowing" -- and a
  second instance of one seam is an argument for the seam.

  WHAT THE FILE WALK MUST CARRY

  Stated concretely, because "track packages" is not yet an instruction.

  The walk must carry the package in effect at each form, and it already does.
  HANDLE-IN-PACKAGE (lisp-analyzer.lisp:1122) is documented as "the only
  handler that changes the walk's state rather than its output": it returns a
  new SYSTEM which threads to every subsequent form, so IN-PACKAGE appearing
  twice in one file already produces two different contexts for the forms
  under each. That is exactly the positional binding environment this needs.
  What it is not is package identity: NORMALIZE-SYSTEM-NAME collapses the
  package to a system name and throws the rest away, so the mechanism is
  present and the information is discarded at the last step.

  So the change is not a new traversal, it is a wider value threaded through
  the existing one, plus one thing carried on the output:

    Every definition and every call name must record the package in effect
    where it was read, not merely the file it was read from.

  :CALL-NAMES today is a list of bare name strings (a call site's :CALL-NAME
  likewise), so a name arrives at RESOLVE-CALLS with no package context and
  nothing downstream can recover it -- the file is not enough, because one
  file can change package mid-way. That is the concrete gap, and it is why the
  fix reaches the analyzer's output format rather than only its internals.

  What a single file CANNOT do is finish the job, and the boundary is exact. A
  file walk can always say which package is in effect; it can only say which
  home package a name binds to when that package's declaration is in the same
  file. So the per-file output is (name, package-in-effect) and the binding to
  a home package is computed in the graph against the assembled package
  graph. A design that tries to resolve bindings during the file walk will
  work on mpackage/filter.lisp, which declares its package inline, and fail on
  test/fixture.lisp, which does not -- which is the same shape of error as
  validating a mechanism on Loom and shipping it against game-server.

  Most of the ontology for this exists and is unused. :PACKAGE
  (code-ontology.lisp:157) has a :QUALIFIED-NAME natural key and an :EXPORTS
  list; :IMPORTS (816) runs :from (:file :module) :to (:file :module
  :package). What is missing is that DEFPACKAGE sits in *DECLARATION-HEADS*
  (lisp-analyzer.lisp:429), the list of forms the Lisp analyzer skips, so no
  :PACKAGE entity is ever minted from Lisp source. Whether symbol-level import
  needs a property on :PACKAGE or a relationship of its own is an open
  modelling question: :IMPORTS as declared is file-and-module grained and
  cannot say "this package imports the single symbol ID from that one".

  THE SEQUENCE

  1. Model package identity and symbol movement, per the three routes above,
     with nicknames canonicalised and DEFINE-PACKAGE handled.
  2. Make CALLABLE-INDEX package-aware, keyed on (home-package, name) rather
     than (string-downcase name). At this point game-server's six `id'
     candidates become three generics of two, one and one, and the candidate
     sets stop being fiction.
  3. Only then decide whether an accessor declaration mints a :METHOD, or
     whether a generic function becomes one entity with several definition
     sites. That is REQ-0020's question and it is answerable once the
     candidate set is true.

  REQ-0020 states what is wanted; this states what is broken and why the cheap
  half of it must not land alone.

  A narrower change that is safe today and worth doing regardless: nothing
  should attribute every call of a generic to a DEFGENERIC's inline default
  method while an accessor method of the same generic goes unreferenced. That
  is cascade-delete's specific wrongness and it does not depend on the package
  question.
