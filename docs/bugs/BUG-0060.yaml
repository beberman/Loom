id: BUG-0060
title: context for a terrain-editor task led with a play-mode class and an archived doc, and returned none of the three files the change edited
status: open
severity: major
date: 2026-08-29
amended: 2026-09-11
priority: p2
refines: [REQ-0026]
affects: [seed-entities, build-context]
tags: [context, recall, seeding, javascript, front-end, req-0026, req-0036,
       fusion, dense-retrieval, req-0048, req-0016]
summary: |
  TRACED 2026-09-11. One failure is still live -- `RenderEngineLeaflet' is not
  seeded -- and the cause is reciprocal-rank fusion, not the lexical ranking.
  The class is lexical rank 4 and fused rank 12. With *SEMANTIC-WEIGHT* at 1.5
  against a lexical weight of 1.0 and *RRF-K* at 60, every candidate on the
  semantic list outranks every candidate that is only on the lexical one, so a
  semantic list as long as the seed limit takes every slot. Rebuilt with no
  vector store, the same task seeds `RenderEngineLeaflet' fourth and the answer
  is right.

  Two of the three failures below are fixed. The body opens with the
  measurement; what follows it is the 2026-09-10 and 2026-08-29 records, each
  kept with its superseded reading marked.

  The task string was "load and hold the map TerrainPartition in
  useLayerEditorState when the active layer is a terrain layer and render faces
  and arcs in RenderEngineLeaflet" (front-end, PLAN-0006 Task 1, 2026-08-29).

  The seed band led with `TerrainLayer` -- a PIXI mesh class in
  `src/ui/play/board/`, the play-mode renderer, unrelated to the terrain
  *editor* -- and with `docs/archive/plan-working-set.md`. The three files the
  change actually edited -- `useLayerEditorDrawing.js`, `RenderEngineLeaflet.js`
  and `partitionModeStyle.js` -- were absent from the bundle. `TerrainPartition.js`
  was a weak mention.

  Every load-bearing noun in the task string -- `renderengineleaflet`,
  `terrainpartition`, `uselayereditorstate`, `faces`, `arcs`, `render` -- came
  back `state: weak`, i.e. matched only in prose, no definition.

  The `LayerEditorState` accessors the bundle did return (`selectMap`,
  `activeMap`, `hasLayer`, source inline) were on target -- VALUE.md records
  them -- but they were a minority of the answer. The rest was found by grep
  and by reading the plan.
body: |
  RE-MEASURED 2026-09-10, AND THE DIAGNOSIS BELOW IS TWO-THIRDS STALE

  The same task string, the same tree, the same budget, run again:

    Fixed. The seed band now leads with six LayerEditorState members from
    `useLayerEditorState.js' -- activePartition, selectMap, activeMap,
    isPartitionLayer, hasLayer and the class -- which is the file the task
    named and the accessors the task was about.

    Fixed by banding. `docs/archive/plan-working-set.md' has dropped out of the
    seed band into `mention', where REQ-0026's bands put prose.

    Still wrong, and demoted rather than gone. `TerrainLayer', the play-mode
    PIXI class, is still a seed, now seventh rather than first.

    Still wrong, and the reason recorded below is FALSE. `RenderEngineLeaflet'
    is absent, and not because the analyzer indexed no definition by that name:
    `find' returns 122 entities for it, including `class RenderEngineLeaflet'
    at src/ui/edit/graphics/rendering/leaflet/RenderEngineLeaflet.js:115 and
    ~120 methods on it. The definitions exist. They are not being chosen.

  WHY IT IS NOT CHOSEN, ISOLATED

  Not a budget cut. The answer reports `seed: {found: 8, sent: 8}' -- the band
  found eight candidates and sent all eight, so nothing was clipped for size.

  Three runs against front-end separate the cause from the task:

    "TerrainPartition and RenderEngineLeaflet"
      -> TerrainPartition.constructor, RenderEngineLeaflet.renderLayer,
         TerrainPartition, TerrainPartition

    "render faces and arcs in RenderEngineLeaflet"
      -> RenderEngineLeaflet.livePartitionUpdate, useDesignScreen,
         RenderEngineLeaflet

    the full task
      -> LayerEditorState.activePartition, .selectMap, .activeMap,
         LayerEditorState, .isPartitionLayer, .hasLayer, TerrainLayer,
         useDesignScreen

  The name seeds on its own and loses every slot in company. Six of the eight
  went to one class and its methods.

  THE MECHANISM: A FAMILY SHARING A PARENT IS CROWDING NOTHING COUNTS

  ADMIT-SEEDS charges a candidate two ways, and its docstring gives the
  reasoning for both: a slice -- the set of terms a seed answers to -- may
  contribute *SEED-TERM-SHARE* (2) distinct names, and a name may be
  *SEED-NAME-SHARE* (3) entities. The second half of that docstring is the
  argument this defect extends: "Exempting anything that answered to more than
  one term let five members of the CHECK-DATABASE-* family take five of eight
  slots ... A family sharing a slice is the same crowding as a family sharing a
  word."

  A method family shares neither. `LayerEditorState.activePartition',
  `.selectMap', `.activeMap', `.isPartitionLayer' and `.hasLayer' are five
  distinct names answering five different slices -- {active, partition}, {map},
  {active, map}, {layer, partition}, {layer}. Neither cap fires, both are
  behaving as designed, and one class takes six of eight slots.

  So the crowding rule needs a third charge, keyed on the definition's owner:
  a family sharing a *parent* is the same crowding as a family sharing a slice.

  WHAT MUST NOT BE DONE ABOUT IT BLIND

  Every constant in SEED-SCORE and ADMIT-SEEDS was measured rather than
  reasoned to, against the 450-case known-item harness -- DES-0033, DES-0036
  and REQ-0016 R7 and R8 each record a change that looked obviously right and
  moved the score the wrong way, and DES-0036 built a weighting that measured
  at exactly the two numbers it set out to beat. A third cap is a change of the
  same kind and belongs behind `tools/test/recall.py' and
  `tools/test/acceptance.py', not behind an argument.

  The measurement to beat is stated so the next attempt does not have to
  re-derive it: fe-1 (WorkingSet) and fe-10 (SaveDesign) are the two front-end
  cases PLAN-0039 S3 lost when MATCH-COVERAGE replaced (LENGTH MATCHES), and
  any owner-cap has to hold them.

  WHAT LANDED, 2026-09-10: THE THIRD CHARGE

  *SEED-OWNER-SHARE*, 3, and SEED-OWNER beside it. A candidate whose name
  spells a parent -- everything before the last dot -- is charged to that
  parent, and a family may hold three of the eight slots. NIL for a :FILE and a
  :DOCUMENT, whose dots are extensions, and NIL for any name with no dot, so
  the cap is inert on a Lisp-only tree rather than guessing at a family nobody
  spelled. A NIL owner is uncharged rather than sharing one bucket, which would
  cap every unqualified name in a tree against every other.

  Measured, and the point of measuring was that it might not be neutral:

    recall.py, 450 known-item cases   435/450 strict, 436/450 lenient
                                      -- identical before and after
    acceptance.py                     33/44 strict, 39/44 lenient
                                      -- identical, three absence cases still absent
    the full FiveAM suite             11 of 11 systems

  On the reported task, the LayerEditorState family fell from six of eight
  slots to four -- three methods plus the class, which carries no dot and is
  therefore uncharged. The two freed slots went to `useLayerEditorState' and
  `TerrainPartition', and `terrainpartition' moved from `weak' to `answered'.

  MEASURED 2026-09-11: DENSE RETRIEVAL TAKES THE WHOLE HEAD OF THE LIST

  The stated cause below -- "it ranks below the eight that were taken" -- is
  false. `RenderEngineLeaflet' is lexical rank 4 of the whole candidate set,
  score 600. It is fused rank 12.

  Traced through SEED-ENTITIES against front-end with the vector store bound
  the way LOOM-SERVE binds it. The two lists FUSE-RANKINGS was given:

    LEXICAL, first 8          SEMANTIC, all 8 (cosine)
    1 useLayerEditorState     1 LayerEditorState.selectMap         0.757
    2 TerrainPartition        2 LayerEditorState.activePartition   0.750
    3 TerrainPartition (var)  3 LayerEditorState.isPartitionLayer  0.747
    4 RenderEngineLeaflet     4 LayerEditorState.hasLayer          0.745
    5 RE-Leaflet.renderPart.  5 LayerEditorState.activeMap         0.738
    6 RE-Leaflet.livePart.    6 useDesignScreen                    0.732
    7 growMap                 7 LayerEditorState                   0.720
    8 resizeMap               8 TerrainLayer                       0.714

  The fused order puts all eight semantic candidates above all eight lexical
  ones. That is arithmetic, not a close call: RRF scores a candidate
  w/(*RRF-K* + rank), *SEMANTIC-WEIGHT* is 1.5 and the lexical weight is 1.0,
  so a semantic candidate at rank 8 scores 1.5/68 = 0.0221 and a lexical
  candidate at rank 1 scores 1.0/61 = 0.0164. With *RRF-K* at 60 the rank
  spread inside a list of 8 is worth far less than the weight between the two
  lists. Any candidate on the semantic list outranks every candidate that is
  only on the lexical one.

  So when the semantic list is as long as the seed limit, it takes every slot,
  and lexical gets in only where a cap holds dense back. That is what happened:
  *SEED-OWNER-SHARE* held the LayerEditorState family to four of eight, and the
  two freed slots went to fused 9 and 10 -- `useLayerEditorState' and
  `TerrainPartition'. `RenderEngineLeaflet' at fused 12 was two places past the
  reach of the freed slots.

  WITHOUT A VECTOR STORE THE ANSWER IS RIGHT

  The same task, the same tree, the same limit, indexed by WATCH-REPOSITORY
  with no store built, so SEMANTIC-CANDIDATES returns NIL and FUSE-RANKINGS
  returns LEXICAL unchanged:

    useLayerEditorState, TerrainPartition, TerrainPartition, RenderEngineLeaflet,
    RenderEngineLeaflet.renderPartition, RenderEngineLeaflet.livePartitionUpdate,
    growMap, resizeMap

  Four of the eight are the two classes the task named and their methods. This
  is not a defect in the lexical seeder, in SEED-SCORE, or in the owner cap. It
  is dense retrieval displacing an exact name match.

  THE MECHANISM THAT WOULD PREVENT IT IS BUILT AND SWITCHED OFF

  FUSE-RANKINGS takes PROTECTED and gives each of them a 1.0 bonus against a
  reciprocal-rank sum that cannot exceed about 0.04 -- a band, not a weight.
  Its docstring names this exact failure: "grep would find MAPPER.TONATIVE for
  `mapper to native'. A retrieval mechanism that does worse than grep on a query
  naming a thing has not earned the right to rank it."

  SEED-ENTITIES computes PROTECTED as (WHEN *PROTECT-NAMED* NAMED), and
  *PROTECT-NAMED* is NIL. So the band never fires. That is deliberate and
  measured -- its docstring records 433/38/42 for "guaranteeing them a slot
  without a place" against 443/39/43 -- and the reason is that NAMED-BY-TASK-P
  calls far too much named: on "segment terrain into region polygons" it fires
  on SEGMENT, and protecting a set that large displaces candidates that were
  being found.

  *SEMANTIC-WEIGHT*'s own docstring records the same trade from the other side:
  at equal weight, known-item reached 448 of 450 and lost none of the eleven
  exact-name cases REQ-0048 R2 protects; at 1.5 it is 443, and buys 10 cases on
  the mismatch family. `RenderEngineLeaflet' is one of the five that 1.5 costs.

  WHAT IS ACTUALLY MISSING

  A predicate that separates `renderengineleaflet' from `segment'. Both are
  words the caller wrote and both match a name at rank 0, so NAMED-BY-TASK-P
  cannot tell them apart. TASK-TOKEN-ORIGINS cannot either: it splits on `-'
  and `_' only, so `renderengineleaflet' has no parts and is its own origin.

  One candidate discriminator is already computed and thrown away.
  SEED-MATCHES returns FREQUENCIES -- per token, how many entities
  FIND-ENTITIES reached -- and SEED-SCORE declares it IGNORE. A transcribed
  identifier reaches entities in one file (`renderengineleaflet' reaches 122,
  all of them RenderEngineLeaflet.js and its methods); an English word reaches
  entities scattered across the tree. Files touched, rather than entities
  matched, is the shape of that measurement, and it is not the count
  FREQUENCIES holds today.

  This is a ranking change and belongs behind `tools/test/recall.py' and
  `tools/test/acceptance.py', with the floor the section below states: fe-1
  (WorkingSet) and fe-10 (SaveDesign) must hold.

  The trace above is `tools/test/seed-trace.lisp', written for this and kept.
  It prints the two lists, the fusion and the caps for one task against one
  tree, which is what settles whether a bundle came back wrong because of the
  analyzer, the lexical score, the fusion or a cap. Run it before arguing from
  a bundle:

      sbcl --script tools/test/seed-trace.lisp /home/beberman/github/front-end \
        load and hold the map TerrainPartition in useLayerEditorState ...

  STILL OPEN, AND THIS BUG STAYS OPEN FOR IT

  `RenderEngineLeaflet' is still not seeded. The 2026-09-10 reading of why
  follows and is superseded by the measurement above: it does not rank below
  the eight, it ranks fourth lexically and twelfth after the fusion.

  WAS: "two candidates that look identical to the scoring rank either side of
  the cut, and the reason is not yet known. What would answer it is the score
  of each, not another experiment on the bundle." That was the right
  instruction and it was followed. They do not rank either side of the cut:
  `RenderEngineLeaflet' scores 600 and `TerrainPartition' scores 600, they are
  lexical ranks 4 and 2, and both are above the cut in the lexical list. The
  fusion is what separates them -- `TerrainPartition' is fused 10 and reached a
  slot the owner cap freed, `RenderEngineLeaflet' is fused 12 and did not.

  Tuning *SEED-OWNER-SHARE* down to 2 to make this one case pass is refused --
  it would be fitting a constant to one anecdote, which is what DES-0033 and
  DES-0036 each record going wrong. So is tuning *SEMANTIC-WEIGHT* down to 1.0
  for it: its own docstring records what that costs on the mismatch family.

  THE ORIGINAL DIAGNOSIS, 2026-08-29, KEPT FOR WHAT IS STILL TRUE
  THREE DISTINCT FAILURES

  1. A NAME COLLISION PROMOTED THE WRONG SUBSYSTEM. "terrain" and "layer" in
     the task string matched `TerrainLayer`, a play-mode PIXI class, and it
     led the seed band. The task is about the terrain editor. Nothing in the
     bundle's ranking separated `src/ui/play/board/` from the editor modules,
     though the task names editor identifiers (`useLayerEditorState`,
     `RenderEngineLeaflet`) that share no directory with the play board.

  2. AN ARCHIVED DOCUMENT LED THE BAND. `docs/archive/plan-working-set.md` is
     superseded working notes. It is indexed by the markdown analyzer with the
     same weight as a live document -- the claim rules in CLAUDE.md exclude
     dot-directories, `templates/` and `CLAUDE.md`/`AGENTS.md` by name, and say
     nothing about `archive/`. A `completed/` document is filed but still
     indexed; an `archive/` document should rank below a live one at least, and
     arguably should not seed a task bundle at all.

  3. THE EDITED FILES WERE NOT IN THE BUNDLE. `useLayerEditorDrawing.js`,
     `RenderEngineLeaflet.js` and `partitionModeStyle.js` -- the diff of the
     change -- did not appear in any band. `RenderEngineLeaflet` is named
     verbatim in the task string. That it resolved `state: weak` says the JS
     analyzer indexed no definition by that name in that file: either the file
     exports a default with no bound name, or the class/function it defines is
     spelled differently from the file, or the analyzer did not claim it. A
     `context` seeded from `find`-strength matches cannot recover a file whose
     defining name `find` does not see.

  WHERE TO LOOK

  `seed-entities` (src/knowledge/context.lisp:1397) builds the seed set from
  term matches; `build-context` (src/knowledge/context.lisp:1732) bands and
  budgets them. The weak-term handling is `weak-term-p` and the coverage band
  is `seed-score` -- but the primary question here is upstream of ranking: the
  load-bearing nouns produced no strong match to rank. That points at JS
  analyzer coverage in front-end (are `RenderEngineLeaflet.js` and
  `useLayerEditorDrawing.js` yielding definitions?) more than at the context
  scorer.

  REPRODUCTION

  Against a current front-end index:

      context load and hold the map TerrainPartition in useLayerEditorState
      when the active layer is a terrain layer and render faces and arcs in
      RenderEngineLeaflet

  Expected: the bundle names `useLayerEditorState.js` /
  `useLayerEditorDrawing.js`, `RenderEngineLeaflet.js` and the partition-style
  module. Actual: `TerrainLayer` and `docs/archive/plan-working-set.md` lead;
  the three files are absent.

  RELATION TO OTHER WORK

  REQ-0036 measures seeding against a scored corpus; this is a case that corpus
  would catch if front-end tasks were in it. REQ-0060 is the same concern for
  Loom's own prose. This bug is the front-end instance and its first cause
  (analyzer coverage) is not something a ranking change fixes.

  NOT IN SCOPE

  Whether `context` should read the plan text directly. The task string came
  from a plan; the plan named the files; `context` seeded from the string and
  missed them. Feeding it the plan is a different requirement, not this fix.
