id: BUG-0011
title: A function quotation is never recorded as a call name, so a callee reached only through #'f has no incoming edge
status: closed
date: 2026-08-06
refines: [PLAN-0009]
affects: [collect-call-names]
tags: [analyzer, lisp, calls, blind-spot]
summary: |
  COLLECT-CALL-NAMES records a symbol only when it sits in operator position.
  `#'f' reads as (FUNCTION F), whose operator is FUNCTION and whose only tail
  element is the bare symbol F in an argument position, so the name F is
  dropped. Every callee designated rather than called -- (apply #'make-selector
  args), (mapcar #'render items), (sort xs #'string<), a callback stored in a
  slot -- therefore has no incoming :CALLS edge from the code that reaches it.
  Found while measuring PLAN-0009 against ~/lisp/game-server: ARCH-0010 R7 and
  REQ-0012's prose both expect the DHANDLER-DELETE inline method to record a
  call to MAKE-SELECTOR, and it does not, because the source writes
  (apply #'make-selector args). Filed rather than fixed, deliberately: the fix
  moves :CALLS totals on both codebases, which would have confounded the very
  delta PLAN-0009 step 8 existed to measure.
body: |
  SYMPTOM

  A function named only through a function quotation is invisible in the
  outgoing direction. `describe' on the caller does not list it under
  -> calls, `describe' on the callee does not list the caller under <- calls,
  and `impact' on the callee never reaches the caller -- which is the one that
  costs something, because impact's whole purpose is to answer "what breaks if
  I change this" and a callback's callers are exactly the answer nobody can
  reconstruct by reading the callee.

  Measured, /usr/bin/sbcl, 2026-08-06, against game-server's
  data-api/handler.lisp:158-166, the inline (:method ...) clause on
  DHANDLER-DELETE. Its body contains all three of MAKE-SELECTOR,
  DHANDLER-DELETE-ALL and DHANDLER-DELETE-SELECTOR. The analyzer records:

      :call-names ("dhandler-delete-selector" "dhandler-delete-all" "selector")

  MAKE-SELECTOR is absent. The source writes it as (apply #'make-selector
  args); the other two are written as ordinary calls. ("selector" is present
  and is a separate, pre-existing imprecision: it is the head of a LET binding
  pair, which the walk cannot tell from an operator.)

  CAUSE

  src/analyzer/lisp-analyzer.lisp, COLLECT-CALL-NAMES. The walk pushes
  (token-name head) only for the head of a form, and recurses into the tail as
  forms in their own right:

      (when (symbolp head) (push (token-name head) names))
      ...
      (loop for tail = (cdr form) then (cdr tail)
            while (consp tail)
            do (walk (car tail)))

  #'make-selector reads as (FUNCTION MAKE-SELECTOR). Its head is FUNCTION, so
  "function" is pushed and then filtered out by STANDARD-OPERATOR-P. Its tail
  is the single element MAKE-SELECTOR, a bare symbol -- and WALK returns
  immediately on a non-cons, because an argument-position symbol is a variable
  reference, not a call. That refusal is correct in general and wrong for this
  one operator: FUNCTION is the form whose argument position holds a name
  rather than a value.

  Note this is narrower than it may look. The head-only discipline is not the
  defect and must not be relaxed: walking every tail symbol as a call is what
  used to make (repo-graph r) claim a call to r, and COLLECT-CALL-NAMES's own
  docstring records why that became harmful once dispatched calls fan out to
  every candidate method. The defect is one missing special case, not a policy.

  WHY IT HID

  The names it drops are precisely the ones a reader would not think to look
  for. A missing edge is invisible by construction -- nothing reports "this
  entity has fewer callers than it should" -- and the check a person actually
  performs is to `describe' a function they were already thinking about and
  see plausible output. #' sites are a minority of call sites in both trees,
  so nothing ever looked empty.

  No test covers a function quotation. src/analyzer/test/lisp-analyzer.lisp
  exercises ordinary calls, foreign package prefixes, quoted data and macro
  templates; not one of its sources contains #', so the gap was never one
  assertion away from being noticed.

  It also survived a design review that was looking straight at it. ARCH-0010
  R7 makes MAKE-SELECTOR an acceptance criterion in so many words -- it is the
  one document that requires the name, and REQ-0012 does not: its R5 asks for
  DHANDLER-DELETE-ALL and DHANDLER-DELETE-SELECTOR, and MAKE-SELECTOR appears
  only in its prose, describing what the method's body contains. Both
  statements were written from reading the source rather than from running the
  analyzer over it, and a criterion is the more expensive of the two to get
  wrong, because it is the thing an implementer is later asked to satisfy.
  PLAN-0009's R-5 is where source and analyzer were finally compared.

  FIX

  Record the argument of a FUNCTION form as a call name: in WALK, when the head
  is a symbol whose TOKEN-NAME is "function" and the tail's single element is a
  non-keyword symbol, push that element's TOKEN-NAME. The same filters already
  applied to every other name -- STANDARD-OPERATOR-P, READER-ARTIFACT-P,
  self-recursion -- then apply unchanged, so #'string< contributes nothing and
  #'make-selector contributes one name.

  Two things to settle before writing it:

  (setf f) as a function quotation. #'(setf foo) reads as (FUNCTION (SETF
  FOO)), whose tail element is a cons rather than a symbol. DEFINITION-NAME
  already renders that shape as "(setf foo)", which is the same string a
  DEFMETHOD (setf foo) is named by, so the name is recoverable -- decide
  whether to record it rather than leaving it to fall out of an unconsidered
  SYMBOLP test.

  #'(lambda ...) reads as (FUNCTION (LAMBDA ...)). There is no name to record
  and the lambda's body must still be walked for the calls inside it, which the
  existing tail recursion already does. A fix that pushes the tail element
  unconditionally would record "lambda" as a callee.

  MEASUREMENT OBLIGATION

  This changes :CALLS on every indexed tree, so whoever fixes it owes a before
  and after count on both codebases, in the shape PLAN-0009 step 8 used. The
  baselines to compare against, taken 2026-08-06 with inline DEFGENERIC methods
  landed:

      Loom          :calls 2666
      game-server   :calls 7242

  Fixing this inside PLAN-0009 was refused for exactly that reason: it would
  have moved both numbers in the same commit that was measuring what inline
  methods contributed, and neither effect could then have been attributed.

  RESOLUTION

  Closed 2026-08-08 by PLAN-0011, which added one clause to COLLECT-CALL-NAMES
  inside WALK: when a form's head is a symbol whose TOKEN-NAME is "function"
  and the form has exactly one argument, record that argument's name if it is
  a non-keyword symbol, or the DEFINITION-NAME rendering if it is exactly
  (setf <non-keyword-symbol>). Nothing else in the walk changed; the head-only
  discipline stands.

  WHAT IS DISCHARGED AND WHAT IS NOT

  This section is deliberately not a claim that the SYMPTOM above is gone. Two
  of the three shapes it names are discharged and the third is not.

  Discharged:

    (apply #'make-selector args)      -- game-server's DHANDLER-DELETE, the
                                         case that motivated the filing.
    (mapcar #'render items)           -- and equally (sort xs #'less-p): a
                                         quotation anywhere inside a body that
                                         reaches COLLECT-CALL-NAMES.

  NOT discharged: "a callback stored in a slot". The clause cannot reach it,
  because the designator never arrives at COLLECT-CALL-NAMES in the first
  place. ANALYZE-FILE hands NOTE-DEFINITION no :body for DEFVAR, DEFPARAMETER,
  DEFCLASS or DEFINE-CONDITION, and a DEFUN's body is (cdddr form), which
  excludes the lambda list -- so an initform designator and a lambda-list
  default designator are both invisible, and no wording of this clause changes
  that. Live evidence in this tree: src/serve/json.lisp:76 writes
  (defparameter *json-key-name* #'default-json-key-name ...) and
  `describe default-json-key-name` still reports zero incoming :CALLS after the
  fix. That residue is BUG-0017, filed the same day, and the honest reading of
  this bug is that its SYMPTOM section named three cases and its FIX section
  addressed two -- which nobody noticed until PLAN-0011's review.

  THE TWO SHAPES THIS BUG LEFT UNSETTLED

  #'(setf f) is recorded, as the string DEFINITION-NAME renders -- "(setf f)",
  the same string a DEFMETHOD (setf f) is named by, so the callable index can
  match it. The guard is exact: the cons must be (setf <non-keyword-symbol>)
  and nothing longer, shorter or dotted.

  #'(lambda ...) records no name and is still walked for the calls inside it,
  by the pre-existing tail loop, unchanged.

  THE MUTATION THAT MADE THE GUARD TEST MEAN SOMETHING

  PLAN-0011 R-2 observed that the hazard this bug warned about -- "a fix that
  pushes the tail element unconditionally would record lambda as a callee" --
  was already neutralised downstream, because TOKEN-NAME of (LAMBDA ...) is
  "lambda" and both consumers filter through STANDARD-OPERATOR-P. The real
  hazard was the setf branch. Implemented unguarded, as
  (push (definition-name designator) names) for any cons, the lambda test went
  red with the fabricated name

      "(lambda item helper)"

  recorded on :CALL-NAMES -- a string no filter removes, that resolves to
  nothing, and that would have sat in :UNRESOLVED-CALLS indefinitely (CON-0001).
  That observation is the only reason the guard test asserts anything; it
  passes both with and without a correct fix.

  MEASUREMENT OBLIGATION, DISCHARGED

  All figures /usr/bin/sbcl, 2026-08-08. The unenriched censuses each ran in a
  fresh process calling WATCH-REPOSITORY and never ENRICH-REPOSITORY (PLAN-0011
  R-3).

  The cheapest acceptance criterion, and the one that cannot be true for any
  other reason: INTERN-FOREIGN-SYMBOL-LOCALLY (lisp-analyzer.lisp:49-71) is
  called in operator position nowhere in the tree and is installed as a handler
  at lines 104 and 189.

      incoming :CALLS   0 -> 2   (read-forms-with-spans, element-spans)

  Loom, unenriched:

      :calls   +79 against PLAN-0011 step 3's attributable baseline -- the
               census with the plan's new tests present and the production
               change absent, which is what makes the delta attributable to
               one edit rather than to the new test file's own harness
               quotations (PLAN-0011 R-4).
      entities unmoved. This change records names; it mints nothing, and an
               entity count that had moved would have been a defect.

  This bug's own 2026-08-06 reference figure of :calls 2666 is not the
  comparison and was never expected to be: PLAN-0010 landed between the two
  dates and the tree has gained files since.

  game-server, unenriched:

      :calls   7242 -> 7314, +72.

  The +72 is wholly attributable, which is more than this bug's MEASUREMENT
  OBLIGATION asked for and worth recording as method: game-server had not been
  re-indexed since 2026-08-06, so the delta could have been the tree moving
  rather than the fix. It was told apart by re-taking the census with the new
  clause disabled, which came out byte-identical to the 2026-08-06 figure of
  7242. The tree had not moved.

  Loom, enriched (separate process, primary unit set, INCLUDE-TEST-UNITS
  defaulted to NIL as PLAN-0010's recorded run used):

      :CALLS (:introspected)              215 -> 194
      :CALLS (:structural :introspected)  768 -> 790

  21 edges left the image-only bucket, which is the migration this fix
  predicts: an edge reachable only through #' could previously have been seen
  by xref alone. The confirmed bucket rose by 22 rather than 21; the extra edge
  is not accounted for by migration and was not chased. As PLAN-0011 said in
  advance, the image-only bucket does not go to zero, because it also holds
  calls xref sees for reasons unrelated to #' -- funcall on a symbol, a call
  inside a macro expansion, and everything ARCH-0001 records as unattributable.

  WHAT THIS CLOSES ELSEWHERE

  ARCH-0010 R7's acceptance criterion -- MAKE-SELECTOR among DHANDLER-DELETE's
  call names at game-server data-api/handler.lisp:158-166 -- is met. It was the
  one criterion PLAN-0009 could not satisfy and the reason REQ-0012 is
  `partial`; REQ-0012's OUTSTANDING item 2 now records it as closed. Item 1,
  describe's same-name tie-breaking, is untouched and still open.

  ONE CONSEQUENCE, RECORDED RATHER THAN SUPPRESSED

  `status`'s tested-unit count rose from 298 to 302, because a :TEST entity's
  :CALLS now include the subject of a (mapcar #'accessor ...) in an assertion.
  Three of the four are ordinary accessors; the fourth, CONCURRENCY-TEXT-P, is
  a private helper defined in the test file that reaches it. PLAN-0011 R-5
  reserved the right to file a bug on seeing the number, and one was filed --
  BUG-0018 -- but note what it is and is not about: this fix added an instance
  of a pre-existing class rather than a new class. STRESS-COUNTS, in the same
  test file, has always shown `<- tests` by the ordinary head-only path.
