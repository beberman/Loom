id: BUG-0054
title: budget counts the bundle's content and not the JSON around it, so a caller that asked for 6000 tokens received 62363 characters and the client refused them
status: open
severity: major
date: 2026-08-27
refines: [REQ-0040]
affects: [build-context, estimate-tokens, encode-result]
tags: [req-0040, context, budget, mcp, envelope, front-end]
summary: |
  `loom_context` with `budget=6000` against front-end returned `tokens: 3692` --
  inside the budget, nothing withheld for size -- in 62,363 characters of JSON.
  The MCP client refused the message and spilled it to a file.

  17 characters per counted token, against the four characters a token usually
  spells. The envelope is three quarters of the payload: each of the 114 `items`
  carries eleven keys and its nested `entity` nine more, most of them NIL or
  constant -- `language` on every row of a single-language tree, `confidence: 1`
  throughout, `referrer-kind` and `stale` null everywhere.
body: |
  WHAT REQ-0040 R1 ASKED FOR

  The call site quotes it: "an MCP caller has a hard output limit and until now
  no way to say so". The knob exists for one purpose, and the purpose is not met
  -- the limit is on the bytes that arrive and the budget is on the content
  inside them, so a caller can be inside its budget and over its limit at the
  same time, which is the state that was measured.

  REQ-0040's own OUTSTANDING section does not cover this. What remains open
  there is R2, the source share, which is a verdict about *how* the budget is
  divided. This is about what the budget counts.

  THE TWO REPAIRS, AND THEY ARE NOT EXCLUSIVE

  F1  COUNT THE RENDERED ANSWER

  The budget is charged against the bytes the caller receives rather than the
  summaries inside them. This is the honest reading of R1 and it makes the knob
  do what its docstring says. The cost is that the count now depends on the
  skin: a console bundle and a JSON bundle of the same content are different
  sizes, and the budget would have to be charged after rendering rather than
  during the walk, which is where the truncation decision is currently made.

  F2  A LEAN SHAPE THE CALLER CAN ASK FOR

  `verbose=false`, dropping null fields and the per-item scoring metadata --
  `cost`, `via`, `direction`, `convergence`, `effective-cost`,
  `relation-count`. Those exist for judging the ranking, which is REQ-0036's
  purpose and not the reading agent's. On the measured bundle that would have
  fit inside any limit without losing a single entity, which is the outcome
  worth having: a caller that hits a limit today loses the whole answer, and the
  entities were never the expensive part.

  F2 is cheaper and lands first. F1 is what makes the budget mean what it says.

  A THIRD OPTION, REJECTED HERE

  Lowering the default budget does not help. The ratio is the defect: at 17
  characters per counted token any budget a caller picks is wrong by a factor
  they cannot see, and a smaller default trades an overflow for a bundle that
  withholds entities it did not need to.

  NOT IN SCOPE

  How the budget is split between the index and source tiers. REQ-0040 R2 owns
  it and is open.

  Whether the scoring metadata should exist. It should -- REQ-0036 reads it.
  This is about who is charged for carrying it.
