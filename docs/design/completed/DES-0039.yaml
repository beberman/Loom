id: DES-0039
title: "REQ-0047 as propose-and-check: a model writes the query, a Lisp checker rejects it against Loom's own tokenizer, and what survives is frozen"
status: implemented
date: 2026-08-22
refines: [REQ-0047]
affects: ['tools/entity-dump.lisp']
tags: [retrieval, measurement, instrument, paraphrase, req-0047, req-0036]
summary: |
  The family cannot be generated by a program -- a paraphrase is the one thing
  tools/make-cases.py cannot derive from a name and a docstring. It can be
  *checked* by one, and that is where the guarantee comes from: a model
  proposes a query, and a Lisp checker calls TASK-TOKENS on both sides and
  rejects any case sharing a searchable token with the entity it names.

  Measured before the design was written: twelve hand-written mismatch queries
  score 3 of 12 against the seeder as it stands. REQ-0047's open question is
  answered -- the bar is not 0 by construction -- and the three that hit did so
  through the neighbour band rather than through a seed, which is the only
  route a disjoint query has.

  One of the twelve turned out not to be disjoint at all. It was checked by eye
  against the truncated docstring tools/entity-dump.lisp keeps, and the entity's
  full :DOCUMENTATION carried the word. That is the design in one failure: the
  check has to be a program, and it has to read what Loom indexes.
body: |
  D1  THE CHECKER IS LISP, BECAUSE IT MUST CALL TASK-TOKENS AND NOT A COPY

  Disjointness is over the tokens Loom searches on, which is TASK-TOKENS'
  output and nothing else. That function splits compounds, keeps the whole and
  the parts, drops stopwords, and adds stem variants through DES-0035's
  generate-and-gate pair. "merging" reaches the index as "merge";
  "compose-view" reaches it as "compose-view", "compose" and "view".

  A Python reimplementation would be a second copy of that, and it would be
  wrong the day the first one changes -- which it did twice today, once for
  BUG-0042's weak terms and once for the stopword list itself. So the checker
  is a script that loads loom-knowledge and calls the function, the way
  tools/entity-dump.lisp already loads loom-workspace.

  This is the same shape as DES-0035, where four suffix rules generate and
  Porter decides whether to believe them, and it is the shape for the same
  reason: the generator is the half that cannot be made trustworthy, so the
  trust is placed in the half that can.

  D2  WHAT IS COMPARED, AND WHY THE TWO SIDES USE DIFFERENT TESTS

  The query goes through TASK-TOKENS. What each token is then compared against
  is whatever SEED-MATCHES compares it against, which is not the same thing on
  the two sides:

    against the name    substring, case-insensitive. FIND-ENTITIES :NAME-LIKE
                        is NAME-MATCHES-P, which is (SEARCH pattern name :test
                        #'CHAR-EQUAL). So `editor' reaches PIECETYPEEDITORSTATE
                        and `part' reaches PARTITIONARC.

    against the prose   whole word. The prose pass builds a word set with
                        PLAIN-WORDS and asks GETHASH, which DES-0028 D4 chose
                        deliberately: substring-matching "test" against 549 KB
                        of English finds "latest" and "contest".

  Token equality on both sides was this design's first draft and it was wrong.
  TASK-TOKENS splits on separators and does not split camelCase, so
  PIECETYPEEDITORSTATE is one token and a query saying `editor' would have read
  as disjoint while reaching the entity at MATCH-RANK 2. A check that does not
  mirror the matcher is a check that certifies the wrong thing.

  Three further details, two of which the probe got wrong by hand:

    The whole documentation, not its first line. tools/entity-dump.lisp keeps
    FIRST-SENTENCE, on the reasonable grounds that a docstring's first line is
    its summary. A mismatch check needs the rest as well: the probe's
    `make sure a match already exists in storage before writing children'
    was disjoint from GAME-SYSTEM-ENSURE-PERSISTED's first line and is not
    disjoint from the entity. The dump grows a full-text field for this.

    Every entity of that name, not one. Recall is scored on the name, so a case
    is satisfied by any entity carrying it; a query sharing a token with a
    same-named sibling in the same repository is answerable lexically, whatever
    the one it was written from says. The check is over all of them.

    An expected name no entity carries is rejected, not passed. Such a case is
    trivially disjoint from everything and can never hit, and recall.py scores
    a name, so a typo would sit in the family forever looking like a hard
    question.

  D2a  WHY A WEAK-TERM OVERLAP IS REJECTED TOO

  BUG-0042 would license a laxer rule. A candidate whose every matched term is
  weak is dropped by STRONG-CANDIDATES, so a query overlapping an entity only
  on `get' cannot seed it, and the case is arguably still a mismatch.

  Rejected anyway, and the reason is that the family is frozen and
  *CONTEXT-WEAK-TERMS* is not. A case file whose disjointness holds only while
  a list keeps sixteen particular words in it is a case file that stops meaning
  what it says the next time someone measures that list -- which happened twice
  today. The strict rule costs some legitimately hard queries and buys a
  property that survives the mechanism changing underneath it.

  What is *not* compared: the file path, and the neighbours' names. A path
  component match is MATCH-RANK 3 and SEED-MATCHES drops it, so a shared path
  word reaches nothing. A neighbour's name is the mechanism under test -- the
  neighbour band is how a disjoint query scores at all, and excluding cases
  whose answer has a reachable neighbour would delete exactly the signal.

  D3  THE GENERATOR IS A MODEL, AND THE RECORD IS WHAT REPLACES REPRODUCIBILITY

  There is no DeepSeek key on this machine and no local embedder; the model
  that writes these queries is the one in the session. REQ-0047 R8 asks for the
  provenance and it goes in tools/cases/mismatch.md, beside the case file:
  what wrote them, on what date, from what dump, under what instruction.

  A sidecar rather than a header object inside the JSON, because REQ-0047 R4
  says tools/recall.py reads the file unchanged and that harness iterates the
  array it is given. A header would be a format change to every case file in
  the directory in order to document one of them. The sidecar is markdown under
  tools/, which REQ-0028 claims wherever the repository keeps it, so the
  provenance is an indexed document rather than a comment nobody can query.

  A reader who distrusts the family cannot re-derive it from a seed the way the
  other three families re-derive from tools/make-cases.py. What they can do is
  read the instruction, read the rejects, and re-run the checker -- which is a
  weaker guarantee honestly labelled, and is what CON-0001 asks for in place of
  a stronger one that would not be true.

  D4  THE PIPELINE

      sbcl --script tools/entity-dump.lisp <repo>     name, type, file, doc
      -- a model writes candidate queries from the dump --
      sbcl --script tools/mismatch-check.lisp         rejects what is not disjoint
      tools/cases/mismatch.json                       what survived, frozen
      tools/recall.py tools/cases/mismatch.json       the same harness

  Four files, one of them new. tools/recall.py is untouched: REQ-0047 R4 asks
  for the four-tuple it already reads, and a family that needs a second harness
  is a family whose numbers cannot be put beside the others.

  The checker reports kept and rejected separately and prints each reject with
  the token that killed it. A generator producing 200 candidates for 100 cases
  is a measurement of how hard writing a mismatch is, and REQ-0047 R2 asks for
  it; a reject nobody can see the reason for is a number nobody can act on.

  D5  THE BAR, MEASURED BEFORE THE FAMILY EXISTS

  Twelve hand-written queries against the seeder as it stands after BUG-0041
  and BUG-0042, on 2026-08-22:

      strict 3/12, lenient 3/12

      hit    make sure a match already exists in storage before writing
             children                        GAME-SYSTEM-ENSURE-PERSISTED
      hit    the vertex at the opposite side of a boundary segment
                                             PARTITIONARC.OTHERNODE
      hit    open a link to the store where records live
                                             CONNECTION-CONNECT-DATABASE

  The first is the one that was not disjoint and would be rejected by D2's
  check. The other two are real, and both arrived the same way: no seed carried
  the answer, and the neighbour band reached it from a seed that shared a word
  with the query. SEGMENT and CLIPSEGMENT reach PARTITIONARC.OTHERNODE; DB-OPEN
  and DB-LEAVE-OPEN reach CONNECTION-CONNECT-DATABASE.

  So the family measures the expansion, not the seeder, and that is the honest
  description of what a lexical mechanism can do with a query it shares no word
  with. REQ-0047 R6's worry -- that a 0 bar can only improve and can never
  report a regression -- does not apply: a change that narrows the neighbour
  band will show up here as a fall.

  D5a  THE FAMILY, MEASURED

  120 cases, 86 on front-end and 34 on game-server, frozen in
  tools/cases/mismatch.json with tools/cases/mismatch.md beside it.

      mismatch    strict 9/120   7.5%    lenient 9/120   7.5%
      front-end     3/86    3.5%
      game-server   6/34   17.6%

  Against 410 of 450, 91.1%, on the three families built from the entities' own
  vocabulary the same afternoon. The gap between 91.1% and 7.5% is the size of
  what those three families cannot see.

  All nine hits came through the neighbour band, as the twelve-case probe
  predicted. No seed ever carried an answer, which is what disjointness
  guarantees.

  The per-repository split answers REQ-0047's second open question and does not
  answer it the way the question expected. front-end documents 999 of 3457
  definitions and game-server 408 of 1811, and the thinner-prose repository
  scored *higher*, 17.6% against 3.5%. Prose is not what these cases are
  reached by -- nothing reaches them by prose, by construction -- so what the
  number reflects is the neighbour band, and game-server's is denser: a Lisp
  tree of functions calling functions against a front-end of classes and
  constants.

  Writing them cost more than running them. 48 of the first 60 candidates were
  rejected, written blind against the entity's own vocabulary; printing the
  forbidden words beside each entity first took the remaining batches to 99
  kept of 103. That ratio is REQ-0047 R2's requested count and it is a fact
  about the task rather than about the generator: most of the work of writing a
  mismatch query is finding out which words are already taken.

  Seventeen of twenty hand-read cases identify their entity (REQ-0047 R7). The
  three that do not are named in tools/cases/mismatch.md and kept in the family.

  D5b  ONE CHANGE THE PLAN DID NOT ANTICIPATE

  tools/recall.py printed nothing at all for the new file. Its report loop
  iterated the literal ("name" "inflected" "prose"), so a family it had never
  heard of contributed to no line and to no total -- and the output was an
  empty run rather than an error.

  It now prints those three first, in make-cases.py's order, then any other
  family the case file holds. known-item.json's numbers are unchanged by that,
  which was checked rather than assumed: 410 of 450 before and after.

  D6  WHAT THE FAMILY WILL NOT SETTLE

  Whether the queries are answerable at all. Nine of the twelve missed, and a
  miss has two readings that no instrument separates: the mechanism could not
  find it, or the query never identified it. `what a square becomes when
  nothing says otherwise' for DEFAULT_TILE_TYPE is a fair description and is
  probably not a fair question.

  REQ-0047 R7's hand-checked sample is the only answer to that and it is a
  small one: twenty cases read against the tree, and a recorded fraction. The
  fraction is a property of the family that a later reader argues with, not a
  filter applied to it -- dropping the cases a human found unanswerable would
  make the family easier by exactly the amount the human was unsure.

  Read, it came to 17 of 20, and two of the three failures are one defect this
  design did not foresee. `fuse adjoining areas by taking out the divider' for
  MERGEFACES and `drop the divider between neighbouring areas so they become
  one' for TERRAINPARTITION.REMOVEARC are the same question with two answers;
  the entities document each other, and the queries do not separate them.
  Disjointness is a property of one case against one entity and has no opinion
  about two cases against each other. Nothing detects that pair, and a family
  large enough to contain near-duplicates will contain some.
