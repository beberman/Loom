id: DES-0014
title: A :CALL-SITE entity exists exactly where a call cannot be an edge from a definition, and nowhere else
status: implemented
date: 2026-08-09
refines: [REQ-0015, BUG-0016, BUG-0017]
affects: [resolve-calls, call-targets, callable-index, analyze-file,
          collect-call-names, definer-call-site, generated-entity,
          resolve-generated-definitions, retract-file, describe-entity,
          impact-report, resolve-tests]
tags: [ontology, graph, analyzer, calls, blind-spot, ambiguity]
summary: |
  Three open items -- REQ-0015's ambiguous calls, BUG-0016's orphaned
  DEFINE-OPERATION bodies, BUG-0017's initform designators -- share one shape:
  a call name that has nowhere to go, because :CALLS runs from a definition
  entity and in each case there either is no definition entity, or it is of a
  type :CALLS refuses. The uniform answer is a node per call site, and it was
  measured before it was designed: this tree carries 4867 call-name
  occurrences against 1604 entities, so a node per occurrence is a 4x entity
  count for problems whose measured size here is 18 ambiguous occurrences, 42
  orphaned names and one initform. That trade is refused. What is adopted is
  the sparse form of the same idea -- a :CALL-SITE entity is minted exactly
  when a name cannot be expressed as a :CALLS edge from an existing definition,
  and never otherwise, so a name resolving to one callee from a DEFUN keeps
  producing exactly the edge it produces today. Roughly 100 entities on this
  tree rather than 4867. The ontology cost is one entity type, one widened
  :CALLS source and two widened :CONTAINS endpoints; :CALL-NAMES stays a
  property and DEC-0003 is untouched.
body: |
  PROBLEM

  Measured on this tree 2026-08-09 under /usr/bin/sbcl, 173 files:

      entities                          1604
      relationships                     7864
      :CALLS edges                      3287
      callables carrying :CALL-NAMES     852
      call-name occurrences             4867
      distinct call names                851

  and, splitting the occurrences by what RESOLVE-CALLS does with each:

      resolve to exactly one callee     2527
      fan out across N methods            30
      resolve to nothing                2310
        of which genuinely external     2292
        of which ambiguous (2+ cands)     18   across 4 distinct names

  Three documents describe the same defect from three sides.

  REQ-0015 wants an ambiguous call to become several discountable edges rather
  than none. CALL-TARGETS' final clause is (t nil): several plain functions of
  one name yield no edge at all, on the stated grounds that "asserting all of
  them would make every caller of a common name look coupled to code it never
  touches."

  BUG-0016 has DEFINE-OPERATION expanding to a runtime table entry, so its 15
  call sites mint no entity and the 42 distinct names their bodies call are
  recorded on the file's :DEFINER-CALL-SITES and attached to nothing. Every
  REST route and MCP tool is invisible in the call graph.

  BUG-0017 has a function designated in an initform -- (defparameter
  *json-key-name* #'default-json-key-name) -- with no incoming edge, and its FIX
  section stalls on exactly the question this document exists to answer: the
  recorded caller would be a :VARIABLE, and ":CALLS runs from (:function
  :method :test)", so there is no edge to assert.

  One shape underneath all three: a call name whose source cannot be the origin
  of a :CALLS edge. Either no definition entity exists for the construct that
  contains the call (BUG-0016), or one exists but is of a type :CALLS refuses
  (BUG-0017), or the destination is plural and the design has declined to pick
  (REQ-0015).

  WHY THE UNIFORM MODEL IS REFUSED

  The obvious design, and the one the TODO note reaching this document proposed,
  is a reference node per call site: :CALL-NAMES becomes a set of edges,
  :UNRESOLVED-CALLS becomes "a reference with no resolution", and every case
  above falls out of one mechanism. It is genuinely uniform and it is genuinely
  the wrong trade, which the census above settles rather than argues.

  4867 call-name occurrences against 1604 entities is a 4.0x entity count --
  1604 becomes roughly 6500 -- plus about 4867 ownership edges and 3287
  resolution edges, taking relationships from 7864 to somewhere near 16000. Every
  consumer pays: ALL-ENTITIES is a linear scan behind ENTITIES-OF-TYPE,
  CALLABLE-INDEX is rebuilt per resolution pass, `find' matches substrings across
  the whole entity set, and `context' ranks over it.

  What that buys, on this tree, is 18 ambiguous occurrences, 42 orphaned names
  and one initform designator. The 2527 names that resolve to exactly one callee
  gain nothing whatsoever from an interposed node -- the edge they produce today
  is already exactly right -- and the 2292 genuinely external names gain nothing
  either, since :UNRESOLVED-CALLS already records them and a node per absent
  callee is a node per thing that is not there.

  The generalisation is worth stating because it will recur: a node earns its
  place when it carries a fact that has nowhere else to live. For 4819 of the
  4867 occurrences here, the fact has somewhere else to live, and it is already
  living there.

  ONE MEASUREMENT THAT CUTS THE OTHER WAY

  REQ-0015's problem is almost absent from this tree and real on the next one.
  18 occurrences across 4 names here -- FIXTURE-INSPECTION with 10 callers and 2
  definitions is the worst -- against game-server's `id' at 7 definitions and 144
  dropped call sites, `definition' at 3 and 50, `cascade-delete' at 2 and about
  12. This is the third time a mechanism has been correct against Loom and wrong
  against game-server, which the TODO's own game-server section names as the
  recurring theme. So REQ-0015 is designed for here and validated there, and the
  acceptance criteria say so.

  WHAT EACH THING BECOMES

  The rule, stated once, because every clause below is a consequence of it:

    A :CALL-SITE entity is minted exactly when a call name cannot be expressed
    as a :CALLS edge from an existing definition entity. Never otherwise.

  So the common path is untouched. A DEFUN calling one uniquely-named function
  produces one :CALLS edge and no :CALL-SITE, exactly as today, and 2527 of the
  2557 currently-resolving occurrences never meet this design at all.

  loom-ontology gains one entity type.

    :CALL-SITE   natural key (:file :start-line :name)
                 properties :file, :start-line, :end-line, :name (the name
                 referenced), :referrer-kind (:variable, :class, :definer-call,
                 :ambiguous), :candidate-count, :language, :system.

  The natural key is the load-bearing part and it is deliberately not
  (:file :caller :name). A file, a line and a referenced name is unique by
  construction -- two definitions cannot begin on one line, and a definer call
  site cannot begin on a definition's line -- and it is stable across
  reanalysis in the way SS5.1's rebuild-equals-update property requires, since
  nothing in it is derived from a resolution outcome. Keying on the caller's
  name instead would make a renamed function silently mint a second call site
  and leave the first to be swept.

  :CALLS widens its :from by one member, to (:function :method :test
  :call-site). That single widening is what closes BUG-0016 and BUG-0017: the
  edge runs from the call site to the callee, so `describe' on the callee shows
  the call site as an incoming caller and `impact' reaches it in one hop rather
  than two. Interposing the node between an existing caller and its callee was
  considered and rejected below -- it would have changed every depth `impact'
  reports.

  :CONTAINS widens twice: :to gains :call-site, and :from gains :variable. A
  call site is a thing its file contains, and for BUG-0017's case a thing its
  variable contains, so ownership needs no new relationship type at all. The
  chain reads file contains variable contains call-site calls callee, and every
  link in it is an edge type that already exists.

  The analyzer mints them, because every one of the three cases is derivable
  from one file. ANALYZE-FILE gains a fourth thing it emits:

    BUG-0017's case. DEFVAR, DEFPARAMETER, DEFCLASS and DEFINE-CONDITION are
    handed their initforms, and any name COLLECT-CALL-NAMES recovers from one
    becomes a :CALL-SITE owned by the variable or class, at the initform's line.
    This is the half of BUG-0017 that was blocked: the recorded caller is no
    longer a :VARIABLE, it is a call site the variable contains, so the
    ontology question that stalled the fix does not arise. BUG-0017's other
    candidate -- walking a lambda list's defaults -- is a separate change and
    stays separate, since it needs the lambda list parsed rather than walked.

    BUG-0016's case. A definer call site whose :CALL-NAMES are non-empty and
    whose macro produces no entity becomes one :CALL-SITE per name, owned by
    the file, at the site's line, :referrer-kind :definer-call. Measured scope:
    644 definer call sites across 65 files carry 3843 call-name occurrences,
    but the great majority belong to fiveam TEST forms whose minted :TEST
    entity already carries them, so only the uncharacterised remainder --
    DEFINE-OPERATION's 15 sites and 42 names as BUG-0016 measured them -- mints
    anything here. RESOLVE-GENERATED-DEFINITIONS decides which is which, so the
    minting cannot be an analyzer decision.

  That last sentence is the one wrinkle in an otherwise analyzer-owned design,
  and it has to be faced rather than glossed. Whether a definer call site mints
  a definition is a workspace question (DES-0002), so whether its names are
  orphaned is also a workspace question, and the analyzer cannot know it. So
  BUG-0016's call sites are minted by the graph, in
  RESOLVE-GENERATED-DEFINITIONS, alongside the entities it already mints from
  the same list -- derived on every pass from :DEFINER-CALL-SITES, never
  consumed, exactly as DEC-0003 requires and exactly as the :TEST entities
  beside them already work. BUG-0017's and REQ-0015's cases stay in the
  analyzer and the graph respectively. Three cases, two owners, one entity type.

  REQ-0015's case, in CALL-TARGETS. The (t nil) clause gains a predecessor: two
  or more plain functions of one name yield one :CALL-SITE with
  :referrer-kind :ambiguous and :candidate-count N, plus one :CALLS edge from
  that call site to each candidate at confidence 1/N -- the same
  DISPATCH-CONFIDENCE the method fan-out already uses, and the same
  *MINIMUM-DISPATCH-CONFIDENCE* floor.

  The node is what makes this safe, and it is the answer to the objection
  CALL-TARGETS' docstring raises against fanning out. "Asserting all of them
  would make every caller of a common name look coupled to code it never
  touches" is true when the edges run from the caller: FIXTURE-INSPECTION's ten
  callers would each acquire two outgoing edges. Running them from a call site
  the caller contains keeps the coupling one hop away and labelled, so
  `describe' on the caller shows one ambiguous site rather than two false
  couplings, and a consumer that wants the candidates walks one edge further to
  get them. The fan-out REQ-0015 asks for and the honesty CON-0001 demands stop
  being in tension.

  :CALL-NAMES stays exactly what it is. It is not replaced by these edges and
  must not be: RESOLVE-CALLS re-derives from it on every pass, which is what
  rebuilds edges that RETRACT-FILE destroyed when a callee's file changed
  (DEC-0003). :CALL-SITE entities are derived from it too, so they rebuild the
  same way. :UNRESOLVED-CALLS also stays for now -- the 2292 external names are
  not getting nodes -- though it remains the removable cache the earlier review
  identified, on its own schedule.

  RETRACT-FILE needs nothing. Every :CALL-SITE carries origin-file = the file
  that contains it, which is the referring file in all three cases, so editing
  that file removes its call sites and the next pass re-derives them. The
  property DES-0011 relied on for image facts is relied on here unchanged.

  WHAT THIS RESOLVES

  BUG-0016, the second and harder half. Its FIX lists three options in
  increasing cost -- leave the bodies unattributed and say so; attribute them to
  the file; or add an ontology type for a registered operation -- and calls the
  third "an ARCH-level question about whether the ontology models runtime
  registrations", correctly refusing to settle it inside a bug fix. This document
  takes a fourth option it did not list, and the distinction matters: a
  :CALL-SITE does not model the registered operation. It models the call, which
  is the thing that actually exists in the source and the thing the call graph
  is missing. Whether Loom should have an :OPERATION entity with a keyword name
  and a route is still open and still ARCH-level; `impact search-entities' will
  mention the call site in operations.lisp at a line, not the /v1/find route.
  BUG-0016's first half -- counting the gap in `status' -- is untouched and
  should land first, since it is cheap and independent.

  BUG-0017, the initform half, which is the half its own FIX could not choose.
  The lambda-list-default half stays open, and BUG-0017's WHY IT HID lesson --
  a FIX narrower than its SYMPTOM -- applies to this document too, so it is
  named rather than left for a reader to notice.

  REQ-0015, mechanically, with its value concentrated off this tree. 18
  occurrences here; the acceptance criterion is game-server's `id'.

  REQ-0013 gains an anchor it did not have. "An answer built from dropped edges
  must say so, at the point of the answer" needs somewhere to hang the fact, and
  an ambiguous call site is a first-class entity a query can count and report.
  It does not implement REQ-0013 -- the 2292 external names still have only the
  property -- but the ambiguous ones stop being invisible.

  BUG-0012 is not resolved and is worth checking against, since both concern
  edges attributed to the wrong definition. Its mechanism is two same-key
  definitions colliding into one id and unioning their outgoing edges. Nothing
  here creates or removes an instance: call sites have their own key including a
  line, so two colliding definitions produce two distinct call sites rather than
  one merged set, which is a small argument in this design's favour and not a
  fix.

  ALTERNATIVES CONSIDERED

  A node per call-name occurrence, uniformly. The design this document was asked
  to write, rejected on the census: 4867 nodes for 61 problems. Recorded with its
  number so the trade is re-checkable rather than re-argued -- if a future tree
  shows ambiguity at game-server's rate across a codebase ten times this size,
  the arithmetic changes and this should be reopened.

  Interpose the call site between every caller and callee. Rejected on impact
  semantics: every path would grow a hop, so `impact foo 3' would reach two
  levels of call graph where it reaches three today, and REQ-0005 already
  records that the depth number is hard to trust. Sourcing the edge at the call
  site only where no caller edge is possible keeps every existing path the
  length it is.

  Attribute BUG-0016's names to the enclosing :FILE entity, the second option
  its FIX lists. Cheaper and genuinely tempting: no ontology change at all,
  since :CALLS would need :file as a source, which is one widening rather than
  an entity type. Rejected because a file is the wrong grain -- operations.lisp
  holds 15 DEFINE-OPERATION forms and the answer to "who calls
  VIOLATION-SUMMARY" would be the file, not the :CHECK operation's body at line
  165 -- and because :CONTAINS already means file-to-definition, so making a
  file also a call source blurs the one edge type whose meaning is currently
  crisp.

  Give the ambiguous case N edges straight from the caller, no node. The literal
  reading of REQ-0015, and the thing CALL-TARGETS' docstring argues against on
  grounds this document accepts. It is also two lines of code against an entity
  type, so it deserves to be named as the cheap fallback if the node proves not
  to earn itself: the loss is that the caller looks coupled to every candidate
  and nothing records that the coupling is a guess beyond a confidence number
  that `describe' does not currently show.

  Mint call sites in the analyzer for all three cases. Rejected on DES-0002's
  boundary: whether a definer call site is orphaned depends on the whole
  workspace's macro registry, which RULE-0002 keeps an analyzer from knowing.
  The split -- analyzer for initforms, graph for definer calls and ambiguity --
  follows the existing seam rather than cutting a new one.

  REQUIREMENTS

  R1  :CALL-SITE is declared with natural key (:file :start-line :name) and
      properties :file, :start-line, :end-line, :name, :referrer-kind,
      :candidate-count, :language, :system. :CALLS gains :call-site as a
      source; :CONTAINS gains :call-site as a target and :variable as a source.
      No other ontology change.

  R2  A :CALL-SITE is minted only where a :CALLS edge from an existing
      definition entity is impossible. A name resolving to exactly one callee
      from a :FUNCTION, :METHOD or :TEST mints none, and the edge it produces is
      byte-identical to today's. Asserted by a test that counts :CALL-SITE
      entities on this tree and fails if the count exceeds the three generators'
      measured sum.

  R3  ANALYZE-FILE hands DEFVAR, DEFPARAMETER, DEFCLASS and DEFINE-CONDITION
      initforms to COLLECT-CALL-NAMES and mints one :CALL-SITE per recovered
      name, owned by the variable or class through :CONTAINS, at the initform's
      line. The lambda-list-default half of BUG-0017 is explicitly not in scope.

  R4  RESOLVE-GENERATED-DEFINITIONS mints one :CALL-SITE per call name on a
      definer call site that produced no entity, owned by the file, with
      :referrer-kind :definer-call. Derived from :DEFINER-CALL-SITES on every
      pass and never consumed, so a retract rebuilds them (DEC-0003). A site
      whose macro did mint an entity mints no call site, because the entity
      already carries the names.

  R5  CALL-TARGETS gains a clause before (t nil): two or more plain function
      candidates yield a :CALL-SITE with :referrer-kind :ambiguous and
      :candidate-count N, and one :CALLS edge from it to each candidate at
      DISPATCH-CONFIDENCE N. The method fan-out is unchanged and keeps running
      from the caller, because dispatch is a union of real possibilities rather
      than an ambiguity -- the distinction CALL-TARGETS' docstring draws and
      this design preserves.

  R6  :CALL-NAMES is unchanged in meaning, ownership and lifecycle. Every
      :CALL-SITE is derived from it, so DEC-0003's rebuild property holds for
      call sites exactly as it holds for edges. Every :CALL-SITE carries
      origin-file = its containing file, so RETRACT-FILE ages them out with no
      new machinery.

  R7  Consumers are checked, not assumed. `describe' on a callee shows an
      incoming call site with its line and kind rather than a bare id;
      `describe' on a caller shows an ambiguous site as one neighbour rather
      than N couplings; RESOLVE-TESTS is confirmed to derive :TESTS from
      :CALLS edges whose source is a :TEST and is therefore unaffected;
      EDGES-BETWEEN-SYSTEMS sees call sites carrying a :SYSTEM, so RULE-0001 to
      RULE-0003 neither gain nor lose violations beyond BUG-0009's known noise.

  R8  Tests per CON-0003, each failing without the change: (defparameter *hook*
      #'target) beside (defun target ...) yields a :CALLS edge reaching TARGET;
      a DEFINE-OPERATION-shaped fixture whose body calls a fixture function
      yields one; two same-named DEFUNs in different files plus a caller yield
      one ambiguous call site with two candidate edges at confidence 0.5 and no
      direct caller-to-candidate edge.

  R9  Acceptance measured on both trees. Loom: entity count rises by the
      generators' sum and by nothing else -- expected order 100 against 1604, to
      be stated exactly by the implementing plan rather than estimated here --
      the 2527 single-target occurrences produce the same 2527 edges, the suite
      is green, and `check' is unchanged modulo BUG-0009. game-server: `impact
      cascade-delete' reaches candidates it does not reach today, and `id''s 144
      dropped sites become ambiguous call sites with 7 candidates each, which is
      REQ-0015's actual acceptance and cannot be demonstrated here.

  R10 Documentation: CLAUDE.md's blind-spot paragraph and the loom skill note
      that an ambiguous call is now a reportable entity rather than a silent
      drop, per DES-0008 R7's precedent that doc obligations are named.

  RISKS

  Entity growth is bounded by a rule rather than by a number, and rules drift. R2
  makes the count a test rather than a hope, but the failure mode if a future
  change makes some common case mint a call site is a graph that quietly
  quadruples. The test asserting a ceiling is the guard and should fail loudly
  rather than warn.

  The ambiguous call site changes what `describe' on a caller shows, and someone
  reading it will read the absence of a direct edge as a missing call. The R7
  rendering obligation is what stops that, and it is a loom-knowledge change in a
  design that is otherwise ontology and graph -- the one place this crosses a
  layer it did not intend to.

  Two owners for one entity type is a seam. The analyzer mints initform call
  sites and the graph mints definer-call and ambiguous ones, so the natural key
  has to agree across a system boundary, exactly the drift DES-0011 R5's
  fixture exists to catch for a different pair of passes. A shared key-computing
  function in loom-ontology, used by both, is the cheap insurance and the plan
  should take it.

  CONSEQUENCES

  Code that changes: one DEFENTITY and three endpoint widenings in
  code-ontology.lisp; ANALYZE-FILE's variable and class branches; CALL-TARGETS
  and RESOLVE-GENERATED-DEFINITIONS in resolve.lisp; the neighbour rendering in
  loom-knowledge. RETRACT-FILE, APPLY-TRANSACTION and the absorb machinery are
  untouched.

  What gets simpler later. The reference-node model was attractive because it
  gave every call site a place to hang facts, and this keeps that for the sites
  that need it while refusing the cost for the ones that do not. DES-0013's
  package prefixes have an obvious home here the moment a qualified name is
  ambiguous -- a call site with :candidate-count 7 and a written prefix of
  `utils' is a resolvable ambiguity, which is the composition of the two designs
  and the strongest argument for doing them in this order.

  The obligation every future change carries. The rule in WHAT EACH THING
  BECOMES is the whole design, and it is one sentence for a reason: any change
  that mints a :CALL-SITE where a :CALLS edge was possible has silently adopted
  the uniform model this document priced at 4867 entities and refused.

  Deferred, on the record: an :OPERATION entity type modelling runtime
  registrations, which BUG-0016 raised and this does not answer; the
  lambda-list-default half of BUG-0017; removing :UNRESOLVED-CALLS as a stored
  property; REQ-0013's per-query reporting of dropped edges, which now has an
  anchor for the ambiguous cases and still none for the 2292 external ones; and
  whether `describe' should show confidence, which is REQ-0015 R5's question and
  stays with it.

  OUTSTANDING

  Implemented by PLAN-0014 on 2026-08-10, eleven steps, suite green. R1 to R8
  and R10 are true of the tree; R9's Loom half is measured below and its
  game-server half was not run, which is why REQ-0015 stays partial. No review
  was performed, so there is no REV-nnnn for this work.

  Six departures from the text above. Every one is an implementation choice
  inside the settled design rather than a reopening of it, and each is recorded
  here because a reader comparing the code against this document would
  otherwise read it as drift.

  1. The natural key is (:file :start-line :call-name), not R1's (:file
     :start-line :name), and NAME carries CALL-SITE-LABEL's
     "<call-name>@<file>:<line>". ENTITY-NATURAL-KEY treats :name as the name
     *slot*, so R1's spelling forces NAME to be the bare referenced name --
     and LINKABLE-INDEX keys every named entity while RESOLVE-ONE refuses a
     name matching several, so 163 call sites named exactly like the functions
     they call would have turned resolved `affects:' references into
     unresolved ones. Semantically the key is R1's exactly: a file, a line and
     a referenced name. PLAN-0014 decision 1.

  2. R4 mints only where the name resolves. Read literally, R4 mints one call
     site per orphaned name, which is 266 entities on this tree of which 142
     are nodes for names that resolve to nothing at all -- against this
     document's own census reasoning ("a node per absent callee is a node per
     thing that is not there") and its own R9. The predicate is CALL-TARGETS,
     and 124 is what it mints. The asymmetry with R3, which keeps minting all
     20 initform sites because the analyzer cannot consult the callable index,
     is deliberate and costs 7 nodes. PLAN-0014 decision 2.

  3. :CONTAINS :from gains :function, :method and :test as well as R1's
     :variable. R7 requires `describe' on a *caller* to show an ambiguous site
     as one neighbour, and there is no edge from the caller to the site
     without them. PLAN-0014 decision 3.

  4. :CALL-SITE declares two properties R1 does not list, :call-names and
     :unresolved-calls. They are what let RESOLVE-CALLS treat a call site as
     one more kind of caller instead of growing a second copy of the
     confidence handling and the DEC-0003 rebuild property. :CALL-NAMES is
     declared and never written -- CALLER-CALL-NAMES derives the one-element
     list from :CALL-NAME -- so the referenced name is stored once. PLAN-0014
     decision 4.

  5. :BELONGS-TO widened in step with :CONTAINS, which R1's "No other ontology
     change" did not anticipate and neither did PLAN-0014 step 3. Nothing in
     the tree asserts a :BELONGS-TO edge, so it buys no behaviour; what it
     keeps true is BELONGS-TO-IS-THE-INVERSE-OF-CONTAINS, which widening one
     side alone would have made false. Weakening that test to exempt the new
     members was the alternative and is the worse trade, since a declared
     inverse that is quietly not one is a fact the ontology states and does
     not hold.

  6. SEARCH-RANK demotes a :call-site below every entity that is not one, in
     loom-knowledge. R7 obliges the consumers to be checked rather than
     assumed and this is what the check found: a call site's name has its
     callee as a *prefix*, so it outranked every substring match among the
     real definitions, and 7 of 86 measured terms lost between one and five
     real definitions off `find''s silent 20-hit cap -- `id' two interfaces,
     `name' three functions. Demoted by a whole rank band rather than
     filtered, because a filtered entity is invisible and this design exists
     to stop calls being invisible.

  THE NUMBER R9 ASKS FOR

  Measured 2026-08-10 under /usr/bin/sbcl on the whole tree, after step 11.
  R9 requires this stated exactly by the implementing plan rather than
  estimated, so "order 100 against 1604" is superseded by:

      files                    178 ->  181
      entities                1684 -> 1890     +206
        of which :call-site             162
          :variable                      20    (R3, the analyzer's)
          :definer-call                 124    (R4, the graph's)
          :ambiguous                     18    (R5, the graph's)
        the other 44 are this work's own documents, tools/call-site-census.lisp,
        and the functions and tests the eleven steps added
      relationships           8261 -> 9065     +804
        of which touch a call site      342
          :contains into one            162
          :calls out of one             180    (13 initform + 131 definer-call
                                                + 36 ambiguous)
      tests                    481 ->  503     covering 322 -> 325 units
      documents                 81 ->   83     (BUG-0020, PLAN-0014)
      rule violations           32 ->   32     all RULE-0003, all BUG-0009
                                               noise; RULE-0001 empty
      unresolved doc refs        0 ->    0
      definer macros             4 ->    3     BUG-0020's fix, not this design
      unread                     2 suppressed, 0 recovered

  R2's rule holds as a number: 162 call sites against 4867 call-name
  occurrences, and the 2527 occurrences resolving to exactly one callee from a
  definition still produce exactly the edges they produced before. The ceiling
  test in src/workspace/test/workspace.lisp is what keeps that from drifting.

  The 180 :CALLS is the one figure worth reading twice, because it is where
  decision 6 shows: 7 of the 124 definer-call names are themselves ambiguous
  and fan out to 2 candidates each from the site that already exists rather
  than minting a call site from a call site, which is 117 + 14 = 131.
