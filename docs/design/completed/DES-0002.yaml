id: DES-0002
title: Macro- and structure-generated definitions reach the index
status: implemented
date: 2026-07-29
refines: [REQ-0003]
affects: [resolve-calls, resolve-definitions, resolve-and-check, make-macro-entity,
          analyze-file, struct-definition-entities, class-definition-entities,
          repository-status, repository-graph]
tags: [analyzer, ontology, macros, tests, resolution]
summary: |
  A macro that expands into a defun or a fiveam test, and a defstruct or
  defclass slot that expands into an accessor, each bring a name into
  existence that appears nowhere as its own form. Today that name is either
  entirely absent from the index (macros) or present but disconnected from
  what generated it (structures, per DES-0001's :generated-by property,
  which nothing traverses). This closes both with one mechanism: a second
  resolution pass that mints the missing entities and links every generated
  definition back to its generator with the ontology's existing :uses edge,
  widened rather than replaced.
body: |
  PROBLEM

  Two things are broken and REQ-0003 shows both are the same hole seen from
  different sides.

  A macro call that is a definer -- struct-simplefn expanding to (defun ,name
  ...), fiveam's (test name ...) -- creates a definition the analyzer never
  sees, because the analyzer walks top-level forms and a call to
  struct-simplefn or test is not a defun. The consequence measured on
  game-server: definer call sites bring new names into existence that never
  resolve, and the :test entity type and :tests relationship, declared in the
  ontology since before this document, hold zero facts. `find def-suite`
  against Loom's own tree returns "Nothing matches" though every
  src/*/test/suite.lisp contains one (REV-0001 finding 6).

  A structure's generated members are already indexed -- DES-0001 gave
  defstruct accessors and defclass slot accessors :generated-by, a string
  naming what generated them -- but the string is a property, not an edge, so
  nothing traverses it. Reproduced live against Loom's own index:

    describe repository        -- <- contains: workspace.lisp, nothing else
    impact repository 2        -- 1 impacted: its own file
    describe repository-graph  -- <- calls: 6 named callers

  repository-graph is repository's accessor. Changing the repository
  structure -- adding, renaming or removing a slot -- reaches nothing, though
  the accessor it would break has six real callers already in the graph. The
  edges to carry that impact exist (:calls, already resolved); the one edge
  that would connect the class to its own accessor does not.

  Both cases need the same thing: a generator (a macro call site, or a
  defstruct/defclass form) linked to what it generates, so impact can walk
  from one to the other. R4 in REQ-0003 asks for exactly this, for both
  cases, with one edge.

  WHAT EACH THING BECOMES

  The ontology change

  This needs the cheapest of the three kinds of ontology change: widening the
  endpoints of a relationship that already exists. No new entity type. No new
  relationship type.

  :uses widens: its :from list gains :interface (a defclass slot accessor is
  an :interface, per DES-0001, and needs to point at its class) and :test (a
  generated test needs to point at the macro that generated it); its :to list
  gains :function (a generated function needs to point at the macro, itself a
  :function carrying :macro-p). :tests widens similarly: its :to list gains
  :interface, so a test that calls a slot accessor directly still produces a
  :tests edge.

  REQ-0003 offered the alternative directly -- a dedicated :generates type
  would say more precisely what the edge means. It is rejected for the exact
  reason DES-0001 rejected a dedicated :specializes for method-to-class: no
  consumer needs to tell a generated-by edge apart from an ordinary :uses
  edge to get the right answer, because both correctly want impact to flow
  from generator to generated, which :uses' existing :reverse impact
  direction already gives. What a reader needs in order to tell a derived
  fact from a written one is already carried elsewhere -- :generated-by, the
  property DES-0001 put on the entity itself -- and duplicating that
  distinction into the edge type would be answering a question nobody asked
  of the edge.

  The analyzer (loom-analyzer)

  Three additions, all file-scoped and stateless, per RULE-0002.

  1. Macro template inspection. When the analyzer reads a defmacro, in
     addition to the existing :function/:macro-p entity (make-macro-entity),
     it inspects the template body against the rule REQ-0003 already fixed
     ("WHERE TEMPLATE READING STOPS": the template contains a defun,
     defclass or defmethod, and the name position is a bare substitution of
     one of the macro's own parameters). When it matches, the macro's entity
     gains three properties -- :generator-entity-type, :generator-name-index,
     :generator-body-index -- derived once from the source text and never
     rewritten, the same discipline as :superclass-names. When the template
     contains one of those three forms but the name position is not a bare
     substitution, the entity instead gets :definer-status :unhandled -- this
     is R6's case, a macro that looks like a definer and cannot be
     characterised. When the template contains none of the three, the entity
     gets no generator properties at all: a wrapper (cond-is, with-lock,
     preflight) is not flagged, because nothing about its shape claims to
     define anything.

  2. Candidate-call recording. For every top-level form whose operator is
     not one of the forms the analyzer already recognises as a definition or
     declaration (defun, defvar, defparameter, defclass, defstruct,
     defmethod, defgeneric, defmacro, define-condition, in-package and
     similar), the analyzer records one entry on the containing file: the
     operator name, the start and end line, the argument tokens rendered as
     strings, and the call names found by walking the whole argument list --
     the same walk already used for a definition's body, applied here to
     everything after the operator regardless of which argument turns out to
     be "the body." This becomes a new property, :definer-call-sites, on the
     :file entity: analyzer-written, never rewritten, exactly the shape
     :call-names already has. Storing the pre-walked call names rather than
     the raw sexp is what keeps resolution reading only properties, never
     source: resolution does not need to know in advance which argument the
     body starts at, because non-body arguments (a bare name symbol, a
     docstring) do not themselves contain calls to lose.

  3. The registry. *macro-generators* in lisp-analyzer.lisp, a table keyed
     by downcased macro name to a list of entries (a list because two
     packages may name a macro identically), each entry carrying :package,
     :entity-type, :name-index, :body-index and :framework, plus
     register-macro-generator to add one. This matches *analyzers*/
     register-analyzer and *document-type-directories*/
     register-document-type exactly, per REQ-0003's own instruction to copy
     the pattern. It ships with two entries: fiveam's test (:entity-type
     :test, :framework :fiveam) and fiveam's def-suite (:entity-type nil).
     def-suite does not mint an entity -- a suite is not a test, and the
     ontology declares no :suite entity type -- its entry exists only so a
     def-suite call is recognised as accounted for and never counted under
     R6's unhandled total. Populating the :test entity's existing :suite
     property from def-suite/in-suite context is real future work and is
     explicitly deferred, not attempted here.

  Graph resolution (loom-graph)

  Two new passes in resolve.lisp, and one widened.

  resolve-generated-definitions runs between resolve-definitions and
  resolve-calls in resolve-and-check. It builds the effective registry --
  the shipped *macro-generators* entries plus every workspace :function
  entity carrying its own :generator-entity-type from step 1 above -- and,
  for every file's :definer-call-sites entry whose operator matches exactly
  one entry, mints or refreshes the generated entity: assert-entity with
  :origin-file the calling file (not the macro's file -- this is what makes
  retract-file clean it up correctly when the call site is edited),
  :generated-by the macro's name, and :call-names the call site's
  pre-walked list, then assert-edge :uses from the generated entity to the
  macro, :structural. An operator matching zero or several registry entries
  is left alone, per CON-0001. An operator matching exactly one entry whose
  target natural key already names an entity without a :generated-by
  property -- a hand-written definition -- is also left alone, and counted
  as a collision rather than silently overwritten: a macro call that happens
  to name something a real defun already claims must not clobber it.

  The same pass closes R4's other half. Every :function or :interface entity
  that already carries a non-nil :generated-by from DES-0001 -- a defstruct
  accessor, constructor, predicate or copier, a defclass slot accessor --
  gets a :uses edge asserted to the class :generated-by names. This needs no
  analyzer change at all, since the property was already being written; it
  only needed the edge, which is why repository's impact was silent while
  repository-graph's callers were not.

  Lifecycle is this pass's own responsibility in a way no earlier resolution
  pass has had to carry. Every prior pass only asserts edges or updates
  properties, and a stale edge is cleaned up for free when retract-file
  clears the origin file's facts and the next analysis does not reassert it.
  A generated entity has no single origin file whose reanalysis is
  guaranteed to invalidate it -- the macro can stop qualifying as a definer
  in its own file while the call site's file never changes -- so
  resolve-generated-definitions recomputes the full correct set on every
  pass and retracts any entity carrying a :generated-by that names a
  registered macro but that the current computation no longer produces. This
  is what keeps the pass a derivation rather than an accumulation, per
  DEC-0003, despite creating entities.

  resolve-calls widens to iterate :test alongside :function and :method, so
  a generated test's :call-names resolve into :calls edges the same way a
  function's do. No new call-resolution logic; :test was already a
  permitted :calls source in the ontology and simply was never fed one.

  resolve-tests runs after resolve-calls: for every :test entity, for every
  :calls edge from it to a :function, :method or :interface, assert a
  :tests edge to the same target. This derives test coverage from what a
  test's body actually invokes rather than from a name or an import.

  The knowledge/console layer

  repository-status gains three counts, following the precedent :documents
  already set (a named sum rather than a raw entity total): :test-entities,
  :tested-units, :unhandled-definer-macros. print-status and check print
  them the way :unresolved-references already is.

  ALTERNATIVES CONSIDERED

  A dedicated :generates relationship instead of widening :uses. Rejected;
  covered above under the ontology change, and for the same reason
  DES-0001 gave for not adding :specializes.

  Marking the generator-to-generated edge :inferred. Rejected. :inferred is
  for a name matching several genuine possibilities -- dispatch fan-out is
  the model. Matching a call site's operator to exactly one registry entry
  is not a guess among alternatives; once matched, the derivation is as
  certain as :inherits or :implements, which DES-0001 already asserts
  :structural despite being resolution-derived. Marking it :inferred would
  make REV-0001 finding 5's problem worse, not better: a fact this certain
  rendered with the same visual weight as a genuine guess teaches an agent to
  distrust confidence markers generally. What actually distinguishes a
  generated definition from a written one -- and what a reader needs -- is
  the :generated-by property already on the entity, unchanged from
  DES-0001; the edge does not need to repeat that signal.

  Naming-convention or import-graph matching for :tests, as the ontology's
  own :tests documentation already describes ("matched by import graph plus
  naming convention, not by execution"). Considered and rejected for Lisp
  specifically. fiveam test names in this codebase are prose, not stems --
  resolve-links-a-call-to-a-definition-in-another-file names no function
  literally -- so a naming heuristic would resolve almost nothing reliably,
  and a looser one risks exactly the fabrication CON-0001 forbids. The Lisp
  analyzer also produces no :imports or :depends-on edges today, so the
  import-graph half of that sentence describes a mechanism that does not yet
  exist. Deriving :tests from what a test's body actually :calls is
  available now, safe by construction (a call that does not resolve simply
  stays unresolved, same as anywhere else), and is the strictly better
  signal for a language where a test invokes its subject directly in the
  same image. This is the second-language question the house principles ask
  to be asked explicitly: a JS/TS test typically imports its subject rather
  than merely calling it locally, so an import-graph-driven resolve-tests
  for that analyzer is the right choice there and the wrong one here. The
  ontology's :tests edge stays exactly as declared -- one type, :collect-as
  :tests -- and different analyzer families feed it via different signals;
  nothing about the type commits to either.

  Expanding the macro and indexing what comes out. Not reopened here --
  REQ-0003's own "WHY EXPANSION IS NOT AVAILABLE" section settled this, and
  nothing in this design changes the reasoning.

  Resolving generated definitions inside the analyzer rather than in a
  second pass. Not reopened here either -- REQ-0003's "DECIDED: ONE
  MECHANISM, RESOLVED IN A SECOND PASS" already settled it, for the same
  structural reason DES-0001's cross-file names are resolved rather than
  read: an analyzer is file-scoped and stateless and a macro's definition
  and its call sites are routinely in different files.

  REQUIREMENTS

  R1  A defmacro's template is inspected once, at analysis time, against
      REQ-0003's bare-substitution rule. A match records
      :generator-entity-type/:generator-name-index/:generator-body-index on
      the macro's entity; a near-miss (a defun/defclass/defmethod present
      but the name not a bare substitution) records :definer-status
      :unhandled; neither present records nothing. Analyzer-written, never
      rewritten.

  R2  Every top-level form whose operator is not a recognised definition or
      declaration head is recorded as one entry of its file's
      :definer-call-sites: operator name, start/end line, argument tokens,
      and call names pre-walked from the whole argument list.
      Analyzer-written, never rewritten.

  R3  *macro-generators* and register-macro-generator exist in
      lisp-analyzer.lisp, matching the *analyzers*/*document-type-
      directories* pattern, shipped with fiveam's test (:entity-type :test)
      and def-suite (:entity-type nil, present so it is never reported
      unhandled).

  R4  :uses widens: :from gains :interface and :test, :to gains :function.
      :tests widens: :to gains :interface. No new entity type, no new
      relationship type.

  R5  resolve-generated-definitions mints or refreshes a generated entity
      for every :definer-call-sites entry whose operator matches exactly
      one registry entry, sets :origin-file to the calling file, :generated-
      by to the macro's name, :call-names to the call site's, and asserts a
      :structural :uses edge from the generated entity to the macro. Zero or
      several matches: left alone. One match onto an existing hand-written
      entity's natural key: left alone and counted as a collision.

  R6  The same pass asserts a :uses edge from every existing :generated-by
      :function or :interface entity (DES-0001's defstruct/defclass
      output) to the class :generated-by names. No analyzer change.

  R7  resolve-generated-definitions recomputes its full output every pass
      and retracts any :generated-by entity naming a registered macro that
      the current computation no longer produces, since no single file's
      retraction is guaranteed to invalidate it.

  R8  resolve-calls iterates :test alongside :function and :method.

  R9  resolve-tests asserts a :tests edge from a :test to every :function,
      :method or :interface it has a :calls edge to.

  R10 repository-status gains :test-entities, :tested-units and
      :unhandled-definer-macros; print-status and check report them the way
      :unresolved-references already is.

  CONSEQUENCES

  resolve-and-check's sequence becomes resolve-definitions,
  resolve-generated-definitions, resolve-calls, resolve-tests,
  resolve-document-links, check-rules. The ordering is load-bearing --
  generated entities must exist with their :call-names before resolve-calls
  runs, and :calls edges on tests must exist before resolve-tests runs -- and
  the comment in workspace.lisp explaining why order matters needs the two
  new stages added to it, not just the code.

  Resolution creates entities for the first time. "Every entity comes from
  an analyzer" stops being literally true; the corrected invariant is
  "every entity comes from an analyzer, or from a resolution pass that owns
  its full lifecycle -- mint and retract -- and marks what it made with
  :generated-by." Two places say the old version outright and need
  correcting in the same change: CON-0001's summary line describes a
  resolution pass as turning "names ... into real edges," and
  assert-entity-op's docstring in ontology-ops.lisp is written for the
  analyzer's use alone. Leaving either uncorrected means the next person who
  reads them inherits a fact this document just made false.

  Two new failure modes need their own tests, per CON-0003, because each is
  a case where the trigger can silently not fire: a hand-written function
  must survive a same-named generated call site, with the collision counted
  in R10's total, not merely absent from a crash; and a macro edited to stop
  qualifying as a definer must cause its previously generated entities to
  disappear on the next resolve-and-check, with the test asserting the
  disappearance rather than only the initial appearance.

  The :tests relationship's documentation comment in code-ontology.lisp
  ("matched by import graph plus naming convention, not by execution")
  should be corrected to describe what Lisp's resolve-tests actually does --
  derives from :calls -- while noting that a different analyzer may derive
  it differently, since the two signals genuinely differ by language.

  R10's counts give a console-readable acceptance check for R5/R6 without
  needing BUG-0002's general fix: named status fields, the same precedent
  :documents already set, rather than the generic ability to enumerate any
  entity type by name that `find` still lacks. BUG-0002 stays open and
  worth fixing on its own; nothing in this design depends on it.

  Wrapper macros -- cond-is at 1393 call sites in the measured repository,
  with-lock at 29, preflight at 23 -- remain exactly as invisible as
  DES-0001's R10 left them. This design mints entities only for definer
  calls; a call made inside a wrapper's body is still attributed to
  nothing. That gap is unchanged and stays open on the record rather than
  implied fixed by this document.

  Self-analysis is the acceptance test, the same way DES-0001 used it for
  CLOS: fiveam's test and def-suite are the two most common macro calls
  across every src/*/test/*.lisp in this tree, so R10's three counts moving
  off zero when Loom indexes itself is the concrete, checkable result R5
  itself asks for.

  IMPLEMENTED, 2026-07-31, BY PLAN-0001

  All ten requirements landed across PLAN-0001's eight steps. Its OUTCOME
  section carries the measured result and two predictions that came out wrong
  (the :test count, and defrelationship being reported as an unhandled definer
  macro when it expands to no definition at all).
