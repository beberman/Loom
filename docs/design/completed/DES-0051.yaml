id: DES-0051
title: Documents are read and written through a document-store protocol, the file tree and an in-memory store implement it from the first commit, and each step is accepted only when a full index dump is unchanged
status: implemented
priority: p1
date: 2026-09-14
refines: [REQ-0009]
affects: [repository-files, file-changed-p, stamp-file, index-file,
          index-repository, reindex-repository, poll-once, detect-deletions,
          index-drift, count-unstamped, check-document-references,
          definition-source, plan-document-edit, apply-transition,
          set-document-status, complete-plan, status-destination,
          flat-directory, document-store-entry, docstore-apply-batch]
tags: [documents, document-store, protocol, adapter, refactor, identity,
