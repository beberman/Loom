id: DES-0013
title: Eclector reads the file behind a Loom-owned client, the raw s-expression stays exactly what it is, and everything the reader learns lands in EQ-keyed side tables
status: implemented
date: 2026-08-09
refines: [REQ-0019]
# READ-FORMS-WITH-SPANS, ELEMENT-SPANS, SKIP-WHITESPACE-AND-COMMENTS and
# INTERN-FOREIGN-SYMBOL-LOCALLY stood here until PLAN-0013 step 4 deleted them
# (R7). A name that resolves to nothing is reported by `check` rather than
# dropped, so they are named in the body and not here.
affects: [read-source, form-range, form-package, form-reader-macro,
          lisp-reader-client, token-name, definition-p, collect-call-names,
          analyze-file, generic-definition-entities, file-form-spans,
          reader-artifact-p, make-unparsable-file-entity, offset-line,
          lisp-analyzer]
tags: [analyzer, lisp, reader, spans, provenance, eclector]
summary: |
  REQ-0019 wants spans at every depth, package prefixes preserved, recovery
  that costs a form rather than a file, and feature handling that is a policy.
  Eclector supplies all four through one protocol, and the whole design problem
  is keeping that from becoming a rewrite of the walk. The answer is that the
  parse result Loom asks Eclector to build IS the ordinary s-expression --
  MAKE-EXPRESSION-RESULT returns its RESULT argument unchanged -- so the tree
  handed to pass 1 is structurally identical to today's, every SYMBOLP,
  KEYWORDP and TOKEN-NAME call keeps working, natural keys do not move, and
  parity is the default rather than an achievement. Everything the reader
  learns that the s-expression cannot carry goes into EQ-keyed side tables over
  that same tree: cons to line range, symbol to written package prefix, plus
  ordered lists of skipped and recovered regions. Symbols are uninterned
  (MAKE-SYMBOL) except keywords, which intern in KEYWORD where they belong, so
  no package is created or deleted per file and no target symbol lands in a
  Loom package. Reader macros are the one class of form a reader legitimately
  does know, so #'f becomes distinguishable from a list that merely looks like
  one and the imprecision COLLECT-CALL-NAMES discloses today is retired. One
  new file, src/analyzer/lisp-reader.lisp, is the only place that names
  Eclector, on the DES-0011 precedent that nothing outside lisp-inspector.lisp
  knows what SBCL is. Since the same pass rewrites ANALYZE-FILE's pass 0
  anyway, it also replaces pass 1's ten-clause DEFINITION-P chain with a
  head-name dispatch table, which removes the hand-maintained agreement between
  that COND and *DEFINITION-HEADS* that the latter's own docstring flags as a
  hazard. ELEMENT-SPANS is deleted; DES-0010's R2 is the only prior
  requirement this retires, and no filed bug is closed by it.
body: |
  PROBLEM

  REQ-0019 measured the substrate: four functions, 169 lines, five gaps. What
  it did not settle is the thing that decides whether this is a two-week change
  or a two-day one -- what the reader hands to the walk.

  The walk is not small and it is not naive. ANALYZE-FILE's pass 1 dispatches
  on (definition-p form "defun") and eleven siblings; COLLECT-CALL-NAMES makes
  twenty distinct SYMBOLP, KEYWORDP and TOKEN-NAME decisions across its
  quotation, SETF-name and dotted-tail clauses, every one of them argued in a
  docstring and several of them the residue of a fixed bug. Counted directly:
  twenty sites in lisp-analyzer.lisp inspect a symbol object rather than a
  string. A design that replaces symbols with a node type, or forms with
  wrappers, breaks all twenty at once and makes REQ-0019 R7's parity claim
  something to be re-established by argument rather than observed. R9 exists to
  forbid exactly that.

  So the design question is not "how do we get a CST" -- it is "how do we get
  what a CST knows without the walk ever meeting one."

  THE LOAD-BEARING DECISION

  Eclector's parse-result protocol lets the client construct whatever it likes
  from a read. Loom's client constructs nothing: MAKE-EXPRESSION-RESULT
  (client result children source) returns RESULT, the ordinary s-expression
  Eclector already built, and records SOURCE in a side table keyed by that
  object. The expression tree that reaches pass 1 is therefore the same shape
  of tree CL:READ produces today -- conses, symbols, numbers, strings -- and
  every clause of the walk continues to work on it unmodified.

  Everything the s-expression cannot carry is recorded beside it, keyed by EQ:

      spans      cons              -> (start-line . end-line)   see below
      packages   symbol            -> package designator as written, a string
      skips      ordered list of   (reason start-line end-line)
      recovered  ordered list of   (condition-text start-line end-line)

  EQ keying is sound for conses because Eclector conses each one fresh, so
  every form in the file is a distinct object. It is deliberately not offered
  for atoms: a symbol or a fixnum is not unique, and a span table keyed on one
  would attribute the last occurrence's range to all of them. Only conses get
  ranges, which is exactly what the walk needs -- a range is wanted for a form,
  never for a token.

  The one shape that breaks EQ uniqueness is reader-level structure sharing:
  #1=(...) referenced by #1# makes one cons appear at two places, and the table
  records whichever range was written last. Zero occurrences in either indexed
  tree. Disclosed rather than handled, and the fallback is the containing
  form's range, which is a wider truth rather than a fabricated one (CON-0001).

  What this buys, stated once because it is the whole argument: parity is not
  something the implementing plan has to work for. The tree is the same tree,
  so the entities are the same entities, so ENTITY-NATURAL-KEY is the same key,
  so every id is the same id, so a reindex after the change is a no-op against
  the graph. REQ-0019 R7 becomes an observation instead of a project, and the
  interesting parts -- R1 through R5 -- can then be turned on one at a time.

  WHAT EACH THING BECOMES

  src/analyzer/lisp-reader.lisp (new). The only file in the tree that names
  Eclector, on DES-0011's precedent -- "nothing outside lisp-inspector.lisp
  knows what SBCL is" -- and for the same reason: a library's spelling should
  be replaceable without touching the code that consumes its answers. It OWNS
  the client class, the symbol policy, the feature policy, the recovery policy,
  and the READING structure below. It may not know what an entity is; it
  emits no ontology operation and imports nothing from the walk.

    LOOM-LISP-CLIENT      A subclass of ECLECTOR.PARSE-RESULT:PARSE-RESULT-
                          CLIENT holding the tables being built and the
                          feature policy in force.

    READING               Plain data returned by READ-SOURCE: FORMS, SPANS,
                          PACKAGES, SKIPS, RECOVERED, and FATAL (a condition
                          when the file could not be read at all).

    READ-SOURCE           (contents &key features) -> READING. The single
                          entry point. Replaces READ-FORMS-WITH-SPANS,
                          ELEMENT-SPANS, SKIP-WHITESPACE-AND-COMMENTS and
                          INTERN-FOREIGN-SYMBOL-LOCALLY, all four of which are
                          deleted rather than kept as fallbacks.

    FORM-RANGE            (reading form) -> (values start-line end-line
                          foundp). The accessor pass 1 and
                          GENERIC-DEFINITION-ENTITIES use instead of
                          ELEMENT-SPANS. NIL for a non-cons or an unrecorded
                          form, and the caller's declared fallback stays the
                          containing form's range.

    FORM-PACKAGE          (reading symbol) -> package designator as written,
                          or NIL when the site wrote no prefix.

  FORMS keeps today's tuple, (form start-line end-line start-offset), rather
  than shrinking it. START-OFFSET no longer has a consumer -- ELEMENT-SPANS was
  its only one and ELEMENT-SPANS is gone -- but DES-0010 R1 named the widened
  tuple as a requirement, and removing an element to save one cons per top-level
  form would break that requirement for no gain. Kept, with its docstring
  restated to say it is now vestigial.

  The symbol policy, which is where the design earns REQ-0019 R2 and R6 at
  once. ECLECTOR.READER:INTERPRET-SYMBOL (client stream package-indicator
  symbol-name internp) is specialized to two cases:

    package-indicator names KEYWORD, or is the keyword marker
        -> intern in KEYWORD, as the standard reader would.
    anything else, including :CURRENT and an absent package
        -> (MAKE-SYMBOL symbol-name), an uninterned symbol; and when the
           indicator names a real package rather than being :CURRENT, record
           that name in the PACKAGES table against the symbol just made.

  Three properties fall out, and each answers something REQ-0019 asked for.
  Nothing is interned anywhere except KEYWORD, so no package is made or
  deleted per file and no target symbol reaches a Loom package (R6) -- the
  KEYWORD exception is not a compromise but the correct answer, since a keyword
  has no home-package identity to confuse and CL:READ would intern it there
  too. A package a workspace has never loaded is no longer an error to recover
  from but simply a string recorded (R2), which is why
  INTERN-FOREIGN-SYMBOL-LOCALLY disappears rather than being ported. And
  because MAKE-SYMBOL returns a fresh object per occurrence, two call sites
  writing the same qualified name each keep their own prefix.

  What the walk sees is unchanged in every respect it tests: SYMBOLP is true of
  an uninterned symbol, KEYWORDP is true of exactly the keywords it was true of
  before, and SYMBOL-NAME returns the name after readtable-case folding, so
  TOKEN-NAME's STRING-DOWNCASE produces the identical string. Verified against
  the requirement it would break first: (in-package :|Loom-Graph|) still yields
  :LOOM-GRAPH through NORMALIZE-SYMBOL-NAME, because the vertical bars survive
  into SYMBOL-NAME exactly as they do today. No site in lisp-analyzer.lisp
  compares a symbol with EQ or EQL -- checked, twenty sites, all of them
  SYMBOLP, KEYWORDP or a STRING= against TOKEN-NAME -- which is the fact that
  makes uninterning safe rather than merely convenient.

  Recovery, and the rule that keeps it from fabricating. Eclector establishes
  an ECLECTOR.READER:RECOVER restart for errors it has a strategy for. Invoking
  it is what buys REQ-0019 R3, and it is also the most dangerous thing in this
  design: a recovered read of a missing close paren may return a form that
  swallowed the definition after it, and a swallowed definition offered to pass
  1 is a fabricated entity with a real-looking range. So recovery is used for
  exactly one purpose and no other:

    A top-level form whose read invoked RECOVER is recorded in RECOVERED with
    its range and the condition text, and is NOT placed in FORMS. Recovery
    advances the reader to the next top-level form; it never makes the damaged
    form trustworthy.

  That is the CON-0001-safe reading of "partial rather than total": the file
  yields the definitions around the damage, the damage itself is a recorded gap
  with a line range someone can open, and nothing invented is asserted. FATAL
  and the existing MAKE-UNPARSABLE-FILE-ENTITY path survive for the file that
  cannot be read at all, which is still the right answer for that case (SS9.3).

  Read-eval, per REQ-0019 R4. ECLECTOR.READER:EVALUATE-EXPRESSION is
  specialized to refuse: it records a skip with reason :READ-EVAL and declines
  to evaluate. The analyzer's identity is unchanged and now enforced by a method
  Loom wrote rather than by a special variable it binds -- strictly stronger,
  since a client that cannot evaluate cannot be talked into it by a dynamic
  rebinding somewhere up the stack.

  Feature expressions, per REQ-0019 R5. The client's feature policy is an
  explicit list, defaulting to the host's *FEATURES* so that the parity step
  changes nothing, and material skipped under it is recorded through
  ECLECTOR.PARSE-RESULT:MAKE-SKIPPED-INPUT-RESULT (client stream reason children
  source) -- whose REASON argument is precisely the discrimination CON-0001
  wants, distinguishing a feature-suppressed form from a comment from a
  read-eval refusal. Making the policy something other than the host's default
  is a separate decision with an entity-count consequence, and this document
  deliberately does not take it; it builds the mechanism and the report, and
  leaves the policy at parity. Whoever changes it owns the count movement.

  Reader macros, which are the one class of form kind a reader is entitled to
  know. #'f reads as (FUNCTION F) and 'x as (QUOTE X), and today nothing
  downstream can tell either from a list that merely looks like one.
  COLLECT-CALL-NAMES' own docstring records the consequence: a one-argument
  (some-pkg:function g) matches its quotation test and contributes "g",
  accepted deliberately under PLAN-0011 R-7 because "the analyzer holds no
  package knowledge to do better." The QUOTE test one line above is
  package-blind in the same way, and there the cost runs the other direction --
  (some-pkg:quote x) is taken for quoted data and everything inside it goes
  unwalked, a silent miss rather than a visible false positive.

  ECLECTOR.READER:WRAP-IN-FUNCTION and WRAP-IN-QUOTE are the client's to
  specialize, so reader-produced quotation can be marked as such. The spelling
  that changes least: the wrapped form stays exactly (FUNCTION F) and (QUOTE X)
  so the walk's existing clauses still fire, and the cons is additionally
  recorded in a READER-MACRO table beside SPANS. COLLECT-CALL-NAMES then asks
  the table rather than comparing a name, and both imprecisions go away at
  once. This is the only place in the design where the walk's output changes
  rather than staying at parity, which is why it is R12 and lands after R8's
  parity step instead of inside it.

  src/analyzer/lisp-analyzer.lisp. Four functions deleted. ANALYZE-FILE's pass
  0 calls READ-SOURCE and keeps the READING in a local, so passes 1 and 2 can
  reach FORM-RANGE; its HANDLER-CASE narrows to the FATAL case because
  everything else is now recovered rather than signalled.
  GENERIC-DEFINITION-ENTITIES drops its :CONTENTS and :START-OFFSET arguments
  and asks FORM-RANGE for each clause's range, which is the same contract
  DES-0010 R4 declared with a mechanism that cannot return NIL for a block
  comment.

  Pass 1's dispatch becomes a table, and this is the one part of the design
  that is not about the reader at all. Today the COND asks DEFINITION-P up to
  ten times per top-level form -- in-package, defun, defmacro, defvar,
  defparameter, defclass, define-condition, defstruct, defgeneric, defmethod --
  and DEFINITION-P is (STRING= (TOKEN-NAME (CAR FORM)) HEAD) where TOKEN-NAME
  is (STRING-DOWNCASE (SYMBOL-NAME X)). The same downcased string is therefore
  allocated and discarded up to ten times per form, on every file, on every
  reindex. It becomes: compute the head name once, look it up in
  *DEFINITION-DISPATCH*, a table from head name to a handler taking the form
  and its context, and fall through to the definer-call-site clause on a miss.

  The allocation is the smallest of three reasons. *DEFINITION-HEADS* exists as
  a separate list because the same set answers a second question -- which
  top-level forms are not call sites -- and its docstring states the obligation
  in so many words: "Adding a clause to that COND means adding its head here",
  with the failure named as "a DEFUN being offered to the macro registry". A
  table makes *DEFINITION-HEADS* the table's own keys, so the two cannot
  disagree and the obligation disappears rather than being restated somewhere
  else. And the COND's first clause carries a comment defending its position --
  IN-PACKAGE is first "so no later clause can shadow it" -- which is an
  ordering hazard a keyed lookup cannot have.

  It is behaviour-preserving and it is deliberately not folded into the reader
  change. It lands as its own step with its own parity assertion (R13), because
  R8's whole claim is that the tree is the same tree, and a count that moves
  should be attributable to one of the two changes rather than to both at once.

  READER-ARTIFACT-P and *READER-ARTIFACTS* stay, and their justification
  improves. They exist because SBCL expands a backquote into
  (SB-INT:QUASIQUOTE ...), "a real symbol in a real package", so every template
  macro claimed to call something named quasiquote. Under this design the
  backquote representation is the client's to choose, so the filter stops being
  a workaround for one implementation's spelling and becomes a statement about
  what Loom chooses to index. The list does not change; the docstring's second
  paragraph does.

  loom-analyzer.asd gains #:eclector. Pure Common Lisp, in Quicklisp, no FFI,
  which is REQ-0019 R8 -- and worth stating against the comment already in that
  file flagging cl-yaml's libyaml binding as "the only FFI dependency in the
  system." It remains the only one.

  VERIFIED BEFORE PLANNING

  Every mechanism above was spiked against Eclector 0.12.0 under /usr/bin/sbcl
  on 2026-08-09, before PLAN-0013 was written, because a design whose central
  claim is "the library will hand us X" is worth an hour of confirming. Six
  findings, of which two correct this document and one is load-bearing.

  Confirmed as designed. MAKE-EXPRESSION-RESULT returning its RESULT argument
  yields an ordinary s-expression -- (#:DEFUN #:FOO (#:X) (#:BAR #:X)) -- with
  a span recorded for every cons at every depth, the inline (:METHOD ...)
  clause of a DEFGENERIC included. Package prefixes arrive as strings on the
  symbol. Keywords stay keywords, and (in-package :|Loom-Graph|) still yields
  SYMBOL-NAME "Loom-Graph", so NORMALIZE-SYSTEM-NAME and the test asserting it
  are unaffected. A read-eval form is refused and costs only itself, the file
  still yielding its other definitions. WRAP-IN-FUNCTION and WRAP-IN-QUOTE
  populate a reader-macro table, so R12 is buildable as described.

  Two corrections to this document. SOURCE-POSITION is ECLECTOR.BASE's, not
  ECLECTOR.PARSE-RESULT's. And the SOURCE argument is a cons of character
  offsets, not lines -- (0 . 25) for a form spanning the first 25 characters --
  so the SPANS table above is populated by converting through OFFSET-LINE in
  the client. That is where the conversion belongs anyway, since OFFSET-LINE
  lives in analyzer.lisp and is already shared with the YAML analyzer, but the
  table's stated value type was wrong.

  The block-comment case, which is the one ELEMENT-SPANS returns NIL for today,
  parses cleanly: a #| |# between a DEFGENERIC's lambda list and its (:METHOD
  ...) clause is reported as a skipped region with reason :BLOCK-COMMENT and
  every clause keeps its own span. R1's claim about retiring DES-0010's
  fallback is therefore measured rather than asserted. Feature-suppressed
  material likewise arrives with the feature expression itself as the reason --
  ((:SHARPSIGN-PLUS . #:NO-SUCH-FEATURE) (15 . 47)) -- which is richer than R5
  asked for; the client must drop the nested *READ-SUPPRESS* results, since a
  suppressed form's every subform produces one.

  An implementation trap worth more than the rest of this section. The
  restart-invoking HANDLER-BIND must be established INSIDE the HANDLER-CASE
  that guards the read loop, not outside it. Handlers run innermost first, so
  with the nesting the other way the HANDLER-CASE unwinds before the
  ECLECTOR.READER:RECOVER restart is ever looked for, and the symptom is not an
  error -- it is the rest of the file silently not being read. This was got
  wrong twice while spiking and diagnosed only by comparing against a working
  case, which is exactly the shape of defect that reaches production.

  And the finding that makes R4 necessary rather than cautious. Recovery from
  an unterminated list does not merely skip: reading

      (defun a () 1)
      (defun b () (oops
      (defun c () 3)

  recovers into two forms, the second being
  (#:DEFUN #:B NIL (#:OOPS (#:DEFUN #:C NIL 3))) -- C's definition swallowed
  whole into B's body. Offered to pass 1 that mints a :FUNCTION named b whose
  range covers text defining c, and c disappears from the index. No count
  moves; the entity simply describes the wrong thing. ALTERNATIVES below
  predicted this shape and R4 forbids it on principle; it is now a measured
  case with a fixture waiting to be written from it. The stray-close-paren case
  by contrast recovers perfectly -- both real definitions survive and the paren
  is recorded as a skipped region -- which is why R3's promise is worth keeping
  and R4's restriction is what keeps it honest.

  WHY DEFINITION-P SURVIVES

  The obvious question on reading the diff, answered here because the document
  would otherwise invite it: if the reader is being replaced, why does the
  ten-clause DEFINITION-P chain not go away with it? A parse result knows what
  kind of thing each form is, surely.

  It does not, and no conforming reader can. Eclector's CST taxonomy is two
  classes, CONS-CST and ATOM-CST. There is no DEFUN node. Common Lisp's reader
  grammar admits lists, symbols, numbers, strings, characters, vectors and
  reader macros, and DEFUN is none of those -- it is an ordinary symbol at the
  head of an ordinary list, which acquires meaning from a macro the evaluator
  holds and which any file is free to shadow. A reader asserting that
  (defun foo (x) ...) defines a function would be claiming knowledge it is not
  entitled to.

  The distinction between the two things this design touches is worth stating,
  because from outside they look like the same kind of gap. ELEMENT-SPANS was a
  workaround for a real deficiency in CL:READ, which reports positions for
  top-level forms and for nothing nested inside them; a conforming reader that
  reports them is a strictly better answer to a question that was always well
  posed. DEFINITION-P is not a workaround for anything. It is the complete and
  correct classification of a Lisp top-level form short of macroexpansion, and
  the head symbol genuinely is the type tag. Replacing the first is progress.
  Replacing the second is not available.

  A compiler front end would not supply it either. Cleavir's AST has SETQ-AST,
  CALL-AST and FUNCTION-AST: it expands DEFUN away into a function binding over
  a lambda, so recovering "this was a DEFUN" means reverse-engineering the
  expansion -- worse than reading the head symbol, at the price REQ-0019's
  closing section already refuses to pay.

  The comparison worth carrying forward, since a second language is coming:
  classifying a top-level form costs ten string comparisons here, where a
  TypeScript analyzer will need a grammar with hundreds of productions to
  answer the same question. The uniformity that denies the reader a DEFUN node
  is the same uniformity that makes the classification trivial. R13's table
  de-duplicates that classification and makes its head set single-sourced; it
  does not replace it, and nothing ever will.

  WHAT THIS SUBSUMES, AND WHAT IT DOES NOT

  DES-0010, partially, and it is the only prior architecture this touches.
  Its R2 -- ELEMENT-SPANS reading a form's elements under the same reader
  environment on the same whole-content stream -- is retired outright: the
  function is deleted and no replacement re-reads anything. Its R1 is preserved
  rather than retired, since FORMS keeps the widened tuple. R3 through R8 are
  untouched: METHOD-ENTITY-FROM-TAIL remains the single copy of tail parsing,
  GENERIC-DEFINITION-ENTITIES still returns interface-plus-methods, inline
  clauses still get :CALL-NAMES, and REQ-0012 stays satisfied. So DES-0010
  keeps status `implemented' -- its requirement is still met, by different
  machinery -- and the implementing plan owes it an OUTSTANDING note recording
  that R2's mechanism was replaced. The document should not be edited in place
  beyond that: on DES-0007's precedent, the argument and its correction are
  worth more next to each other than the corrected claim alone.

  Two obligations DES-0010 imposed on the future are discharged by this
  design rather than inherited. "Anything touching READ-FORMS-WITH-SPANS must
  preserve the start-offset element and the whole-content-stream property
  ELEMENT-SPANS also depends on" -- the second half becomes moot, because there
  is no second read for FILE-POSITION to be ambiguous about, which was the
  hazard two docstrings spent sixty lines on.

  DES-0009 is extended, not subsumed, and the distinction matters enough to
  state. IN-PACKAGE tracking remains the sole source of :SYSTEM; the PACKAGES
  table records something different -- the prefix a call site wrote, which is
  evidence about which definition is meant, not about which system a definition
  belongs to. Feeding one into the other would be a second, disagreeing answer
  to a question DES-0009 settled. Explicitly out of scope.

  DES-0011 is not subsumed and this design does not reduce its value. A reader
  produces pre-macroexpansion structure; the 476 image-minted definitions the
  enrichment pass contributed on this tree are invisible to any parser. One
  interaction is load-bearing and belongs in the risk list rather than here:
  DES-0011 R5's fixture asserts that the text pass and the image pass compute
  identical natural keys. Parity (REQ-0019 R7) is what keeps that fixture green,
  and it is the sharpest single reason parity is a requirement rather than a
  preference.

  DES-0012 is unaffected in mechanism and slightly improved in outcome.
  SUPERSEDE-SHADOWED-DEFINITIONS runs over whatever pass 1 produced, and a
  recovered form contributes no definition, so nothing can be shadowed by
  damage. Where today a file whose *later* same-key definition fails to read
  loses every definition in the file, it now keeps the earlier one -- which is
  wrong about what the file defines once loaded, but the file does not load, and
  a recorded gap beside a real definition beats an empty file.

  DES-0002's definer call sites are untouched. The PACKAGES table would let a
  call-site entry record the prefix a definer macro was written with, which is
  the input a future disambiguation pass wants; nothing here does it.

  WHICH BUGS THIS RESOLVES

  None. That is the honest answer and it should stay in the document, because
  the temptation on a change this size is to collect adjacent defects into the
  justification.

  Checked one at a time. BUG-0002 (find caps at twenty) is loom-knowledge.
  BUG-0009 (RULE-0002 and RULE-0003 false positives) is rule authorship and
  system identity. BUG-0012 (a collided entity's edges are a union) is absorb
  semantics in the writer, and DES-0012 already owns the analyzer half.
  BUG-0013 (affects: unread outside decisions) is the document resolver.
  BUG-0015 (RESOLVE-CALLS erases the :SOURCES union) is DEC-0003's re-derivation
  colliding with edge properties. BUG-0016 (DEFINE-OPERATION defines nothing the
  ontology models) is a modelling question about runtime registrations, and its
  42 orphaned call names have nowhere to land regardless of how well the file
  was read. BUG-0018 (:TESTS reachability overclaims) is a counting question in
  the knowledge layer. None of the seven moves.

  BUG-0017 deserves its own paragraph because it is the one a reader change
  looks like it should fix and does not. Its cause is upstream of any reader:
  ANALYZE-FILE hands NOTE-DEFINITION no :BODY for DEFVAR, DEFPARAMETER, DEFCLASS
  or DEFINE-CONDITION, and a DEFUN's body is (cdddr form), which starts after
  the lambda list. The designator in (defparameter *hook* #'default-hook) is
  read perfectly well today and is never walked. Its open question -- whether a
  :VARIABLE may be the source of a :CALLS edge -- is an ontology question this
  design does not touch. What does improve is the cost of the *other* candidate
  fix: walking a lambda list's defaults but not its parameter names requires
  distinguishing the two, and a spans table plus written-package information
  makes the resulting entity's range and provenance exact rather than
  approximate. Cheaper afterwards, not fixed by it.

  What this does close is three gaps that were disclosed in docstrings and never
  filed, which is its own small indictment: ELEMENT-SPANS' two NIL shapes (a
  block comment before a closing paren; a top-level DEFGENERIC behind a reader
  macro), and the all-or-nothing file loss on a single malformed form. The
  fourth -- that the index depends on the analyzing implementation's *FEATURES*
  and records nothing about it -- is disclosed nowhere at all, and the
  implementing plan should file it as a bug before fixing it, so the gap exists
  on the record independently of the change that closes it (CON-0001, and
  BUG-0017's own lesson about a FIX narrower than its SYMPTOM).

  The one requirement this supplies an input to rather than satisfying is
  REQ-0015. 241 qualified operator occurrences in this tree, 30 distinct ones
  naming in-tree functions, currently reduced to bare names before RESOLVE-CALLS
  sees them. After this, the prefix is available. Deciding what resolution does
  with it -- prefer the qualified match, or rank candidates by it -- is
  REQ-0015's question and is deliberately not answered here.

  ALTERNATIVES CONSIDERED

  Use ECLECTOR.CONCRETE-SYNTAX-TREE and hand (CST:RAW node) to the walk. This
  was the staging plan sketched before the walk was counted, and it is worse
  than it looks. CST:RAW reconstructs a fresh s-expression from the CST, so the
  conses the walk sees are not the conses the CST holds, and mapping a sub-form
  back to its node requires walking both trees in parallel -- which is
  ELEMENT-SPANS' alignment problem returning in a new costume, including its
  failure mode of misattributing a range on mismatch. Building the raw tree
  directly and keying spans off its own conses has no alignment step to get
  wrong. The CST system is the right tool for a consumer that wants to keep the
  tree; Loom wants the sexp and the ranges, which is what the lower-level
  parse-result protocol is for.

  Replace symbols with a SOURCE-SYMBOL struct carrying name and package. The
  honest modelling, and rejected on blast radius: twenty sites in one file test
  SYMBOLP or KEYWORDP, several inside COLLECT-CALL-NAMES clauses whose exact
  shape is the fixed form of BUG-0011, and every one would need re-argument. It
  also fails REQ-0019 R9 outright -- there is no intermediate state in which the
  reader has moved and the walk has not. The side table gets the same
  information to the same consumers with none of that, and a later change can
  still promote it if a second consumer ever wants package-qualified names in
  the tree itself.

  Keep interning into a throwaway package and record prefixes alongside.
  Rejected: it keeps the per-file package churn REQ-0019 R6 exists to remove and
  the DELETE-PACKAGE in an UNWIND-PROTECT that goes with it, and buys nothing
  the uninterned policy does not, since nothing downstream needs a home package.

  Keep ELEMENT-SPANS as a fallback when the spans table misses. Rejected: the
  table misses only for a non-cons and for shared structure, and the re-read
  answers neither -- it would be dead code that looks like a safety net. The
  declared fallback stays what DES-0010 chose, the containing form's range.

  Trust recovered forms and offer them to pass 1. Rejected on the mechanism
  above: a recovered read can merge two definitions, and an entity minted from
  one carries a plausible range over text that does not define it. That is the
  fabricated fact CON-0001 forbids, and it would be undetectable in the index --
  no count moves, the entity simply describes the wrong thing.

  Let the reader classify definitions and delete DEFINITION-P. Rejected on the
  mechanism set out under WHY DEFINITION-P SURVIVES: Eclector's node taxonomy
  is two classes, no conforming Common Lisp reader knows what a DEFUN is, and
  the only thing that would know is a macroexpander this design refuses on
  REQ-0019's stated grounds. Recorded as an alternative rather than left
  implicit because it is the first thing a reader of this document will ask.

  Leave the DEFINITION-P chain alone and do the reader change only. The
  conservative option, and rejected on the grounds that the pass is already
  rewriting ANALYZE-FILE's pass 0 and the DEFGENERIC branch, so pass 1's
  dispatch is being read closely by the same person in the same week. The
  synchronisation hazard *DEFINITION-HEADS* documents is cheap to remove now
  and expensive to remember later. The parity objection is real and is answered
  by sequencing rather than by deferral: two steps, two assertions (R8, R13).

  Port the four functions to fix their known holes without a dependency.
  Rejected on the second-tree argument REQ-0019 makes: block comments and
  reader macros are two of the shapes found by probe, and the reason to take a
  conforming reader is the shapes nobody has probed for. Hand-maintaining a
  reader is the trap REQ-0018's opening paragraph names, one language down.

  Adopt Eclector for the .asd files as well and stop there. Not an alternative
  so much as a smaller scope, and rejected because .asd files are the least of
  it -- they are read by the same analyzer through the same path, and splitting
  the reader by file type would mean maintaining both.

  REQUIREMENTS

  R1  src/analyzer/lisp-reader.lisp is the only file naming ECLECTOR. No symbol
      from any ECLECTOR package appears in lisp-analyzer.lisp, in any other
      analyzer, or above loom-analyzer. loom-analyzer.asd gains #:eclector and
      no other dependency, and gains no FFI.

  R2  READ-SOURCE returns a READING carrying FORMS in today's four-element
      tuple, a SPANS table keyed by cons, a PACKAGES table keyed by symbol,
      ordered SKIPS with a reason per entry, ordered RECOVERED entries with
      condition text and range, and FATAL. MAKE-EXPRESSION-RESULT returns its
      RESULT argument unchanged, so the expression tree is an ordinary
      s-expression and no wrapper reaches the walk.

  R3  Symbols intern in KEYWORD when the site wrote a keyword and are
      uninterned otherwise. No other package is created, interned into, or
      deleted by analyzing a file. A written package prefix is recorded in
      PACKAGES; :CURRENT and an absent prefix record nothing.

  R4  A top-level form whose read invoked RECOVER is recorded in RECOVERED and
      is not placed in FORMS. Recovery advances the reader and never yields a
      form to pass 1. FATAL and MAKE-UNPARSABLE-FILE-ENTITY remain the answer
      for a file that cannot be read at all.

  R5  EVALUATE-EXPRESSION refuses and records a skip with reason :READ-EVAL.
      Loom's image evaluates no form of target code, enforced by a method
      rather than by a bound special variable.

  R6  The feature policy is explicit on the client and defaults to the host's
      *FEATURES*, so this change moves no entity count. Feature-suppressed
      material is recorded through MAKE-SKIPPED-INPUT-RESULT with its reason.
      Changing the policy away from the default is out of scope and is named as
      such.

  R7  ELEMENT-SPANS, READ-FORMS-WITH-SPANS, SKIP-WHITESPACE-AND-COMMENTS and
      INTERN-FOREIGN-SYMBOL-LOCALLY are deleted, not deprecated.
      GENERIC-DEFINITION-ENTITIES takes the READING instead of :CONTENTS and
      :START-OFFSET and obtains each clause's range from FORM-RANGE, keeping
      DES-0010 R4's declared fallback.

  R8  Parity, asserted by test and not by inspection. On this tree the entity
      count, the relationship count and every entity id are unchanged, the full
      suite is green, and `check' reports what it reports today modulo
      BUG-0009's known false positives. A test asserts that DES-0011 R5's
      key-equality fixture still holds, since a rendering drift there turns
      upserts into duplicate entities. Parity is asserted twice, once after the
      reader change and once after R13's dispatch table, so a count that moves
      is attributable to one change rather than to two.

  R9  Tests per CON-0003, each failing without the change: a fixture whose
      second top-level form has an unbalanced paren, asserting the first and
      third definitions exist and the damage appears in RECOVERED with a range;
      a fixture calling (utils:parse-config), asserting FORM-PACKAGE returns
      "utils" for that symbol; a fixture DEFGENERIC with a block comment before
      its closing paren, asserting each inline clause gets its own range rather
      than the form's -- the case ELEMENT-SPANS returns NIL for today; and a
      fixture containing a read-eval form, asserting the file yields its other
      definitions and one skip with reason :READ-EVAL.

  R10 Indexing time is measured before and after on both trees and reported.
      Eclector is a portable reader dispatching in Lisp where SB-IMPL's is
      native, so it is expected to be slower, and `watch' is the command whose
      seconds-scale budget users already feel. A regression large enough to
      change how `watch' feels is a result this design has to answer for, not a
      detail -- see the risk below.

  R11 Documentation: CLAUDE.md's analyzer notes and the loom skill say that a
      malformed form now costs a form rather than a file, and `status' reports
      the skip and recovery counts alongside the unresolved counts it already
      carries. Per DES-0008 R7's precedent, doc obligations are named rather
      than implied.

  R12 The client marks reader-produced quotation. #'f and 'x are recorded in a
      READER-MACRO table beside SPANS, and COLLECT-CALL-NAMES consults it
      instead of comparing a name, so a literal (some-pkg:function g) no longer
      contributes "g" and a (some-pkg:quote x) no longer suppresses the walk of
      its own contents. This is the one requirement that changes the walk's
      output: it lands after R8's parity step, and its effect on call-name and
      :CALLS counts is measured and reported rather than absorbed into the
      reader change's numbers.

  R13 Pass 1 dispatches through *DEFINITION-DISPATCH*, a table from head name
      to handler, computing the head name once per form and falling through to
      the definer-call-site clause on a miss. *DEFINITION-HEADS* becomes the
      table's keys rather than a parallel list, discharging the synchronisation
      its docstring currently makes the reader responsible for. The table
      refuses a duplicate key at construction. Behaviour-preserving, landing as
      its own step with its own parity assertion per R8, and the
      IN-PACKAGE-first ordering comment is deleted rather than carried forward,
      since a keyed lookup cannot be shadowed.

  RISKS

  Indexing gets slower and `watch' feels it. The one risk that could sink the
  design rather than complicate it. 171 files index in a few seconds today and
  the monitor's poll cycle is built around that. Eclector is portable Common
  Lisp doing character dispatch where SBCL's reader is compiled native, and the
  parse-result protocol adds a generic call per form. R10 makes the measurement
  an acceptance criterion rather than a hope. If it lands badly the fallback is
  narrow and known: read with the host reader for the FORMS list and invoke
  Eclector only for files that fail or for forms whose sub-ranges are wanted --
  ugly, a partial return to two readers, and worth naming now so it is a
  decision rather than a scramble.

  Recovery quality is Eclector's, not Loom's. R4 makes a recovered form
  untrusted, which bounds the damage to a missed definition rather than a wrong
  one, but the *number* of definitions a single stray paren costs depends on
  how far the library's strategy skips. Unmeasurable without a corpus of broken
  files; the R9 fixture establishes the shape, not the rate.

  The dispatch table turns an ordering into a lookup, and orderings can hide
  intent. A COND tries its clauses in sequence, so a form matching two heads
  takes the first; a table takes the only one. The two agree if and only if no
  head appears twice, which is true today and is exactly the sort of property
  that stays true by accident. So the table must refuse a duplicate key at
  construction rather than let a later entry overwrite an earlier one -- the
  opposite of the replace-by-name semantics the four existing registries in this
  tree use, and deliberately so: those exist to be extended by third parties
  (REQ-0004), and this one exists to be exhaustive over a fixed set the analyzer
  owns. Getting that backwards would convert a duplicated head from a
  load-time error into a silently dropped definition kind.

  A skipped form cannot shadow, and that changes a fact about the file. Covered
  under DES-0012 above; the outcome is more correct rather than less, but any
  test asserting supersession over a file with damage in it will need to say
  which definitions it expects.

  CONSEQUENCES

  Code that changes: one new file; four functions deleted from
  lisp-analyzer.lisp; ANALYZE-FILE's pass 0 and the DEFGENERIC branch adjusted;
  pass 1's COND replaced by *DEFINITION-DISPATCH* with *DEFINITION-HEADS*
  derived from it; COLLECT-CALL-NAMES' quotation and QUOTE clauses consulting
  the reader-macro table; one docstring paragraph rewritten on
  *READER-ARTIFACTS*; one line added to loom-analyzer.asd. No ontology change
  of any kind -- no new entity type, no
  new relationship type, no widened endpoint, no new property -- which is the
  same claim DES-0010 was able to make and for the same reason: this is the
  analyzer's own machinery, and the graph has no opinion about how a file was
  read.

  What gets simpler later. Sub-form ranges stop being a design problem. Every
  container form that has been waiting for one -- DEFCLASS slot accessors,
  MACROLET and FLET and LABELS, definitions under EVAL-WHEN or a top-level
  PROGN -- becomes a FORM-RANGE call rather than another DES-0010. That is the
  single largest thing this buys, and it is worth more than any of the four
  capabilities REQ-0019 enumerated.

  The obligation every future change carries. TOKEN-NAME's contract now rests
  on symbols being uninterned everywhere except KEYWORD: anything that starts
  comparing a symbol with EQ, or reading its home package, breaks silently and
  in a way no count would reveal. The parity test in R8 is the guard, and the
  reason it asserts ids rather than counts. Adding a definition kind is now one
  entry in *DEFINITION-DISPATCH* and nothing else -- no COND clause, no second
  edit to *DEFINITION-HEADS* -- and the table's duplicate-key refusal is what
  keeps that from becoming a way to lose a definition kind quietly.

  Deferred, on the record: the feature policy moving off the host default (R6);
  recording call-site package prefixes onto DES-0002's definer call sites;
  teaching RESOLVE-CALLS to use FORM-PACKAGE, which is REQ-0015's and stays
  with it; and the reference-node model for call sites, which would give the
  prefix a place to live as a property rather than a side table, and which
  should be argued against BUG-0016, BUG-0017 and REQ-0015 together rather than
  folded in here.

  AS IMPLEMENTED

  PLAN-0013's nine steps all landed, 2026-08-09. Every requirement R1-R13 is
  met. What follows is where the implementation and this document disagree,
  kept beside the argument rather than edited into it, on the DES-0007
  precedent this document cites for DES-0010.

  Four corrections of fact.

  The client class is LISP-READER-CLIENT, not LOOM-LISP-CLIENT. A cosmetic
  divergence, recorded because the affects: list above resolves against the
  index and the wrong name would resolve to nothing.

  CONSEQUENCES claims "no ontology change of any kind -- no new entity type, no
  new relationship type, no widened endpoint, no new property." The first three
  hold; the fourth does not. Four properties were added, and each is a
  requirement of this document arriving somewhere it can be read:
  :SUPPRESSED-REGIONS and :RECOVERED-REGIONS on :FILE (R6 and R4's reporting
  halves, PLAN-0013 step 5), and :QUALIFIED-CALLS on :FUNCTION and :METHOD (R2
  reaching the graph, step 6). The claim was true of the reader change proper
  and false of the plan that carried it; a capability whose output goes nowhere
  is not a capability.

  R11 asks `status' to report skip counts. It reports SUPPRESSED counts, which
  is a narrower thing and deliberately so. Skips are the reader's whole
  passed-over channel and comments come through it: measured on this tree,
  4513 line comments against 2 feature-suppressed sites. Reporting skips
  undifferentiated would have buried the two that mean a definition is missing
  under four and a half thousand that mean nothing at all -- BUG-0009's failure
  in a new place. SKIP-SUPPRESSES-SOURCE-P draws the line and is stated as an
  exclusion, so a reason nobody has met yet is reported rather than dropped.

  The bug this design said to file before fixing is BUG-0019, and it was filed
  after. Recorded in the bug itself rather than smoothed over.

  One defect found by building it. The recovery classifier marked exactly one
  repair per form as having cost a form, via a single FIND-IF over the repairs.
  An unterminated list signals twice at end of input -- once for the inner list,
  once for the outer -- and both are damage to the same form, so the second was
  recorded as having cost nothing. :COST is what a reader of
  :RECOVERED-REGIONS uses to tell "a definition is missing here" from "the
  reader stepped over some junk", so a repair mislabelled :NOTHING is a gap
  that reads as harmless. Classified per repair now, and asserted by
  A-REPAIRED-FORM-MINTS-NOTHING-AND-SAYS-WHAT-IT-COST.

  Measured, against what this document and PLAN-0013 predicted.

  R10, the risk that could have sunk the design. Reading the whole tree costs
  0.140s against the host reader's 0.016s -- nine times slower in the read
  phase, and 0.12s absolute on a full 177-file index whose wall time is 2.4s
  including SBCL startup and compilation. `watch' cannot feel it and the
  fallback DES-0013 named is not needed. Worth recording why the ratio is
  survivable: it very nearly was not. Eclector reports a position for every
  cons at every depth, 21411 of them here against 1521 top-level forms, and
  OFFSET-LINE is linear in the offset -- free when the only caller asked once
  per top-level form, quadratic when it is asked for every cons. That cost 5.25
  seconds. BUILD-NEWLINE-INDEX and a binary search took it to 0.14. The
  conclusion the first measurement invited -- that Eclector is slow -- was
  wrong: Eclector reading this tree and recording nothing takes 0.09s, less
  than half what the host reader takes.

  R12's delta is zero. Old logic and new logic over every body in this tree
  both yield 8551 call names, because this tree writes neither
  (some-pkg:function g) nor (some-pkg:quote x). The measurement is the point
  rather than the number: PLAN-0013 asked for it reported either way, and a
  step that changes the walk's output deliberately has to say by how much.

  R2's occurrence count is 224 qualified operator occurrences over 76 distinct
  qualified names across 20 packages, where PLAN-0013's baseline said 241 and
  30. The tree moved under the plan -- files added, four functions deleted --
  so the numbers are not comparable and neither is wrong.

  The two reader-conditional sites are two, not the five PLAN-0013 step 7
  predicted. Both are #-, both now reported on `status'' unread line.

  One thing this design got right that was worth the words. The claim that
  parity is the default rather than an achievement held: no natural key moved,
  DES-0011 R5's key-equality fixture never went red, and every count that
  moved across nine steps was accounted for by the source those steps added or
  deleted -- 4 deleted functions, 6 deleted tests, one deleted test fixture at
  step 4, and new source thereafter. The alternative designs under ALTERNATIVES
  would each have made that something to argue rather than observe.
