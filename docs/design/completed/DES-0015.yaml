id: DES-0015
title: A callable is identified by the symbol it names, not the string it spells, so package identity is resolved before anything is keyed on a name
status: implemented
date: 2026-08-10
refines: [BUG-0021, REQ-0020]
affects: [callable-index, call-targets, resolve-calls, normalize-system-name,
          in-package-argument-name, handle-in-package, analyze-file,
          collect-call-names, entity-system, make-call-site-entity,
          resolve-generated-definitions, entity-natural-key, derive-id]
tags: [ontology, analyzer, graph, packages, clos, resolution, con-0001,
       game-server, blind-spot]
summary: |
  CALLABLE-INDEX keys candidates on (string-downcase name), so two definitions
  are the same callable when they are spelled the same. In Common Lisp they
  are the same callable when they name the same symbol, and the two questions
  diverge badly: measured here, 3.1% of Loom's :CALLS edges land on a
  package-spanning name against 55% of game-server's -- 7085 of 12884. The
  design is to resolve symbol identity first and key on it: the analyzer
  records the package in effect at each form and each package declaration it
  reads, the graph assembles the package graph and computes each name's home
  package through the three routes CL actually provides, and CALLABLE-INDEX is
  keyed on (home-package, name). The load-bearing constraint is that the naive
  version of this is a regression rather than a fix: keying on the package a
  definition was WRITTEN in would split CL:PRINT-OBJECT's ten definitions
  across seven packages into seven unrelated generics, breaking dispatch that
  works today. Inheritance is not optional. This document predicted that all 18
  of Loom's ambiguous call sites, being package collisions, would stop being
  minted; measured after implementation, 16 survive, because three of the four
  names are written in packages that use :FIVEAM and HOME-PACKAGE refuses to
  place a name it might be inheriting from a package the tree does not declare.
  The OUTSTANDING section carries that correction and the rest of the numbers.
body: |
  MEASURED FIRST

  Both trees, /usr/bin/sbcl, 2026-08-10, before any of this was designed, by
  tools/package-census.lisp, which takes a repository path and is re-runnable
  after every step of whatever plan implements this. Its caveat is stated
  below.

                                            Loom      game-server
      files scanned                           85              134
      package declarations                    24               41
        defpackage                            24               10
        uiop define-package                    0               31
        declaring nicknames                    0               28
        with :import-from                      0               31
        with :export                          19               39
        with :shadow / :shadowing-import       0                0
      in-package forms                        72              116
        naming a nickname                      0                5
        files with more than one in-package    0                0
      distinct symbol names imported by name   0              227

      callable names (fn/method/interface)   789             1091
        defined once                         769              862
        defined more than once                20              229
        spanning 2+ packages                  11               95
      :calls edges                          3844            12884
        landing on a package-spanning name   120             7085
                                           3.1%              55%

  The 3.1% against 55% is the whole argument for doing this, and it is the
  fourth instance of DES-0014's own observation that a mechanism can be
  correct against Loom and wrong against game-server. Loom uses :import-from
  zero times and declares no nicknames; game-server uses uiop's DEFINE-PACKAGE
  three times more often than DEFPACKAGE, declares nicknames in 28 of 41
  packages, and imports 227 distinct symbol names. A design validated here
  would model none of what is actually in use there.

  CAVEAT ON THE CENSUS, stated because it bounds two of the numbers. The
  package half text-reads each file with READ under *READ-EVAL* NIL and stops
  at the first condition, so 11 of Loom's 85 files and 87 of game-server's 134
  were not read to the end. Package declarations and IN-PACKAGE forms sit at
  the top of a file and are believed complete; anything counted from deeper in
  a file is a floor. The index half has no such limit -- it reads Loom's own
  graph -- so the callable and :calls figures are exact.

  THE PROBLEM

  CALL-TARGETS asks CALLABLE-INDEX for the candidates of a name and the index
  is keyed on (string-downcase name) (src/graph/resolve.lisp:681). Every
  definition spelled alike is a candidate, so the candidate set is a set of
  spellings and the question CALL-TARGETS then asks of it -- one function? a
  fan-out? an ambiguity? -- is asked of the wrong set.

  BUG-0021 records the two shapes this produces. On game-server `id' has six
  definitions in six different files and resolves to nothing, because six
  candidates match no clause. `cascade-delete' resolves to a DEFGENERIC's
  inline default method that returns NIL while the accessor that answers is
  invisible. Neither is an ambiguity and neither is served by DES-0014's
  ambiguity machinery.

  WHAT A SYMBOL IS, AND WHY :SYSTEM IS NOT IT

  BUG-0021's FIX section states the three routes -- import, inheritance
  through :use of another package's exported symbols, and interning a fresh
  symbol in the current package -- and that rule is adopted here unchanged.
  What this document adds is why the information already in the index cannot
  stand in for it.

  Every entity already carries :SYSTEM, and DES-0009 makes the IN-PACKAGE
  chain its sole source: HANDLE-IN-PACKAGE (lisp-analyzer.lisp:1122) is "the
  only handler that changes the walk's state rather than its output" and
  returns a new SYSTEM threaded to every following form. So a per-form package
  designator is already computed, positionally, by machinery that exists. Two
  things stop it being the answer.

  NORMALIZE-SYSTEM-NAME (lisp-analyzer.lisp:251) folds the designator to a
  keyword and its docstring is explicit that it does no nickname resolution,
  "a nickname is declared by a DEFPACKAGE that RULE-0002 forbids an analyzer
  from reading beyond its own file, so folding one here would be CON-0001's
  fabricated fact. The literal canonical designator is recorded, gap and all."
  That is the correct decision and this design agrees with it: the analyzer
  records the literal, and canonicalisation happens where the whole tree is
  visible. It is also the reason game-server's 5 nickname IN-PACKAGE forms
  currently produce a second :SYSTEM for a package that already has one.

  The deeper reason is that the package a definition is WRITTEN in is not the
  home package of the symbol it defines. mpackage/filter.lisp is
  (in-package :mpackage.filter) and defines a slot reader ID, but filter.lisp
  imports ID from :mpackage/object, so the symbol is MPACKAGE/OBJECT:ID and
  the generic function extended is that package's. The census above keys by
  the writing package and therefore reports `id' as 6 definitions across 6
  packages; the true count of distinct symbols is smaller, and the difference
  is exactly what this design has to compute. Any scheme keyed on :SYSTEM
  would split one generic into six.

  THE REGRESSION THE NAIVE VERSION CAUSES

  This is the constraint that shapes everything below, and it was found in the
  census rather than reasoned out. On game-server PRINT-OBJECT has 10
  definitions across 7 packages. It is CL:PRINT-OBJECT, one symbol, reached in
  every one of those packages by inheritance because each of them does
  (:use :cl). Today the index merges the ten by spelling and CALL-TARGETS'
  method clause fans out across them, which is right by accident. Key on the
  writing package and they become seven unrelated generic functions with one
  or two methods each -- and every call to PRINT-OBJECT resolves to the subset
  in the caller's own package, which is wrong on purpose.

  So route 2 is not a refinement to add later. A design that implements
  import and interning but not inheritance makes the index worse than the
  string key it replaced, and does so silently, on exactly the CLOS-heavy
  trees this exists to serve. TO-ALIST at 20 definitions across 9 packages,
  GET-VALUE at 12 across 9, OBJ-DECODE at 24 across 7 are the same question
  asked 95 times.

  WHAT EACH THING BECOMES

  loom-ontology. :PACKAGE already exists (code-ontology.lisp:157) with natural
  key (:qualified-name), an :exports list and a :language, and is never minted
  from Lisp source because DEFPACKAGE sits in *DECLARATION-HEADS*
  (lisp-analyzer.lisp:429). It gains two properties and no new entity type:

    :nicknames        list of declared aliases.
    :imported-symbols list of (symbol-name . from-package-name).

  :IMPORTED-SYMBOLS is a property rather than a relationship or an entity per
  imported symbol, and the reasoning is DES-0014's own. A symbol is not an
  entity in this ontology and making it one costs a node per imported name --
  227 on game-server today, and unbounded on a tree that imports heavily --
  to answer a question that has somewhere else to live. :EXPORTS is already a
  list property on the same entity, so this is symmetric with what is there
  rather than a new idea. The natural key is unchanged: :qualified-name is the
  package's DECLARED name, and a nickname is an alias recorded on it, never a
  second :PACKAGE.

  The analyzer records and does not decide. It gains a DEFPACKAGE handler that
  emits a :PACKAGE entity from a DEFPACKAGE or a uiop DEFINE-PACKAGE, with its
  nicknames, :use list, :export list and :import-from clauses. This is a
  per-file fact -- a package declaration is a form in a file -- so it is
  squarely the analyzer's under DES-0002. It must handle both operators:
  game-server declares 31 of its 41 packages with uiop's DEFINE-PACKAGE, so
  DEFPACKAGE alone would read that tree as having no imports whatsoever.

  Every definition and every call name gains the package in effect where it
  was read, as the literal designator, under a new :PACKAGE property. :SYSTEM
  keeps its current meaning and derivation untouched, because DES-0009 built
  the layering rules on it and this design has no business moving them. The
  two are computed from the same IN-PACKAGE chain and diverge only in what
  they are for: :SYSTEM answers "which layer", :PACKAGE answers "which
  namespace".

  :CALL-NAMES is where this costs something. It is a list of bare strings and
  a name has to arrive at RESOLVE-CALLS with the package it was read in, or
  nothing downstream can recover it -- the file is not enough, because a file
  may change package part-way even though no file in either tree does today.
  The list becomes a list of (name . package) pairs. A :CALL-SITE's
  :CALL-NAME gains a :CALL-PACKAGE beside it rather than becoming a pair,
  because :CALL-NAME is a natural-key component and DES-0014's key must not
  change shape.

  The graph assembles and decides. A new pass, before RESOLVE-CALLS, builds
  the package graph from every :PACKAGE entity: canonicalise nicknames to
  declared names, resolve :use lists to canonical packages, and index each
  package's exports and imported symbols. Then HOME-PACKAGE (name,
  package-in-effect) applies the three routes in order -- an explicit import
  wins, then inheritance from a :use whose target exports the name, then the
  package in effect itself -- and returns the canonical package or NIL.

  This is the analyzer-records/graph-assembles seam DES-0014 R4 used for
  definer call sites, chosen for the identical reason: test/fixture.lisp is
  only (in-package :integration-test) with the declaration in
  test/package.lisp, so no single-file pass can resolve it, and RULE-0002
  keeps the analyzer from reading beyond its file. A second instance of one
  seam is an argument for the seam.

  CALLABLE-INDEX is keyed on (home-package, string-downcase name). Names whose
  home package is NIL -- a package declared outside the tree, an unresolvable
  :use, a shadowing clause -- go to a bucket keyed on the name alone and are
  reported, not guessed. CON-0001 is the whole of that decision: the index
  saying "I could not place this" is worth more than an index that placed it
  confidently in the wrong package, and BUG-0021 exists because the second
  kind of error is invisible.

  WHAT THIS DOES TO DES-0014, WHICH IS NOT OPTIONAL TO STATE

  All four ambiguous names on Loom are package collisions.
  FIXTURE-INSPECTION, LOG-EVENT and READ-INSPECTION-FILE each have two
  definitions in two packages, and DISCOVER-UNITS is :LOOM-ANALYZER against
  :LOOM-ANALYZER-TEST. Between them they are all 18 of the ambiguous call
  sites PLAN-0014 minted, which is the entire population DES-0014's REQ-0015
  mechanism has on this tree.

  Under this design they are not ambiguous. Each call reaches exactly one
  definition, the ambiguous call sites are not minted, and 36 edges at
  confidence 0.5 become 18 structural edges at certainty. That is a strict
  improvement and it is also an uncomfortable one, because it means the 18
  sites DES-0014 measured as its Loom result were an artifact of the defect
  this document fixes, and the confidence 0.5 on them was manufactured
  uncertainty about calls that were never uncertain.

  DES-0014's mechanism is not thereby wrong. game-server has 371 ambiguous
  occurrences and only some of them are package artifacts; a name with several
  plain functions in ONE package is genuinely ambiguous and is what the
  mechanism is for. But the implementing plan must predict the new ambiguous
  population on both trees before landing, and DES-0014's ceiling test will
  move -- probably down. A test whose number falls without anyone expecting it
  is how a silent regression enters, so it must be expected.

  REQUIREMENTS

  R1  :PACKAGE gains :nicknames and :imported-symbols. No new entity type, no
      new relationship type, and :qualified-name stays the declared name with
      nicknames as aliases recorded on it.

  R2  The analyzer emits a :PACKAGE entity for DEFPACKAGE and for uiop
      DEFINE-PACKAGE, carrying nicknames, :use, :export and every
      :import-from clause -- all of them, since a package may import from
      many. DEFINE-PACKAGE's additional symbol-moving clauses
      (:use-reexport, :mix, :recycle) are either handled or recorded as
      unhandled on the entity; they may not be silently dropped.

  R3  Every definition and every call name carries the package in effect where
      it was read, as the literal designator. :SYSTEM's meaning and derivation
      are unchanged, and DES-0009's layering rules must produce identical
      output before and after -- asserted by `check' reporting the same 32
      RULE-0003 lines and an empty RULE-0001.

  R4  A graph pass builds the package graph and computes HOME-PACKAGE through
      import, then inheritance via :use of an exported symbol, then the
      package in effect. Inheritance is required, not deferred: R7 is the test
      that proves it.

  R5  CALLABLE-INDEX is keyed on (home-package, name). A name with no
      determinable home package is keyed on the name alone, counted, and
      surfaced in `status' beside the existing `unread' and `unresolved'
      lines. A guess is never substituted for the gap.

  R6  Nicknames are canonicalised in the graph, never in the analyzer.
      NORMALIZE-SYSTEM-NAME's docstring already argues why and stays true.
      game-server's 5 nickname IN-PACKAGE forms resolve to the packages they
      alias.

  R7  Tests per CON-0003, each failing without the change. The two that carry
      the design: a symbol imported by :import-from and extended by an
      accessor in the importing package resolves to ONE callable, not two
      (game-server's `id'); and a generic inherited through (:use :cl) and
      specialised in seven packages stays ONE callable with seven methods, not
      seven (game-server's PRINT-OBJECT). The second is the regression test
      for the naive implementation and must exist before R5 lands.

  R8  The effect on DES-0014 is predicted before it is observed. The
      implementing plan states the expected ambiguous-call-site population on
      both trees, and the ceiling test in src/workspace/test/workspace.lisp is
      updated deliberately with the new number rather than adjusted to fit
      what came out.

  R9  Acceptance is a command, not a paragraph. On game-server:
      `tools/synoptik.sh 'unwatch Loom | watch "/path/to/game-server" |
      describe id | impact cascade-delete 3'` shows `id' reaching its
      definitions and `cascade-delete' reaching the mpackage files that call
      it, where both report nothing today. REQ-0015 R6 went unrun through an
      eleven-step plan because it was prose; this one is a line somebody
      pastes.

  R10 Landed in stages, because 55% of game-server's :CALLS edges land on a
      package-spanning name and a single change that moves them all is
      unreviewable. Ontology and analyzer recording first, minting nothing and
      changing no edge; the package graph and HOME-PACKAGE next, computed and
      asserted against but not yet keyed on; the index re-key last, with the
      edge delta measured on both trees against the census above.

  RISKS

  Inheritance is the whole design and the easiest half to postpone. Import is
  concrete and visible in 31 game-server declarations; inheritance is implicit
  and invisible, and its absence produces a plausible index rather than an
  obviously broken one. R7's PRINT-OBJECT test is the guard and belongs in the
  suite before the re-key, not after.

  Edge movement is enormous on the tree that matters and trivial on the tree
  the suite runs against. 120 edges here, 7085 there. Every test in this
  repository could stay green while game-server's call graph is rebuilt
  wrongly, which is precisely how BUG-0021 survived. The staged landing in R10
  and the census script are what make the movement attributable.

  The census's own reading limit. 87 of game-server's 134 files were not read
  to the end by the package scan, so any figure it derives from deep in a file
  is a floor. The package declarations it counts are believed complete because
  they sit at the top; if an implementing plan needs a number from further
  down, it needs a better reader than READ under *READ-EVAL* NIL -- and Loom's
  own Eclector client (DES-0013) is the obvious one.

  Shadowing is unmeasured because neither tree uses it: :shadow and
  :shadowing-import-from appear zero times in 41 and 24 package declarations.
  That makes it safe to defer and unsafe to assume away, since the first tree
  that uses it will be silently mis-resolved. Record it as an unhandled clause
  per R2 rather than ignoring it.

  Two derivations of one IN-PACKAGE chain can drift. :SYSTEM and :PACKAGE come
  from the same walk state and mean different things, and a later change that
  "simplifies" one into the other reintroduces this bug with DES-0009's
  layering rules as collateral. The property names and their docstrings are
  the only guard, which is weak; R3's requirement that `check' output be
  byte-identical is the check that would catch it.

  ALTERNATIVES CONSIDERED

  Key CALLABLE-INDEX on :SYSTEM as it stands. Free, and wrong in both
  directions at once: it splits CL:PRINT-OBJECT's ten definitions into seven
  generics because it does not know inheritance, and it splits
  MPACKAGE/OBJECT:ID from the reader that filter.lisp adds to it because it
  does not know imports. It would have produced a confident, wrong index and
  a green suite.

  Mint an entity per imported symbol, and edges for import and inheritance.
  Uniform and queryable -- `describe' on a package would list what it takes
  from where. Refused on DES-0014's arithmetic: 227 imported names on
  game-server before counting inheritance, and every package that (:use :cl)
  inherits on the order of a thousand exported symbols, so modelling
  inheritance as edges is a node or edge per inherited symbol per package. The
  fact has somewhere else to live and it is living there.

  Resolve symbols in the analyzer by loading the tree. DES-0011's enrichment
  proves a bounded child image can answer questions the text walk cannot, and
  a live image knows every symbol's home package exactly. Refused as the
  primary mechanism because resolution would then only work for a tree that
  compiles, on demand, and DEC-0001 wants the index derivable from files.
  Worth revisiting as an enrichment that corrects the text answer, which is
  what DES-0011 is for.

  Do REQ-0020's accessor question first. Tempting, since it is the visible
  symptom and BUG-0021 was filed about `id'. Refused because minting accessors
  as methods on today's package-blind index would fan a caller in mpackage out
  to :integration-test's fixture accessor -- BUG-0021's FIX says this and the
  census now quantifies it at 95 spanning names. Package identity is upstream
  and REQ-0020 is answerable once the candidate set is true.

  CONSEQUENCES

  Code that changes: a DEFPACKAGE/DEFINE-PACKAGE handler and two properties in
  the Lisp analyzer; :PACKAGE's declaration in code-ontology.lisp; a package
  graph pass and HOME-PACKAGE in loom-graph; CALLABLE-INDEX's key; the shape
  of :CALL-NAMES. RETRACT-FILE needs nothing new -- a :PACKAGE entity's
  origin-file is the file declaring it, so editing that file ages it out and
  the next pass re-derives, which is DEC-0003 unchanged.

  What gets simpler afterwards. REQ-0020's accessor question becomes
  answerable. DES-0013's :QUALIFIED-CALLS, recorded and still unread by
  anything, acquires its consumer: a written prefix is a package designator
  and resolving it is the same HOME-PACKAGE call with the prefix substituted
  for the package in effect. DES-0014's ambiguity mechanism narrows to the
  cases that are genuinely ambiguous, which is what it was designed for.

  Deferred, on the record: shadowing clauses; DEFINE-PACKAGE's :mix and
  :recycle beyond recording them; package-aware resolution for the TypeScript
  analyzer, whose module system asks the same question with different answers;
  and REQ-0020's accessor modelling, which is downstream of this and stays
  open.

  OUTSTANDING

  Implemented by PLAN-0015 on 2026-08-10, suite 9/9. R1 to R8 and R10 are true
  of the tree. R9 is not, and it is this document's error rather than the
  plan's -- see below.

  Six departures, each measured rather than argued.

  1. :PACKAGE also gained :uses, and :file/:start-line/:end-line/:system. R1
     lists only :nicknames and :imported-symbols, but HOME-PACKAGE's own
     inheritance route needs the :use list and there is nowhere else for it to
     live. R1 is incomplete rather than wrong.

  2. :CONTAINS widened to terminate at :PACKAGE, and :BELONGS-TO with it. Not
     anticipated here; ANALYZE-FILE emits a containment edge for every entity
     it notes, so the first run of the new handler was rejected outright.

  3. R3's separate :PACKAGE property on every definition was not built.
     ENTITY-PACKAGE reads :SYSTEM instead, which DES-0009 derives from the
     IN-PACKAGE chain and NORMALIZE-SYSTEM-NAME uppercases -- so :SYSTEM
     already is the package name, character for character, and duplicating it
     onto ~6000 entities across both trees would have built the two-derivations
     drift this document's own RISKS section warns about.

  4. R10's staged landing was followed, but stage A's :CALL-NAMES format change
     proved unnecessary and was not made. A call name always sits on an entity
     carrying its own package; only a definer call site, a plist on the :FILE
     entity, had nowhere to look, so it gained a :system element. The riskiest
     step in the plan dissolved.

  5. Common Lisp does not live in loom-graph. The first implementation put
     (find-package :common-lisp) in the package graph, making loom-graph the
     only system in the tree that knew what language it was indexing --
     against DES-0012 and CON-0005. BUILD-PACKAGE-GRAPH now takes
     :EXTERNAL-PACKAGES as data, loom-analyzer reads it from the host image,
     and loom-workspace hands it across, exactly as it already hands
     *MACRO-GENERATORS* to RESOLVE-GENERATED-DEFINITIONS.

  6. Scope widened from callables to all five callers of ENTITIES-BY-NAME.
     Superclasses, specialisers and method protocols go through UNIQUE-MATCH,
     which returns NIL for several candidates, so a name spanning packages
     resolved to nothing there too. Fixing only the callable index would have
     left four known-wrong callers of a fixed function.

  R9 IS WRONG AND IS MOVED. This document adopted BUG-0021's acceptance --
  `describe id' and `impact cascade-delete 3' answering on game-server --
  without noticing that BUG-0021's own FIX sequences it third, after the
  accessor question REQ-0020 asks. Both still report nothing, and correctly so:
  a caller in MPACKAGE/OBJECT now gets the right candidate set, two accessor
  definitions of one generic collapsed by the import, and CALL-TARGETS has a
  clause for exactly one interface and none for two. The criterion belongs to
  whatever implements REQ-0020. What this design delivers is the precondition:
  the candidate set is true.

  THE NUMBERS, measured 2026-08-10 under /usr/bin/sbcl.

                                        Loom      game-server
      :package entities                   25               41
      names spanning 2+ packages          11               95
        placed to one home                 1               29
        genuinely distinct                 2               12
        unplaceable, falls back            8               54
      :calls edges           3904 ->    3922    12884 -> 12612
      edges onto a spanning name  120 ->  84     7085 ->  6813
      relationships          9626 ->    9632    20317 -> 20346
      call sites              162 ->     161

  The unplaceable column is the honest limit of a text pass: those packages use
  :FIVEAM, :DRAKMA and :CL-JSON, which neither tree declares, so HOME-PACKAGE
  refuses to place their names and they fall back to spelling.
  LOOM-ANALYZER:*EXTERNAL-PACKAGE-NAMES* is the lever, and DES-0011 enrichment
  is the other one.

  And the prediction this document got wrong, recorded because it was stated
  confidently. "All 18 ambiguous call sites stop being ambiguous" -- measured,
  16 survive. Only LOG-EVENT resolved; FIXTURE-INSPECTION, DISCOVER-UNITS and
  READ-INSPECTION-FILE are unplaceable for the reason above. The ceiling test
  therefore did not move and says so.

  Deferred: REQ-0020's accessor modelling; shadowing clauses and DEFINE-PACKAGE's
  :mix and :recycle beyond recording them as unhandled; reading :QUALIFIED-CALLS,
  which HOME-PACKAGE is now the natural consumer of; and package-aware resolution
  for the TypeScript analyzer.
