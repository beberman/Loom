id: DES-0050
title: Relative score fusion is built, measured and left switched off, because it fixes the exactly-named class and costs six of the mismatch family that dense weight bought
status: draft
date: 2026-09-11
refines: [BUG-0060]
affects: [fuse-rankings, seed-entities, seed-score, semantic-candidates,
          admit-seeds]
tags: [context, seeding, fusion, rrf, relative-score-fusion, dense-retrieval,
       recall, bug-0060, req-0048, req-0016, des-0040]
summary: |
  `context' loses an exact name match to dense retrieval. BUG-0060 has the
  trace: on a task naming `RenderEngineLeaflet', the class is lexical rank 4 of
  the whole candidate set and fused rank 12.

  Reciprocal-rank fusion reads positions and ignores scores, so it cannot tell
  a list whose ordering carries information from one whose ordering carries
  almost none. Both lists here are 8 long. The dense list spans 5 to 7% of its
  best cosine, because *SEMANTIC-RELATIVE-FLOOR* builds it to sit within 10% of
  the best. The lexical list opens with a 100000-unit jump, because SEED-SCORE
  is a lexicographic band vector and its top band is whether the caller named
  this entity.

  RRF is refused rather than retuned, on measurement. Five values of *RRF-K* --
  60, 30, 10, 3 and 0 -- were fused against the recorded lists for three tasks.
  The target stays at fused rank 12 for k of 60, 30, 10 and 3, and reaches 10
  at k of 0. None of them puts it inside eight. D3 has the grid.

  Relative score fusion does. Each list is normalised to [0,1] against its own
  best and worst over a bounded head, then the two are added with a weight.
  The target moves to fused rank 4 or 5 under every setting tried, and the
  two control tasks are unharmed.

  This supersedes the first draft of this document, which hand-coded a leading
  band tuple to carry the cliff across the fusion. Min-max normalisation finds
  the cliff on its own: the 100000-unit jump is the dominant feature of the
  lexical range, so normalising maps it onto most of the interval. A general
  mechanism from the retrieval literature subsumes the bespoke one. D6 records
  what that costs, because it works through the packing of SEED-SCORE rather
  than through any property of the quantity.
body: |
  D1  THE TWO LISTS, MEASURED

  Three tasks against front-end, through `tools/test/seed-trace.lisp', with the
  vector store read from disk so the numbers are the service's.

  Task A  "load and hold the map TerrainPartition in useLayerEditorState when
           the active layer is a terrain layer and render faces and arcs in
           RenderEngineLeaflet"                            target RenderEngineLeaflet
  Task B  "the bit that merges edits"                      target LayerEditorState.canMergeSelection
  Task C  "undo and redo a partition edit"                 target PartitionEditTool

    task   lexical first 8              dense first 8     dense span
    A      500 600 600 600 100101 ...   0.757 .. 0.714    5.6% of best
    B      100502 .. 100602             0.660 .. 0.627    5.0%
    C      1700 100502 .. 100601        0.787 .. 0.732    7.0%

  The dense span is 5 to 7% every time because *SEMANTIC-RELATIVE-FLOOR* is
  0.90 and the list cannot span more than 10%. Dense rank 1 against dense rank
  8 is a few thousandths of a cosine. The ordering is nearly information-free
  and RRF spends a full rank decay across it.

  D2  THE LEXICAL SCORE IS BANDED, WHICH IS WHY NORMALISATION FINDS THE CLIFF

  SEED-SCORE returns

      1000000*type + 100000*not-named + 10000*accessor + 1000*test
        + 100*(8 - coverage) + 10*prose-only + name-rank

  so a difference of 100000 is a change of kind and a difference of 1 is a
  change of degree. Reading the three tasks by that decomposition:

    A   500, 600, 600, 600     four candidates the caller NAMED
        100101 onward          nothing else was named
    C   1700                   one candidate the caller named, a test entity
        100502 onward          nothing else was named
    B   100502 .. 100602       nothing was named; one flat band, range 100

  A and C open with a discontinuity. B has none, and B is the task RRF already
  answers correctly.

  Min-max normalisation over a head of 50 divides by a range of roughly 1000,
  so the 100000-unit jump lands beyond the top of the interval and every named
  candidate normalises to approximately 1.0 while everything below the jump
  normalises to approximately 0. The cliff becomes a near-binary signal without
  anything being written to detect it.

  D3  RRF IS REFUSED ON MEASUREMENT, NOT RETUNED

  *RRF-K*'s docstring says "60 is what the RRF literature settles on and is not
  tuned here". 60 is from Cormack, Clarke and Buettcher 2009, fitted against
  TREC runs of thousands of documents. *SEMANTIC-LIMIT* here is 8, and both
  lists that reach the fusion are 8 long.

  At that length the list weight swamps the rank. Lexical rank 1 outranks
  semantic rank N only when 1/(k+1) > *SEMANTIC-WEIGHT*/(k+N), which for a
  weight of 1.5 is N > k/2 + 1.5. At k of 60 that needs a dense list of 32.
  The dense list is capped at 8. So the top of the lexical list cannot outrank
  the bottom of the dense list on any query, which is what the seed band shows.

  That reads like a constant fitted to the wrong list length, and it is not
  enough to explain the defect. Fused against the recorded lists, target
  position by k:

    fusion        task A       task B      task C
    RRF k=60          12            1           2
    RRF k=30          12            1           2
    RRF k=10          12            1           3
    RRF k=3           12            1           3
    RRF k=0           10            1           4

  Task A's target stays outside eight at every k. The reason is visible in the
  lists: five of the eight dense candidates are LayerEditorState members and
  three of those are also high in the lexical list, so they hold the head of
  the fused order however ranks are discounted. Rank fusion has no way to say
  that four lexical candidates are different in kind from everything under
  them, because it never sees that they are.

  D4  ANCHOR CALIBRATION IS REFUSED, AND THE ANCHOR SET IS NOT THE PROBLEM

  Fitting a shift and a spread on the candidates both lists hold was
  considered. The anchor set is full -- every dense candidate appears somewhere
  in the lexical list on all three tasks, because the lexical list is 600 to
  1200 deep -- so the thin-overlap problem that usually sinks anchor
  calibration does not arise.

  Where the anchors sit is the problem:

    task   dense rank 1..8 sits at lexical
    A      14, 15, 25, 26, 80, 134, 140, 275
    B      1, 2, 14, 25, 32, 35, 58, 327
    C      10, 12, 13, 14, 16, 34, 36, 37

  A shift fitted on task A maps dense 1..8 onto lexical 14..275 and deletes the
  dense contribution. That is right for task A and destroys task B, where
  dense's top two are lexical's top two. The anchors record that the two
  systems disagree. They do not record which is right.

  D5  THE ALGORITHM

  Each list is normalised against its own best and worst, then added with a
  weight. This is relative score fusion.

      lexical   head = the first *FUSION-HEAD* candidates of the SEED-SCORE order
                hi, lo = worst and best score in that head
                norm(e) = (hi - score(e)) / (hi - lo)      ; lower score is better

      dense     hi, lo = best and worst cosine among the admitted candidates
                norm(e) = (cosine(e) - lo) / (hi - lo)

      fused(e)  = *LEXICAL-WEIGHT* * norm-lexical(e)
                    + (1 - *LEXICAL-WEIGHT*) * norm-dense(e)

  A candidate absent from a list contributes nothing from it. A candidate
  outside the lexical head contributes nothing from the lexical side, which is
  the same treatment a candidate absent from the dense list gets.

  Measured against the recorded lists, target position:

    fusion                            task A   task B   task C
    RRF k=60  (today)                     12        1        2
    relative-score head=50 w=0.5           5        1        4
    relative-score head=50 w=0.6           4        1        4
    relative-score head=20 w=0.5           5        1        4
    relative-score head=200 w=0.5          5        1        4

  These are fusion positions, before ADMIT-SEEDS applies the term, name and
  owner caps, so they are the pessimistic reading: the caps only free slots.

  PROTECTED, ADMIT-SEEDS and every cap are untouched. *PROTECT-NAMED* stays
  NIL. The change is confined to how one ordered list is built from two.

  D6  WHAT THIS COSTS, AND THE TWO WAYS IT CAN GO WRONG SILENTLY

  Normalisation works on SEED-SCORE through the packing rather than through any
  property of the quantity. Two consequences, both to be guarded rather than
  assumed away.

  The bands below `not-named' are flattened. The head spans about 1000 units,
  so the test band at 1000, the accessor band at 10000 and the coverage band at
  100 each shrink towards nothing once the named jump is in the range. Task C's
  top candidate is `partition', a test entity scoring 1700, and under relative
  score fusion it leads the fused order where RRF k=60 kept it out. Demotion of
  test code is REQ-0016 R4 and it is the first thing to inspect if known-item
  falls.

  A type-band entity in the head breaks the scale. A :FILE or :DOCUMENT carries
  1000000 in the top band, so one of them inside *FUSION-HEAD* multiplies the
  range by ten and compresses the named boundary to a tenth of the interval,
  which hands the head back to the dense list. Head of 200, 50 and 20 measure
  identically on these three tasks because no type-band candidate falls inside
  them, and that is luck rather than a property. *FUSION-HEAD* is 50 to keep
  the odds low; nothing yet detects the case.

  Both of these say the same thing: the fusion now depends on SEED-SCORE's band
  weights, which it did not before. Changing a band weight, or adding a band,
  changes the fusion silently. A test asserting the band weights against the
  fusion's assumption is the cheapest guard and belongs with the change.

  D7  BASELINE, AND THE RULE FOR SHIPPING

  Measured 2026-09-11 against the service at b33e86b, front-end at 7ad171d and
  game-server at d81bc61:

    known-item   strict 434/449  96.7%    lenient 435/449  96.9%
    mismatch     strict  31/120  25.8%    lenient  34/120  28.3%
    acceptance   strict  33/45            lenient  39/45

  A first known-item run returned 431/446 and is discarded: front-end was
  reindexing a branch merge mid-run and four cases came back HTTP 500. A recall
  figure measured against a tree that moved under it is what RULE-0008 exists
  to prevent, and the re-run on the settled index is the number above.

  front-end is under active development, so a case file naming it measures a
  tree that changes between runs. Re-measure the baseline in the same sitting
  as the change rather than comparing against this table later.

  fe-11 is BUG-0060's case, added to `tools/test/acceptance.py' rather than to
  known-item.json because that file is regenerated from entity dumps and a
  hand-written case in it would be lost. It fails today, 0 of 1 strict and
  lenient, MISS RenderEngineLeaflet. CON-0003.

  THE ORDER

    1  Implement with *FUSION* bound to :RECIPROCAL-RANK. All three harnesses
       must return 434/449, 31/120 and 33/45 exactly. A refactor that moves a
       number here has done something other than what it claims and nothing
       measured after it is readable.
    2  Switch to :RELATIVE-SCORE. Sweep *LEXICAL-WEIGHT* over 0.4, 0.5 and 0.6
       and *FUSION-HEAD* over 20 and 50. Report the whole grid rather than the
       best cell.

  SHIPS ONLY IF ALL FOUR HOLD

    fe-11 passes, and known-item, mismatch and acceptance each stay at or above
    434, 31 and 33 strict. If no cell in the grid satisfies all four, the
    change is refused and the grid is recorded here -- the outcome DES-0049 D3
    reached on the occurrence band.

  The weight is the parameter most likely to break the second condition.
  *SEMANTIC-WEIGHT* at 1.5 corresponds to a lexical weight of 0.4, and the
  mismatch family is what raising it to 1.5 bought. A lexical weight above 0.4
  moves in the direction that gives that back.

  D8  THE WEIGHT CANNOT BE ONE NUMBER, AND TWO IS NOT ENOUGH EITHER

  `tools/test/cases/mismatch.md' states what that family is: 120 queries, each
  describing an entity in words its author did not use, checked mechanically by
  `mismatch-check.lisp'. No lexical candidate can be the answer. So every slot
  the lexical list takes there is a slot the dense list needed, and raising the
  lexical weight costs cases in direct proportion.

  fe-11 wants the opposite. The caller wrote the class name and lexical must
  win. One number cannot serve both.

  So the weight was split. *LEXICAL-WEIGHT* applies when the task named the
  candidate at lexical rank 1 and *LEXICAL-WEIGHT-UNNAMED* when it did not,
  which is the mismatch family by construction. That recovers most of the loss
  -- mismatch back from 25 to 30 strict and 29 to 34 lenient -- and costs two
  known-item cases.

  The two it costs say why the split is still too coarse:

    front-end  ListMapper.toNative   name family
    front-end  getDefinitionList     name family
    game-server *gen-map-ne*         prose family
    front-end  slot-defn             recovered

  The first is the case FUSE-RANKINGS' own docstring already names: "`mapper to
  native' returns MAPMAPPER.TONATIVE at 0.982 and MAPPER.TONATIVE at 0.635. No
  threshold separates those, because the wrong answers score higher." The query
  names the definition, and NAMED-BY-TASK-P does not see it, because that
  predicate asks whether the entity's whole name is one of the caller's words
  and `ListMapper.toNative' is four of them. So the head reads as unnamed, the
  unnamed weight sends it to the dense side, and dense prefers the longer
  relative.

  The signal wanted is the shape of the lexical list, not a predicate on its
  first entry. That does not exist yet and guessing at it here would be fitting
  a third constant to the two cases it was written for.

  D9  THE GRID, AND THE OUTCOME

  Every cell measured against the service with front-end at 7ad171d and
  game-server at d81bc61. Strict figures; acceptance lenient in brackets.

    fusion                          known-item  mismatch   acceptance   fe-11
    reciprocal-rank  (shipped)         435/450    31/120    33/45 [39]   FAIL
    relative head=20 w=0.4             435/450    25/120    35/45 [44]   pass
    relative head=20 w=0.5             432/450    23/120    35/45 [44]   pass
    relative head=20 w=0.6             431/450    23/120    34/45 [43]   pass
    relative head=50 w=0.4             430/450    24/120    32/45 [41]   pass
    relative head=50 w=0.5             433/450    20/120    32/45 [41]   pass
    relative head=50 w=0.6             433/450    16/120    30/45 [39]   pass
    adaptive head=20 0.4 / 0.0         433/450    30/120    -            -
    adaptive head=20 0.4 / 0.1         433/450    30/120    34/45 [43]   pass
    adaptive head=20 0.4 / 0.2         433/450    27/120    35/45 [44]   pass
    adaptive head=20 0.5 / 0.1         433/450    30/120    34/45 [43]   pass
    adaptive head=20 0.6 / 0.1         433/450    30/120    34/45 [43]   pass

  D7's rule is that the change ships only if fe-11 passes and none of the three
  baselines falls. No cell satisfies it. Every cell that fixes fe-11 costs
  mismatch, and the two closest miss differently:

    head=20 w=0.4        holds known-item exactly, costs 6 mismatch
    adaptive 0.4 / 0.1   costs 2 known-item and 1 mismatch strict, and ties
                         mismatch lenient at 34

  So the mechanism is built, tested and left switched off. *FUSION* ships as
  :RECIPROCAL-RANK and every number in D7 is reproduced at that setting: 435 of
  450, 31 of 120, 33 of 45. This is *PROTECT-NAMED*'s disposition and for its
  reason -- the idea is not in doubt and the predicate is not good enough yet,
  so the measurement is kept where the next attempt will find it rather than
  deleted with the code.

  WHAT WOULD CHANGE THE ANSWER

  D6 predicted the known-item fall and named the repair: normalise the
  decomposed bands rather than the packed integer. Two of the three cases lost
  are the `name' family, which is where band flattening would show, and the
  third is `prose'. That is the next thing to try and it is a wider change than
  this one.

  The other lead is the predicate. NAMED-BY-TASK-P fires when an entity's whole
  name is one word the caller wrote, so it misses `ListMapper.toNative' written
  as four words and fires on SEGMENT written as one. A predicate keyed on how
  much of the lexical head the caller actually spelled would serve both this
  and the protected band that has been switched off since PLAN-0043.

  D10  THE PREDICATE, AND WHAT IT CHANGES

  D8 named NAMED-BY-TASK-P as the blocker and SPELLED-NAME-P is the repair.

  A candidate counts as named when the caller wrote at least
  *SPELLED-WORD-FLOOR* words of its name. The name is split on dots first and
  then by SPLIT-NAME-PARTS, because a dot is a member separator in JavaScript
  and is not one of that function's boundaries. A term equal to the whole name
  counts for every word in it.

  Checked against the cases that motivated it:

    entity                task                              old      new
    ListMapper.toNative   "list mapper to native"           -        named
    getDefinitionList     "get definition list"             -        named
    slot-defn             "slot defn"                       -        named
    RenderEngineLeaflet   fe-11's task                      named    named
    segment               "segment terrain into region..."  named    -
    partition             "undo and redo a partition edit"  named    -

  The first three are the cases the fixed-weight fusion lost; all three are the
  `name' family, and NAMED-BY-TASK-P missed them because it asks whether the
  whole name is one of the caller's words and these names are three or four.
  SEGMENT is the case that has kept *PROTECT-NAMED* switched off since
  PLAN-0043, and the floor of 2 is what excludes it.

  Used for the fusion weight only, deliberately not for SEED-SCORE's `named'
  band. That band orders the lexical list; this decides what the lexical list is
  worth against the dense one. Moving both at once would leave neither
  measurable.

  MEASURED, floor 2, head 20, named 0.4, unnamed 0.1

  Each configuration run twice, with fe-11 as the probe for which code is
  actually answering -- it passes under :RELATIVE-SCORE and fails under
  :RECIPROCAL-RANK, which is the only reliable reading available. BUG-0067 is
  why that is needed.

    measure                reciprocal-rank    relative + spelled
    known-item strict      432, 435           435, 435
    known-item lenient     434, 436           436, 436
    mismatch strict        31, 31             30, 30
    mismatch lenient       34, 34             35, 35
    acceptance strict      33/45              35/45
    acceptance lenient     39/45              44/45
    fe-11                  FAIL               pass

  known-item varies by 3 between identical baseline runs, so the +0 to +3 there
  is the new fusion sitting at the top of the old one's noise band rather than
  a gain that can be claimed. mismatch and acceptance are stable across repeats
  and their differences are real.

  The one regression is one mismatch case, and the diff says what happened to
  it rather than leaving it a number:

    front-end TerrainPartition.removeArc   strict -> lenient only
    front-end PolygonGraphic.mousedown     gained, lenient

  So no case left the bundle. One was demoted out of the seed band and one
  appeared that was not there before.

  WHAT D7's RULE SAYS, AND WHAT THE EVIDENCE SAYS

  The rule is that the change ships only if fe-11 passes and none of the three
  baselines falls. mismatch strict is 30 against a baseline of 31, so by the
  letter it is refused, by one case that is demoted rather than lost.

  The rule was written to stop a constant being fitted to the anecdote that
  motivated it, and that risk is real here: *SPELLED-WORD-FLOOR* of 2 was chosen
  because it separates the six cases in the table above. Against that, the gain
  is on the corpus least susceptible to it -- acceptance is the judged,
  held-out set REQ-0036 R11 protects, and it moves 33 to 35 strict and 39 to 44
  lenient, five of its six missing cases recovered.

  Recorded rather than decided here. The default ships as :RECIPROCAL-RANK and
  every baseline reproduces at that setting.

  THE VOID SWEEP

  A first run of this measurement returned known-item 409, mismatch 9 and
  acceptance 33, identical across four cells however the weights moved. The
  vector stores were gone and `context' was answering lexically, so no weight
  between two lists could matter when there was one list. 9 of 120 is
  `mismatch.md's pre-dense bar, which the harness reproduced from the document
  rather than measuring. Those numbers are void and BUG-0067 is the defect.

  ACCEPTANCE

  fe-11 seeds RenderEngineLeaflet under :RELATIVE-SCORE at every cell measured,
  and does not under the shipped :RECIPROCAL-RANK. Binding *FUSION* to
  :RECIPROCAL-RANK reproduces every number in D7 exactly, which is the property
  that makes the grid readable and is asserted by the suite rather than only
  measured: the fusion tests bind it, and four new tests cover the
  relative-score path -- the refusal without scores, the named cliff against a
  flat dense list, a head of equal scores, and the head bound.

  OPEN QUESTIONS

  - Whether *SEMANTIC-RELATIVE-FLOOR* at 0.90 should widen once the fusion
    reads scores. It was set when only ranks were read, and it makes the dense
    ordering nearly information-free by construction. Under relative score
    fusion the cosine spread is what the dense side contributes, so a floor
    that compresses it to 5% is now throwing away the signal the new fusion
    reads. Not touched here; measure the fusion change alone first.

  - Whether the lexical side should be normalised on the decomposed bands
    rather than on the packed integer. That would remove both hazards in D6 at
    the cost of a wider change, and it is the repair if the band-flattening
    shows up in known-item.

  - Whether *SEMANTIC-LIMIT* at 8 is still right. It was set so a longer dense
    list could not win slots by being longer, which was a property of rank
    fusion. Score fusion does not have it.
