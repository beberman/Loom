  PLANS

  Two plans. They share no code path, and they differ in risk.

  Plan A, dependencies. This design's R1 to R8. It covers REQ-0078 R1 and
  R10, and rewrites REQ-0078's OUTSTANDING line for R4 when it completes.
  Steps: the ontology change (R1, R3); the manifest analyzer (R2);
  extract.py's :STDLIB (R4); the dependency-modules: key (R5);
  RESOLVE-DEPENDENCIES (R6); the reader's surfaces (R8); init's proposal
  (R7); acceptance on the fixtures and on front-end.

  Plan B, call-site shapes. This design's R9 to R12. It covers REQ-0078 R2
  and REQ-0041 R1 to R5, with R2 narrowed by U4. Steps: the baseline for
  D13; :VIA on :CALLS, which moves no count and can land alone; the Lisp
  signature and :CALL-SHAPES; Python; JavaScript; the gate; describe and
  `sites`; acceptance on game-server, lfia and front-end. It touches all
  three extractors and the resolution hot path, which is why it is apart.

  DEFERRED, ON THE RECORD

  - REQ-0078 R7 to R9 for CommonJS and TypeScript functions trees, as
    PLAN-0058 left them.
  - Addressing an in-tree module by its dotted name (D1).
  - pyproject.toml, setup.cfg, setup.py, Pipfile and poetry.lock. Loom has
    no TOML reader. Neither lfia nor front-end uses one.
  - Lock files: package-lock.json, yarn.lock. A lock file states what is
    installed, which is the venv's question in another form.
  - Transitive dependencies. google-cloud-firestore reaches lfia through
    firebase-admin. Only a lock file or a venv says so. The 73 imports are
    reported as undeclared, which is true of the manifests.
  - Function-level :DEPENDS-ON for JavaScript. It needs import-bound calls
    in extract.js, the follow-on DES-0053 named.
  - A dependency-modules: entry for npm. The npm join needs none.
  - pytest.ini's python_files. It would let a pytest tree name test files
    with hyphens. Neither Loom nor lfia sets it, and it would not help Loom's
    scripts, which hold no case.

  - Reacting to a .loom/frameworks.yaml edit without a reindex. DES-0047
    already accepts this cost for the file, and dependency-modules: inherits
    it.
  - Joining a `node:` specifier to anything. A bare `fs` stays undeclared.

  CONSEQUENCES

  Code that changes. code-ontology.lisp: :MODULE, :DEPENDS-ON, new
  properties. A new manifest-analyzer.lisp, and markdown-analyzer.lisp's
  claim. extract.py's import records and call records, extract.js's call
  records, and lisp-analyzer.lisp's COLLECT-CALL-NAMES and its local-edge
  assert. python-analyzer.lisp and js-analyzer.lisp carry :CALL-SHAPES
  through. frameworks.lisp's PARSE-FRAMEWORKS and FRAMEWORKS-PROBLEMS.
  resolve.lisp: RESOLVE-CALLS writes :VIA; RESOLVE-DEPENDENCIES is new.
  ASSERT-EDGE takes edge properties, which it does not today.
  RESOLVE-AND-CHECK gains one pass. federate.lisp's
  ENTITY-AT-PATH. loom-knowledge's DESCRIBE-ENTITY and a sites service.
  The console, and one serve operation. init.lisp's proposal.

  No .asd gains a dependency. The manifest analyzer is in loom-analyzer,
  which has cl-yaml. The new pass is in loom-graph and receives declarations
  as data. loom-rest and loom-mcp change only through the registry, so the
  peer property in CLAUDE.md's Layering holds.

  Behaviour that changes on trees already watched:

      1. requirements*.txt stop being :DOCUMENTs. A markdown mention that
         resolved to one now resolves to the :FILE.
      2. `status`' imports line splits :EXTERNAL into declared, stdlib and
         undeclared.
      3. `impact` on a helper in a Python tree can now end at a :MODULE
         through :DEPENDS-ON. Its rows grow by the dependencies the helper's
         callers use.
      4. Every :CALLS edge carries :VIA. A REST caller reading edges sees
         the new property.

  The obligation every later change carries. A join from an import to a
  dependency is made by the ecosystem's resolution rule or by a
  declaration, never by spelling. A new manifest format is read by the
  manifest analyzer and stores names and specs, never a URL. A new analyzer
  writes :CALL-SHAPES by D10's grammar, and whatever writes a :CALLS edge
  writes its :VIA.

  DECISIONS TAKEN BY THE USER, 2026-10-06

  U1  R10's Python map is declaration-only. There are no spelling joins at
      all (D6).
  U2  init may read a venv's RECORD files, through Loom's own `python3 -I`,
      to build its proposal (D7).
  U3  The :FILE meets REQ-0078 R1's module clause for modules in the tree
      (D1). :MODULE is reserved for declared dependencies.
  U4  REQ-0041 R2 is narrowed to argument kinds and keyword names, with no
      literal values (D10).
  U5  REQ-0078 R4 is closed as already met. No test-scripts: key is added.
      REQ-0078's OUTSTANDING hyphen line is rewritten when Plan A completes.
  U6  Nothing is written to lfia-accounting. Acceptance for
      dependency-modules: uses fixtures the tests build. lfia's own
      acceptance is not measured; its author may adopt the key later.

  RISKS

  Shape storage over budget on front-end (D13). Two cheaper forms, both
  smaller than the full design:
  (a) record lines only for signatures that are not their key's most common
  signature in that caller, and a count for the common one; (b) record no
  shapes on :TEST callers, which hold most of front-end's 30787 file-level
  calls. Each loses part of REQ-0041 R4's answer, and the choice is the
  user's.

  sys.stdlib_module_names depends on the interpreter. A module added to or
  removed from the standard library reads differently under two Pythons.
  DES-0053 D1 already accepts this kind of difference for syntax.

  The nearest-manifest rule (D4) can disagree with a monorepo tool's
  hoisting. A workspace that hoists a dependency to the root while a nested
  package.json omits it is joined to the root's declaration. That is the
  declaration Node would find.

  OUTSTANDING

  R1 to R8 are built by PLAN-0059 (2026-10-09). R9 to R12, the call-site shapes
  and :VIA on :CALLS, are Plan B's (PLAN-0060) and are not built.
