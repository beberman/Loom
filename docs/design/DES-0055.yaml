                             from google.oauth2 import credentials,
                             import requests, import os,
                             from firebase_functions import https_fn, and a
                             function decorated @https_fn.on_request
      app/store.py           from google.cloud import firestore
      tests/test_main.py     import pytest
      .loom/frameworks.yaml  dependency-modules: for google-auth
                             (google.auth, google.oauth2), requests and
                             pytest; none for firebase-functions or tzdata

  Expected on the fixture:

      find google-auth          a :MODULE in requirements.txt, provides
                                google.auth and google.oauth2
      app/main.py               :IMPORTS google-auth once and requests once;
