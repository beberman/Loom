  ACCEPTANCE

  Loom writes nothing to ~/github/lfia-accounting or its untracked
  .loom/frameworks.yaml (U6). lfia's own acceptance for dependency-modules:
  is not measured by this design. Its author may adopt the key later, and
  lfia's numbers under EXPECTED DELTAS are a census, not an acceptance.

  Correction, 2026-10-09 (PLAN-0059 step 9). `node:fs` joins nothing and is
  counted as npm stdlib, not as undeclared, which is D8's rule. A bare `fs`
  with no declaration stays undeclared, because Loom ships no list of Node's
  builtins.

  The dependency-modules: declarations are accepted on a fixture the tests
  build themselves in a scratch directory. A small Python tree:

      requirements.txt       google-auth>=2.29, requests>=2.31,
                             firebase-functions>=0.4.0, tzdata
      requirements-dev.txt   -r requirements.txt, pytest>=8.0
