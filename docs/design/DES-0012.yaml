id: DES-0012
title: A same-key definition supersedes the one it shadows inside the analyzer, and the shadowing is recorded on the survivor and surfaced by a rule
status: draft
date: 2026-08-08
refines: [BUG-0012]
affects: [analyze-file, absorb-entity, absorb-relationship, apply-transaction,
          run-check, check-rules]
tags: [analyzer, graph, rules, clos, provenance]
summary: |
  BUG-0012: when two definitions in one file derive one natural key, the
  surviving entity's properties describe the later definition but its outgoing
  :CALLS edges describe the union of both. This design takes both of the bug's
  candidate directions, each at the layer where it is actually possible: the
  graph is made consistent by superseding the shadowed definition inside
  ANALYZE-FILE, before ops are emitted -- not by a retract inside
  ABSORB-ENTITY, which measurement shows is both vacuous (the analyzer emits
  every entity op before any local-call edge op, so at absorb time there is
  nothing to retract) and impossible (both definitions' edges bake the same
  derived id, the same origin-file and the same provenance, so no writer-side
  discriminator exists) -- and the collision is made loud by recording a
  :shadowed-definitions property on the survivor and reporting every carrier
  through a new :property-absent check kind and a new RULE-0006. The writer
  changes only by gaining the EQ guard ABSORB-RELATIONSHIP was always missing.
  Both game-server instances were re-verified against source before designing:
  ADD-DEFN's identical clauses at mpackage/obj-types.lisp:438 and :452, and
  COMPUTED-ID-P's inline clause at mpackage/object.lisp:54 shadowed by the
  standalone DEFMETHOD at :68.
body: |
  PROBLEM

  BUG-0012, measured rather than restated. A file containing a standalone
  DEFMETHOD and a colliding inline (:method ...) clause whose bodies call
  different locally-defined functions produces one :METHOD entity whose
  properties are the later definition's (DES-0010 R4's later-assert-wins,
  correct) and whose outgoing :CALLS edges are both definitions' (recorded by
  A-COLLIDED-METHODS-CALLS-EDGES-ARE-A-UNION-NOT-A-REPLACEMENT). The entity
  attributes a call to a body that, by every property it carries, does not
  exist -- and that at runtime is not in effect either: CL replaces a method
  whose name, qualifiers and specializers match an existing one, so the file's
  loaded state contains exactly the survivor's body. Files are truth
  (DEC-0001), and the file's truth is the survivor.

  Where the union actually comes from, traced through the code because it
  narrows the fix decisively:

  - Cross-file :CALLS edges are NOT part of the defect. RESOLVE-CALLS derives
    them from :CALL-NAMES, a property, and ABSORB-ENTITY already replaces
    properties wholesale -- so after the collision, cross-file edges follow
    the survivor's :CALL-NAMES alone. Verified by reading ANALYZE-FILE pass 2
    (SETP :call-names per entity) and ABSORB-PROPERTIES.

  - The union is confined to the analyzer's own local-call edge ops.
    ANALYZE-FILE pass 2 collects (caller-entity . callee-entity) pairs for
    BOTH colliding entity objects, and pass 3 (lisp-analyzer.lisp:1130-1137)
    emits ops in the order: RETRACT-FILE, the file entity, every definition
    entity with its :CONTAINS edge, then every local-call edge last. Both
    call-edge ops therefore land after both entity asserts, and both bake the
    same FROM-ID, because DERIVE-ID computes the id from the natural key and
    the two definitions share the key.

  Two consequences of that trace, which is what makes this a design rather
  than a patch:

  1. BUG-0012's candidate (a) -- retract, when ABSORB-ENTITY replaces an
     entity, every relationship with that FROM-ID and the reanalyzed file's
     origin-file -- is a no-op against the real op stream. RETRACT-FILE at op
     0 already removed the previous pass's edges (and any :introspected edges
     with that origin-file, per DES-0011's aging design); at absorb time the
     current pass's call edges have not landed yet; and after they land, the
     shadowed definition's edges are indistinguishable from the survivor's --
     same id, same origin-file, same :source :structural, same confidence.
     DES-0011's CONSEQUENCES offered the source slot as the discriminator
     candidate (a) was missing; BUG-0015 then measured that confirmed edges do
     not reliably carry it. There is no writer-side fix, because by the time
     the writer sees the ops, the fact "which definition produced this edge"
     has already been destroyed.

  2. The only layer that still holds the two definitions as distinct objects
     is the analyzer, during ANALYZE-FILE, between pass 1 and pass 3. That is
     where the fix goes.

  Blast radius supports the same placement: `impact absorb-entity 3` reaches
  85+ entities (truncated) -- effectively every test that goes through
  APPLY-TRANSACTION -- while `impact analyze-file 2` reaches 21, all inside
  the analyzer and its own suite.

  The real instances, re-verified against game-server source today
  rather than trusted from PLAN-0009: mpackage/obj-types.lisp ADD-DEFN has two
  inline clauses with identical specializers ((typename symbol) (defn
  type-defn) &key interface &allow-other-keys) at lines 438 and 452 -- the
  clause at 438 is dead code, silently replaced at load -- and
  mpackage/object.lisp has COMPUTED-ID-P's inline (:method (id) nil) at line
  54 shadowed by the standalone DEFMETHOD at line 68. Worth recording: in both
  real instances the dead bodies contribute no callee the survivor lacks (438
  calls only type-add, which 452 also reaches; the line-54 body is NIL), so on
  game-server the union is currently invisible in edge counts. The graph
  half of the fix is guarded by the fixture, where the bodies differ; the
  game-server value is the loudness half, which turns two pieces of silent
  dead code into reported findings.

  WHAT EACH THING BECOMES

  No new entity type, no new relationship type, no widened endpoint. The
  ontology cost is one property added to the code definition types; the rules
  engine gains one check kind (its own header says a kind is one method plus
  documentation); one new RULE document.

  ANALYZE-FILE (src/analyzer/lisp-analyzer.lisp) gains a supersession step
  between pass 1 and pass 2. It OWNS the language's reconciliation semantics:
  for Common Lisp, among definitions in one file sharing one natural key, the
  last in source order is the definition in effect, exactly the semantics
  DES-0010 R4 already argued for properties. The step reduces DEFINITIONS,
  CALLABLES and LOCAL-FUNCTIONS to survivors before pass 2 runs, so a
  shadowed definition's entity, :CONTAINS edge, body walk, :CALL-NAMES and
  local-call edges are never computed or emitted at all. Invariant, stated as
  the analyzer contract this design adds: one file's op stream asserts each
  natural key at most once. Keys are computed with ENTITY-NATURAL-KEY from
  synoptik-ontology, which the analyzer already depends on; the keys are type-led,
  so a DEFUN and a DEFCLASS sharing a name do not collide, while a DEFUN and a
  DEFMACRO do (both mint :FUNCTION), matching what the graph would have
  collided anyway.

  The survivor records what it shadowed: property :shadowed-definitions, a
  list of "start-end" line-range strings, one per superseded definition in
  source order, absent (not empty) when there was no collision. That is
  CON-0001's side of the line: the shadowed text is real source, so its
  existence is recorded as a fact on the survivor rather than silently
  dropped -- and no guess is involved, because source order decides the
  survivor; this is not a choice between live possibilities.

  synoptik-ontology declares :shadowed-definitions on the definition types the
  analyzer mints with :file-bearing natural keys -- :function, :method,
  :variable, :class, :interface, :test, and :condition if it is a distinct
  defentity rather than a :class variant (the implementing plan reads
  code-ontology.lisp and settles the exact list). A property addition, the
  cheap kind, and schema'd so UPDATE-PROPERTIES could touch it if ever needed.

  synoptik-graph's rules engine (src/graph/rules.lisp) gains RUN-CHECK method
  (:kind :property-absent): every entity -- optionally narrowed by
  :entity-type -- carrying the named property is a violation, reported with
  the entity's name, location and the property's value, so a finding reads
  "add-defn (mpackage/obj-types.lisp) shadows definitions at 438-441". The
  kind is deliberately generic; nothing in it knows about shadowing.

  docs/rules/RULE-0006.yaml (new, the next free number): a definition must
  not be silently shadowed by a same-key definition in its own file; check
  clause (:kind :property-absent :property :shadowed-definitions). Severity
  follows the existing rule vocabulary; nothing here depends on which value
  the plan picks. `check` then surfaces every instance, which is BUG-0012's
  candidate (b) delivered through machinery that already exists.

  ABSORB-ENTITY and APPLY-OP are unchanged. Within-transaction key collisions
  remain absorbed later-wins -- now as the disclosed backstop for an analyzer
  that violates the contract, not as the mechanism anything relies on.
  Rejecting them as a TRANSACTION-ERROR was considered and rejected below.

  ABSORB-RELATIONSHIP (src/graph/transaction.lisp:139) gains the EQ guard
  ABSORB-ENTITY has had all along (the ((eq existing e) existing) clause at
  line 196 of the same file): absorbing a relationship into itself must be a
  no-op, not a CLRHASH of its own property table followed by a copy of the
  emptied table into itself. Decided into this design rather than filed as
  its own bug: it is two lines in the machinery this document already
  reasons about, it shares the invariant "absorbing a fact into itself is a
  no-op", and it has already been observed in the wild -- the PLAN-0010
  coder hit it re-applying enrichment ops and routed around it by
  re-deriving, which DES-0011's OUTSTANDING records. The guard makes
  re-application safe; ENRICH-REPOSITORY's re-derive stays as written, since
  it remains correct and the guard removes a trap rather than mandating a
  new shape.

  Interaction with DES-0011's enrichment, answered explicitly because an
  over-broad retract was the risk BUG-0012's candidate (a) carried: this
  design adds no retract anywhere. :introspected entities and edges are
  touched by exactly the machinery that touched them before -- RETRACT-FILE
  on edit, re-assert on the next enrich -- so the asymmetry DES-0011's
  self-aging depends on (a poll never restores an image fact) is preserved
  untouched. Enrichment also composes correctly with supersession: the image
  holds only the surviving method, its definition maps to the same natural
  key regardless of line, the key is present, so ENRICH-OPS asserts nothing
  for it, as today.

  BUG-0015 is genuinely separate, and one design does not cover both.
  BUG-0012 is edges that should not exist, created by one pass from two
  source definitions; BUG-0015 is properties that should survive, erased
  across passes by a propertyless re-assert. They meet in ABSORB-PROPERTIES
  but their fixes live in different layers -- this one in the analyzer,
  BUG-0015's remaining half (the poll-time erasure) wherever its own design
  eventually puts it. This design changes nothing on BUG-0015's mechanism in
  either direction, except that the EQ guard makes its recorded workaround
  unforced.

  ALTERNATIVES CONSIDERED

  BUG-0012's candidate (a) as filed -- absorb-time retract of same-FROM-ID,
  same-origin-file relationships. Rejected on measurement, not preference:
  pass 3's op order (entities first, all local-call edges last) means the
  retract fires before either definition's edges exist, so it deletes
  nothing; and after the transaction no discriminator distinguishes the dead
  definition's edges from the survivor's -- DERIVE-ID gives both the same
  FROM-ID, both carry the reanalyzed file as origin-file, and BUG-0015
  showed the :source slot is not reliably present on confirmed edges. The
  reason is structural, so a future reader can check whether it still
  applies by rereading lisp-analyzer.lisp's pass 3 and DERIVE-ID.

  Candidate (a) rescued: interleave op emission per definition (entity, then
  its edges) and retract transaction-added FROM-ID edges at absorb time.
  Mechanically workable -- and rejected twice over. It couples the
  analyzer's op ordering to the writer's absorb semantics as an undocumented
  protocol invariant every analyzer must keep forever; and it hardcodes
  later-wins into the language-neutral writer, which the second-language
  test fails outright: a TypeScript analyzer meeting interface merging or
  function overloads must MERGE same-key declarations, not replace them.
  Reconciliation is language semantics, so it belongs in the language's
  analyzer. This is also the reason the chosen fix is a per-analyzer
  contract rather than shared post-processing in the workspace.

  Candidate (b) alone -- accept the union, make the collision loud. Rejected
  as the whole answer: the union is false not only of the file but of the
  loaded image, since CL replaces the same-key method (BUG-0012's own
  SYMPTOM records the redefinition overwrite), so keeping it fabricates a
  fact where the honest alternatives -- replace, or record the gap -- are
  both available. Retained as half the answer, because after supersession
  the graph would otherwise erase all evidence that the shadowed source
  exists, and the shadowing is the actual defect in game-server worth a
  user's attention.

  Reject within-transaction entity-key collisions with TRANSACTION-ERROR.
  Rejected: the colliding file is legal Common Lisp, and the penalty would
  be a whole file unindexed -- turning a source smell into an index hole,
  harsher than the defect. It would also make enrichment fragile against an
  image that legitimately reports two same-key definitions.

  Mint both definitions as entities by disambiguating the key (an ordinal or
  start-line component). Rejected: an ordinal shifts when a definition is
  added above, so ids stop being stable across edits and SS5.1's
  rebuild-lands-on-the-same-id property breaks; `find` and `impact` would
  present a dead body as a live definition; and CON-0001's exception clause
  does not apply -- the two definitions are not a union of real
  possibilities, because source order decides which one the loaded program
  contains.

  Record the shadowed bodies' call names on the survivor (union the
  :CALL-NAMES). Rejected in a sentence: it reintroduces exactly the union
  this design exists to remove, one level down.

  A note on what changed during design, per house practice: this document
  went in weighing (a) against (b) as BUG-0012 framed them. Reading pass 3's
  emission order and DERIVE-ID killed (a) in its filed form and relocated
  the consistency fix from the writer to the analyzer; the loudness half
  survived unchanged. The choice is therefore both -- but neither at the
  layer BUG-0012 sketched for (a).

  REQUIREMENTS

  R1  ANALYZE-FILE supersedes before pass 2: among pass-1 definitions
      sharing one ENTITY-NATURAL-KEY, only the last in source order remains
      in DEFINITIONS, CALLABLES and LOCAL-FUNCTIONS. No op of any kind --
      entity, :CONTAINS, or local :CALLS -- is emitted for a superseded
      definition, and its body is never walked. Applies to every definition
      kind the analyzer mints, not only methods.

  R2  The survivor carries :shadowed-definitions, a list of "start-end"
      line-range strings for the superseded definitions in source order;
      the property is absent when nothing collided. Declared in
      code-ontology.lisp on every definition type the analyzer can mint
      with a :file-bearing natural key.

  R3  Pass 2 resolves local calls against survivors only: the walked bodies
      are the survivors', and a local name shared with a superseded
      definition links to the surviving entity (which, ids being
      key-derived, is also the only id such an edge could carry).

  R4  The rules engine gains RUN-CHECK (:kind :property-absent): every
      entity of the (optional) :entity-type carrying :property is a
      violation whose report includes the property's value. The kind knows
      nothing about shadowing.

  R5  RULE-0006 exists, active, with check clause
      (:kind :property-absent :property :shadowed-definitions), and `check`
      reports each carrier with its shadowed ranges.

  R6  ABSORB-RELATIONSHIP gains an EQ guard mirroring ABSORB-ENTITY's:
      absorbing a relationship into itself returns it unchanged. A test
      applies the same op list twice through APPLY-TRANSACTION and asserts
      the relationship's properties survive -- the exact trap PLAN-0010 hit.

  R7  Tests per CON-0003, each failing without its change:
      A-COLLIDED-METHODS-CALLS-EDGES-ARE-A-UNION-NOT-A-REPLACEMENT is
      rewritten to assert the survivor's edges only (SECOND-CALLEE present,
      FIRST-CALLEE absent) plus :shadowed-definitions carrying the
      DEFMETHOD's range; a two-DEFUN collision test proves R1 is not
      method-specific; a no-collision fixture asserts the property is
      absent; a rules test covers :property-absent directly.

  R8  Acceptance is measured on both trees. Synoptik: full suite green under
      /usr/bin/sbcl, entity and relationship counts unchanged from before
      the change (this tree is believed collision-free; any RULE-0006
      finding that appears is a real discovery to record, not a failure),
      `check` output unchanged modulo BUG-0009's known noise plus RULE-0006
      lines if any. game-server (watch, reindex, check): RULE-0006 reports
      exactly two findings -- ADD-DEFN shadowing the clause at
      obj-types.lisp:438 and COMPUTED-ID-P shadowing the inline clause at
      object.lisp:54 -- and ADD-DEFN's entity carries the 452-clause's
      properties with no edge reachable only from the 438 body.

  R9  The implementing plan closes BUG-0012 with a WHAT LANDED section,
      marks this document implemented (RULE-0005), and notes in DES-0010
      that R4's edge-union disclosure is superseded by this design --
      DES-0010 already forward-references BUG-0012, so a one-line status
      update at that reference suffices.

  CONSEQUENCES

  Code that changes: lisp-analyzer.lisp (the supersession step and pass-2
  filtering), code-ontology.lisp (one property on the definition types),
  rules.lisp (one RUN-CHECK method), transaction.lisp (two lines of EQ
  guard), one new RULE document, and the tests named in R7. APPLY-OP,
  ABSORB-ENTITY, RESOLVE-CALLS, ENRICH-OPS and every consumer of
  APPLY-TRANSACTION are untouched -- the 85-entity impact set around
  absorb-entity stays out of the blast radius, which is most of what
  choosing the analyzer layer bought.

  What gets simpler: the graph's invariant "an entity's outgoing edges
  derive from its own definition" becomes true by construction of the op
  stream instead of false-with-a-disclosure; DES-0010 R4's collision story
  reduces to "later wins, wholly, and loudly"; and :property-absent is a
  reusable check kind the next presence-is-a-finding rule gets for free.

  The obligation every future change carries: each analyzer -- the YAML one
  today, TypeScript when it comes -- owns the contract that one file's op
  stream asserts each natural key at most once, reconciling by its
  language's own semantics: CL replaces, TS interface declarations merge,
  and the writer stays agnostic. Anything touching ANALYZE-FILE's passes
  must keep supersession between pass 1 and pass 2, or shadowed bodies leak
  back into :CALL-NAMES and local edges. ABSORB-ENTITY's later-wins remains
  a backstop, and a within-transaction absorb of a code entity is from now
  on evidence of an analyzer violating its contract.

  A known edge, recorded rather than fixed: DES-0010 captures only one
  method qualifier, so two clauses differing in a second qualifier collide
  spuriously. Today they union silently; after this design the earlier is
  superseded and RULE-0006 reports it -- a finding whose remedy is widening
  the :method key, and the report is the tell that it has started to
  matter.

  On the other open bugs. BUG-0015: unchanged in mechanism (see above); the
  EQ guard makes its re-apply trap impossible, so its option space widens
  slightly. BUG-0016: neutral -- it concerns entities never minted, and the
  definer-macro minting pass already checks the graph before asserting, so
  supersession neither helps nor hinders a fix; if that fix ever mints
  same-key entities from two call sites in one file, R1's contract and
  RULE-0006 will cover them for free. BUG-0017: neutral -- initforms never
  reach pass 2; if a fix later walks them, R3 already guarantees it walks
  survivors only. BUG-0018: untouched. BUG-0013: this document's affects:
  list is as invisible to `check` as every other ARCH's until that closes;
  nothing here depends on it, because RULE-0006's loudness travels through
  the rules engine, not through affects:.
