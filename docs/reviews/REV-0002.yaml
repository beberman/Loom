id: REV-0002
title: Twenty-two duplicated capabilities in Synoptik, and the four homes they can move to
status: open
date: 2026-09-01
refines: [REQ-0042, DES-0041]
affects:
  - log-event
  - require-vectors
  - repository-for-similar
  - entity-natural-key
  - inspected-natural-key
  - generated-natural-key
