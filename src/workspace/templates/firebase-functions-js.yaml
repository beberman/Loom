# A proposal for .loom/frameworks.yaml: copy what you want into your own file.
# Loom shows this when it finds a firebase.json with a Node codebase and never
# writes it for you. A declaration nobody wrote cannot be told from one somebody
# did (DES-0054 D3).
#
# The callees are firebase-functions 6.6.0's public registrations, read from an
# installed copy of the SDK: the functions each provider module exports whose
# names begin `on' or `before'. The SDK's own helpers (onInit, onOperation,
# onChangedOperation, beforeOperation) register nothing and are left out. A
# trigger a later version adds is absent until you add it; the function then
# stays in `structure's no-caller list, which is how the miss shows.
#
# ES modules only. `import {onRequest} from "firebase-functions/v2/https"`,
# `import * as v2 from "firebase-functions/v2"` and `import functions from
# "firebase-functions"` are matched, so both spellings of each callee are listed:
# the namespace or named one (`https.onRequest`) and the default import's
# (`default.https.onRequest`). `const {onRequest} = require(...)`,
# `exports.api = onRequest(...)` and a TypeScript source are not read, and
# `firebase init` writes the first two for JavaScript. A registration is a
# module-level `const NAME = call(..., function)`; one that is only default
# exported is counted, not named.
#
# The root module "firebase-functions" is the v2 API in 6.x, as its package.json
# maps "." to lib/v2. v1 is listed for https only, and only its direct
# `functions.https.onRequest` and `onCall`. v1's chained builders
# (`functions.pubsub.schedule("...").onRun(fn)`, `.runWith({secrets}).https...`)
# have a callee rooted in a call and are not matched.
#
# Add `domains: [{name: functions, root: functions/, resolution: node-esm}]` as
# well when functions/package.json says `"type": "module"`: node does not guess
# a file extension, so Loom must be told it does not either.
#
# Names only. A secret's value is in Secret Manager or a dot-file Loom never
# reads, and a param's default is not a first string argument, so neither can
# reach the index (DES-0054 D7).
entry-points:
  - framework: firebase-functions
    trigger: https
    module: firebase-functions/https
    names: [onRequest, onCall, onCallGenkit]
    settings: [secrets]
  - framework: firebase-functions
    trigger: https
    module: firebase-functions/v2/https
    names: [onRequest, onCall, onCallGenkit]
    settings: [secrets]
  - framework: firebase-functions
    trigger: https
    module: firebase-functions
    names: [https.onRequest, default.https.onRequest, https.onCall, default.https.onCall,
            https.onCallGenkit, default.https.onCallGenkit]
    settings: [secrets]
  - framework: firebase-functions
    trigger: https
    module: firebase-functions/v2
    names: [https.onRequest, default.https.onRequest, https.onCall, default.https.onCall,
            https.onCallGenkit, default.https.onCallGenkit]
    settings: [secrets]
